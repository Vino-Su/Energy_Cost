<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日回顾（全部完成态） - 参考页面</title>
    <link rel="stylesheet" href="../03-高保真页面/components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 375px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; color: #1f2329;
            width: 100%; min-height: 100vh; margin: 0;
        }
        /* 顶部导航 */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
            width: 100%; max-width: 375px; height: 44px;
            background: rgba(255,255,255,0.96); border-bottom: 1px solid #e5e6eb;
            display: flex; align-items: center; z-index: 1000; padding: 0 16px;
        }
        .top-nav-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #1f2329; text-decoration: none; margin-left: -8px;
            -webkit-tap-highlight-color: transparent;
        }
        .top-nav-back:active { background: #f2f3f5; border-radius: 6px; }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #1f2329;
        }
        .content-area { padding: 56px 16px 96px; }
        /* 交车成功横幅（保持不变） */
        .success-card {
            background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%);
            border-radius: 12px; padding: 18px 16px; margin-bottom: 12px;
            color: #ffffff;
        }
        .success-top { display: flex; align-items: center; gap: 10px; }
        .success-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .success-icon svg { width: 22px; height: 22px; }
        .success-title { font-size: 17px; font-weight: 600; }
        .success-sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
        .success-meta {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.25);
            font-size: 12px; line-height: 20px;
        }
        .success-meta .label { opacity: 0.85; margin-right: 6px; }
        /* 通用卡片 */
        .card {
            background: #ffffff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 15px; font-weight: 600; color: #1f2329; margin-bottom: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .card-title .bar {
            width: 3px; height: 14px; border-radius: 2px; background: #1677ff;
        }
        .card-title .count {
            font-size: 12px; font-weight: 400; color: #86909c;
            margin-left: auto;
        }
        /* 今日回顾指标 */
        .review-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .review-item {
            text-align: center; padding: 14px 4px;
            background: #f7fafd; border-radius: 10px;
        }
        .review-value {
            font-size: 22px; font-weight: 700; color: #1677ff; line-height: 28px;
        }
        .review-value .unit { font-size: 12px; font-weight: 500; color: #00000073; margin-left: 2px; }
        .review-label { font-size: 11px; color: #86909c; margin-top: 4px; }
        /* 极简正向空态 */
        .empty-state {
            padding: 32px 16px 28px; text-align: center;
        }
        .empty-icon {
            width: 88px; height: 88px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        /* 今日完成空态：成功绿色 */
        .empty-state.done .empty-icon {
            background: #f6ffed;
            box-shadow: 0 6px 18px rgba(82,196,26,0.18);
        }
        .empty-state.done .empty-icon svg {
            width: 48px; height: 48px; color: #52c41a;
        }
        /* 明日空态：中性蓝灰 */
        .empty-state.calendar .empty-icon {
            background: #f0f5fa;
            box-shadow: 0 6px 18px rgba(22,119,255,0.10);
        }
        .empty-state.calendar .empty-icon svg {
            width: 44px; height: 44px; color: #bfbfbf;
        }
        .empty-title {
            font-size: 15px; font-weight: 600; color: #1f2329; line-height: 22px;
        }
        .empty-desc {
            margin-top: 6px; font-size: 12px; color: #86909c; line-height: 20px;
        }
        /* 底部固定按钮 */
        .bottom-actions {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 375px;
            padding: 12px 16px 16px; background: #ffffff; border-top: 1px solid #e8e8e8;
            z-index: 1000;
        }
        .action-btn {
            width: 100%; height: 44px; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; text-decoration: none;
            background: #1677ff; color: #ffffff;
        }
        .action-btn:active { opacity: 0.85; }
        /* 顶部参考页标识（仅参考稿可见，不影响设计） */
        .reference-tag {
            position: fixed; top: 50px; right: 12px; z-index: 999;
            padding: 3px 8px; border-radius: 4px;
            background: rgba(22,119,255,0.12); color: #1677ff;
            font-size: 10px; font-weight: 500;
        }
    </style>
</head>
<body data-no-project-switcher="true">
    <header class="top-nav">
        <a href="../03-高保真页面/vehicle-management.html" class="top-nav-back" aria-label="返回首页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title">今日回顾</div>
    </header>
    <div class="reference-tag">参考稿 · 全部完成态</div>

    <div class="content-area">
        <!-- 交车成功横幅（保留不变） -->
        <div class="success-card">
            <div class="success-top">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div>
                    <div class="success-title">交车成功</div>
                    <div class="success-sub">已解除人车绑定，今日作业已收尾</div>
                </div>
            </div>
            <div class="success-meta">
                <span class="label">车辆</span>粤B·D2856 · 洗扫车<br>
                <span class="label">交车时间</span>2026-07-10 18:26 · 科苑南路停放场
            </div>
        </div>

        <!-- 今日回顾指标 -->
        <div class="card">
            <div class="card-title"><span class="bar"></span>今日回顾</div>
            <div class="review-grid">
                <div class="review-item">
                    <div class="review-value">5</div>
                    <div class="review-label">完成任务数</div>
                </div>
                <div class="review-item">
                    <div class="review-value">38.6<span class="unit">km</span></div>
                    <div class="review-label">轨迹里程</div>
                </div>
                <div class="review-item">
                    <div class="review-value">7<span class="unit">时42分</span></div>
                    <div class="review-label">出车时长</div>
                </div>
            </div>
        </div>

        <!-- 今日待办（极简正向空态） -->
        <div class="card">
            <div class="card-title">
                <span class="bar"></span>今日待办
            </div>
            <div class="empty-state done">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="17 8 10 15 7 12"/>
                    </svg>
                </div>
                <div class="empty-title">今日任务已全部完成</div>
                <div class="empty-desc">辛苦了，好好休息吧</div>
            </div>
        </div>

        <!-- 明日待办（极简空态） -->
        <div class="card">
            <div class="card-title">
                <span class="bar"></span>明日待办
            </div>
            <div class="empty-state calendar">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </div>
                <div class="empty-title">暂无明日待办任务</div>
                <div class="empty-desc">请留意后续派发</div>
            </div>
        </div>
    </div>

    <div class="bottom-actions">
        <a href="../03-高保真页面/vehicle-management.html" class="action-btn">返回首页</a>
    </div>

    <script src="../03-高保真页面/components/app-common.js"></script>
</body>
</html>
