<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>任务执行 - 车机品质巡查</title>
<link rel="stylesheet" href="components/car-common.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* 业务入口置于右上，地图辅助工具独立置于右下，与 car-home 进行中任务保持一致。 */
.run-tools { position: absolute; right: var(--car-gap); top: var(--car-gap); z-index: 10; }
.run-tools__group { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.run-biz-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 128px; height: var(--car-touch); padding: 0 20px; border: 1px solid var(--car-border); border-radius: calc(var(--car-touch) / 2); background: rgba(255,255,255,0.96); box-shadow: 0 2px 8px rgba(20,40,70,0.14); color: var(--car-text); font-size: var(--car-fs-body); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.12s; }
.run-biz-btn:active { transform: scale(0.98); background: var(--car-surface-soft); }
.run-biz-btn.is-active { border-color: var(--car-primary); background: var(--car-primary); box-shadow: 0 2px 8px rgba(20,40,70,0.18); color: #fff; }
.run-biz-btn__txt { pointer-events: none; }
.run-tool-badge { position: absolute; top: -8px; right: -8px; display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border: 2px solid var(--car-surface); border-radius: 12px; background: var(--car-danger); color: #fff; font-family: var(--car-font-num); font-size: 12px; font-weight: 700; line-height: 1; }
.run-map-tools { position: absolute; right: var(--car-gap); bottom: calc(var(--car-gap) + 24px); z-index: 10; display: flex; flex-direction: column; gap: 12px; }
.run-map-tools .car-icon-btn { box-shadow: 0 2px 8px rgba(20,40,70,0.14); }
.run-map-tools .car-icon-btn.is-active { border-color: #91caff; background: var(--car-primary-soft); color: var(--car-primary); }
/* 轨迹：强制 SVG 服从容器实际尺寸，防止被 viewBox 1:1 比例自撑为正方形导致与车辆点错位 */
.run-track { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.run-phone-track { z-index: 5; }
.run-phone-track path { stroke: var(--car-primary); stroke-dasharray: 3 2; }
.run-phone-point { z-index: 8; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50%; background: var(--car-success); color: #fff; box-shadow: 0 2px 5px rgba(20,40,70,0.24); }
.run-problem-points { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
.run-problem-point { position: absolute; display: none; width: 56px; height: 56px; align-items: center; justify-content: center; transform: translate(-50%, -50%); pointer-events: auto; }
.run-problem-point.is-visible { display: flex; animation: run-problem-arrive 0.36s ease-out both; }
.run-problem-point__icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--run-problem-color, var(--car-danger)); color: #fff; font-family: var(--car-font-num); font-size: 18px; font-weight: 700; box-shadow: 0 2px 6px rgba(20,40,70,0.36); transform: rotate(-45deg); }
.run-problem-point__icon > span { transform: rotate(45deg); }
@keyframes run-problem-arrive { from { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
/* 地图总览图层（点击任务/事件图标时切换，对齐 car-home） */
.run-map-all-zones { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.run-map-all-zone { position: absolute; padding: 8px; border: 2px dashed rgba(22,119,255,0.34); border-radius: var(--car-radius); background: rgba(22,119,255,0.05); color: var(--car-text); font-size: var(--car-fs-aux); font-weight: 600; }
.run-map-all-zone--pending { border-color: var(--car-warning); background: var(--car-warning-soft); }
.run-map-all-zone--running { border-color: var(--car-success); background: var(--car-success-soft); }
.run-map-all-zone--done { border-color: var(--car-primary); background: var(--car-primary-soft); }
.run-map-all-zone--transferred, .run-map-all-zone--terminated, .run-map-all-zone--invalid { border-color: var(--car-neutral); background: var(--car-neutral-soft); }
.run-map-all-zone.is-current { border-color: rgba(22,119,255,0.82); background: rgba(22,119,255,0.12); box-shadow: inset 0 0 0 1px rgba(22,119,255,0.12); }
.run-map-problems { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
.run-map-problem { --run-prob-color: var(--car-neutral); position: absolute; display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; transform: translate(-50%,-82%); pointer-events: auto; }
.run-map-problem__icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--run-prob-color); color: #fff; font-family: var(--car-font-num); font-size: 18px; font-weight: 700; box-shadow: 0 2px 6px rgba(20,40,70,0.28); transform: rotate(-45deg); }
.run-map-problem__icon > span { transform: rotate(45deg); }
.run-map-problem--judging { --run-prob-color: var(--car-neutral); }
.run-map-problem--assigning { --run-prob-color: var(--car-warning); }
.run-map-problem--pending { --run-prob-color: var(--car-primary); }
.run-map-problem--processing { --run-prob-color: var(--car-primary); }
.run-map-problem--review { --run-prob-color: var(--car-primary); }
.run-map-problem--done { --run-prob-color: var(--car-success); }
.run-map-cluster { position: absolute; display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; transform: translate(-50%,-50%); border: 4px solid rgba(255,255,255,0.9); border-radius: 50%; background: var(--car-danger); color: #fff; font-family: var(--car-font-num); font-size: var(--car-fs-body); font-weight: 700; box-shadow: 0 3px 10px rgba(20,40,70,0.25); pointer-events: auto; }
.car-map--leaflet { overflow: hidden; }
.run-leaflet-map { position: absolute; inset: 0; z-index: 0; background: #edf2f5; font-family: var(--car-font); }
.run-map-fallback { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; padding: 24px; background: #edf2f5; color: var(--car-text-secondary); font-size: var(--car-fs-body); text-align: center; }
.run-map-fallback.is-visible { display: flex; }
.car-map--leaflet > .car-map__base,
.car-map--leaflet > .car-map__water,
.car-map--leaflet > .car-map__park,
.car-map--leaflet > .car-map__bldg,
.car-map--leaflet > .car-map__roads,
.car-map--leaflet > .car-map__road--h2,
.car-map--leaflet > .car-map__road--v2,
.car-map--leaflet > .car-map__grid,
.car-map--leaflet > .car-map__label,
.car-map--leaflet > .car-map__zone,
.car-map--leaflet > .run-map-all-zones,
.car-map--leaflet > .run-track,
.car-map--leaflet > .run-problem-points,
.car-map--leaflet > .run-map-problems,
.car-map--leaflet > .car-map__point,
.run-leaflet-map .leaflet-control-zoom a { width: 40px; height: 40px; line-height: 38px; color: var(--car-text); font-size: 22px; }
.run-leaflet-map .leaflet-control-attribution { padding: 2px 5px; background: rgba(255,255,255,0.86); color: var(--car-text-secondary); font-size: 10px; }
.run-leaflet-map .leaflet-control-attribution a { color: var(--car-primary); }
.run-leaflet-map .leaflet-marker-icon { border: 0; background: transparent; }
.run-map-marker { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: var(--car-font); }
.run-map-marker--vehicle { width: 34px; height: 34px; border: 2px solid #fff; border-radius: 50%; background: var(--car-primary); color: #fff; box-shadow: 0 2px 6px rgba(20,40,70,0.3); }
.run-map-marker--phone { width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50%; background: var(--car-success); color: #fff; box-shadow: 0 2px 6px rgba(20,40,70,0.3); }
.run-map-marker--problem { width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--run-problem-color, var(--car-danger)); color: #fff; box-shadow: 0 2px 6px rgba(20,40,70,0.32); transform: rotate(-45deg); font-family: var(--car-font-num); font-size: 18px; font-weight: 700; }
.run-map-marker--problem > span { transform: rotate(45deg); }
.run-map-marker--problem.is-selected { box-shadow: 0 0 0 4px var(--car-primary-soft), 0 3px 8px rgba(20,40,70,0.32); }
.run-map-marker--cluster { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.94); border-radius: 50%; background: var(--car-danger); color: #fff; box-shadow: 0 3px 10px rgba(20,40,70,0.3); font-family: var(--car-font-num); font-size: var(--car-fs-body); font-weight: 700; }
.run-leaflet-map .leaflet-tooltip.run-map-area-label { padding: 3px 6px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.88); color: var(--car-text); box-shadow: none; font-family: var(--car-font); font-size: 12px; font-weight: 600; }
.run-leaflet-map .leaflet-tooltip.run-map-area-label::before { display: none; }
.car-main-split.is-map-fullscreen { position: fixed; inset: var(--car-topbar-height) 0 0; z-index: 80; display: block; padding: var(--car-gap); background: var(--car-page-bg); }
.car-main-split.is-map-fullscreen > .car-map { width: 100%; height: 100%; }
.car-main-split.is-map-fullscreen > .run-side-panel { display: none; }
.car-map.is-resetting { animation: run-map-reset 0.34s ease-out; }
@keyframes run-map-reset { 50% { box-shadow: inset 0 0 0 4px rgba(22,119,255,0.3); } }
.run-side-panel .car-task-context { padding: 14px var(--car-pad); }
.run-side-panel .car-task-context__eyebrow { color: var(--car-primary); font-weight: 500; }
.run-side-panel .car-task-summary { padding: 10px var(--car-pad); border-bottom: 1px solid var(--car-border); }
.run-side-panel .car-task-action.is-split { display: flex; gap: 12px; }
.run-side-panel .car-task-action.is-split .car-btn { width: auto; flex: 1; }

/* 右屏面板作为抽屉定位上下文（抽屉仅覆盖右屏，不遮挡左屏地图） */
.car-panel { position: relative; }
/* ===== 今日清单抽屉（覆盖右屏面板，对齐 car-home 右屏抽屉） ===== */
/* 绝对定位于右屏 .car-panel，不遮挡左屏地图；地图同步切换总览图层 */
.run-drawer-mask { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,0.32); opacity: 0; visibility: hidden; transition: opacity 0.22s ease-out, visibility 0.22s; }
.run-drawer-mask.is-open { opacity: 1; visibility: visible; }
.run-drawer { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 31; display: flex; flex-direction: column; background: var(--car-surface); transform: translateY(8px); opacity: 0; visibility: hidden; transition: transform 0.26s ease-out, opacity 0.26s ease-out, visibility 0.26s; }
.run-drawer.is-open { transform: translateY(0); opacity: 1; visibility: visible; }
.run-drawer__head { display: flex; align-items: center; gap: 12px; padding: 14px var(--car-pad); border-bottom: 1px solid var(--car-border); }
.run-drawer__title { font-size: var(--car-fs-panel); font-weight: 600; }
.run-drawer__body { flex: 1; min-height: 0; overflow-y: auto; }
.run-drawer__foot { display: flex; padding: var(--car-pad); border-top: 1px solid var(--car-border); background: var(--car-surface); }
.run-drawer__foot .car-btn { gap: 8px; }
.run-task-item { width: 100%; display: flex; flex-direction: column; gap: 6px; min-height: 96px; padding: 14px var(--car-pad); border: 0; border-bottom: 1px solid var(--car-border); background: var(--car-surface); color: var(--car-text); text-align: left; cursor: pointer; transition: background-color 0.18s ease-out; position: relative; }
.run-task-item:last-child { border-bottom: none; }
.run-task-item:active { background: var(--car-surface-soft); }
.run-task-item.is-current { background: var(--car-primary-soft); }
.run-task-item.is-current::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--car-primary); }
.run-task-item__r1 { display: flex; align-items: center; gap: 12px; }
.run-task-item__area { flex: 1 1 auto; min-width: 0; font-size: var(--car-fs-list); font-weight: 500; color: var(--car-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-task-item__r1-meta { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; }
/* 事件上报数徽标：带问题图标，与地图事件点位同色系，未开始任务不渲染 */
.run-task-item__events { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--car-radius-sm); background: var(--car-danger-soft); color: var(--car-danger); font-family: var(--car-font-num); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
.run-task-item__events svg { width: 14px; height: 14px; }
.run-task-item__r2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.run-task-item__r2 .car-sep { color: var(--car-border); }
.run-task-item__r2 .car-mono { font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.run-group { padding: 10px var(--car-pad) 4px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); background: var(--car-surface-soft); }
.run-issue-group { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 8px var(--car-pad); background: var(--car-surface-soft); color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
/* 跨任务事件清单：按事件状态分组 */
.run-issue-filters { display: flex; gap: 8px; padding: 12px var(--car-pad); overflow-x: auto; border-bottom: 1px solid var(--car-border); background: var(--car-surface); }
.run-issue-filter { flex: 0 0 auto; min-height: var(--car-touch); padding: 0 12px; border: 1px solid var(--car-border); border-radius: var(--car-radius-sm); background: var(--car-surface); color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
.run-issue-filter.is-active { border-color: var(--car-primary); background: var(--car-primary-soft); color: var(--car-primary); font-weight: 500; }
.car-task-problem, .run-issue { position: relative; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 12px; min-height: 116px; padding: 14px var(--car-pad); border: 0; border-bottom: 1px solid var(--car-border); background: var(--car-surface); color: var(--car-text); font: inherit; transition: background-color 0.15s; }
.car-task-problem:last-child, .run-issue:last-child { border-bottom: 0; }
.car-task-problem.is-selected, .run-issue.is-selected { background: var(--car-primary-soft); }
.car-task-problem.is-selected::before, .run-issue.is-selected::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--car-primary); }
.car-task-problem__summary, .run-issue__summary { display: block; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.car-task-problem__summary:active, .run-issue__summary:active { opacity: 0.76; }
.car-task-problem__time, .run-issue__time { flex: 0 0 auto; color: var(--car-text); font-size: 18px; font-weight: 600; line-height: 22px; }
.car-task-problem__content, .run-issue__content { display: grid; gap: 7px; min-width: 0; }
.car-task-problem__head, .run-issue__head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.car-task-problem__location, .run-issue__location { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--car-fs-body); font-weight: 600; }
.car-task-problem__tags, .run-issue__tags { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 6px; }
.car-task-problem__meta, .run-issue__meta { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
.car-task-problem__type, .run-issue__type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--car-text); font-size: var(--car-fs-body); font-weight: 500; }
.car-task-problem__desc, .run-issue__desc { overflow: hidden; color: var(--car-text-secondary); font-size: var(--car-fs-aux); line-height: 20px; text-overflow: ellipsis; white-space: nowrap; }
.car-task-problem__detail, .run-issue__detail { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--car-primary); border-radius: 50%; background: var(--car-surface); color: var(--car-primary); cursor: pointer; transition: background-color 0.15s, transform 0.12s; }
.car-task-problem__detail:hover, .car-task-problem__detail:focus-visible, .run-issue__detail:hover, .run-issue__detail:focus-visible { background: var(--car-primary-soft); }
.car-task-problem__detail:active, .run-issue__detail:active { transform: scale(0.96); }
.car-task-problem__detail svg, .run-issue__detail svg { width: 20px; height: 20px; }
.run-prob-empty-line { padding: 18px 0; color: var(--car-text-secondary); font-size: var(--car-fs-body); text-align: center; }
</style>
</head>
<body>
<div class="car-app">
    <!-- 顶栏 -->
    <header class="car-topbar">
        <div class="car-topbar__page">
            <div class="car-topbar__brand">
                <svg class="car-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h2l2-5h9l3 5h2"/><path d="M5 13v5h14v-5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>
                品质巡查
            </div>
        </div>
        <div class="car-topbar__center">
            <div class="car-task-notice car-hidden" id="js-task-notice" role="status" aria-live="polite" aria-atomic="true">
                <span class="car-task-notice__icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
                <span class="car-task-notice__lead">新任务</span>
                <span class="car-task-notice__summary" data-task-notice-summary>品质巡查 - 解放南路沿线 - 13:30-15:00</span>
                <span class="car-task-notice__more" data-task-notice-more aria-label="另有1条新任务">+1</span>
                <button type="button" class="car-task-notice__action" data-task-notice-view aria-label="查看新任务" title="查看任务">查看</button>
                <button type="button" class="car-task-notice__close" data-task-notice-close aria-label="关闭新任务提醒" title="关闭新任务提醒"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
        </div>
        <div class="car-topbar__meta">
            <span class="car-pill car-mono" id="js-vehNo">粤B·D2856</span>
            <span class="car-pill js-clock">--:--</span>
        </div>
        <button class="car-topbar__logout" id="js-handover" aria-label="退出登录" title="退出登录（扫码交车解绑）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            退出登录
        </button>
    </header>

    <!-- 主体 -->
    <div class="car-main">
        <div class="car-main-split">
            <!-- 左屏地图 -->
            <div class="car-map car-map--leaflet">
                <div class="run-leaflet-map" id="js-leaflet-map" aria-label="任务执行地图"></div>
                <div class="run-map-fallback" id="js-map-fallback">地图服务暂不可用，请检查网络连接后重试。</div>
                <div class="car-map__base"></div>
                <div class="car-map__water"></div>
                <div class="car-map__park car-map__park--1"></div>
                <div class="car-map__park car-map__park--2"></div>
                <div class="car-map__bldg" style="left:25%;top:30%;width:5%;height:8%"></div>
                <div class="car-map__bldg" style="left:55%;top:24%;width:6%;height:7%"></div>
                <div class="car-map__bldg" style="left:72%;top:55%;width:5%;height:9%"></div>
                <div class="car-map__bldg" style="left:15%;top:60%;width:7%;height:8%"></div>
                <div class="car-map__roads"></div>
                <div class="car-map__road--h2"></div>
                <div class="car-map__road--v2"></div>
                <div class="car-map__grid"></div>
                <span class="car-map__label" style="left:30%;top:51%">滨江路</span>
                <span class="car-map__label" style="left:44%;top:20%;transform:rotate(3deg)">解放南路</span>
                <div class="car-map__zone" id="js-zone" style="left:18%;top:24%;width:50%;height:46%"></div>
                <!-- 总览图层：全部任务作业区域（点击任务图标时展示） -->
                <div class="run-map-all-zones" id="js-all-zones" aria-label="全部任务作业区域"></div>
                <!-- 实时轨迹：0-100 百分比坐标系，与车辆点共用同一套坐标，避免拉伸错位 -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="components/car-common.js"></script>
<script>
(function () {
    var taskCallDemoMode = CAR.query('callDemo');
    var taskCallDemoEntry = taskCallDemoMode && taskCallDemoMode !== 'off';
    if (taskCallDemoEntry) {
        if (!CAR.getState().bound) CAR.bindVehicle(CAR.getState().driverName);
        var demoTaskId = CAR.query('id') || 'T002';
        var demoTask = CAR.getTask(demoTaskId);
        if (!demoTask || demoTask.status !== 'running') CAR.startTask(demoTaskId);
    }
    var st = CAR.getState();
    if (!st.bound) { location.replace('car-bind.html'); return; }
    document.getElementById('js-vehNo').textContent = st.vehicleNo;
    CAR.bindClock();
    CAR.installDebugFab();

    var currentTask = CAR.getTask(CAR.query('id')) || CAR.getRunningTask();
    if (!currentTask || currentTask.status !== 'running') {
        var requestedTaskId = CAR.query('id') || 'T002';
        CAR.go('car-home.html?task=' + encodeURIComponent(requestedTaskId), { toast: '请先在任务详情开始任务', delay: 180 });
        return;
    }

    var mapReady = typeof window.L !== 'undefined';
    var leafletMap = null;
    var mapLayers = null;
    var tileErrorNotified = false;
    var trackProgress = 0;
    var phoneTrackProgress = 0;
    var currentTrackLayer = null;
    var currentPhoneTrackLayer = null;
    var currentVehicleMarker = null;
    var currentPhoneMarker = null;
    var problemClusterExpanded = false;
    var selectedProblemId = null;

    function renderActiveTask() {
        var zone = document.getElementById('js-zone');
        zone.style.left = currentTask.zone.left; zone.style.top = currentTask.zone.top; zone.style.width = currentTask.zone.width; zone.style.height = currentTask.zone.height;
        document.getElementById('js-track').setAttribute('d', currentTask.track);
        document.getElementById('js-phone-track').setAttribute('d', currentTask.phoneTrack || '');
        // 车辆初始位置取 path 起点，与 startRealtimeTrack 首帧一致，避免动画启动瞬间跳变。
        var startMatch = (currentTask.track.match(/^M\s*([0-9.]+)[,\s]+([0-9.]+)/) || []).slice(1);
        document.getElementById('js-vehicle').style.left = (startMatch[0] || currentTask.vehicle.left) + '%';
        document.getElementById('js-vehicle').style.top = (startMatch[1] || currentTask.vehicle.top) + '%';
        document.getElementById('js-phone').style.left = currentTask.phone.left;
        document.getElementById('js-phone').style.top = currentTask.phone.top;
        document.getElementById('js-start').textContent = currentTask.start || CAR.hhmm();
        document.getElementById('js-mileage').textContent = currentTask.mileage.toFixed(2);
        document.getElementById('js-duration').textContent = currentTask.duration;
        document.getElementById('js-taskTitle').textContent = currentTask.area;
        document.getElementById('js-taskStatus').textContent = '进行中';
        document.getElementById('js-taskMeta').innerHTML = '<span>' + currentTask.workType + '</span><span class="car-sep">·</span><span class="car-mono">' + currentTask.date + ' ' + currentTask.time + '</span>';
    }
    renderActiveTask();

    function taskInfoMarkup(task) {
        return '<div class="car-task-info-grid">' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">任务编号</span><span class="car-task-info-field__value car-mono">' + task.no + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">作业资源</span><span class="car-task-info-field__value">' + task.resource + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">任务类型</span><span class="car-task-info-field__value">' + task.type + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">作业类型</span><span class="car-task-info-field__value">' + task.workType + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">任务日期</span><span class="car-task-info-field__value car-mono">' + task.date + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">计划时段</span><span class="car-task-info-field__value car-mono">' + task.time + '</span></div>' +
        '</div>';
    }

    function openTaskInfo() {
        document.getElementById('js-taskInfoBody').innerHTML = taskInfoMarkup(currentTask);
        document.getElementById('js-taskInfoMask').classList.add('is-open');
        var panel = document.getElementById('js-taskInfoPanel');
        panel.classList.add('is-open');
        panel.setAttribute('aria-hidden', 'false');
    }

    function closeTaskInfo() {
        document.getElementById('js-taskInfoMask').classList.remove('is-open');
        var panel = document.getElementById('js-taskInfoPanel');
        panel.classList.remove('is-open');
        panel.setAttribute('aria-hidden', 'true');
    }

    // 事件卡片以时间为扫描锚点，地点、类型、发现方式和状态分层展示。
    var PROBLEMS = currentTask.problemsList.slice();
    var PROB_STATUS_TAG = {};
    Object.keys(CAR.EVENT_STATUS).forEach(function (key) { PROB_STATUS_TAG[key] = CAR.EVENT_STATUS[key].tag; });
    var reportedProblemIds = {};
    PROBLEMS.forEach(function (problem) { reportedProblemIds[problem.id] = true; });
    var LIVE_PROBLEMS = [
        { id: 'P004', status: 'judging', reportProgress: 0.38, locationSuffix: '东侧辅路', reportTime: '2026-07-30 11:16', coordinates: '113.273,23.133', discoveryType: 'AI', problemType: '路面抛洒物', description: '东侧辅路发现袋装抛洒物。', photos: [{ type: 'spill', caption: '车载画面 1' }, { type: 'scene', caption: '现场近景 2' }] },
        { id: 'P005', status: 'review', reportProgress: 0.72, locationSuffix: '喷泉广场南侧', reportTime: '2026-07-30 11:19', coordinates: '113.274,23.132', discoveryType: '人工', problemType: '路面破损', description: '喷泉广场南侧路面存在破损。', photos: [{ type: 'breakage', caption: '车载画面 1' }] }
    ];

    function renderProblems() {
        var html = '';
        PROBLEMS.slice().sort(function (a, b) { return b.reportTime.localeCompare(a.reportTime); }).forEach(function (p) {
            html += '<article class="car-task-problem' + (p.id === selectedProblemId ? ' is-selected' : '') + '" data-pid="' + p.id + '">' +
                '<button type="button" class="car-task-problem__summary" data-focus="' + p.id + '" aria-label="在地图定位' + p.location + '事件">' +
                '<span class="car-task-problem__content"><span class="car-task-problem__head"><span class="car-task-problem__time car-mono">' + p.reportTime.slice(11) + '</span><span class="car-sep">·</span><span class="car-task-problem__location">' + p.location + '</span></span>' +
                '<span class="car-task-problem__meta"><span class="car-task-problem__type">' + p.problemType + '</span><span class="car-task-problem__tags"><span class="car-tag car-tag--discovery ' + (p.discoveryType === 'AI' ? 'car-tag--discovery-ai' : 'car-tag--discovery-manual') + '">' + p.discoveryType + '</span><span class="car-tag ' + (PROB_STATUS_TAG[p.status] || 'car-tag--neutral') + '">' + p.statusText + '</span></span></span>' +
                '<span class="car-task-problem__desc">' + p.description + '</span></span></button>' +
                '<button type="button" class="car-task-problem__detail" data-detail="' + p.id + '" aria-label="进入' + p.location + '事件详情" title="进入事件详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>' +
            '</article>';
        });
        document.getElementById('js-probList').innerHTML = html || '<div class="car-empty"><span class="car-empty__txt">当前任务暂无上报事件</span></div>';
        document.getElementById('js-probTotal').textContent = '共 ' + PROBLEMS.length + ' 项';
        // 事件角标同步为今日全量事件数（含外设上报的新事件归入后刷新）
        if (typeof updateToolBadges === 'function') updateToolBadges();
        document.querySelectorAll('#js-probList [data-focus]').forEach(function (el) {
            el.addEventListener('click', function () { focusProblemOnMap(el.dataset.focus); });
        });
        document.querySelectorAll('.car-task-problem [data-detail]').forEach(function (el) {
            el.addEventListener('click', function () { openProblem(el.dataset.detail); });
        });
    }
    function openProblem(pid) { CAR.go('car-problem-detail.html?id=' + pid, { delay: 300 }); }
    // 点位 click 事件入口：点击照片气泡内的缩略图/箭头时不进详情，交由气泡委托处理
    function onProblemMarkerClick(e, pid) {
        var target = e && e.originalEvent && e.originalEvent.target;
        if (target && (target.closest('[data-photo-view]') || target.closest('[data-photo-nav]') || target.closest('.car-photo-bubble-tip'))) return;
        openProblem(pid);
    }

    function renderProblemPoint(problem) {
        var container = document.getElementById('js-problemPoints');
        if (container.querySelector('[data-pid="' + problem.id + '"]')) return;
        container.insertAdjacentHTML('beforeend', '<button type="button" class="run-problem-point is-visible" data-pid="' + problem.id + '" style="left:' + problem.point.left + ';top:' + problem.point.top + ';--run-problem-color:' + statusColor(problem.status) + '" aria-label="查看上报事件：' + problem.location + '" title="' + problem.location + '"><span class="run-problem-point__icon"><span>!</span></span></button>');
        container.lastElementChild.addEventListener('click', function () { openProblem(problem.id); });
    }

    function reportLiveProblem(template, point) {
        if (reportedProblemIds[template.id]) return;
        reportedProblemIds[template.id] = true;
        var location = currentTask.area + template.locationSuffix;
        var problem = {
            taskId: currentTask.id,
            id: template.id,
            status: template.status,
            statusText: CAR.EVENT_STATUS[template.status].text,
            location: location,
            detailedLocation: location + '靠近非机动车道',
            occurrenceTime: template.reportTime,
            reportTime: template.reportTime,
            source: '车载外设上报',
            discoveryType: template.discoveryType,
            discoverer: template.discoveryType === 'AI' ? '巡查车 ' + st.vehicleNo : '巡查员 ' + st.driverName,
            coordinates: template.coordinates,
            problemType: template.problemType,
            description: template.description,
            photos: template.photos || [],
            point: { left: point.x.toFixed(2) + '%', top: point.y.toFixed(2) + '%' }
        };
        PROBLEMS.unshift(problem);
        CAR.addProblem(problem);
        TODAY_TASKS = CAR.getTasks();
        // Leaflet 模式直接重绘业务图层；底图不可用时保留静态点位降级展示。
        if (document.getElementById('js-drawer').classList.contains('is-open') && drawerMode === 'problems') {
            renderProblemList();
            renderMapLayers();
        } else if (mapReady && mapMode === 'focus') {
            renderMapLayers();
        } else {
            renderProblemPoint(problem);
        }
        renderProblems();
        CAR.toast('收到新的事件上报，已加入事件列表');
        CAR.speak('收到新的事件上报');
    }

    function startLegacyRealtimeTrack() {
        var track = document.getElementById('js-track');
        var phoneTrack = document.getElementById('js-phone-track');
        var vehicle = document.getElementById('js-vehicle');
        var phone = document.getElementById('js-phone');
        var trackLength = track.getTotalLength();
        var phoneTrackLength = phoneTrack.getTotalLength();
        var durationMs = 16000;
        var startedAt = null;
        track.style.strokeDasharray = trackLength + ' ' + trackLength;
        track.style.strokeDashoffset = trackLength;
        // 轨迹与车辆共用 0-100 百分比坐标系：point.x/point.y 即为百分比，直接赋值，避免任何拉伸换算。
        function placeVehicle(point, nextPoint) {
            var angle = Math.atan2(nextPoint.y - point.y, nextPoint.x - point.x) * 180 / Math.PI + 90;
            vehicle.style.left = point.x.toFixed(2) + '%';
            vehicle.style.top = point.y.toFixed(2) + '%';
            vehicle.style.transform = 'translate(-50%, -50%) rotate(' + angle.toFixed(1) + 'deg)';
        }
        placeVehicle(track.getPointAtLength(0), track.getPointAtLength(Math.min(trackLength, 2)));
        function step(timestamp) {
            if (startedAt === null) startedAt = timestamp;
            var progress = Math.min(1, (timestamp - startedAt) / durationMs);
            var point = track.getPointAtLength(trackLength * progress);
            var nextPoint = track.getPointAtLength(Math.min(trackLength, trackLength * progress + 2));
            track.style.strokeDashoffset = trackLength * (1 - progress);
            placeVehicle(point, nextPoint);
            if (phoneTrackLength) {
                var phonePoint = phoneTrack.getPointAtLength(phoneTrackLength * progress);
                phone.style.left = phonePoint.x.toFixed(2) + '%';
                phone.style.top = phonePoint.y.toFixed(2) + '%';
            }
            LIVE_PROBLEMS.forEach(function (problem) {
                if (progress >= problem.reportProgress) reportLiveProblem(problem, point);
            });
            if (progress >= NEW_TASK_TRIGGER_PROGRESS) showNewTaskNotice();
            if (progress < 1) window.requestAnimationFrame(step);
        }
        window.requestAnimationFrame(step);
    }

    // 实时刷新里程/时长（演示，平滑过渡）
    var mileage = currentTask.mileage, duration = currentTask.duration;
    function rollNum(el, to, decimals) {
        var from = parseFloat(el.textContent) || 0;
        var steps = 8, i = 0;
        var timer = setInterval(function () {
            i++; var v = from + (to - from) * (i / steps);
            el.textContent = decimals ? v.toFixed(decimals) : Math.round(v);
            if (i >= steps) { el.textContent = decimals ? to.toFixed(decimals) : to; clearInterval(timer); }
        }, 30);
    }
    setInterval(function () {
        mileage += 0.04; duration += 1;
        rollNum(document.getElementById('js-mileage'), mileage, 2);
        rollNum(document.getElementById('js-duration'), duration, 0);
    }, 3000);

    // 新任务提醒与今日任务清单复用同一任务详情入口。
    function openTaskDetail(taskId, toast) {

    function routePoint(points, progress) {
        if (!points || !points.length) return null;
        if (points.length === 1) return points[0];
        var scaled = Math.max(0, Math.min(1, progress || 0)) * (points.length - 1);
        var index = Math.min(points.length - 2, Math.floor(scaled));
        var ratio = scaled - index;
        return [points[index][0] + (points[index + 1][0] - points[index][0]) * ratio, points[index][1] + (points[index + 1][1] - points[index][1]) * ratio];
    }
    function routeSlice(points, progress) {
        if (!points || !points.length) return [];

        var index = Math.floor(scaled);
        var visible = points.slice(0, index + 1);
        var point = routePoint(points, progress);
        if (point && (index < points.length - 1 || visible.length === 1)) visible.push(point);
        return visible;
    }
    function addFocusLayer() {

    function addTaskOverview() {

                running: { color: '#52c41a', fillColor: '#52c41a' },
                done: { color: '#1677ff', fillColor: '#1677ff' },

                terminated: { color: '#86909c', fillColor: '#86909c' },

                var cluster = L.marker([clusterLat, b.getCenter().lng], { icon: clusterIcon(task.problemsList.length), title: task.area + '事件', keyboard: true, riseOnHover: true });

            mapLayers.tasks.addLayer(L.marker(routePoint(currentTask.geo.track, trackProgress) || currentTask.geo.vehicle, { icon: vehicleIcon(), title: '当前车辆位置', keyboard: true, riseOnHover: true }).bindTooltip('当前车辆位置', { direction: 'top', offset: [0, -20] }));

    function shiftBubblePhoto(pid, dir) {
        var p = findProblemById(pid);
        if (!p || !p.photos || !p.photos.length) return;
        var marker = findProblemMarker(pid);
        var tip = marker && marker.getTooltip && marker.getTooltip();
        var el = tip && tip.getElement ? tip.getElement() : null;
        if (!el) return;
        var thumbs = el.querySelectorAll('.car-photo-bubble__thumb');
        var cur = Array.prototype.findIndex.call(thumbs, function (t) { return t.classList.contains('is-active'); });
        var len = thumbs.length;
        var next = dir === 'next' ? (cur + 1) % len : (cur - 1 + len) % len;
        thumbs.forEach(function (t, i) { t.classList.toggle('is-active', i === next); });
        var count = el.querySelector('.car-photo-bubble__count');
        if (count) count.textContent = (next + 1) + ' / ' + len;

                        if (layer.getTooltip && found === null) {

    function startRealtimeTrack() {
        if (!mapReady || !currentTask.geo) return;
        var startedAt = null;
        var durationMs = 16000;
        function step(timestamp) {
            if (startedAt === null) startedAt = timestamp;
            trackProgress = Math.min(1, (timestamp - startedAt) / durationMs);
            phoneTrackProgress = trackProgress;
            if (currentTrackLayer) currentTrackLayer.setLatLngs(routeSlice(currentTask.geo.track, trackProgress));
            if (currentPhoneTrackLayer) currentPhoneTrackLayer.setLatLngs(routeSlice(currentTask.geo.phoneTrack, phoneTrackProgress));
            if (currentVehicleMarker) currentVehicleMarker.setLatLng(routePoint(currentTask.geo.track, trackProgress) || currentTask.geo.vehicle);
            if (currentPhoneMarker) currentPhoneMarker.setLatLng(routePoint(currentTask.geo.phoneTrack, phoneTrackProgress) || currentTask.geo.phone);
            LIVE_PROBLEMS.forEach(function (problem) {
                if (trackProgress >= problem.reportProgress) reportLiveProblem(problem, { x: 0, y: 0 });
            });
            if (trackProgress >= NEW_TASK_TRIGGER_PROGRESS) showNewTaskNotice();
            if (trackProgress < 1) window.requestAnimationFrame(step);
        }
        window.requestAnimationFrame(step);
    }

        document.getElementById('js-drawer').classList.add('is-open');
        document.getElementById('js-drawerMask').classList.add('is-open');
        setToolActive(true);
    }
    function closeDrawer() {
        document.getElementById('js-drawer').classList.remove('is-open');
        document.getElementById('js-drawerMask').classList.remove('is-open');
        mapMode = 'focus';
        renderMapLayers();
        setToolActive(false);
    }
    function toggleDrawer(mode) {
        var open = document.getElementById('js-drawer').classList.contains('is-open');
        if (open && drawerMode === mode) { closeDrawer(); return; }
        openDrawer(mode);
    }
    function setToolActive(open) {
        var taskActive = open && drawerMode === 'tasks';
        var taskTool = document.getElementById('js-task-tool');
        taskTool.classList.toggle('is-active', taskActive);
        taskTool.setAttribute('aria-pressed', String(taskActive));
    }
    function renderDrawer() {
        if (drawerMode === 'problems') renderProblemList();
        else renderTaskList();
    }
    function renderTaskList() {
        document.getElementById('js-drawerTitle').textContent = '今日巡查任务 · ' + TODAY_TASKS.length + '项';
        var groups = Object.keys(CAR.TASK_STATUS).map(function (key) { return { key: key, label: CAR.TASK_STATUS[key].text }; });
        var html = '', lastGroup = null;
        sortedTodayTasks().forEach(function (t) {
            if (t.status !== lastGroup) {
                var g = groups.find(function (x) { return x.key === t.status; });
                html += '<div class="run-group">' + g.label + '</div>';
                lastGroup = t.status;
            }
            html += '<button type="button" class="run-task-item' + (t.id === currentTask.id ? ' is-current' : '') + '" data-id="' + t.id + '" aria-label="查看' + t.area + '任务详情">' +
                '<div class="run-task-item__r1"><span class="run-task-item__area">' + t.area + '</span>' +
                '<span class="run-task-item__r1-meta">' +
                // 事件上报数：任务未开始（无开始时间）时不显示，符合 PRD 6.3 第3条
                (t.start ? '<span class="run-task-item__events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>事件 ' + t.problems + '</span>' : '') +
                '<span class="car-tag ' + (STATUS_TAG[t.status] || 'car-tag--neutral') + '">' + t.statusText + '</span>' +
                '</span></div>' +
                '<div class="run-task-item__r2"><span class="car-mono">' + t.date + '</span><span class="car-sep">·</span><span class="car-mono">' + t.time + '</span><span class="car-sep">·</span><span>' + t.resource + '</span></div>' +
                '</button>';
        });
        document.getElementById('js-drawerBody').innerHTML = html;
        document.querySelectorAll('.run-task-item').forEach(function (el) {
            el.addEventListener('click', function () {
                closeDrawer();
                var task = TODAY_TASKS.find(function (x) { return x.id === el.dataset.id; }) || {};
                openTaskDetail(el.dataset.id, '已打开「' + task.area + '」任务详情');
            });
        });
    }
    function renderProblemList() {
        var all = todayProblems();
        document.getElementById('js-drawerTitle').textContent = '今日上报事件 · ' + all.length + '项';
        var html = '';
        if (!all.length) {
            html += '<div class="run-prob-empty-line">暂无符合条件的事件</div>';
        } else {
            Object.keys(CAR.EVENT_STATUS).forEach(function (status) {
                var group = all.filter(function (p) { return p.status === status; });
                if (!group.length) return;
                html += '<div class="run-issue-group"><span>' + CAR.EVENT_STATUS[status].text + '</span><span>' + group.length + ' 项</span></div>';
                group.sort(function (a, b) { return b.reportTime.localeCompare(a.reportTime); });
                group.forEach(function (p) {
                    html += '<article class="run-issue' + (p.id === selectedProblemId ? ' is-selected' : '') + '" data-id="' + p.id + '">' +
                        '<button type="button" class="run-issue__summary" data-focus="' + p.id + '" aria-label="在地图定位' + p.location + '事件">' +
                        '<span class="run-issue__content"><span class="run-issue__head"><span class="run-issue__time car-mono">' + p.reportTime.slice(11) + '</span><span class="car-sep">·</span><span class="run-issue__location">' + p.location + '</span></span>' +
                        '<span class="run-issue__meta"><span class="run-issue__type">' + p.problemType + '</span><span class="run-issue__tags"><span class="car-tag car-tag--discovery ' + (p.discoveryType === 'AI' ? 'car-tag--discovery-ai' : 'car-tag--discovery-manual') + '">' + p.discoveryType + '</span><span class="car-tag ' + (PROB_TAG[p.status] || 'car-tag--neutral') + '">' + p.statusText + '</span></span></span>' +
                        '<span class="run-issue__desc">' + p.description + '</span></span></button>' +
                        '<button type="button" class="run-issue__detail" data-detail="' + p.id + '" aria-label="进入' + p.location + '事件详情" title="进入事件详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>' +
                    '</article>';
                });
            });
        }
        document.getElementById('js-drawerBody').innerHTML = html;
        document.querySelectorAll('.run-issue [data-focus]').forEach(function (el) {
            el.addEventListener('click', function () { focusProblemOnMap(el.dataset.focus); });
        });
        document.querySelectorAll('.run-issue [data-detail]').forEach(function (el) {
            el.addEventListener('click', function () { openProblem(el.dataset.detail); });
        });
    }

    function focusProblemOnMap(pid) {
        // 再次点击同一点位 → 取消选中；点击另一点位 → 切换选中
        selectedProblemId = (selectedProblemId === pid) ? null : pid;
        problemClusterExpanded = true;
        mapMode = 'problems';
        renderProblems();
        if (drawerMode === 'problems' && document.getElementById('js-drawer').classList.contains('is-open')) renderProblemList();
        renderMapLayers();
        if (selectedProblemId) CAR.toast('已在地图定位该事件');
    }

    updateToolBadges();
    document.getElementById('js-task-tool').addEventListener('click', function () { toggleDrawer('tasks'); });
    document.getElementById('js-drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('js-drawerMask').addEventListener('click', closeDrawer);
    document.getElementById('js-taskInfo').addEventListener('click', openTaskInfo);
    document.getElementById('js-taskInfoClose').addEventListener('click', closeTaskInfo);
    document.getElementById('js-taskInfoMask').addEventListener('click', closeTaskInfo);

    document.getElementById('js-reset').addEventListener('click', function () {
        closeDrawer();
        var map = document.querySelector('.car-map'); map.classList.remove('is-resetting'); void map.offsetWidth; map.classList.add('is-resetting');
        focusCurrentTask();
        CAR.toast('已复位至车辆与巡查员当前位置');
    });
    document.getElementById('js-fullscreen').addEventListener('click', function () {
        var split = document.querySelector('.car-main-split');
        var active = split.classList.toggle('is-map-fullscreen'); this.classList.toggle('is-active', active);
        this.setAttribute('aria-label', active ? '退出全屏' : '地图全屏');
        this.setAttribute('aria-pressed', String(active));
        if (leafletMap) window.setTimeout(function () { leafletMap.invalidateSize(false); focusCurrentTask(); }, 0);
        CAR.toast(active ? '已进入地图全屏' : '已退出地图全屏');
    });
    document.getElementById('js-handover').addEventListener('click', function () {
        var check = CAR.validateHandover();
        if (!check.ok) { CAR.toast(check.message); return; }
        CAR.go('car-handover.html', { delay: 300 });
    });

    document.getElementById('js-back-list').addEventListener('click', function () {
        CAR.go('car-home.html?panel=tasks&task=' + encodeURIComponent(currentTask.id), { toast: '已返回今日任务列表', delay: 260 });
    });

    // 结束任务：任务完成情况校验（含失败分支演示）
    document.getElementById('js-finish').addEventListener('click', function () {
        var check = CAR.validateFinish(currentTask, mileage);
        if (!check.ok) { CAR.toast(check.message); return; }
        CAR.confirm({
            title: '结束任务确认',
            content: '将结束当前巡查任务「' + currentTask.area + '」，结束后系统将进行任务完成情况校验。',
            okText: '结束任务',
            onOk: function () {
                var result = CAR.finishTask(currentTask.id, { mileage: Number(mileage.toFixed(2)), duration: Math.round(duration) });
                var target = result.next ? result.next.id : currentTask.id;
                var message = result.next ? '当前任务已结束，下一条任务已推送' : '今日任务均已完成，可在归还车辆后交车';
                CAR.go('car-home.html?panel=tasks&task=' + target + '&finished=' + currentTask.id, { toast: message, delay: 900 });
            }
        });
    });

    PROBLEMS.forEach(renderProblemPoint);
    renderProblems();
    initLeafletMap();
    renderMapLayers();
    focusCurrentTask();
    startRealtimeTrack();
})();
</script>
</body>
</html>
