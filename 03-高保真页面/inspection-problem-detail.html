<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>事件详情 - 品质巡查</title>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="components/top-capsule.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * { box-sizing: border-box; }
        html { max-width: 375px; margin: 0 auto; background: #f5f5f5; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0 0 calc(76px + env(safe-area-inset-bottom));
            background: #f5f5f5;
            color: #000000d9;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }

        .problem-map {
            position: relative;
            height: 208px;
            overflow: hidden;
            background:
                linear-gradient(119deg, transparent 0 34%, rgba(255,255,255,0.62) 34% 37%, transparent 37%),
                linear-gradient(22deg, transparent 0 53%, rgba(255,255,255,0.55) 53% 56%, transparent 56%),
                linear-gradient(156deg, transparent 0 73%, rgba(255,255,255,0.48) 73% 75%, transparent 75%),
                #dfe7eb;
        }
        /* Leaflet 地图（替代上方伪底图方案） */
        .problem-map.is-leaflet { background: #edf2f5; }
        .pd-leaflet-map { position: absolute; inset: 0; z-index: 0; background: #edf2f5; font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
        .pd-map-fallback { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; padding: 16px; background: #edf2f5; color: #00000073; font-size: 13px; text-align: center; }
        .pd-map-fallback.is-visible { display: flex; }
        .problem-map.is-leaflet > .map-area,
        .problem-map.is-leaflet > .map-pin { display: none !important; }
        .pd-leaflet-map .leaflet-control-zoom { display: none; }
        .pd-leaflet-map .leaflet-control-attribution { padding: 2px 5px; background: rgba(255,255,255,0.86); color: #00000073; font-size: 10px; }
        .pd-leaflet-map .leaflet-control-attribution a { color: #1677ff; }
        .pd-leaflet-map .leaflet-marker-icon { border: 0; background: transparent; }
        .pd-leaflet-map .leaflet-tile-pane { filter: saturate(0.8) contrast(0.96) brightness(1.03); }
        .pd-map-marker--problem { width: 38px; height: 38px; display: grid; place-items: center; transform: translate(-50%, -100%); border: 3px solid #fff; border-radius: 50% 50% 50% 0; background: var(--pd-problem-color, #8c8c8c); box-shadow: 0 4px 12px rgba(24,39,59,0.25); }
        .pd-map-marker--problem svg { width: 19px; height: 19px; color: #fff; }
        .problem-map::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.55;
            background-image:
                linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .map-area {
            position: absolute;
            left: 17%;
            top: 31%;
            width: 56%;
            height: 42%;
            border: 2px dashed rgba(22,119,255,0.62);
            border-radius: 12px;
            background: rgba(22,119,255,0.11);
        }
        .map-pin {
            position: absolute;
            left: 49%;
            top: 51%;
            z-index: 2;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            transform: translate(-50%, -100%) rotate(-45deg);
            border: 3px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            background: var(--pd-problem-color, #8c8c8c);
            box-shadow: 0 4px 12px rgba(24,39,59,0.25);
        }
        .map-pin svg { width: 19px; height: 19px; transform: rotate(45deg); color: #ffffff; }
        .map-label {
            position: absolute;
            left: 16px;
            bottom: 14px;
            z-index: 3;
            max-width: calc(100% - 32px);
            padding: 6px 10px;
            overflow: hidden;
            border-radius: 6px;
            background: rgba(255,255,255,0.94);
            color: #000000a6;
            font-size: 12px;
            line-height: 18px;
            text-overflow: ellipsis;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(24,39,59,0.11);
        }

        .summary-band { padding: 14px 16px; background: #ffffff; }
        .summary-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .problem-type { min-width: 0; overflow: hidden; font-size: 17px; font-weight: 700; line-height: 24px; text-overflow: ellipsis; white-space: nowrap; }
        .status-tag { flex: none; display: inline-flex; align-items: center; min-height: 22px; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 18px; }
        .status-tag--done { background: #f6ffed; color: #389e0d; }
        .status-tag--pending { background: #fffbe6; color: #d48806; }
        .status-tag--assigned { background: #e6f4ff; color: #0958d9; }
        .status-tag--processing { background: #e6f4ff; color: #1677ff; }
        .status-tag--review { background: #f9f0ff; color: #531dab; }
        .summary-time { margin-top: 6px; color: #00000073; font-size: 13px; line-height: 20px; font-family: "DIN", "SF UI Text", sans-serif; }
        .summary-source { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; color: #000000a6; font-size: 13px; line-height: 20px; }
        .summary-source .src-sep { margin: 0 6px; color: #d9d9d9; }

        /* 处置节点流程条 */
        .node-flow { padding: 16px; }
        .node-flow__track { display: flex; align-items: flex-start; justify-content: space-between; position: relative; }
        .node-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; min-width: 0; }
        .node-step__dot { width: 18px; height: 18px; border-radius: 50%; background: #ffffff; border: 2px solid #d9d9d9; display: grid; place-items: center; color: #ffffff; font-size: 11px; }
        .node-step__name { margin-top: 6px; color: #00000073; font-size: 11px; line-height: 16px; text-align: center; white-space: nowrap; }
        .node-step.is-done .node-step__dot { background: #52c41a; border-color: #52c41a; }
        .node-step.is-done .node-step__name { color: #52c41a; }
        .node-step.is-current .node-step__dot { background: #1677ff; border-color: #1677ff; box-shadow: 0 0 0 4px rgba(22,119,255,0.18); }
        .node-step.is-current .node-step__name { color: #1677ff; font-weight: 600; }
        .node-step__line { position: absolute; top: 8px; left: 50%; right: -50%; height: 2px; background: #d9d9d9; z-index: 0; }
        .node-step.is-done .node-step__line { background: #52c41a; }
        .node-step:last-child .node-step__line { display: none; }

        .section { margin-top: 12px; background: #ffffff; }
        .section__title { padding: 13px 16px 8px; color: #00000073; font-size: 12px; line-height: 18px; }
        .info-list { padding: 0 16px; }
        .info-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; min-height: 48px; padding: 12px 0; border-top: 1px solid #f0f0f0; }
        .info-row__label { flex: none; color: #00000073; font-size: 14px; line-height: 22px; }
        .info-row__value { min-width: 0; color: #000000d9; font-size: 14px; line-height: 22px; text-align: right; word-break: break-word; }
        .info-row__value--mono { font-family: "DIN", "SF UI Text", sans-serif; }
        .text-block { padding: 10px 16px 16px; border-top: 1px solid #f0f0f0; color: #000000d9; font-size: 14px; line-height: 22px; white-space: pre-wrap; }
        .photo-row { display: flex; gap: 8px; padding: 10px 16px 16px; border-top: 1px solid #f0f0f0; }
        .photo-empty {
            width: 92px;
            height: 92px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 1px dashed #d9d9d9;
            border-radius: 8px;
            background: #fafafa;
            color: #00000073;
            font-size: 12px;
            line-height: 18px;
        }
        .photo-empty svg { width: 22px; height: 22px; color: #00000040; }
        .photo-note { align-self: center; color: #00000073; font-size: 12px; line-height: 18px; }

        .page-actions {
            position: fixed;
            left: 50%;
            bottom: 0;
            z-index: 20;
            width: min(100%, 375px);
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            background: #ffffff;
            border-top: 1px solid #e8e8e8;
        }
        .page-actions__back { width: 100%; height: 44px; border: none; border-radius: 8px; background: #1677ff; color: #ffffff; font-size: 16px; font-weight: 600; }
        .page-actions__back:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div id="js-capsule" data-top-capsule></div>

    <main>
        <section class="problem-map" id="js-problem-map" aria-label="事件点位地图">
            <div class="pd-leaflet-map" id="js-leaflet-map"></div>
            <div class="pd-map-fallback" id="js-map-fallback">地图服务暂不可用，请检查网络连接</div>
            <div class="map-area"></div>
            <span class="map-pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 12.5 10.2 16 17 8.5"/></svg></span>
            <span class="map-label" id="js-map-location"></span>
        </section>

        <section class="summary-band" aria-label="事件摘要">
            <div class="summary-top">
                <span class="problem-type" id="js-problem-type"></span>
                <span class="status-tag" id="js-status"></span>
            </div>
            <div class="summary-time" id="js-occur-time"></div>
            <div class="summary-source" id="js-source-line"></div>
        </section>

        <section class="section" aria-label="事件信息">
            <div class="section__title">事件信息</div>
            <div class="info-list">
                <div class="info-row"><span class="info-row__label">任务编号</span><span class="info-row__value info-row__value--mono" id="js-task-id"></span></div>
                <div class="info-row"><span class="info-row__label">经纬度</span><span class="info-row__value info-row__value--mono" id="js-coordinate"></span></div>
                <div class="info-row"><span class="info-row__label">事件地点</span><span class="info-row__value" id="js-location"></span></div>
            </div>
            <div class="section__title">事件图片</div>
            <div class="photo-row" id="js-problem-photos"></div>
            <div class="section__title">事件描述</div>
            <div class="text-block" id="js-description"></div>
        </section>

        <section class="section" aria-label="处置节点">
            <div class="section__title">处置节点</div>
            <div class="node-flow" id="js-node-flow"></div>
        </section>
    </main>

    <footer class="page-actions">
        <button type="button" class="page-actions__back" id="js-back">返回</button>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="components/top-capsule.js"></script>
    <script src="components/inspection-problem-data.js"></script>
    <script>
    (function () {
        'use strict';

        var params = new URLSearchParams(location.search);
        var requestedId = params.get('problem') || 'P001';
        var requestedTaskId = params.get('task');
        var source = params.get('from');
        var records = window.INSPECTION_PROBLEM_BY_ID || {};
        var item = records[requestedId] || {
            id: requestedId, no: requestedId, taskId: requestedTaskId, status: 'pending', statusText: '待确认', node: '待判别',
            problemType: '未知类型', discoveryType: '人工', source: '监控中心', discoverer: '—',
            location: '待确认事件位置', occurredAt: '—', coordinate: '—', description: '暂无事件描述。',
            photos: []
        };
        item.taskId = requestedTaskId || item.taskId;

        function setText(id, value) { document.getElementById(id).textContent = value || '—'; }
        function renderPhotoState(id, list, emptyText) {
            var holder = document.getElementById(id);
            if (list && list.length) {
                holder.innerHTML = list.map(function (src, index) { return '<img src="' + src + '" alt="事件照片 ' + (index + 1) + '">'; }).join('');
                return;
            }
            holder.innerHTML = '<div class="photo-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-4.5-4.5L6 20"/></svg><span>暂无照片</span></div><span class="photo-note">' + emptyText + '</span>';
        }
        function backToProblemList() {
            if (source === 'service') {
                var query = new URLSearchParams({
                    status: params.get('status') || item.status || 'pending',
                    date: params.get('date') || 'today'
                });
                if (params.get('date') === 'custom') {
                    query.set('start', params.get('start') || '');
                    query.set('end', params.get('end') || '');
                }
                location.href = 'inspection-problem-management.html?' + query.toString();
                return;
            }
            location.href = 'inspection-management.html?task=' + encodeURIComponent(item.taskId) + '&sheet=problems';
        }

        // ===== Leaflet 小地图：展示事件点位 =====
        function parseLatLng(str) {
            if (!str) return null;
            var parts = String(str).split(',').map(function (s) { return s.trim(); });
            if (parts.length < 2) return null;
            var lng = parseFloat(parts[0]);
            var lat = parseFloat(parts[1]);
            if (isNaN(lat) || isNaN(lng)) return null;
            return [lat, lng];
        }
        function problemStatusColor(status) {
            return {
                unidentified: '#8c8c8c',
                unassigned: '#faad14',
                unprocessed: '#1677ff',
                processing: '#1677ff',
                reviewing: '#1677ff',
                pending: '#8c8c8c',
                assigned: '#faad14',
                review: '#1677ff',
                done: '#52c41a'
            }[status] || '#8c8c8c';
        }
        function initProblemMap() {
            var mapEl = document.getElementById('js-problem-map');
            if (typeof window.L === 'undefined') { return; }
            var ll = parseLatLng(item.coordinate);
            var center = ll || [23.129, 113.265];
            try {
                var map = L.map('js-leaflet-map', {
                    zoomControl: false, attributionControl: true,
                    preferCanvas: true, minZoom: 12, maxZoom: 19,
                    dragging: true, scrollWheelZoom: false
                }).setView(center, 16);
                var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
                }).addTo(map);
                tiles.on('tileerror', function () { /* 静默降级，保留点位 */ });
                if (ll) {
                    var icon = L.divIcon({
                        className: '', iconSize: [38, 38], iconAnchor: [19, 38],
                        html: '<span class="pd-map-marker--problem" style="--pd-problem-color:' + problemStatusColor(item.status) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 12.5 10.2 16 17 8.5"/></svg></span>'
                    });
                    L.marker(ll, { icon: icon }).addTo(map);
                }
                mapEl.classList.add('is-leaflet');
                // 容器尺寸就绪
                [0, 60, 200].forEach(function (d) { setTimeout(function () { map.invalidateSize(false); }, d); });
                window.addEventListener('load', function () { map.invalidateSize(false); });
            } catch (err) {
                var fb = document.getElementById('js-map-fallback');
                if (fb) fb.classList.add('is-visible');
            }
        }

        // 处置节点流程：待判别 - 待分配 - 待处理 - 处理中 - 待核查 - 已完成
        var NODE_FLOW = ['待判别', '待分配', '待处理', '处理中', '待核查', '已完成'];
        function renderNodeFlow(currentNode) {
            var idx = NODE_FLOW.indexOf(currentNode);
            if (idx === -1) idx = 0;
            var html = '<div class="node-flow__track">';
            NODE_FLOW.forEach(function (name, i) {
                var state = i < idx ? 'is-done' : (i === idx ? 'is-current' : '');
                var check = i < idx ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 4 4L19 6"/></svg>' : '';
                html += '<div class="node-step ' + state + '">' +
                    '<div class="node-step__dot">' + check + '</div>' +
                    '<div class="node-step__name">' + name + '</div>' +
                    (i < NODE_FLOW.length - 1 ? '<div class="node-step__line ' + (i < idx ? 'is-done' : '') + '"></div>' : '') +
                    '</div>';
            });
            html += '</div>';
            document.getElementById('js-node-flow').innerHTML = html;
        }
        function statusTagClass(status, node) {
            if (node === '已完成' || status === 'done') return 'status-tag--done';
            if (node === '待核查') return 'status-tag--review';
            if (status === 'processing') return 'status-tag--processing';
            if (status === 'assigned') return 'status-tag--assigned';
            return 'status-tag--pending';
        }

        setText('js-map-location', item.location);
        setText('js-problem-type', item.problemType);
        setText('js-status', item.statusText);
        document.getElementById('js-status').classList.add(statusTagClass(item.status, item.node));
        setText('js-occur-time', item.occurredAt || '—');
        // 事件发现类型 · 事件来源 · 事件发现方 拼接为一行
        var srcParts = [item.discoveryType, item.source, item.discoverer].filter(Boolean);
        document.getElementById('js-source-line').innerHTML = srcParts.map(function (s) { return '<span>' + s + '</span>'; }).join('<span class="src-sep">·</span>');
        setText('js-task-id', item.taskId);
        setText('js-coordinate', item.coordinate);
        setText('js-location', item.location);
        setText('js-description', item.description);
        renderPhotoState('js-problem-photos', item.photos, '当前事件未上传现场图片');
        renderNodeFlow(item.node);

        if (window.TopCapsule) {
            window.TopCapsule.mount(document.getElementById('js-capsule'), {
                title: '事件详情',
                back: backToProblemList,
                moreItems: [
                    { label: '关于', action: function () { alert('品质巡查 v1.0'); } }
                ],
                onExit: backToProblemList
            });
        }
        document.getElementById('js-back').addEventListener('click', backToProblemList);
        document.querySelector('.map-pin').style.setProperty('--pd-problem-color', problemStatusColor(item.status));
        initProblemMap();
    })();
    </script>
</body>
</html>
