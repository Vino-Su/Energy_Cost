<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>结束任务确认 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 375px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; width: 100%; margin: 0; min-height: 100vh;
        }
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
            width: 100%; max-width: 375px; height: 44px;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            display: flex; align-items: center; z-index: 1000; padding: 0 16px;
        }
        .top-nav-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #000000d9; text-decoration: none; margin-left: -8px;
        }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #000000d9;
        }
        .content-area {
            padding: 56px 16px 24px;
        }
        /* 任务概览卡片 */
        .summary-card {
            background: #ffffff; border-radius: 12px;
            padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .summary-name {
            font-size: 16px; font-weight: 600; color: #000000d9;
            margin-bottom: 8px;
        }
        .summary-meta {
            font-size: 12px; color: #00000073; line-height: 20px;
        }
        .summary-stats {
            display: flex; gap: 12px; margin-top: 12px;
            padding-top: 12px; border-top: 1px solid #f5f5f5;
        }
        .stat-item { flex: 1; }
        .stat-value {
            font-size: 18px; font-weight: 600; color: #000000d9;
        }
        .stat-value.success { color: #52c41a; }
        .stat-label {
            font-size: 11px; color: #00000073; margin-top: 2px;
        }
        /* 完成校验区 */
        .check-card {
            background: #ffffff; border-radius: 12px;
            padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .check-title {
            font-size: 14px; font-weight: 500; color: #000000d9; margin-bottom: 12px;
        }
        .check-row {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 0; font-size: 13px;
        }
        .check-row + .check-row { border-top: 1px solid #f5f5f5; }
        .check-icon {
            width: 18px; height: 18px; flex-shrink: 0;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .check-icon.ok { background: #f6ffed; color: #52c41a; }
        .check-icon.warn { background: #fff7e6; color: #fa8c16; }
        .check-icon.fail { background: #fff1f0; color: #ff4d4f; }
        .check-icon svg { width: 12px; height: 12px; }
        .check-text { flex: 1; color: #000000d9; }
        .check-meta { color: #00000073; font-size: 12px; }
        /* 结果填写 */
        .input-card {
            background: #ffffff; border-radius: 12px;
            padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .input-label {
            font-size: 13px; color: #000000d9; margin-bottom: 8px;
            font-weight: 500;
        }
        .textarea-field {
            width: 100%; min-height: 80px; padding: 10px 12px;
            border: 1px solid #e8e8e8; border-radius: 8px;
            background: #ffffff; font-size: 14px; color: #000000d9;
            font-family: inherit; box-sizing: border-box; resize: vertical;
        }
        .textarea-field:focus { outline: none; border-color: #1677ff; }
        /* 阻断项提示 */
        .block-alert {
            background: #fff1f0; border: 1px solid #ffccc7; border-radius: 8px;
            padding: 12px; margin-bottom: 12px;
            display: none;
        }
        .block-alert.show { display: flex; gap: 8px; align-items: flex-start; }
        .block-alert-icon {
            width: 18px; height: 18px; color: #ff4d4f; flex-shrink: 0; margin-top: 1px;
        }
        .block-alert-text { flex: 1; font-size: 13px; color: #ff4d4f; line-height: 20px; }
        /* 提醒项提示 */
        .warn-alert {
            background: #fff7e6; border: 1px solid #ffe7ba; border-radius: 8px;
            padding: 12px; margin-bottom: 12px;
            display: none;
        }
        .warn-alert.show { display: flex; gap: 8px; align-items: flex-start; }
        .warn-alert-icon {
            width: 18px; height: 18px; color: #fa8c16; flex-shrink: 0; margin-top: 1px;
        }
        .warn-alert-text { flex: 1; font-size: 13px; color: #fa8c16; line-height: 20px; }
        /* 底部操作 */
        .bottom-actions {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 375px;
            padding: 12px 16px 16px;
            background: #ffffff; border-top: 1px solid #e8e8e8;
            display: flex; gap: 8px;
            z-index: 1000;
        }
        .action-btn {
            flex: 1; height: 44px; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; transition: opacity 0.15s;
            text-decoration: none;
        }
        .action-btn.secondary {
            background: #ffffff; color: #000000d9; border: 1px solid #e8e8e8;
        }
        .action-btn.primary { background: #1677ff; color: #ffffff; }
        .action-btn.primary.disabled { background: #85a5cc; color: #ffffff; cursor: not-allowed; }
        .action-btn:active:not(.disabled) { opacity: 0.85; }
    </style>
</head>
<body data-no-project-switcher="true">
    <div class="top-nav">
        <a href="map-workbench.html" class="top-nav-back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title">结束任务</div>
    </div>

    <div class="content-area">
        <!-- 任务概览 -->
        <div class="summary-card">
            <div class="summary-name">科技园南区道路清扫</div>
            <div class="summary-meta">
                计划时间：08:30 - 10:30<br>
                实际开始：08:35<br>
                已执行时长：1 小时 12 分钟
            </div>
            <div class="summary-stats">
                <div class="stat-item">
                    <div class="stat-value success">92%</div>
                    <div class="stat-label">路线覆盖度</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">计划内</div>
                    <div class="stat-label">时间校验</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">0</div>
                    <div class="stat-label">未闭环动态任务</div>
                </div>
            </div>
        </div>

        <!-- 完成校验 -->
        <div class="check-card">
            <div class="check-title">完成校验</div>
            <div class="check-row">
                <div class="check-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="check-text">路线覆盖度 92%（阈值 80%）</div>
            </div>
            <div class="check-row">
                <div class="check-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="check-text">在计划时间内完成作业</div>
            </div>
            <div class="check-row">
                <div class="check-icon ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="check-text">动态任务 0 项未闭环</div>
            </div>
            <div class="check-row">
                <div class="check-icon warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div>
                <div class="check-text">轻微偏离路线 <span class="check-meta">1 次</span></div>
            </div>
        </div>

        <!-- 提醒项提示（演示状态切换） -->
        <div class="warn-alert" id="warnAlert">
            <svg class="warn-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
            <div class="warn-alert-text">存在提醒项（轻微偏离 1 次），确认后将记录异常，但允许结束任务。</div>
        </div>

        <!-- 阻断项提示（演示状态切换） -->
        <div class="block-alert" id="blockAlert">
            <svg class="block-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div class="block-alert-text">存在未闭环动态任务，请先处理后再结束。</div>
        </div>

        <!-- 结果填写 -->
        <div class="input-card">
            <div class="input-label">完成说明</div>
            <textarea class="textarea-field" placeholder="请描述本次任务完成情况（选填）"></textarea>
        </div>
        <div class="input-card">
            <div class="input-label">异常说明</div>
            <textarea class="textarea-field" placeholder="如有异常情况，请详细说明（选填）"></textarea>
        </div>
    </div>

    <div class="bottom-actions">
        <a href="map-workbench.html" class="action-btn secondary">取消</a>
        <a href="javascript:void(0)" id="confirmBtn" onclick="confirmFinish()" class="action-btn primary">确认结束</a>
    </div>

    <script>
        // 演示：根据 demo 状态切换（默认仅提醒项）
        function confirmFinish() {
            if (document.getElementById('blockAlert').classList.contains('show')) {
                alert('存在阻断项，无法结束任务');
                return;
            }
            if (document.getElementById('warnAlert').classList.contains('show')) {
                if (!confirm('存在提醒项，确认结束并记录异常？')) return;
            }
            alert('演示：任务已结束，已自动推送下一任务：沙河西路应急处置');
            window.location.href = 'map-workbench.html';
        }

        // 暴露切换函数以便演示（不显示 UI）
        window.__demo = {
            showBlock: function () {
                document.getElementById('blockAlert').classList.add('show');
                document.getElementById('warnAlert').classList.remove('show');
                document.getElementById('confirmBtn').classList.add('disabled');
            },
            showWarn: function () {
                document.getElementById('blockAlert').classList.remove('show');
                document.getElementById('warnAlert').classList.add('show');
                document.getElementById('confirmBtn').classList.remove('disabled');
            },
            hideAll: function () {
                document.getElementById('blockAlert').classList.remove('show');
                document.getElementById('warnAlert').classList.remove('show');
                document.getElementById('confirmBtn').classList.remove('disabled');
            }
        };
        // 默认展示提醒项
        window.__demo.showWarn();
    </script>
    <script src="components/app-common.js"></script>
</body>
</html>
