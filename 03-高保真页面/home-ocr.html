<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工作台 - 城市管家OCR版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="components/custom-tabbar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 375px;
            min-height: 100vh;
            background: #f5f5f5;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            width: 100%;
            margin: 0;
            min-height: 100vh;
            padding-bottom: 56px;
        }
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 375px;
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 0 16px;
        }
        .top-nav-title {
            font-size: 16px;
            font-weight: 600;
            color: #000000d9;
        }
        .content-area {
            padding-top: 44px;
            padding-bottom: 56px;
        }
        .section-title {
            font-size: 14px;
            color: #00000073;
            padding: 16px 16px 12px;
        }
        .module-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 0 16px;
        }
        .module-item {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.15s;
        }
        .module-item:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        .module-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .module-icon.fuel { background: #fff7e6; }
        .module-icon.water { background: #e6f4ff; }
        .module-icon.charge { background: #f6ffed; }
        .module-icon.records { background: #f2f0ff; }
        .module-icon svg {
            width: 24px;
            height: 24px;
        }
        .module-name {
            font-size: 12px;
            color: #000000d9;
            font-weight: 500;
        }
        .ocr-tag {
            font-size: 10px;
            color: #1677ff;
            background: #e6f4ff;
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: -4px;
        }
        .placeholder-hint {
            margin: 24px 16px 0;
            padding: 16px;
            background: #ffffff;
            border-radius: 12px;
            font-size: 13px;
            color: #00000073;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <div class="top-nav-title">工作台 · OCR版</div>
        <div class="project-switcher" role="button" aria-label="切换项目" onclick="CityStewardCommon.openProjectPicker()">
            <span class="project-switcher-text">选择项目</span>
            <svg class="project-switcher-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
    </div>

    <div class="content-area">
        <!-- 车务管理分组 -->
        <div class="section-title">车务管理 · OCR识别</div>
        <div class="module-grid">
            <a href="fuel-report-ocr.html?from=ocr" class="module-item">
                <div class="module-icon fuel">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#fa8c16"/></svg>
                </div>
                <span class="module-name">加油上报</span>
                <span class="ocr-tag">OCR</span>
            </a>

            <a href="water-report-ocr.html?from=ocr" class="module-item">
                <div class="module-icon water">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 18c-3.15 0-6-2.38-6-6.2 0-2.34 1.78-5.23 6-8.92 4.22 3.69 6 6.58 6 8.92 0 3.82-2.85 6.2-6 6.2z" fill="#1677ff"/></svg>
                </div>
                <span class="module-name">加水上报</span>
                <span class="ocr-tag">OCR</span>
            </a>

            <a href="charge-report-ocr.html?from=ocr" class="module-item">
                <div class="module-icon charge">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z" fill="#52c41a"/></svg>
                </div>
                <span class="module-name">充电上报</span>
                <span class="ocr-tag">OCR</span>
            </a>

            <a href="records.html?from=ocr" class="module-item">
                <div class="module-icon records">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#722ed1" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                </div>
                <span class="module-name">上报记录</span>
            </a>
        </div>

        <div class="placeholder-hint">
            本页面为 OCR 识别版工作台，支持拍照自动识别加油、充电、加水相关字段。
        </div>
    </div>

    <!-- 底部Tab（自定义组件） -->
    <nav class="ctab-bar" aria-label="主导航"></nav>
    <script src="components/app-common.js"></script>
    <script src="components/tab-apps-data.js"></script>
    <script src="components/custom-tabbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            CustomTabbar.init({ activeKey: 'sys-workbench' });
        });
    </script>
</body>
</html>
