<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系统首页 - 车机品质巡查</title>
<link rel="stylesheet" href="components/car-common.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* 地图右上仅保留文字业务入口，右下使用独立的地图辅助工具组。 */
.home-tools { position: absolute; right: var(--car-gap); top: var(--car-gap); z-index: 10; }
.home-tools__group { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
/* 业务入口保留文字识别，默认收敛为白底，当前打开的清单再使用主色强调。 */
.home-biz-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; min-width: 128px; height: var(--car-touch); padding: 0 20px; border: 1px solid var(--car-border); border-radius: calc(var(--car-touch) / 2); background: rgba(255,255,255,0.96); box-shadow: 0 2px 8px rgba(20,40,70,0.14); color: var(--car-text); font-size: var(--car-fs-body); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.12s; }
.home-biz-btn:active { transform: scale(0.98); background: var(--car-surface-soft); }
.home-biz-btn.is-active { border-color: var(--car-primary); background: var(--car-primary); box-shadow: 0 2px 8px rgba(20,40,70,0.18); color: #fff; }
.home-biz-btn__txt { pointer-events: none; }
.home-tool-badge { position: absolute; top: -8px; right: -8px; display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border: 2px solid var(--car-surface); border-radius: 12px; background: var(--car-danger); color: #fff; font-family: var(--car-font-num); font-size: 12px; font-weight: 700; line-height: 1; }
.home-map-tools { position: absolute; right: var(--car-gap); bottom: calc(var(--car-gap) + 24px); z-index: 10; display: flex; flex-direction: column; gap: 12px; }
.home-map-tools .car-icon-btn { box-shadow: 0 2px 8px rgba(20,40,70,0.14); }
.home-map-tools .car-icon-btn.is-active { border-color: #91caff; background: var(--car-primary-soft); color: var(--car-primary); }
/* Leaflet 底图与车机业务图层：地图保持真实瓦片，业务点位使用独立、可访问的标记。 */
.car-map--leaflet { isolation: isolate; }
.home-leaflet-map { position: absolute; inset: 0; z-index: 0; background: #e8eef2; }
.home-leaflet-map .leaflet-tile-pane { filter: saturate(0.78) contrast(0.96) brightness(1.03); }
.home-leaflet-map .leaflet-control-zoom { margin: var(--car-gap); border: 1px solid var(--car-border); border-radius: var(--car-radius-sm); overflow: hidden; box-shadow: 0 2px 8px rgba(20,40,70,0.18); }
.home-leaflet-map .leaflet-control-zoom a { width: 40px; height: 40px; border: 0; color: var(--car-text); font-size: 24px; line-height: 38px; }
.home-leaflet-map .leaflet-control-attribution { padding: 2px 5px; background: rgba(255,255,255,0.84); color: rgba(0,0,0,0.5); font-size: 10px; }
.home-leaflet-map .leaflet-control-attribution a { color: inherit; }
.leaflet-map-area-label { border: 0; border-radius: var(--car-radius-sm); background: rgba(255,255,255,0.92); box-shadow: 0 1px 4px rgba(20,40,70,0.18); color: var(--car-text); font-family: var(--car-font); font-size: 12px; font-weight: 600; }
.leaflet-map-area-label::before { display: none; }
.leaflet-map-marker { display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: var(--car-font-num); font-weight: 700; line-height: 1; }
.leaflet-map-marker--vehicle { width: 34px; height: 34px; border: 2px solid #fff; border-radius: 50%; background: var(--car-primary); color: #fff; box-shadow: 0 2px 6px rgba(20,40,70,0.32); }
.leaflet-map-marker--vehicle svg { width: 22px; height: 22px; }
.leaflet-map-marker--phone { width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50%; background: var(--car-success); color: #fff; box-shadow: 0 2px 6px rgba(20,40,70,0.3); }
.leaflet-map-marker--phone svg { width: 16px; height: 16px; }
.leaflet-map-marker--problem { width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--home-problem-color, var(--car-neutral)); color: #fff; box-shadow: 0 2px 6px rgba(20,40,70,0.3); transform: rotate(-45deg); }
.leaflet-map-marker--problem > span { transform: rotate(45deg); font-size: 18px; }
.leaflet-map-marker--problem.is-selected { box-shadow: 0 0 0 4px var(--car-primary-soft), 0 3px 8px rgba(20,40,70,0.32); }
.leaflet-map-marker--cluster { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.94); border-radius: 50%; background: var(--car-danger); color: #fff; box-shadow: 0 3px 10px rgba(20,40,70,0.3); font-size: var(--car-fs-body); }
.home-map-fallback { position: absolute; inset: 0; z-index: 1; display: none; align-items: center; justify-content: center; padding: 24px; background: #edf2f5; color: var(--car-text-secondary); font-size: var(--car-fs-body); text-align: center; }
.home-map-fallback.is-visible { display: flex; }
.car-main-split.is-map-fullscreen { position: fixed; inset: var(--car-topbar-height) 0 0; z-index: 80; display: block; padding: var(--car-gap); background: var(--car-page-bg); }
.car-main-split.is-map-fullscreen > .car-map { width: 100%; height: 100%; }
.car-main-split.is-map-fullscreen > .home-detail { display: none; }

/* ===== 右屏：当前任务详情卡 + 今日清单抽屉 ===== */
.home-detail { position: relative; display: flex; flex-direction: column; min-height: 0; }
/* 详情主体 */
.home-detail__body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--car-pad); display: flex; flex-direction: column; gap: 0; }
.home-pending-empty { display: flex; flex: 1 0 220px; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 32px 20px; color: var(--car-text-secondary); text-align: center; }
.home-pending-empty__icon { width: 48px; height: 48px; color: var(--car-primary); }
.home-pending-empty__title { color: var(--car-text); font-size: var(--car-fs-panel); font-weight: 600; line-height: 28px; }
.home-pending-empty__desc { max-width: 320px; font-size: var(--car-fs-body); line-height: 24px; }

/* ===== 今日清单抽屉（覆盖详情卡） ===== */
.home-drawer-mask { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.32); opacity: 0; visibility: hidden; transition: opacity 0.22s ease-out, visibility 0.22s; }
.home-drawer-mask.is-open { opacity: 1; visibility: visible; }
.home-drawer { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; background: var(--car-surface); transform: translateY(8px); opacity: 0; visibility: hidden; transition: transform 0.26s ease-out, opacity 0.26s ease-out, visibility 0.26s; }
.home-drawer.is-open { transform: translateY(0); opacity: 1; visibility: visible; }
.home-drawer__head { display: flex; align-items: center; gap: 12px; padding: 14px var(--car-pad); border-bottom: 1px solid var(--car-border); }
.home-drawer__title { font-size: var(--car-fs-panel); font-weight: 600; }
.home-drawer__body { flex: 1; min-height: 0; overflow-y: auto; }
.home-drawer__foot { display: flex; padding: var(--car-pad); border-top: 1px solid var(--car-border); background: var(--car-surface); }
.home-drawer__foot .car-btn { gap: 8px; }
.home-drawer__foot[hidden], .home-drawer__foot .car-btn[hidden] { display: none !important; }
.home-drawer__foot--review { gap: 12px; }
.home-drawer__foot--review .car-btn { width: auto; flex: 1; }
/* 抽屉内任务概要（精简两行） */
.home-task { width: 100%; display: flex; flex-direction: column; gap: 6px; min-height: 96px; padding: 14px var(--car-pad); border: 0; border-bottom: 1px solid var(--car-border); background: var(--car-surface); color: var(--car-text); text-align: left; cursor: pointer; transition: background-color 0.18s ease-out; position: relative; }
.home-task:last-child { border-bottom: none; }
.home-task:active { background: var(--car-surface-soft); }
.home-task.is-selected { background: var(--car-primary-soft); }
.home-task.is-selected::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--car-primary); }
.home-task__r1 { display: flex; align-items: center; gap: 12px; }
.home-task__area { flex: 1 1 auto; min-width: 0; font-size: var(--car-fs-list); font-weight: 500; color: var(--car-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-task__r1-meta { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; }
/* 事件上报数徽标：带问题图标，与地图事件点位同色系，未开始任务不渲染 */
.home-task__events { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: var(--car-radius-sm); background: var(--car-danger-soft); color: var(--car-danger); font-family: var(--car-font-num); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; }
.home-task__events svg { width: 14px; height: 14px; }
.home-task__r2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-task__r2 .car-sep { color: var(--car-border); }
.home-task__r2 .car-mono { font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
/* 抽屉分组标题 */
.home-group { padding: 10px var(--car-pad) 4px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); background: var(--car-surface-soft); }
/* 跨任务事件清单：按事件状态分组 */
.home-issue-group { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 8px var(--car-pad); background: var(--car-surface-soft); color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
.home-issue, .car-task-problem { position: relative; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: center; gap: 12px; min-height: 116px; padding: 14px var(--car-pad); border: 0; border-bottom: 1px solid var(--car-border); background: var(--car-surface); color: var(--car-text); transition: background-color 0.15s; }
.home-issue:last-child, .car-task-problem:last-child { border-bottom: 0; }
.home-issue.is-selected, .car-task-problem.is-selected { background: var(--car-primary-soft); }
.home-issue.is-selected::before, .car-task-problem.is-selected::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--car-primary); }
.home-issue__summary, .car-task-problem__summary { display: block; min-width: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.home-issue__summary:active, .car-task-problem__summary:active { opacity: 0.76; }
.home-issue__time, .car-task-problem__time { flex: 0 0 auto; color: var(--car-text); font-size: 18px; font-weight: 600; line-height: 22px; }
.home-issue__content, .car-task-problem__content { display: grid; gap: 7px; min-width: 0; }
.home-issue__head, .car-task-problem__head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.home-issue__location, .car-task-problem__location { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--car-fs-body); font-weight: 600; }
.home-issue__tags, .car-task-problem__tags { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 6px; }
.home-issue__meta, .car-task-problem__meta { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
.home-issue__type, .car-task-problem__type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--car-text); font-size: var(--car-fs-body); font-weight: 500; }
.home-issue__desc, .car-task-problem__desc { overflow: hidden; color: var(--car-text-secondary); font-size: var(--car-fs-aux); line-height: 20px; text-overflow: ellipsis; white-space: nowrap; }
.home-issue__detail, .car-task-problem__detail { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 1px solid var(--car-primary); border-radius: 50%; background: var(--car-surface); color: var(--car-primary); cursor: pointer; transition: background-color 0.15s, transform 0.12s; }
.home-issue__detail:hover, .home-issue__detail:focus-visible, .car-task-problem__detail:hover, .car-task-problem__detail:focus-visible { background: var(--car-primary-soft); }
.home-issue__detail:active, .car-task-problem__detail:active { transform: scale(0.96); }
.home-issue__detail svg, .car-task-problem__detail svg { width: 20px; height: 20px; }
.car-app.is-review-mode #js-handover, .car-app.is-review-mode .home-detail-foot { display: none !important; }
.car-app.is-review-mode .home-tools { display: none; }
.home-task-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; padding: 12px 0; border-bottom: 1px solid var(--car-border); }
.home-task-field { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; min-width: 0; font-size: var(--car-fs-aux); }
.home-task-field__label { color: var(--car-text-secondary); }
.home-task-field__value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--car-text); }
.car-map.is-resetting { animation: home-map-reset 0.34s ease-out; }
@keyframes home-map-reset { 0% { box-shadow: inset 0 0 0 0 rgba(22,119,255,0); } 50% { box-shadow: inset 0 0 0 4px rgba(22,119,255,0.3); } 100% { box-shadow: inset 0 0 0 0 rgba(22,119,255,0); } }
/* 详情卡底部：待开始任务时双按钮横排（开始任务 + 返回列表） */
.home-detail-foot.is-split { display: flex; gap: 12px; }
.home-detail-foot.is-split .car-btn { width: auto; flex: 1; }
</style>
</head>
<body>
<div class="car-app">
    <!-- 顶栏 -->
    <header class="car-topbar">
        <div class="car-topbar__page">
            <div class="car-topbar__brand">
                <svg class="car-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h2l2-5h9l3 5h2"/><path d="M5 13v5h14v-5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>
                品质巡查
            </div>
        </div>
        <div class="car-topbar__spacer"></div>
        <div class="car-topbar__meta">
            <span class="car-pill" id="js-driver">--</span>
            <span class="car-pill car-mono" id="js-vehNo">粤B·D2856</span>
            <span class="car-pill js-clock">--:--</span>
        </div>
        <button class="car-topbar__logout" id="js-handover" aria-label="退出登录" title="退出登录（扫码交车解绑）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            退出登录
        </button>
    </header>
    <!-- 主体：左右分屏 -->
    <div class="car-main">
        <div class="car-main-split">
            <!-- 左屏：地图 -->
            <div class="car-map car-map--leaflet">
                <div class="home-leaflet-map" id="js-leaflet-map" aria-label="车机品质巡查地图"></div>
                <div class="home-map-fallback" id="js-map-fallback" role="status">地图服务未加载，任务与事件信息仍可继续查看</div>
                <!-- 右上业务入口：保留文字以便行车前快速识别 -->
                <div class="home-tools">
                    <div class="home-tools__group home-tools__group--biz">
                        <button class="home-biz-btn home-biz-btn--task" id="js-task-tool" aria-label="查看今日任务" aria-pressed="false" title="今日任务">
                            <span class="home-biz-btn__txt">今日任务</span>
                            <span class="home-tool-badge" id="js-task-badge">0</span>
                        </button>
                        <button class="home-biz-btn home-biz-btn--problem" id="js-problem-tool" aria-label="查看今日事件" aria-pressed="false" title="今日事件">
                            <span class="home-biz-btn__txt">今日事件</span>
                            <span class="home-tool-badge" id="js-problem-badge">0</span>
                        </button>
                    </div>
                </div>
                <!-- 右下地图辅助工具：避开右下版权信息，降低对业务入口的视觉干扰 -->
                <div class="home-map-tools" role="group" aria-label="地图辅助工具">
                        <button class="car-icon-btn" id="js-reset" aria-label="复位" title="复位">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                        <button class="car-icon-btn" id="js-fullscreen" aria-label="地图全屏" aria-pressed="false" title="全屏">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        </button>
                </div>
                <!-- 图例 -->
                <div class="car-legend" id="js-legend">
                    <div class="car-legend__row"><span class="car-legend__mark"><span class="car-legend__zone"></span></span>任务作业区域</div>
                    <div class="car-legend__row"><span class="car-legend__mark"><span class="car-legend__dot car-legend__dot--vehicle"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></span></span>当前车辆位置</div>
                    <div class="car-legend__row"><span class="car-legend__mark"><span class="car-legend__track"></span></span>实际轨迹</div>
                </div>
            </div>

            <!-- 右屏：当前任务详情卡 + 今日清单抽屉 -->
            <div class="car-panel home-detail">
                <!-- 选中任务详情 -->
                <div class="home-detail__body" id="js-detail"></div>
                <div class="car-task-action home-detail-foot">
                    <button class="car-btn car-btn--primary car-btn--lg" id="js-start">开始任务</button>
                    <button class="car-btn car-btn--ghost car-btn--lg" id="js-back-list" style="display:none">返回任务列表</button>
                </div>

                <!-- 今日任务/今日事件抽屉（完整覆盖详情卡） -->
                <div class="home-drawer-mask" id="js-mask"></div>
                <div class="home-drawer" id="js-drawer">
                    <div class="home-drawer__head">
                        <span class="home-drawer__title" id="js-drawerTitle">今日巡查任务</span>
                    </div>
                    <div class="home-drawer__body" id="js-drawerBody"></div>
                    <div class="home-drawer__foot">
                        <button class="car-btn car-btn--ghost car-btn--lg car-btn--block" id="js-close">关闭</button>
                        <button class="car-btn car-btn--ghost car-btn--lg car-btn--block" id="js-review-bind" hidden>返回绑定页</button>
                        <button class="car-btn car-btn--ghost car-btn--lg car-btn--block" id="js-review-back" hidden>返回今日回顾</button>
                    </div>
                </div>
                <div class="car-task-info-mask" id="js-taskInfoMask"></div>
                <aside class="car-task-info-panel" id="js-taskInfoPanel" role="dialog" aria-modal="true" aria-label="任务信息" aria-hidden="true">
                    <div class="car-task-info-panel__head">
                        <span class="car-task-info-panel__title">任务信息</span>
                        <button type="button" class="car-task-info-panel__close" id="js-taskInfoClose" aria-label="关闭任务信息" title="关闭">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="car-task-info-panel__body" id="js-taskInfoBody"></div>
                </aside>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="components/car-common.js"></script>
<script>
(function () {
    var st = CAR.getState();
    var reviewIssueEntry = CAR.query('panel') === 'problems' && CAR.query('from') === 'review';
    if (!st.bound && !reviewIssueEntry) { location.replace('car-bind.html'); return; }
    document.getElementById('js-driver').textContent = st.driverName;
    document.getElementById('js-vehNo').textContent = st.vehicleNo;
    if (reviewIssueEntry) {
        document.querySelector('.car-app').classList.add('is-review-mode');
        document.getElementById('js-task-tool').style.display = 'none';
    }
    CAR.bindClock();
    CAR.installDebugFab();

    var TASKS = CAR.getTasks();
    var STATUS_TAG = {};
    var STATUS_TEXT = {};
    Object.keys(CAR.TASK_STATUS).forEach(function (key) { STATUS_TAG[key] = CAR.TASK_STATUS[key].tag; STATUS_TEXT[key] = CAR.TASK_STATUS[key].text; });
    var PROB_TAG = {};

    function problemLatLng(problem) {

    function addTaskOverview() {
        TASKS.forEach(function (task) {
            if (!task.geo) return;
            var statusStyle = {
                pending: { color: '#faad14', fillColor: '#faad14' },
                running: { color: '#52c41a', fillColor: '#52c41a' },
                done: { color: '#1677ff', fillColor: '#1677ff' },
                transferred: { color: '#86909c', fillColor: '#86909c' },
                terminated: { color: '#86909c', fillColor: '#86909c' },
                invalid: { color: '#86909c', fillColor: '#86909c' }
            }[task.status] || { color: '#86909c', fillColor: '#86909c' };
            var polygon = L.polygon(task.geo.zone, { color: statusStyle.color, weight: task.id === selectedId ? 3 : 2, dashArray: '8 6', fillColor: statusStyle.fillColor, fillOpacity: task.id === selectedId ? 0.18 : 0.10 });

            polygon.on('click', function () {
                selectedId = task.id;
                renderList(); renderDetail(); updateToolBadges();
                CAR.toast('已切换至' + task.area);
            });
            mapLayers.tasks.addLayer(polygon);
            if (task.problemsList.length) {
                // 聚合点落在区域下三分之一处，与上方区域名称形成上下分布
                var b = polygon.getBounds();

                    selectedProblemId = null;
                    focusWithProblems = true;

                    renderDetail(); updateToolBadges();
                    CAR.toast('已展开' + task.area + '的事件点位');

                mapLayers.tasks.addLayer(cluster);

        var selectedTask = TASKS.find(function (task) { return task.id === selectedId; });

            mapLayers.tasks.addLayer(L.marker(selectedTask.geo.vehicle, { icon: vehicleIcon(), title: '当前车辆位置', keyboard: true, riseOnHover: true }).bindTooltip('当前车辆位置', { direction: 'top', offset: [0, -20] }));
            mapLayers.tasks.addLayer(L.marker(selectedTask.geo.phone, { icon: phoneIcon(), title: '巡查员手机位置', keyboard: true, riseOnHover: true }).bindTooltip('巡查员手机位置', { direction: 'top', offset: [0, -20] }));

    function addProblemOverview() {

        // 今日事件模式始终直接展示所有事件点位，不做聚合（PRD 6.2.1：点击今日事件图标后左侧地图显示今日所有上报的事件点位）
        problems.forEach(function (problem) {
            var marker = L.marker(problemLatLng(problem), { icon: problemIcon(problem), title: problem.location + ' · ' + problem.statusText, keyboard: true, riseOnHover: true });
            var isSel = problem.id === selectedProblemId;
            var photos = problem.photos || [];
            if (isSel && photos.length) {

    function fitMapToLayer(layer, maxZoom) {

        renderLegend();
        if (mapMode === 'tasks') {
            fitMapToLayer(mapLayers.tasks, 15);
        } else if (mapMode === 'problems') {
            var selectedProblem = todayProblems().find(function (problem) { return problem.id === selectedProblemId; });
            var selectedLatLng = problemLatLng(selectedProblem);

    function initLeafletMap() {

            if (tileErrorNotified) return;

            CAR.toast('地图底图加载失败，请检查网络连接');
        });
        mapLayers = {
            focus: L.featureGroup().addTo(leafletMap),

        var marker = findProblemMarker(pid);
        var tip = marker && marker.getTooltip && marker.getTooltip();
        var el = tip && tip.getElement ? tip.getElement() : null;
        if (!el) return;
        var thumbs = el.querySelectorAll('.car-photo-bubble__thumb');
        var cur = Array.prototype.findIndex.call(thumbs, function (t) { return t.classList.contains('is-active'); });
        var len = thumbs.length;
        var next = dir === 'next' ? (cur + 1) % len : (cur - 1 + len) % len;
        thumbs.forEach(function (t, i) { t.classList.toggle('is-active', i === next); });
        var count = el.querySelector('.car-photo-bubble__count');
        if (count) count.textContent = (next + 1) + ' / ' + len;

                    var tip = layer.getTooltip();

                    if (el && el.querySelector('[data-problem-id="' + pid + '"]')) found = layer;

    }

    function renderDrawer() {
        if (drawerMode === 'problems') renderProblemList();

    }

    function focusProblemOnMap(pid) {

    // 地图事件点位点击：直接进入事件详情，不显示缩略图、不定位右侧列表

    }
    // 点位 click 事件入口：点击照片气泡内的缩略图/箭头时不进详情，交由气泡委托处理

        var target = e && e.originalEvent && e.originalEvent.target;
        if (target && (target.closest('[data-photo-view]') || target.closest('[data-photo-nav]') || target.closest('.car-photo-bubble-tip'))) return;
        openProblemDetail(pid);
    }

    // 抽屉内任务清单（精简两行 + 分组标题）
    function renderTaskList() {
        document.getElementById('js-drawerTitle').textContent = '今日巡查任务 · ' + TASKS.length + '项';
        var groups = Object.keys(CAR.TASK_STATUS).map(function (key) { return { key: key, label: CAR.TASK_STATUS[key].text }; });
        var html = '';
        var lastGroup = null;
        sortedTasks().forEach(function (t) {
            // 同组首项前插入分组标题
            if (t.status !== lastGroup) {
                var g = groups.find(function (x) { return x.key === t.status; });
                html += '<div class="home-group">' + g.label + '</div>';
                lastGroup = t.status;
            }
            html += '<button type="button" class="home-task' + (t.id === selectedId ? ' is-selected' : '') + '" data-id="' + t.id + '" aria-label="查看' + t.area + '任务详情">' +
                '<div class="home-task__r1"><span class="home-task__area">' + t.area + '</span>' +
                '<span class="home-task__r1-meta">' +
                // 事件上报数：任务未开始（无开始时间）时不显示，符合 PRD 6.3 第3条
                (t.start ? '<span class="home-task__events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>事件 ' + t.problems + '</span>' : '') +
                '<span class="car-tag ' + (STATUS_TAG[t.status] || 'car-tag--neutral') + '">' + t.statusText + '</span>' +
                '</span></div>' +
                '<div class="home-task__r2"><span class="car-mono">' + t.date + '</span><span class="car-sep">·</span><span class="car-mono">' + t.time + '</span><span class="car-sep">·</span><span>' + t.resource + '</span></div>' +
                '</button>';
        });
        document.getElementById('js-drawerBody').innerHTML = html;
        document.querySelectorAll('.home-task').forEach(function (el) {
            el.addEventListener('click', function () {
                selectedId = el.dataset.id;
                focusWithProblems = false;
                renderList(); renderDetail(); updateToolBadges();
                closeDrawer();
            });
        });
    }

    function renderProblemList() {
        var allProblems = todayProblems();
        document.getElementById('js-drawerTitle').textContent = '今日上报事件 · ' + allProblems.length + '项';
        var html = '';
        if (!allProblems.length) {
            html += '<div class="home-prob-empty">暂无符合条件的事件</div>';
        } else {
            Object.keys(CAR.EVENT_STATUS).forEach(function (status) {
                var group = allProblems.filter(function (problem) { return problem.status === status; });
                if (!group.length) return;
                html += '<div class="home-issue-group"><span>' + CAR.EVENT_STATUS[status].text + '</span><span>' + group.length + ' 项</span></div>';
                group.sort(function (a, b) { return b.reportTime.localeCompare(a.reportTime); });
                group.forEach(function (problem) {
                    html += '<article class="home-issue' + (problem.id === selectedProblemId ? ' is-selected' : '') + '" data-id="' + problem.id + '">' +
                        '<button type="button" class="home-issue__summary" data-focus="' + problem.id + '" aria-label="在地图定位' + problem.location + '事件">' +
                        '<span class="home-issue__content"><span class="home-issue__head"><span class="home-issue__time car-mono">' + problem.reportTime.slice(11) + '</span><span class="car-sep">·</span><span class="home-issue__location">' + problem.location + '</span></span>' +
                        '<span class="home-issue__meta"><span class="home-issue__type">' + problem.problemType + '</span><span class="home-issue__tags"><span class="car-tag car-tag--discovery ' + (problem.discoveryType === 'AI' ? 'car-tag--discovery-ai' : 'car-tag--discovery-manual') + '">' + problem.discoveryType + '</span><span class="car-tag ' + (PROB_TAG[problem.status] || 'car-tag--neutral') + '">' + problem.statusText + '</span></span></span>' +
                        '<span class="home-issue__desc">' + problem.description + '</span></span></button>' +
                        '<button type="button" class="home-issue__detail" data-detail="' + problem.id + '" aria-label="进入' + problem.location + '事件详情" title="进入事件详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>' +
                    '</article>';
                });
            });
        }
        document.getElementById('js-drawerBody').innerHTML = html;
        document.querySelectorAll('#js-drawerBody [data-focus]').forEach(function (el) {
            el.addEventListener('click', function () { focusProblemOnMap(el.dataset.focus); });
        });
        document.querySelectorAll('#js-drawerBody [data-detail]').forEach(function (el) {
            el.addEventListener('click', function () { CAR.go('car-problem-detail.html?id=' + el.dataset.detail + (reviewIssueEntry ? '&from=review' : ''), { delay: 220 }); });
        });
    }

    // 保留原调用名，供状态切换后的任务清单刷新使用。
    function renderList() { renderTaskList(); }

    function renderMap(t) {
        renderMapLayers();
        if (mapMode === 'focus') focusTaskMap(t);
    }

    function taskInfoMarkup(t) {
        return '<div class="car-task-info-grid">' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">任务编号</span><span class="car-task-info-field__value car-mono">' + t.no + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">作业资源</span><span class="car-task-info-field__value">' + t.resource + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">任务类型</span><span class="car-task-info-field__value">' + t.type + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">作业类型</span><span class="car-task-info-field__value">' + t.workType + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">任务日期</span><span class="car-task-info-field__value car-mono">' + t.date + '</span></div>' +
            '<div class="car-task-info-field"><span class="car-task-info-field__label">计划时段</span><span class="car-task-info-field__value car-mono">' + t.time + '</span></div>' +
        '</div>';
    }

    function openTaskInfo(t) {
        document.getElementById('js-taskInfoBody').innerHTML = taskInfoMarkup(t);
        document.getElementById('js-taskInfoMask').classList.add('is-open');
        var panel = document.getElementById('js-taskInfoPanel');
        panel.classList.add('is-open');
        panel.setAttribute('aria-hidden', 'false');
    }

    function closeTaskInfo() {
        document.getElementById('js-taskInfoMask').classList.remove('is-open');
        var panel = document.getElementById('js-taskInfoPanel');
        panel.classList.remove('is-open');
        panel.setAttribute('aria-hidden', 'true');
    }

    // 当前任务详情：任务摘要保持紧凑，关联事件按上报时间倒序展示。
    function renderDetail() {
        var t = TASKS.find(function (x) { return x.id === selectedId; });
        renderMap(t);

        var html =
            '<div class="car-task-context">' +
                '<div class="car-task-context__title-row">' +
                    '<div class="car-task-context__title-group"><div class="car-task-context__title">' + t.area + '</div><button type="button" class="car-task-info-trigger" data-task-info aria-label="查看任务信息" title="任务信息"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 3v4h4M8 12h8M8 16h6"/></svg></button></div>' +
                    '<div class="car-task-context__actions"><span class="car-tag ' + (STATUS_TAG[t.status] || 'car-tag--neutral') + '">' + t.statusText + '</span></div>' +
                '</div>' +
                '<div class="car-task-context__meta">' +
                    '<span>' + t.workType + '</span><span class="car-sep">·</span><span class="car-mono">' + t.date + ' ' + t.time + '</span>' +
                '</div>' +
            '</div>';

        if (t.status === 'running' || t.status === 'done') {
            html += '<div class="car-task-summary" aria-label="作业摘要">' +
                '<span class="car-task-summary__item">开始 <strong>' + fmt(t.start) + '</strong></span>' +
                '<span class="car-task-summary__item">里程 <strong>' + fmt(t.mileage, '', '—') + ' km</strong></span>' +
                '<span class="car-task-summary__item">时长 <strong>' + fmt(t.duration, '', '—') + ' min</strong></span>' +
            '</div>';
        }

        if (t.status === 'pending') {
            html += '<section class="home-pending-empty" aria-label="尚未开始作业">' +
                '<svg class="home-pending-empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5h6v2H9zM9 11h6M9 15h4"/></svg>' +
                '<span class="home-pending-empty__title">尚未开始作业</span>' +
                '<span class="home-pending-empty__desc">开始任务后将生成作业摘要与上报记录</span>' +
            '</section>';
        }

        if (t.status === 'running' || t.status === 'done') {
            var taskProblems = (t.problemsList || []).slice().sort(function (a, b) { return b.reportTime.localeCompare(a.reportTime); });
            html += '<section class="car-task-problems"><div class="car-task-problems__head"><span class="car-task-problems__title">上报事件</span><span class="car-task-problems__count">共 ' + taskProblems.length + ' 项</span></div><div class="car-task-problem-list">';
            if (taskProblems.length) {
                taskProblems.forEach(function (p) {
                    html += '<article class="car-task-problem' + (p.id === selectedProblemId ? ' is-selected' : '') + '" data-id="' + p.id + '">' +
                        '<button type="button" class="car-task-problem__summary" data-focus="' + p.id + '" aria-label="在地图定位' + p.location + '事件">' +
                        '<span class="car-task-problem__content"><span class="car-task-problem__head"><span class="car-task-problem__time car-mono">' + p.reportTime.slice(11) + '</span><span class="car-sep">·</span><span class="car-task-problem__location">' + p.location + '</span></span>' +
                        '<span class="car-task-problem__meta"><span class="car-task-problem__type">' + p.problemType + '</span><span class="car-task-problem__tags"><span class="car-tag car-tag--discovery ' + (p.discoveryType === 'AI' ? 'car-tag--discovery-ai' : 'car-tag--discovery-manual') + '">' + p.discoveryType + '</span><span class="car-tag ' + (PROB_TAG[p.status] || 'car-tag--neutral') + '">' + p.statusText + '</span></span></span>' +
                        '<span class="car-task-problem__desc">' + p.description + '</span></span></button>' +
                        '<button type="button" class="car-task-problem__detail" data-detail="' + p.id + '" aria-label="进入' + p.location + '事件详情" title="进入事件详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>' +
                    '</article>';
                });
            } else {
                html += '<div class="car-empty"><span class="car-empty__txt">暂无事件上报记录</span></div>';
            }
            html += '</div></section>';
        }

        document.getElementById('js-detail').innerHTML = html;

        document.querySelectorAll('#js-detail [data-focus]').forEach(function (el) {
            el.addEventListener('click', function () { focusProblemOnMap(el.dataset.focus); });
        });
        document.querySelectorAll('#js-detail [data-detail]').forEach(function (el) {
            el.addEventListener('click', function () { CAR.go('car-problem-detail.html?id=' + el.dataset.detail + (reviewIssueEntry ? '&from=review' : ''), { delay: 220 }); });
        });
        document.querySelectorAll('#js-detail [data-task-info]').forEach(function (el) {
            el.addEventListener('click', function () { openTaskInfo(t); });
        });

        // 固定操作区：待接收双按钮（开始任务 + 返回任务列表）；进行中双按钮（结束任务 + 返回任务列表）；已完成单按钮（返回任务列表）。
        var startBtn = document.getElementById('js-start');
        var backBtn = document.getElementById('js-back-list');
        var foot = document.querySelector('.home-detail-foot');
        if (reviewIssueEntry) { foot.style.display = 'none'; return; }
        foot.style.display = '';
        if (t.status === 'running') {
            foot.classList.add('is-split'); backBtn.style.display = '';
            startBtn.textContent = '结束任务'; startBtn.disabled = false; startBtn.dataset.mode = 'finish'; startBtn.className = 'car-btn car-btn--primary car-btn--lg';
        } else if (t.status !== 'pending') {
            foot.classList.remove('is-split'); backBtn.style.display = 'none';
            startBtn.textContent = '返回任务列表'; startBtn.disabled = false; startBtn.dataset.mode = 'list'; startBtn.className = 'car-btn car-btn--ghost car-btn--lg';
        } else {
            foot.classList.add('is-split'); backBtn.style.display = '';
            startBtn.textContent = '开始任务'; startBtn.disabled = false; startBtn.dataset.mode = 'start'; startBtn.className = 'car-btn car-btn--primary car-btn--lg';
        }
    }

    document.getElementById('js-start').addEventListener('click', function () {
        var t = TASKS.find(function (x) { return x.id === selectedId; });
        var mode = this.dataset.mode;
        if (this.disabled) return;
        if (mode === 'list') { CAR.go('car-home.html?panel=tasks&task=' + t.id, { delay: 180 }); return; }
        if (mode === 'finish') {
            var finishCheck = CAR.validateFinish(t, t.mileage);
            if (!finishCheck.ok) { CAR.toast(finishCheck.message); return; }
            CAR.confirm({
                title: '结束任务确认',
                content: '将结束当前巡查任务「' + t.area + '」，结束后系统将进行任务完成情况校验。',
                okText: '结束任务',
                onOk: function () {
                    var result = CAR.finishTask(t.id, { mileage: t.mileage, duration: t.duration });
                    var target = result.next ? result.next.id : t.id;
                    var message = result.next ? '当前任务已结束，下一条任务已推送' : '今日任务均已完成，可在归还车辆后交车';
                    CAR.go('car-home.html?panel=tasks&task=' + target + '&finished=' + t.id, { toast: message, delay: 900 });
                }
            });
            return;
        }
        var startCheck = CAR.validateStart(t);
        if (!startCheck.ok) {
            CAR.toast(startCheck.message);
            if (startCheck.focusTaskId) { selectedId = startCheck.focusTaskId; renderList(); renderDetail(); updateToolBadges(); }
            return;
        }
        if (startCheck.warning) CAR.toast(startCheck.warning);
        CAR.startTask(t.id);
        CAR.go('car-task-running.html?id=' + t.id, { toast: '任务已开始，进入执行', delay: 900 });
    });
    document.getElementById('js-back-list').addEventListener('click', function () {
        CAR.go('car-home.html?panel=tasks', { toast: '已返回任务列表', delay: 200 });
    });

    // 抽屉交互：任务与事件在右侧工具栏中并列为页面级入口
    document.getElementById('js-task-tool').addEventListener('click', function () { toggleDrawer('tasks'); });
    document.getElementById('js-problem-tool').addEventListener('click', function () { problemTaskFilter = null; toggleDrawer('problems'); });
    document.getElementById('js-close').addEventListener('click', closeDrawer);
    document.getElementById('js-review-bind').addEventListener('click', function () { CAR.go('car-bind.html', { delay: 180 }); });
    document.getElementById('js-review-back').addEventListener('click', function () { CAR.go('car-today-review.html', { delay: 180 }); });
    document.getElementById('js-mask').addEventListener('click', closeDrawer);
    document.getElementById('js-taskInfoClose').addEventListener('click', closeTaskInfo);
    document.getElementById('js-taskInfoMask').addEventListener('click', closeTaskInfo);
    document.getElementById('js-reset').addEventListener('click', function () {
        mapMode = 'focus'; closeDrawer();
        var map = document.querySelector('.car-map'); map.classList.remove('is-resetting'); void map.offsetWidth; map.classList.add('is-resetting');
        focusTaskMap(TASKS.find(function (task) { return task.id === selectedId; }));
        CAR.toast('已复位至车辆与巡查员当前位置');
    });
    document.getElementById('js-fullscreen').addEventListener('click', function () {
        var split = document.querySelector('.car-main-split');
        var active = split.classList.toggle('is-map-fullscreen'); this.classList.toggle('is-active', active);
        this.setAttribute('aria-pressed', String(active));
        this.setAttribute('aria-label', active ? '退出全屏' : '地图全屏');
        if (mapReady && leafletMap) window.setTimeout(function () { leafletMap.invalidateSize(false); }, 0);
        CAR.toast(active ? '已进入地图全屏' : '已退出地图全屏');
    });
    document.getElementById('js-handover').addEventListener('click', function () {
        var handoverCheck = CAR.validateHandover();
        if (!handoverCheck.ok) { CAR.toast(handoverCheck.message); selectedId = handoverCheck.focusTaskId; renderList(); renderDetail(); updateToolBadges(); return; }
        CAR.go('car-handover.html', { delay: 300 });
    });

    initLeafletMap();
    updateToolBadges();
    renderList();
    renderDetail();
    if (CAR.query('finished') || CAR.query('panel') === 'tasks') {
        openDrawer('tasks');
        if (CAR.query('finished')) CAR.toast('任务已结束，已返回任务列表');
    } else if (CAR.query('panel') === 'problems') {
        openDrawer('problems');
    }
})();
</script>
</body>
</html>
