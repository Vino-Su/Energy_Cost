<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系统首页 - 车机品质巡查</title>
<link rel="stylesheet" href="components/car-common.css">
<style>
/* 左屏地图工具条：任务与问题入口和地图辅助操作共用右侧竖向工具栏 */
.home-tools { position: absolute; right: var(--car-gap); top: var(--car-gap); display: flex; flex-direction: column; gap: 10px; z-index: 10; }
.home-tool-btn { position: relative; overflow: visible; }
.home-tool-btn--task { color: var(--car-primary); }
.home-tool-btn--problem { color: var(--car-danger); }
.home-tool-btn.is-active { background: var(--car-primary-soft); border-color: var(--car-primary); }
.home-tool-btn--problem.is-active { background: var(--car-danger-soft); border-color: var(--car-danger); }
.home-tool-badge { position: absolute; top: -7px; right: -7px; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; border: 2px solid var(--car-surface); border-radius: 11px; background: var(--car-danger); color: #fff; font-family: var(--car-font-num); font-size: 12px; font-weight: 700; line-height: 1; }
.home-tool-btn--task .home-tool-badge { background: var(--car-primary); }
.home-tools__divider { width: 28px; height: 1px; margin: 2px auto; background: rgba(0,0,0,0.14); }
/* 地图数据层：仅承载作业区域、重点点位、车辆位置与实际轨迹 */
.home-map-track { position: absolute; inset: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }
.home-map-track path { fill: none; stroke: var(--car-danger); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; filter: drop-shadow(0 1px 2px rgba(255,77,79,0.28)); }
.home-map-all-zones { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.home-map-all-zone { position: absolute; border: 2px dashed rgba(22,119,255,0.34); border-radius: 14px; background: rgba(22,119,255,0.05); }
.home-map-all-zone.is-selected { border-color: rgba(22,119,255,0.82); background: rgba(22,119,255,0.12); box-shadow: inset 0 0 0 1px rgba(22,119,255,0.12); }
.home-map-keypoints { position: absolute; inset: 0; z-index: 7; pointer-events: none; }
.home-map-keypoint { position: absolute; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--car-warning); color: #5b3a00; font-family: var(--car-font-num); font-size: 13px; font-weight: 700; box-shadow: 0 2px 5px rgba(135,89,0,0.28); transform: translate(-50%,-100%) rotate(-45deg); }
.home-map-keypoint > span { transform: rotate(45deg); }
.car-map__point--veh { z-index: 8; width: 26px; height: 26px; }
.car-map__point--veh .home-veh-icon { width: 26px; height: 26px; color: var(--car-primary); filter: drop-shadow(0 2px 4px rgba(20,40,70,0.3)); }
.home-map-problems { position: absolute; inset: 0; z-index: 9; pointer-events: none; }
.home-map-problem { --home-problem-color: var(--car-neutral); position: absolute; width: 36px; height: 42px; transform: translate(-50%,-100%); pointer-events: auto; }
.home-map-problem__icon { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--home-problem-color); color: #fff; font-family: var(--car-font-num); font-size: 18px; font-weight: 700; box-shadow: 0 2px 6px rgba(20,40,70,0.28); transform: rotate(-45deg); }
.home-map-problem__icon > span { transform: rotate(45deg); }
.home-map-problem--pending { --home-problem-color: var(--car-neutral); }
.home-map-problem--assigned { --home-problem-color: var(--car-primary); }
.home-map-problem--processing { --home-problem-color: var(--car-warning); }
.home-map-problem--done { --home-problem-color: var(--car-success); }

/* ===== 右屏：当前任务详情卡 + 今日清单抽屉 ===== */
.home-detail { position: relative; display: flex; flex-direction: column; min-height: 0; }
/* 顶部仅保留任务状态统计，清单入口放入地图右侧工具栏 */
.home-entry { display: flex; align-items: center; gap: 12px; padding: 14px var(--car-pad); border-bottom: 1px solid var(--car-border); }
.home-entry__stats { display: flex; min-width: 0; align-items: baseline; gap: 10px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); white-space: nowrap; }
.home-entry__stats .car-mono { font-size: var(--car-fs-body); font-weight: 600; color: var(--car-text); }
.home-entry__stats .home-stat { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
.home-entry__stats .home-stat .home-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; transform: translateY(-1px); }
/* 详情主体 */
.home-detail__body { flex: 1; overflow-y: auto; padding: var(--car-pad); display: flex; flex-direction: column; gap: 18px; }
/* 详情头部：区域名 + 状态 + 计划时间段 */
.home-dhead { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--car-border); }
.home-dhead__area { font-size: var(--car-fs-title); font-weight: 600; color: var(--car-text); line-height: 1.25; }
.home-dhead__r2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-dhead__r2 .car-sep { color: var(--car-border); }
.home-dhead__r2 .car-mono { font-size: var(--car-fs-body); color: var(--car-text); }
/* 执行指标与作业要求 */
.home-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; padding: 2px 0; }
.home-metric { display: flex; min-width: 0; flex-direction: column; gap: 5px; padding: 2px 12px; border-left: 1px solid var(--car-border); }
.home-metric:first-child { padding-left: 0; border-left: 0; }
.home-metric:last-child { padding-right: 0; }
.home-metric__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-metric__value { display: flex; min-width: 0; align-items: baseline; gap: 3px; }
.home-metric__value .car-mono { overflow: hidden; text-overflow: ellipsis; font-size: 24px; font-weight: 600; color: var(--car-text); line-height: 1.1; }
.home-metric__unit { font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-metric--problems .home-metric__label, .home-metric--problems .home-metric__value .car-mono { color: var(--car-primary); }
.home-requirement { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 2px 14px; border-left: 4px solid var(--car-primary); }
.home-requirement__label, .home-probs__title { font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-requirement__value { margin: 0; font-size: var(--car-fs-body); line-height: 1.5; color: var(--car-text); }
/* 问题上报卡片 */
.home-probs { display: flex; flex-direction: column; gap: 10px; }
.home-probs__head { display: flex; align-items: baseline; justify-content: space-between; }
.home-prob { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; padding: 14px; border: 1px solid var(--car-border); border-radius: var(--car-radius); background: var(--car-surface-soft); color: var(--car-text); font: inherit; text-align: left; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
.home-prob:active { background: var(--car-primary-soft); border-color: var(--car-primary); }
.home-prob__head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.home-prob__no { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--car-font-num); font-size: var(--car-fs-body); font-weight: 600; }
.home-prob__chevron { align-self: center; color: var(--car-text-secondary); }
.home-prob__location, .home-prob__node { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.home-prob__label { flex: 0 0 56px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-prob__location strong, .home-prob__node span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--car-fs-body); font-weight: 400; }
.home-prob__node span:last-child { color: var(--car-primary); }
.home-prob-empty { padding: 18px 0; color: var(--car-text-secondary); font-size: var(--car-fs-body); text-align: center; }
/* 底部主按钮 */
.home-detail-foot { padding: var(--car-pad); border-top: 1px solid var(--car-border); }
.home-detail-foot .car-btn { width: 100%; }

/* ===== 今日清单抽屉（覆盖详情卡） ===== */
.home-drawer-mask { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,0.32); opacity: 0; visibility: hidden; transition: opacity 0.22s ease-out, visibility 0.22s; }
.home-drawer-mask.is-open { opacity: 1; visibility: visible; }
.home-drawer { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 21; display: flex; flex-direction: column; background: var(--car-surface); transform: translateY(8px); opacity: 0; visibility: hidden; transition: transform 0.26s ease-out, opacity 0.26s ease-out, visibility 0.26s; }
.home-drawer.is-open { transform: translateY(0); opacity: 1; visibility: visible; }
.home-drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px var(--car-pad); border-bottom: 1px solid var(--car-border); }
.home-drawer__title { font-size: var(--car-fs-panel); font-weight: 600; }
.home-drawer__close { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: var(--car-fs-aux); color: var(--car-primary); border: 1px solid var(--car-border); border-radius: var(--car-radius-sm); background: var(--car-surface); }
.home-drawer__body { flex: 1; min-height: 0; overflow-y: auto; }
/* 抽屉内任务概要（精简两行） */
.home-task { display: flex; flex-direction: column; gap: 6px; padding: 14px var(--car-pad); border-bottom: 1px solid var(--car-border); cursor: pointer; transition: background-color 0.18s ease-out; position: relative; }
.home-task:last-child { border-bottom: none; }
.home-task:active { background: var(--car-surface-soft); }
.home-task.is-selected { background: var(--car-primary-soft); }
.home-task.is-selected::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--car-primary); }
.home-task__r1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.home-task__area { font-size: var(--car-fs-list); font-weight: 500; color: var(--car-text); }
.home-task__r2 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-task__r2 .car-sep { color: var(--car-border); }
.home-task__r2 .car-mono { font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
/* 抽屉分组标题 */
.home-group { padding: 10px var(--car-pad) 4px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); background: var(--car-surface-soft); }
/* 跨任务问题清单：状态筛选 + 所属任务信息 */
.home-issue-filters { display: flex; gap: 8px; padding: 12px var(--car-pad); overflow-x: auto; border-bottom: 1px solid var(--car-border); background: var(--car-surface); }
.home-issue-filter { flex: 0 0 auto; min-height: var(--car-touch); padding: 0 12px; border: 1px solid var(--car-border); border-radius: var(--car-radius-sm); background: var(--car-surface); color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
.home-issue-filter.is-active { border-color: var(--car-primary); background: var(--car-primary-soft); color: var(--car-primary); font-weight: 500; }
.home-issue { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; padding: 14px var(--car-pad); border-bottom: 1px solid var(--car-border); background: var(--car-surface); color: var(--car-text); font: inherit; text-align: left; cursor: pointer; transition: background-color 0.15s; }
.home-issue:active { background: var(--car-primary-soft); }
.home-issue__head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.home-issue__no { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--car-font-num); font-size: var(--car-fs-body); font-weight: 600; }
.home-issue__chevron { align-self: center; color: var(--car-text-secondary); }
.home-issue__field { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.home-issue__label { flex: 0 0 56px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); }
.home-issue__field strong, .home-issue__field span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--car-fs-body); font-weight: 400; }
.home-issue__field--node span:last-child { color: var(--car-primary); }
.home-issue__task { grid-column: 1 / -1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 66px; color: var(--car-text-secondary); font-size: var(--car-fs-aux); }
</style>
</head>
<body>
<div class="car-app">
    <!-- 顶栏 -->
    <header class="car-topbar">
        <button class="car-topbar__back" onclick="location.href='car-home.html'" aria-label="返回今日任务列表">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="car-topbar__page">
            <div class="car-topbar__brand">
                <svg class="car-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h2l2-5h9l3 5h2"/><path d="M5 13v5h14v-5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>
                酷哇车机 · 品质巡查
            </div>
            <div class="car-topbar__title" id="js-page-title">今日巡查任务</div>
        </div>
        <div class="car-topbar__spacer"></div>
        <div class="car-topbar__meta">
            <span class="car-pill" id="js-driver">--</span>
            <span class="car-pill car-mono" id="js-vehNo">粤B·D2856</span>
            <span class="car-pill js-clock">--:--</span>
        </div>
    </header>

    <!-- 主体：左右分屏 -->
    <div class="car-main">
        <div class="car-main-split">
            <!-- 左屏：地图 -->
            <div class="car-map">
                <div class="car-map__base"></div>
                <div class="car-map__water"></div>
                <div class="car-map__park car-map__park--1"></div>
                <div class="car-map__park car-map__park--2"></div>
                <!-- 建筑块 -->
                <div class="car-map__bldg" style="left:25%;top:30%;width:5%;height:8%"></div>
                <div class="car-map__bldg" style="left:55%;top:24%;width:6%;height:7%"></div>
                <div class="car-map__bldg" style="left:72%;top:55%;width:5%;height:9%"></div>
                <div class="car-map__bldg" style="left:15%;top:60%;width:7%;height:8%"></div>
                <!-- 道路 -->
                <div class="car-map__roads"></div>
                <div class="car-map__road--h2"></div>
                <div class="car-map__road--v2"></div>
                <div class="car-map__grid"></div>
                <!-- 路名标注 -->
                <span class="car-map__label" style="left:30%;top:51%">滨江路</span>
                <span class="car-map__label" style="left:44%;top:20%;transform:rotate(3deg)">解放南路</span>
                <!-- 任务作业区域 -->
                <div class="car-map__zone" id="js-zone" style="left:22%;top:26%;width:46%;height:44%"></div>
                <!-- 打开今日任务清单时展示全部任务作业区域 -->
                <div class="home-map-all-zones" id="js-all-zones" aria-label="全部任务作业区域"></div>
                <!-- 实际轨迹：不展示计划路线 -->
                <svg class="home-map-track" id="js-track" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="车辆实际轨迹">
                    <path id="js-track-path" d=""></path>
                </svg>
                <!-- 重点点位：随任务切换 -->
                <div class="home-map-keypoints" id="js-keypoints" aria-label="重点点位"></div>
                <!-- 车辆位置 -->
                <div class="car-map__point car-map__point--veh" id="js-vehicle" style="left:48%;top:55%">
                    <svg class="home-veh-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </div>
                <!-- 打开今日问题清单时展示全部问题点位 -->
                <div class="home-map-problems" id="js-problem-points" aria-label="今日问题点位"></div>
                <!-- 右侧工具：任务与问题清单为页面级入口，和地图辅助工具同层 -->
                <div class="home-tools">
                    <button class="car-icon-btn home-tool-btn home-tool-btn--task" id="js-task-tool" aria-label="查看今日任务" title="今日任务">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/></svg>
                        <span class="home-tool-badge" id="js-task-badge">0</span>
                    </button>
                    <button class="car-icon-btn home-tool-btn home-tool-btn--problem" id="js-problem-tool" aria-label="查看今日问题" title="今日问题">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 19a2 2 0 0 0 1.75 3h14.5A2 2 0 0 0 21 19L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg>
                        <span class="home-tool-badge" id="js-problem-badge">0</span>
                    </button>
                    <div class="home-tools__divider" aria-hidden="true"></div>
                    <button class="car-icon-btn" id="js-reset" aria-label="复位" title="复位">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                    <button class="car-icon-btn" id="js-layer" aria-label="图层" title="辅助设施图层">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                    </button>
                    <button class="car-icon-btn" id="js-fullscreen" aria-label="全屏" title="全屏">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                    </button>
                    <button class="car-icon-btn" id="js-handover" aria-label="交车" title="交车">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    </button>
                </div>
                <!-- 图例 -->
                <div class="car-legend" id="js-legend">
                    <div class="car-legend__row"><span class="car-legend__mark" style="background:rgba(22,119,255,0.10);border:2px dashed rgba(22,119,255,0.55)"></span>任务作业区域</div>
                    <div class="car-legend__row"><span class="car-legend__mark" style="background:#faad14;border-radius:50%"></span>重点点位</div>
                    <div class="car-legend__row"><span class="car-legend__mark" style="background:#1677ff;border-radius:50%"></span>当前车辆位置</div>
                    <div class="car-legend__row"><span class="car-legend__mark" style="width:16px;height:3px;background:#ff4d4f;border-radius:2px"></span>实际轨迹</div>
                </div>
            </div>

            <!-- 右屏：当前任务详情卡 + 今日清单抽屉 -->
            <div class="car-panel home-detail">
                <!-- 顶部仅展示任务状态统计 -->
                <div class="home-entry">
                    <span class="home-entry__stats" id="js-stats"></span>
                </div>
                <!-- 选中任务详情 -->
                <div class="home-detail__body" id="js-detail"></div>
                <div class="home-detail-foot">
                    <button class="car-btn car-btn--primary car-btn--lg" id="js-start">开始任务</button>
                </div>

                <!-- 今日任务/今日问题抽屉（完整覆盖详情卡） -->
                <div class="home-drawer-mask" id="js-mask"></div>
                <div class="home-drawer" id="js-drawer">
                    <div class="home-drawer__head">
                        <span class="home-drawer__title" id="js-drawerTitle">今日巡查任务</span>
                        <button class="home-drawer__close" id="js-close">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                            <span>收起</span>
                        </button>
                    </div>
                    <div class="home-drawer__body" id="js-drawerBody"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="components/car-common.js"></script>
<script>
(function () {
    var st = CAR.getState();
    var reviewIssueEntry = CAR.query('panel') === 'problems' && CAR.query('from') === 'review';
    if (!st.bound && !reviewIssueEntry) { location.replace('car-bind.html'); return; }
    document.getElementById('js-driver').textContent = st.driverName;
    document.getElementById('js-vehNo').textContent = st.vehicleNo;
    if (reviewIssueEntry) {
        document.getElementById('js-page-title').textContent = '今日上报问题';
        document.getElementById('js-task-tool').style.display = 'none';
    }
    CAR.bindClock();
    CAR.installDebugFab();

    // 演示任务数据：地图仅渲染作业区域、重点点位、车辆位置与实际轨迹。
    var TASKS = [
        { id: 'T001', area: '滨江路东段', status: 'done', statusText: '已完成', type: '巡查任务', workType: '路面质检', time: '08:00-10:00', start: '08:02', mileage: 9.42, duration: 118, problems: 2,
          points: [{ name: '滨江路18号路口', left: '32%', top: '38%' }, { name: '中央广场北门', left: '54%', top: '48%' }, { name: '公交枢纽站', left: '42%', top: '62%' }],
          track: 'M 25 64 C 30 57, 33 48, 39 45 S 50 43, 56 49 S 60 58, 67 62', vehicle: { left: '67%', top: '62%' },
          req: '对作业后路面进行质量检查，发现问题及时通过车载外设上报并处置。',
          problemsList: [
            { id: 'P001', no: 'Q20260727-0014', status: 'done', statusText: '已完成', loc: '滨江路18号路口', currentNode: '处置完成', point: { left: '32%', top: '38%' } },
            { id: 'P003', no: 'Q20260727-0021', status: 'assigned', statusText: '待分配', loc: '滨江路东段K2+300', currentNode: '等待责任人分配', point: { left: '54%', top: '60%' } }
          ],
          zone: { left: '22%', top: '26%', width: '46%', height: '44%' } },
        { id: 'T002', area: '中央广场片区', status: 'todo', statusText: '待开始', type: '巡查任务', workType: '路面质检', time: '10:30-12:00', start: '10:31', mileage: 4.86, duration: 42, problems: 1,
          points: [{ name: '中央广场北门', left: '35%', top: '42%' }, { name: '中央广场南门', left: '58%', top: '61%' }, { name: '喷泉广场', left: '48%', top: '50%' }],
          track: 'M 31 66 C 37 59, 40 51, 46 47 S 54 46, 58 52', vehicle: { left: '58%', top: '52%' },
          req: '对作业后路面进行质量检查，重点关注广场出入口路面破损与积水情况。',
          problemsList: [
            { id: 'P002', no: 'Q20260727-0033', status: 'processing', statusText: '待处理', loc: '中央广场北门', currentNode: '责任人处理中', point: { left: '35%', top: '42%' } }
          ],
          zone: { left: '28%', top: '32%', width: '40%', height: '38%' } },
        { id: 'T003', area: '解放南路沿线', status: 'todo', statusText: '待开始', type: '巡查任务', workType: '路面质检', time: '13:30-15:00', start: null, mileage: null, duration: null, problems: 0,
          points: [{ name: '解放南路1号桥', left: '30%', top: '55%' }, { name: '解放南路匝道', left: '52%', top: '42%' }, { name: '文昌路口', left: '65%', top: '63%' }],
          track: '', vehicle: { left: '46%', top: '59%' },
          req: '对解放南路沿线作业后路面进行质量检查，注意匝道接缝处平整度。',
          problemsList: [],
          zone: { left: '18%', top: '40%', width: '52%', height: '36%' } },
        { id: 'T004', area: '人民东路-文昌路', status: 'todo', statusText: '待开始', type: '巡查任务', workType: '路面质检', time: '15:30-17:00', start: null, mileage: null, duration: null, problems: 0,
          points: [{ name: '人民东路跨线桥', left: '34%', top: '35%' }, { name: '文昌路小学', left: '55%', top: '52%' }, { name: '文昌路地铁口', left: '43%', top: '67%' }],
          track: '', vehicle: { left: '48%', top: '55%' },
          req: '对人民东路至文昌路段作业后路面进行检查，关注学校周边路面清洁度。',
          problemsList: [],
          zone: { left: '24%', top: '22%', width: '44%', height: '48%' } }
    ];
    var STATUS_TAG = { done: 'car-tag--success', running: 'car-tag--info', todo: 'car-tag--warning' };
    var STATUS_TEXT = { done: '已完成', running: '进行中', todo: '待开始' };
    var PROB_TAG = { done: 'car-tag--success', pending: 'car-tag--neutral', processing: 'car-tag--warning', assigned: 'car-tag--info' };
    TASKS.forEach(function (task) {
        var storedStatus = CAR.getTaskStatus(task.id);
        if (storedStatus) { task.status = storedStatus; task.statusText = STATUS_TEXT[storedStatus]; }
    });
    // 从今日任务列表进入时优先展示指定任务；直接进入时聚焦进行中任务。
    var requestedId = CAR.query('task');
    var selectedId = (TASKS.find(function (t) { return t.id === requestedId; }) || TASKS.find(function (t) { return t.status === 'running'; }) || TASKS.find(function (t) { return t.status === 'todo'; }) || TASKS[0]).id;
    var drawerMode = 'tasks';
    var mapMode = 'focus';
    var issueFilter = 'all';
    var ISSUE_FILTERS = [
        { key: 'all', label: '全部' },
        { key: 'pending', label: '待确认' },
        { key: 'assigned', label: '待分配' },
        { key: 'processing', label: '待处理' },
        { key: 'done', label: '已完成' }
    ];

    // 任务执行页写入的外设问题，回到首页后归入对应任务并进入跨任务问题清单。
    function storedLiveProblems() {
        try {
            var stored = JSON.parse(sessionStorage.getItem('car-live-problems') || '[]');
            return Array.isArray(stored) ? stored : [];
        } catch (e) { return []; }
    }
    function ownerTask(problem) {
        return TASKS.find(function (task) {
            return problem.taskId === task.id || (problem.loc && problem.loc.indexOf(task.area) === 0);
        }) || TASKS.find(function (task) { return task.status === 'running'; }) || TASKS[1];
    }
    function syncLiveProblems() {
        storedLiveProblems().forEach(function (problem) {
            var task = ownerTask(problem);
            if (!task) return;
            if (!task.problemsList.some(function (item) { return item.id === problem.id; })) task.problemsList.unshift(problem);
        });
        TASKS.forEach(function (task) { task.problems = task.problemsList.length; });
    }
    syncLiveProblems();

    function fmt(v, suffix, dash) { return v === null || v === undefined ? (dash || '—') : (v + (suffix || '')); }

    // 三态分组顺序：未完成(待开始) → 进行中 → 已完成；同组按时间段排序
    function groupOrder(s) { return s === 'todo' ? 0 : (s === 'running' ? 1 : 2); }
    function sortedTasks() {
        return TASKS.slice().sort(function (a, b) {
            if (groupOrder(a.status) !== groupOrder(b.status)) return groupOrder(a.status) - groupOrder(b.status);
            return a.time < b.time ? -1 : 1;
        });
    }
    function countBy() {
        var c = { todo: 0, running: 0, done: 0 };
        TASKS.forEach(function (t) { c[t.status]++; });
        return c;
    }

    function todayProblems() {
        var list = [];
        TASKS.forEach(function (task) {
            task.problemsList.forEach(function (problem) {
                list.push(Object.assign({}, problem, { taskId: task.id, taskArea: task.area }));
            });
        });
        return list.sort(function (a, b) { return a.no < b.no ? 1 : -1; });
    }

    function updateToolBadges() {
        var taskTotal = TASKS.length;
        var problemTotal = todayProblems().length;
        var taskBadge = document.getElementById('js-task-badge');
        var problemBadge = document.getElementById('js-problem-badge');
        taskBadge.textContent = taskTotal;
        problemBadge.textContent = problemTotal;
        document.getElementById('js-task-tool').setAttribute('aria-label', '查看今日任务，共' + taskTotal + '项');
        document.getElementById('js-problem-tool').setAttribute('aria-label', '查看今日问题，共' + problemTotal + '项');
    }

    function renderLegend() {
        var legend = document.getElementById('js-legend');
        if (mapMode === 'tasks') {
            legend.innerHTML =
                '<div class="car-legend__row"><span class="car-legend__mark" style="background:rgba(22,119,255,0.05);border:2px dashed rgba(22,119,255,0.34)"></span>全部任务作业区域</div>' +
                '<div class="car-legend__row"><span class="car-legend__mark" style="background:#1677ff;border-radius:50%"></span>当前车辆位置</div>' +
                '<div class="car-legend__row"><span class="car-legend__mark" style="width:16px;height:3px;background:#ff4d4f;border-radius:2px"></span>实际轨迹</div>';
            return;
        }
        if (mapMode === 'problems') {
            legend.innerHTML =
                '<div class="car-legend__row"><span class="car-legend__mark" style="background:var(--car-neutral);border-radius:50%"></span>待确认</div>' +
                '<div class="car-legend__row"><span class="car-legend__mark" style="background:var(--car-primary);border-radius:50%"></span>待分配</div>' +
                '<div class="car-legend__row"><span class="car-legend__mark" style="background:var(--car-warning);border-radius:50%"></span>待处理</div>' +
                '<div class="car-legend__row"><span class="car-legend__mark" style="background:var(--car-success);border-radius:50%"></span>已完成</div>';
            return;
        }
        legend.innerHTML =
            '<div class="car-legend__row"><span class="car-legend__mark" style="background:rgba(22,119,255,0.10);border:2px dashed rgba(22,119,255,0.55)"></span>任务作业区域</div>' +
            '<div class="car-legend__row"><span class="car-legend__mark" style="background:#faad14;border-radius:50%"></span>重点点位</div>' +
            '<div class="car-legend__row"><span class="car-legend__mark" style="background:#1677ff;border-radius:50%"></span>当前车辆位置</div>' +
            '<div class="car-legend__row"><span class="car-legend__mark" style="width:16px;height:3px;background:#ff4d4f;border-radius:2px"></span>实际轨迹</div>';
    }

    function renderMapLayers() {
        var currentZone = document.getElementById('js-zone');
        var allZones = document.getElementById('js-all-zones');
        var problemPoints = document.getElementById('js-problem-points');
        currentZone.style.display = mapMode === 'tasks' ? 'none' : '';
        allZones.innerHTML = '';
        problemPoints.innerHTML = '';

        if (mapMode === 'tasks') {
            allZones.innerHTML = TASKS.map(function (task) {
                return '<span class="home-map-all-zone' + (task.id === selectedId ? ' is-selected' : '') + '" style="left:' + task.zone.left + ';top:' + task.zone.top + ';width:' + task.zone.width + ';height:' + task.zone.height + '" aria-label="' + task.area + '作业区域"></span>';
            }).join('');
        }
        if (mapMode === 'problems') {
            problemPoints.innerHTML = todayProblems().filter(function (problem) { return problem.point; }).map(function (problem) {
                return '<button type="button" class="home-map-problem home-map-problem--' + problem.status + '" data-id="' + problem.id + '" style="left:' + problem.point.left + ';top:' + problem.point.top + '" title="' + problem.no + ' · ' + problem.statusText + '" aria-label="查看问题' + problem.no + '，' + problem.statusText + '"><span class="home-map-problem__icon"><span>!</span></span></button>';
            }).join('');
            document.querySelectorAll('.home-map-problem').forEach(function (el) {
                el.addEventListener('click', function () { CAR.go('car-problem-detail.html?id=' + el.dataset.id, { delay: 220 }); });
            });
        }
        renderLegend();
    }

    // 两个页面级入口共用同一抽屉，且同一时刻只激活一种地图总览图层。
    function setToolActive(isOpen) {
        document.getElementById('js-task-tool').classList.toggle('is-active', isOpen && drawerMode === 'tasks');
        document.getElementById('js-problem-tool').classList.toggle('is-active', isOpen && drawerMode === 'problems');
    }
    function openDrawer(mode) {
        drawerMode = mode || drawerMode;
        mapMode = drawerMode === 'tasks' ? 'tasks' : 'problems';
        renderDrawer();
        renderMapLayers();
        document.getElementById('js-drawer').classList.add('is-open');
        document.getElementById('js-mask').classList.add('is-open');
        setToolActive(true);
    }
    function closeDrawer() {
        if (reviewIssueEntry) { history.back(); return; }
        document.getElementById('js-drawer').classList.remove('is-open');
        document.getElementById('js-mask').classList.remove('is-open');
        mapMode = 'focus';
        renderMapLayers();
        setToolActive(false);
    }
    function toggleDrawer(mode) {
        var drawerOpen = document.getElementById('js-drawer').classList.contains('is-open');
        if (drawerOpen && drawerMode === mode) { closeDrawer(); return; }
        openDrawer(mode);
    }

    // 顶部入口：三态统计
    function renderStats() {
        var c = countBy();
        var html =
            '<span class="home-stat"><span class="home-dot" style="background:var(--car-warning)"></span>未完成 <span class="car-mono">' + c.todo + '</span></span>' +
            '<span class="home-stat"><span class="home-dot" style="background:var(--car-success)"></span>进行中 <span class="car-mono">' + c.running + '</span></span>' +
            '<span class="home-stat"><span class="home-dot" style="background:var(--car-primary)"></span>已完成 <span class="car-mono">' + c.done + '</span></span>' +
            '<span class="home-sep" style="color:var(--car-border)">/</span>' +
            '<span>共 <span class="car-mono">' + TASKS.length + '</span> 项</span>';
        document.getElementById('js-stats').innerHTML = html;
        updateToolBadges();
    }

    function renderDrawer() {
        if (drawerMode === 'problems') renderProblemList();
        else renderTaskList();
    }

    // 抽屉内任务清单（精简两行 + 分组标题）
    function renderTaskList() {
        document.getElementById('js-drawerTitle').textContent = '今日巡查任务 · ' + TASKS.length + '项';
        var groups = [
            { key: 'todo', label: '未开始' },
            { key: 'running', label: '进行中' },
            { key: 'done', label: '已完成' }
        ];
        var html = '';
        var lastGroup = null;
        sortedTasks().forEach(function (t) {
            // 同组首项前插入分组标题
            if (t.status !== lastGroup) {
                var g = groups.find(function (x) { return x.key === t.status; });
                html += '<div class="home-group">' + g.label + '</div>';
                lastGroup = t.status;
            }
            html += '<div class="home-task' + (t.id === selectedId ? ' is-selected' : '') + '" data-id="' + t.id + '">' +
                '<div class="home-task__r1"><span class="home-task__area">' + t.area + '</span>' +
                '<span class="car-tag ' + (STATUS_TAG[t.status] || 'car-tag--neutral') + '">' + t.statusText + '</span></div>' +
                '<div class="home-task__r2"><span>' + t.type + '</span><span class="car-sep">·</span><span>' + t.workType + '</span><span class="car-sep">·</span><span class="car-mono">' + t.time + '</span></div>' +
                '</div>';
        });
        document.getElementById('js-drawerBody').innerHTML = html;
        document.querySelectorAll('.home-task').forEach(function (el) {
            el.addEventListener('click', function () {
                selectedId = el.dataset.id;
                renderList(); renderDetail(); renderStats();
                closeDrawer();
            });
        });
    }

    function renderProblemList() {
        var allProblems = todayProblems();
        var visibleProblems = issueFilter === 'all' ? allProblems : allProblems.filter(function (problem) { return problem.status === issueFilter; });
        document.getElementById('js-drawerTitle').textContent = '今日上报问题 · ' + allProblems.length + '项';
        var html = '<div class="home-issue-filters">';
        ISSUE_FILTERS.forEach(function (filter) {
            var count = filter.key === 'all' ? allProblems.length : allProblems.filter(function (problem) { return problem.status === filter.key; }).length;
            html += '<button type="button" class="home-issue-filter' + (issueFilter === filter.key ? ' is-active' : '') + '" data-filter="' + filter.key + '">' + filter.label + ' ' + count + '</button>';
        });
        html += '</div>';
        if (!visibleProblems.length) {
            html += '<div class="home-prob-empty">暂无符合条件的问题</div>';
        } else {
            visibleProblems.forEach(function (problem) {
                html += '<button type="button" class="home-issue" data-id="' + problem.id + '" aria-label="查看问题' + problem.no + '详情">' +
                    '<div class="home-issue__head"><span class="home-issue__no">' + problem.no + '</span><span class="car-tag ' + (PROB_TAG[problem.status] || 'car-tag--neutral') + '">' + problem.statusText + '</span></div>' +
                    '<svg class="home-issue__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>' +
                    '<div class="home-issue__field"><span class="home-issue__label">问题位置</span><strong>' + problem.loc + '</strong></div>' +
                    '<div class="home-issue__field home-issue__field--node"><span class="home-issue__label">当前节点</span><span>' + problem.currentNode + '</span></div>' +
                    '<div class="home-issue__task">所属任务 · ' + problem.taskArea + '</div>' +
                '</button>';
            });
        }
        document.getElementById('js-drawerBody').innerHTML = html;
        document.querySelectorAll('.home-issue-filter').forEach(function (el) {
            el.addEventListener('click', function () { issueFilter = el.dataset.filter; renderProblemList(); });
        });
        document.querySelectorAll('.home-issue').forEach(function (el) {
            el.addEventListener('click', function () { CAR.go('car-problem-detail.html?id=' + el.dataset.id, { delay: 220 }); });
        });
    }

    // 保留原调用名，供状态切换后的任务清单刷新使用。
    function renderList() { renderTaskList(); }

    function renderMap(t) {
        var z = document.getElementById('js-zone');
        var track = document.getElementById('js-track');
        var trackPath = document.getElementById('js-track-path');
        var vehicle = document.getElementById('js-vehicle');
        var keypoints = document.getElementById('js-keypoints');
        z.style.left = t.zone.left; z.style.top = t.zone.top; z.style.width = t.zone.width; z.style.height = t.zone.height;
        trackPath.setAttribute('d', t.track || '');
        track.style.display = t.track ? '' : 'none';
        vehicle.style.left = t.vehicle.left;
        vehicle.style.top = t.vehicle.top;
        keypoints.innerHTML = t.points.map(function (p, index) {
            return '<span class="home-map-keypoint" style="left:' + p.left + ';top:' + p.top + '" title="' + p.name + '" aria-label="重点点位' + (index + 1) + '：' + p.name + '"><span>' + (index + 1) + '</span></span>';
        }).join('');
        renderMapLayers();
    }

    // 当前任务详情卡：任务类型与作业类型仅保留在标题摘要；重点点位仅在地图展示。
    function renderDetail() {
        var t = TASKS.find(function (x) { return x.id === selectedId; });
        renderMap(t);

        var html =
            '<div class="home-dhead">' +
                '<div class="home-dhead__area">' + t.area + '</div>' +
                '<div class="home-dhead__r2">' +
                    '<span class="car-tag ' + (STATUS_TAG[t.status] || 'car-tag--neutral') + '">' + t.statusText + '</span>' +
                    '<span>' + t.type + '</span><span class="car-sep">·</span><span>' + t.workType + '</span><span class="car-sep">·</span><span class="car-mono">' + t.time + '</span>' +
                '</div>' +
            '</div>';

        if (t.status === 'running' || t.status === 'done') {
            html += '<div class="home-metrics">' +
                '<div class="home-metric"><span class="home-metric__label">开始时间</span><span class="home-metric__value"><span class="car-mono">' + fmt(t.start) + '</span></span></div>' +
                '<div class="home-metric"><span class="home-metric__label">作业里程</span><span class="home-metric__value"><span class="car-mono">' + fmt(t.mileage, '', '—') + '</span><span class="home-metric__unit">km</span></span></div>' +
                '<div class="home-metric"><span class="home-metric__label">作业时长</span><span class="home-metric__value"><span class="car-mono">' + fmt(t.duration, '', '—') + '</span><span class="home-metric__unit">min</span></span></div>' +
                '<div class="home-metric home-metric--problems"><span class="home-metric__label">问题上报</span><span class="home-metric__value"><span class="car-mono">' + fmt(t.problems, '', '0') + '</span><span class="home-metric__unit">项</span></span></div>' +
            '</div>';
        }

        if (t.status === 'running' || t.status === 'done') {
            html += '<div class="home-probs"><div class="home-probs__head"><span class="home-probs__title">问题上报</span></div>';
            if (t.problemsList && t.problemsList.length) {
                t.problemsList.forEach(function (p) {
                    html += '<button type="button" class="home-prob" data-id="' + p.id + '" aria-label="查看问题' + p.no + '详情">' +
                        '<div class="home-prob__head"><span class="home-prob__no">' + p.no + '</span><span class="car-tag ' + (PROB_TAG[p.status] || 'car-tag--neutral') + '">' + p.statusText + '</span></div>' +
                        '<svg class="home-prob__chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>' +
                        '<div class="home-prob__location"><span class="home-prob__label">问题位置</span><strong>' + p.loc + '</strong></div>' +
                        '<div class="home-prob__node"><span class="home-prob__label">当前节点</span><span>' + p.currentNode + '</span></div>' +
                    '</button>';
                });
            } else {
                html += '<div class="home-prob-empty">暂无问题上报记录</div>';
            }
            html += '</div>';
        }

        if (t.status !== 'done') {
            html += '<div class="home-requirement"><span class="home-requirement__label">作业要求</span><p class="home-requirement__value">' + t.req + '</p></div>';
        }

        document.getElementById('js-detail').innerHTML = html;

        document.querySelectorAll('.home-prob').forEach(function (el) {
            el.addEventListener('click', function () { CAR.go('car-problem-detail.html?id=' + el.dataset.id, { delay: 220 }); });
        });

        // 底部主按钮（单按钮复用，按状态切换文案与操作）：
        // 进行中→结束任务（需求 6.1.1.8，结束后即可交车）；待开始→开始任务；已完成→禁用
        var startBtn = document.getElementById('js-start');
        document.querySelector('.home-detail-foot').style.display = '';
        if (t.status === 'running') {
            startBtn.textContent = '继续任务'; startBtn.disabled = false; startBtn.dataset.mode = 'continue';
        } else if (t.status === 'done') {
            startBtn.textContent = '返回今日任务'; startBtn.disabled = false; startBtn.dataset.mode = 'list';
        } else {
            startBtn.textContent = '开始任务'; startBtn.disabled = false; startBtn.dataset.mode = 'start';
        }
    }

    document.getElementById('js-start').addEventListener('click', function () {
        var t = TASKS.find(function (x) { return x.id === selectedId; });
        var mode = this.dataset.mode;
        if (this.disabled) return;
        if (mode === 'list') { CAR.go('car-home.html', { delay: 180 }); return; }
        if (mode === 'continue') { CAR.go('car-task-running.html?id=' + t.id, { delay: 180 }); return; }
        // 开始任务校验：同时只允许一个任务执行
        var running = TASKS.find(function (x) { return x.status === 'running'; });
        if (running && running.id !== t.id) { CAR.toast('当前存在进行中任务，已自动切换'); selectedId = running.id; renderList(); renderDetail(); renderStats(); return; }
        CAR.setTaskStatus(t.id, 'running');
        CAR.go('car-task-running.html?id=' + t.id, { toast: '任务已开始，进入执行', delay: 900 });
    });

    // 抽屉交互：任务与问题在右侧工具栏中并列为页面级入口
    document.getElementById('js-task-tool').addEventListener('click', function () { toggleDrawer('tasks'); });
    document.getElementById('js-problem-tool').addEventListener('click', function () { toggleDrawer('problems'); });
    document.getElementById('js-close').addEventListener('click', closeDrawer);
    document.getElementById('js-mask').addEventListener('click', closeDrawer);
    document.getElementById('js-reset').addEventListener('click', function () { CAR.toast('已复位至车辆当前位置'); });
    document.getElementById('js-layer').addEventListener('click', function () { CAR.toast('辅助设施图层已切换（车机不支持水电油上报）'); });
    document.getElementById('js-fullscreen').addEventListener('click', function () { CAR.toast('已进入地图全屏'); });
    document.getElementById('js-handover').addEventListener('click', function () {
        var running = TASKS.find(function (x) { return x.status === 'running'; });
        if (running) { CAR.toast('存在进行中任务，无法交车'); selectedId = running.id; renderList(); renderDetail(); renderStats(); return; }
        CAR.go('car-handover.html', { delay: 300 });
    });

    renderStats();
    renderList();
    renderDetail();
    if (CAR.query('finished')) {
        openDrawer('tasks');
        CAR.toast('任务已结束，已返回今日任务列表');
    } else if (CAR.query('panel') === 'problems') {
        openDrawer('problems');
    }
})();
</script>
</body>
</html>
