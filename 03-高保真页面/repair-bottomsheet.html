<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>故障报修 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 375px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; width: 100%; margin: 0; min-height: 100vh;
        }
        /* 顶部遮罩 */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
            width: 100%; max-width: 375px; height: 44px;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            display: flex; align-items: center; z-index: 1000; padding: 0 16px;
        }
        .top-nav-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #000000d9; text-decoration: none; margin-left: -8px;
        }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #000000d9;
        }
        /* 页面主内容区（让出顶部 fixed nav 44px + 视觉间距；高度自适应，不撑出空白） */
        .content-area {
            padding: 60px 16px 96px;
            background: #f5f5f5;
        }
        /* 表单卡片 */
        .form-card {
            background: #ffffff; border-radius: 12px;
            padding: 16px; margin-bottom: 12px;
        }
        .form-card-title {
            font-size: 14px; font-weight: 600; color: #000000d9;
            margin-bottom: 12px;
        }
        /* 只读字段行 */
        .readonly-row {
            display: flex; gap: 8px;
        }
        .readonly-row .readonly-cell {
            flex: 1; min-width: 0;
        }
        .field-block { margin-bottom: 16px; }
        .field-label {
            font-size: 13px; color: #00000073; margin-bottom: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .field-label .required { color: #ff4d4f; margin-right: 2px; }
        /* 单选组 */
        .radio-group { display: flex; flex-direction: column; gap: 8px; }
        .radio-item {
            padding: 12px; border: 1px solid #e8e8e8; border-radius: 8px;
            display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
            transition: all 0.15s;
        }
        .radio-item.active { border-color: #1677ff; background: #e6f4ff; }
        .radio-circle {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid #d9d9d9; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            margin-top: 1px;
        }
        .radio-item.active .radio-circle { border-color: #1677ff; }
        .radio-item.active .radio-circle::after {
            content: ''; width: 8px; height: 8px; border-radius: 50%; background: #1677ff;
        }
        .radio-content { flex: 1; }
        .radio-title {
            font-size: 14px; font-weight: 500; color: #000000d9; line-height: 20px;
        }
        .radio-desc {
            font-size: 12px; color: #00000073; line-height: 18px; margin-top: 2px;
        }
        /* 输入框 */
        .input-field {
            width: 100%; height: 40px; padding: 0 12px;
            border: 1px solid #e8e8e8; border-radius: 8px;
            background: #ffffff; font-size: 14px; color: #000000d9;
            font-family: inherit; box-sizing: border-box;
        }
        .input-field:focus { outline: none; border-color: #1677ff; }
        .textarea-field {
            width: 100%; min-height: 80px; padding: 10px 12px;
            border: 1px solid #e8e8e8; border-radius: 8px;
            background: #ffffff; font-size: 14px; color: #000000d9;
            font-family: inherit; box-sizing: border-box; resize: vertical;
        }
        .textarea-field:focus { outline: none; border-color: #1677ff; }
        /* 只读字段 */
        .readonly-field {
            height: 40px; padding: 0 12px;
            background: #f5f5f5; border-radius: 8px;
            display: flex; align-items: center;
            font-size: 14px; color: #00000073;
        }
        /* 选择器 */
        .select-field {
            width: 100%; height: 40px; padding: 0 12px;
            border: 1px solid #e8e8e8; border-radius: 8px;
            background: #ffffff; font-size: 14px; color: #000000d9;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .select-field svg { width: 16px; height: 16px; color: #00000073; }
        /* 开关 */
        .switch-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 0;
        }
        .switch {
            width: 40px; height: 22px; border-radius: 11px;
            background: #e8e8e8; position: relative; cursor: pointer;
            transition: background 0.2s;
        }
        .switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; border-radius: 50%;
            background: #ffffff; transition: left 0.2s;
        }
        .switch.on { background: #1677ff; }
        .switch.on::after { left: 20px; }
        /* 照片上传 */
        .upload-area {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .upload-btn {
            width: 72px; height: 72px; border: 1px dashed #d9d9d9;
            border-radius: 8px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: #00000073; font-size: 11px; cursor: pointer;
        }
        .upload-btn svg { width: 22px; height: 22px; margin-bottom: 4px; }
        /* 底部操作（fixed） */
        .bottom-actions {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 375px;
            padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
            background: #ffffff; border-top: 1px solid #e8e8e8;
            display: flex; gap: 8px;
            z-index: 1000;
        }
        .action-btn {
            flex: 1; height: 44px; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; transition: opacity 0.15s;
            text-decoration: none;
        }
        .action-btn.secondary {
            background: #ffffff; color: #000000d9; border: 1px solid #e8e8e8;
        }
        .action-btn.primary { background: #1677ff; color: #ffffff; }
        .action-btn:active { opacity: 0.85; }
    </style>
</head>
<body data-no-project-switcher="true">
    <div class="top-nav">
        <a href="javascript:history.back()" class="top-nav-back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title">故障报修</div>
    </div>

    <div class="content-area">
        <!-- 车辆与位置 -->
        <div class="form-card">
            <div class="form-card-title">车辆与位置</div>
            <div class="field-block">
                <div class="field-label"><span>车辆</span></div>
                <div class="readonly-field">粤B·D2856 · 洗扫车</div>
            </div>
            <div class="field-block">
                <div class="field-label"><span>当前位置</span></div>
                <div class="readonly-field">深圳市南山区科苑南路（北纬 22.5380, 东经 113.9420）</div>
            </div>
        </div>

        <!-- 故障信息 -->
        <div class="form-card">
            <div class="form-card-title">故障信息</div>
            <!-- 故障影响 -->
            <div class="field-block">
                <div class="field-label"><span><span class="required">*</span>故障影响</span></div>
                <div class="radio-group">
                    <div class="radio-item" onclick="selectRadio(this, 'level-1')">
                        <div class="radio-circle"></div>
                        <div class="radio-content">
                            <div class="radio-title">影响作业且无法自行返回</div>
                            <div class="radio-desc">作业将终止，请等待现场维修</div>
                        </div>
                    </div>
                    <div class="radio-item active" onclick="selectRadio(this, 'level-2')">
                        <div class="radio-circle"></div>
                        <div class="radio-content">
                            <div class="radio-title">影响作业但可自行返回</div>
                            <div class="radio-desc">作业终止，系统将导航至维修场地</div>
                        </div>
                    </div>
                    <div class="radio-item" onclick="selectRadio(this, 'level-3')">
                        <div class="radio-circle"></div>
                        <div class="radio-content">
                            <div class="radio-title">不影响作业</div>
                            <div class="radio-desc">可继续任务，并预约维修</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 故障类型 -->
            <div class="field-block">
                <div class="field-label"><span><span class="required">*</span>故障类型</span></div>
                <div class="select-field" onclick="alert('演示：弹出故障类型选择器')">
                    <span>请选择故障类型</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>

            <!-- 故障描述 -->
            <div class="field-block">
                <div class="field-label">
                    <span><span class="required">*</span>故障描述</span>
                    <span style="color:#00000040;font-size:11px;">10~300 字</span>
                </div>
                <textarea class="textarea-field" placeholder="请详细描述故障现象，例如：扫刷无法正常旋转，伴随异响"></textarea>
            </div>

            <!-- 是否现场维修 -->
            <div class="field-block">
                <div class="field-label"><span><span class="required">*</span>是否现场维修</span></div>
                <div class="switch-row">
                    <span style="font-size:13px;color:#00000073;">需维修人员到现场</span>
                    <div class="switch on" id="switchRepair" onclick="toggleSwitch()"></div>
                </div>
            </div>

            <!-- 期望维修时间 -->
            <div class="field-block">
                <div class="field-label"><span>期望维修时间</span></div>
                <div class="select-field" onclick="alert('演示：弹出时间选择器')">
                    <span>2026-07-10 14:00</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </div>
            </div>

            <!-- 故障照片 -->
            <div class="field-block">
                <div class="field-label"><span>故障照片</span><span style="color:#00000040;font-size:11px;">最多 5 张</span></div>
                <div class="upload-area">
                    <div class="upload-btn" onclick="alert('演示：拍照上传')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                        拍照
                    </div>
                    <div class="upload-btn" onclick="alert('演示：从相册选择')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" x="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        相册
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-actions">
        <a href="javascript:history.back()" class="action-btn secondary">取消</a>
        <a href="javascript:void(0)" id="submitBtn" onclick="submitRepair()" class="action-btn primary">提交报修</a>
    </div>

    <script>
        function selectRadio(el, level) {
            document.querySelectorAll('.radio-item').forEach(function (item) {
                item.classList.remove('active');
            });
            el.classList.add('active');
            // 影响作业且无法自行返回 → 现场维修默认是
            if (level === 'level-1') {
                document.getElementById('switchRepair').classList.add('on');
            }
        }

        function toggleSwitch() {
            document.getElementById('switchRepair').classList.toggle('on');
        }

        // 根据 URL ?source= 参数判断返回页面（vehicle-management / 其他）
        function getReturnPage() {
            var src = new URLSearchParams(location.search).get('source');
            if (src === 'vehicle-management') return 'vehicle-management.html?tab=service';
            return 'map-workbench.html';
        }

        function submitRepair() {
            var textarea = document.querySelector('.textarea-field');
            if (!textarea.value || textarea.value.length < 10) {
                alert('请补充故障描述（10~300 字）');
                textarea.focus();
                return;
            }
            alert('演示：报修已提交，工单已推送售后平台');
            window.location.href = getReturnPage();
        }
    </script>
    <script src="components/app-common.js"></script>
</body>
</html>
