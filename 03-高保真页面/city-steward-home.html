<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>首页 - 城市管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="components/custom-tabbar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 430px;
            min-height: 100vh;
            background: #f5f5f5;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            width: 100%;
            margin: 0;
            min-height: 100vh;
            padding-bottom: 56px;
        }
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 430px;
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .top-nav-title { font-size: 16px; font-weight: 600; color: #000000d9; }
        .content-area {
            padding-top: 44px;
            padding-bottom: 56px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #00000073;
        }
        .placeholder-icon {
            width: 120px;
            height: 120px;
            background: #e6f4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .placeholder-icon svg { width: 48px; height: 48px; color: #1677ff; }
        /* 底部Tab 由 custom-tabbar.css 承载 */
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="top-nav-title">城市管家</div>
        <div class="project-switcher" role="button" aria-label="切换项目" onclick="CityStewardCommon.openProjectPicker()">
            <span class="project-switcher-text">选择项目</span>
            <svg class="project-switcher-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
    </div>

    <div class="content-area">
        <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>
        <div style="font-size:14px;">首页模块暂未开放</div>
    </div>

    <!-- 底部Tab（自定义组件） -->
    <nav class="ctab-bar" aria-label="主导航"></nav>
    <script src="components/app-common.js"></script>
    <script src="components/tab-apps-data.js"></script>
    <script src="components/custom-tabbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            CustomTabbar.init({ activeKey: 'sys-workbench' });
        });
    </script>
</body>
</html>
