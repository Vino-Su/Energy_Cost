<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>品质巡查 - 城市管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <script src="components/app-common.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 375px;
            min-height: 100vh;
            background: #ffffff;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            width: 100%;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
        }
        button, a { -webkit-tap-highlight-color: transparent; font: inherit; }

        /* ===== 应用外壳（模式 A：独立应用，与用车管理同源） ===== */
        .app-shell {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: calc(56px + env(safe-area-inset-bottom));
            margin: 0 auto;
            max-width: 375px;
            overflow: hidden;
            background: #ffffff;
        }
        .tab-panel {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none;
            background: #ffffff;
        }
        .tab-panel.active { display: block; }

        /* 地图 Tab：iframe 填满 */
        #panel-map { background: #eef2f5; }
        #panel-map iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #eef2f5;
        }

        /* 服务 Tab：可滚动，含顶部导航 */
        #panel-service {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #ffffff;
            padding-bottom: 16px;
        }
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
            height: 56px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
        }
        /* 小程序胶囊（与地图页 top-bar 完全同款） */
        .nav-back {
            position: absolute;
            left: 16px;
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 12px rgba(15, 35, 70, 0.12);
            color: #000000d9;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .nav-back:active { transform: scale(0.92); background: #f5f5f5; }
        .nav-back svg { width: 16px; height: 16px; }
        .nav-title {
            font-size: 15px;
            font-weight: 600;
            color: #000000d9;
            line-height: 22px;
        }
        .nav-capsule {
            position: absolute;
            right: 16px;
            width: 88px;
            height: 32px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 4px 12px rgba(15, 35, 70, 0.12);
        }
        .nav-capsule__btn {
            width: 43px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 15px;
            background: transparent;
            color: #1f1f1f;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .nav-capsule__btn:active { transform: scale(0.92); background: #f5f5f5; }
        .nav-capsule__btn svg { width: 20px; height: 20px; }
        .nav-capsule__divider {
            width: 1px;
            height: 18px;
            flex: 0 0 1px;
            background: #e8e8e8;
        }
        .nav-pop {
            position: absolute;
            top: 40px;
            right: 0;
            min-width: 120px;
            padding: 4px 0;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(15, 35, 70, 0.18);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 20;
        }
        .nav-pop.show { display: flex; }
        .nav-pop button {
            height: 40px;
            padding: 0 16px;
            border: none;
            background: #ffffff;
            text-align: left;
            font-size: 14px;
            color: #000000d9;
            cursor: pointer;
        }
        .nav-pop button:active { background: #f5f5f5; }

        /* 项目切换行（标题栏下方第一行） */
        .project-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #ffffff;
            border-bottom: 1px solid #f0f0f0;
        }
        .project-bar__label { color: #00000073; font-size: 13px; line-height: 20px; flex: none; }
        .project-bar__switch {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            background: #f7faff;
            color: #1677ff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        .project-bar__switch:active { background: #eef6ff; border-color: #91caff; }
        .project-bar__arrow { width: 16px; height: 16px; flex: none; color: #00000073; }

        .section-title {
            font-size: 14px;
            color: #00000073;
            padding: 16px 16px 12px;
        }
        .section-title:first-child { padding-top: 12px; }

        /* 子项宫格 */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 0 16px;
        }
        .module-item {
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.15s;
        }
        .module-item:active { opacity: 0.6; }
        .module-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .module-icon svg { width: 22px; height: 22px; }
        .module-name {
            font-size: 13px;
            color: #000000d9;
            font-weight: 500;
            text-align: center;
        }
        .module-icon.inspection { background: #e6f4ff; color: #1677ff; }
        .module-icon.problem { background: #fff1f0; color: #ff4d4f; }
        .module-icon.fuel { background: #fff7e6; color: #fa8c16; }
        .module-icon.water { background: #e6f4ff; color: #1677ff; }
        .module-icon.charge { background: #f6ffed; color: #52c41a; }
        .module-icon.repair { background: #fff1f0; color: #ff4d4f; }
        .module-icon.stat { background: #f2f0ff; color: #722ed1; }

        /* ===== 底部导航：地图 / 快捷操作 / 服务 ===== */
        .app-tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            max-width: 375px;
            height: calc(56px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            overflow: visible;
            z-index: 1000;
        }
        .app-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            background: none;
            border: none;
            color: #00000073;
            font-size: 10px;
            line-height: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .app-tab.active { color: #1677ff; }
        .app-tab:active { opacity: 0.7; }
        .app-tab svg { width: 24px; height: 24px; }
        .app-tab--quick {
            position: absolute;
            top: 28px;
            left: 50%;
            width: 52px;
            height: 52px;
            padding: 0;
            border: 4px solid #ffffff;
            border-radius: 50%;
            background: #1677ff;
            box-shadow: 0 5px 14px rgba(22, 119, 255, 0.32);
            color: #ffffff;
            gap: 0;
            transform: translate(-50%, -50%);
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            z-index: 1;
        }
        .app-tab--quick svg { width: 24px; height: 24px; }
        .app-tab--quick:active {
            opacity: 1;
            background: #0958d9;
            box-shadow: 0 3px 8px rgba(22, 119, 255, 0.28);
            transform: translate(-50%, -50%) scale(0.92);
        }
        .app-tab--quick::after {
            content: '快捷操作';
            position: absolute;
            left: 50%;
            bottom: 50px;
            padding: 5px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.76);
            color: #ffffff;
            font-size: 12px;
            line-height: 18px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 4px);
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .app-tab--quick:hover::after,
        .app-tab--quick:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ===== 快捷操作底部弹窗 ===== */
        .quick-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0 auto;
            max-width: 375px;
            display: none;
            align-items: flex-end;
            background: rgba(0, 0, 0, 0.5);
            z-index: 4000;
        }
        .quick-overlay.show { display: flex; }
        .quick-sheet {
            width: 100%;
            padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
            border-radius: 16px 16px 0 0;
            background: #ffffff;
            transform: translateY(100%);
            transition: transform 0.2s ease;
        }
        .quick-overlay.show .quick-sheet { transform: translateY(0); }
        .quick-sheet__handle {
            width: 36px;
            height: 4px;
            margin: 0 auto 8px;
            border-radius: 2px;
            background: #d9d9d9;
        }
        .quick-sheet__header {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .quick-sheet__title {
            margin-left: 40px;
            color: #000000d9;
            font-size: 16px;
            font-weight: 600;
            line-height: 24px;
        }
        .quick-sheet__close {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #00000073;
            cursor: pointer;
        }
        .quick-sheet__close:active { background: #f5f5f5; }
        .quick-sheet__close svg { width: 20px; height: 20px; }
        .quick-action {
            width: 100%;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            border: none;
            border-top: 1px solid #f0f0f0;
            background: #ffffff;
            color: #000000d9;
            text-align: left;
            cursor: pointer;
        }
        .quick-action:active { background: #f5f5f5; }
        .quick-action__icon {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #fff2f0;
            color: #ff4d4f;
        }
        .quick-action__icon svg { width: 20px; height: 20px; }
        .quick-action__text { font-size: 15px; font-weight: 500; line-height: 22px; }


        /* ===== 退出确认弹窗（与用车管理一致） ===== */
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0 auto;
            max-width: 375px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .confirm-overlay.show { display: flex; }
        .confirm-card {
            width: 280px;
            background: #ffffff;
            border-radius: 16px;
            padding: 24px 20px 20px;
            text-align: center;
        }
        .confirm-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #fffbe6;
            color: #faad14;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .confirm-icon svg { width: 28px; height: 28px; }
        .confirm-title {
            font-size: 16px;
            font-weight: 600;
            color: #000000d9;
            line-height: 24px;
            margin-bottom: 6px;
        }
        .confirm-desc {
            font-size: 14px;
            color: #00000073;
            line-height: 22px;
            margin-bottom: 18px;
        }
        .confirm-buttons {
            display: flex;
            gap: 8px;
        }
        .confirm-btn {
            flex: 1;
            height: 40px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .confirm-btn:active { opacity: 0.85; }
        .confirm-btn.secondary {
            background: #ffffff;
            border: 1px solid #e8e8e8;
            color: #000000d9;
        }
        .confirm-btn.primary {
            background: #1677ff;
            border: 1px solid #1677ff;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- 地图 Tab（默认）：嵌入巡查地图页 -->
        <section id="panel-map" class="tab-panel active" role="tabpanel" aria-label="地图">
            <iframe id="mapFrame" src="about:blank" title="巡查地图"></iframe>
        </section>

        <!-- 服务 Tab：子功能入口 -->
        <section id="panel-service" class="tab-panel" role="tabpanel" aria-label="服务">
            <div class="top-nav" data-no-project-switcher="true">
                <button type="button" class="nav-back" id="js-service-back" aria-label="返回">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <span class="nav-title">服务</span>
                <div class="nav-capsule">
                    <button type="button" class="nav-capsule__btn" id="js-service-more" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
                        <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="6" cy="14" r="2.2" fill="currentColor"/><circle cx="14" cy="14" r="2.8" fill="currentColor"/><circle cx="22" cy="14" r="2.2" fill="currentColor"/></svg>
                    </button>
                    <span class="nav-capsule__divider" aria-hidden="true"></span>
                    <button type="button" class="nav-capsule__btn" id="js-service-exit" aria-label="退出品质巡查">
                        <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="9.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="14" cy="14" r="3.25" fill="currentColor"/></svg>
                    </button>
                    <div class="nav-pop" id="js-service-pop">
                        <button type="button" data-action="today">今日回顾</button>
                        <button type="button" data-action="layer">图层设置</button>
                        <button type="button" data-action="about">关于</button>
                    </div>
                </div>
            </div>
            <!-- 项目切换行（标题栏下方第一行） -->
            <div class="project-bar" id="js-project-bar">
                <span class="project-bar__label">当前项目</span>
                <button type="button" class="project-bar__switch" id="js-project-switch" aria-label="切换项目">
                    <span class="project-switcher-text">选择项目</span>
                    <svg class="project-bar__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                </button>
            </div>

            <div class="content-area">
                <!-- 品质管理：面向品质巡查业务，分为巡查任务、品质事件 -->
                <div class="section-title">品质管理</div>
                <div class="module-grid">
                    <a href="inspection-task-management.html" class="module-item">
                        <div class="module-icon inspection">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/><path d="M3 12h4M3 16h6"/></svg>
                        </div>
                        <span class="module-name">巡查任务</span>
                    </a>
                    <a href="inspection-problem-management.html" class="module-item">
                        <div class="module-icon problem">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 19a2 2 0 0 0 1.75 3h14.5A2 2 0 0 0 21 19L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg>
                        </div>
                        <span class="module-name">品质事件</span>
                    </a>
                </div>

                <!-- 车务管理：能耗类费用数据上报，复用水电油上报 OCR 版本 -->
                <div class="section-title">车务管理</div>
                <div class="module-grid">
                    <a href="fuel-report-ocr.html" class="module-item">
                        <div class="module-icon fuel">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"/><path d="M3 14h12"/><path d="M15 8h2.5a1.5 1.5 0 0 1 1.5 1.5V18a2 2 0 0 0 4 0V9l-3-3"/></svg>
                        </div>
                        <span class="module-name">加油上报</span>
                    </a>
                    <a href="water-report-ocr.html" class="module-item">
                        <div class="module-icon water">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.5S5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.5-7-12.5Z"/><path d="M9 15a3 3 0 0 0 3 3"/></svg>
                        </div>
                        <span class="module-name">加水上报</span>
                    </a>
                    <a href="charge-report-ocr.html" class="module-item">
                        <div class="module-icon charge">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
                        </div>
                        <span class="module-name">充电上报</span>
                    </a>
                </div>

                <!-- 维保管理：车辆故障报修和维修记录查看（不在本次范围内） -->
                <div class="section-title">维保管理</div>
                <div class="module-grid">
                    <a href="placeholder.html?from=inspection-repair&title=故障报修" class="module-item">
                        <div class="module-icon repair">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
                        </div>
                        <span class="module-name">故障报修</span>
                    </a>
                </div>

                <!-- 数据统计：以用户为维度进行数据统计（不在本次范围内） -->
                <div class="section-title">数据统计</div>
                <div class="module-grid">
                    <a href="placeholder.html?from=inspection-stat&title=巡查统计" class="module-item">
                        <div class="module-icon stat">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/><line x1="3" y1="20" x2="21" y2="20"/></svg>
                        </div>
                        <span class="module-name">巡查统计</span>
                    </a>
                </div>
            </div>
        </section>
    </div>

    <!-- 底部导航：地图 / 快捷操作 / 服务 -->
    <nav class="app-tabbar" aria-label="主导航">
        <button type="button" class="app-tab active" id="tab-map" onclick="switchTab('map')" aria-label="地图">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>地图</span>
        </button>
        <button type="button" class="app-tab app-tab--quick" id="js-quick-trigger" aria-label="快捷操作" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="app-tab" id="tab-service" onclick="switchTab('service')" aria-label="服务">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>服务</span>
        </button>
    </nav>

    <!-- 快捷操作 -->
    <div class="quick-overlay" id="js-quick-overlay" role="dialog" aria-modal="true" aria-labelledby="js-quick-title">
        <div class="quick-sheet">
            <div class="quick-sheet__handle" aria-hidden="true"></div>
            <div class="quick-sheet__header">
                <span class="quick-sheet__title" id="js-quick-title">快捷操作</span>
                <button type="button" class="quick-sheet__close" id="js-quick-close" aria-label="关闭快捷操作">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
                </button>
            </div>
            <button type="button" class="quick-action" id="js-quick-report">
                <span class="quick-action__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
                </span>
                <span class="quick-action__text">事件上报</span>
            </button>
        </div>
    </div>

    <!-- 退出确认弹窗 -->
    <div class="confirm-overlay" id="exitConfirm" role="dialog" aria-modal="true" aria-label="退出确认">
        <div class="confirm-card">
            <div class="confirm-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="confirm-title">有任务进行中</div>
            <div class="confirm-desc">退出后任务仍会在后台记录，确认退出品质巡查？</div>
            <div class="confirm-buttons">
                <button type="button" class="confirm-btn secondary" onclick="closeExitConfirm()">取消</button>
                <button type="button" class="confirm-btn primary" onclick="confirmExit()">确认退出</button>
            </div>
        </div>
    </div>

    <script>
        /* ===== Tab 切换 ===== */
        function switchTab(name) {
            document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
            var panel = document.getElementById('panel-' + name);
            if (panel) panel.classList.add('active');
            document.querySelectorAll('.app-tab').forEach(function (t) { t.classList.remove('active'); });
            var tab = document.getElementById('tab-' + name);
            if (tab) tab.classList.add('active');
            if (name === 'service') {
                document.getElementById('panel-service').scrollTop = 0;
            }
        }

        /* ===== 快捷操作 ===== */
        (function () {
            var trigger = document.getElementById('js-quick-trigger');
            var overlay = document.getElementById('js-quick-overlay');
            var close = document.getElementById('js-quick-close');
            var report = document.getElementById('js-quick-report');
            function closeQuickActions() {
                overlay.classList.remove('show');
                trigger.setAttribute('aria-expanded', 'false');
            }
            function openQuickActions() {
                overlay.classList.add('show');
                trigger.setAttribute('aria-expanded', 'true');
            }
            trigger.addEventListener('click', openQuickActions);
            close.addEventListener('click', closeQuickActions);
            overlay.addEventListener('click', function (event) {
                if (event.target === overlay) closeQuickActions();
            });
            report.addEventListener('click', function () {
                window.location.href = 'inspection-problem-report.html?task=I002&captured=1';
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && overlay.classList.contains('show')) closeQuickActions();
            });
        })();

        /* ===== 服务页顶部胶囊交互（与地图页同款） ===== */
        (function () {
            var back = document.getElementById('js-service-back');
            var more = document.getElementById('js-service-more');
            var exit = document.getElementById('js-service-exit');
            var pop = document.getElementById('js-service-pop');
            function toast(msg) {
                var t = document.createElement('div');
                t.textContent = msg;
                t.setAttribute('style', 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:8px;background:rgba(0,0,0,0.76);color:#fff;font-size:14px;z-index:9999;pointer-events:none;');
                document.body.appendChild(t);
                setTimeout(function () { t.remove(); }, 2000);
            }
            if (back) back.addEventListener('click', function () { switchTab('map'); });
            // 项目切换：复用 app-common 的项目选择器
            var projSwitch = document.getElementById('js-project-switch');
            if (projSwitch && typeof CityStewardCommon !== 'undefined' && CityStewardCommon.openProjectPicker) {
                projSwitch.addEventListener('click', function () { CityStewardCommon.openProjectPicker(); });
            }
            if (more) {
                more.addEventListener('click', function (e) {
                    e.stopPropagation();
                    pop.classList.toggle('show');
                    more.setAttribute('aria-expanded', pop.classList.contains('show') ? 'true' : 'false');
                });
            }
            document.addEventListener('click', function () {
                pop.classList.remove('show');
                more.setAttribute('aria-expanded', 'false');
            });
            if (pop) {
                pop.addEventListener('click', function (e) {
                    var action = e.target.getAttribute('data-action');
                    if (!action) return;
                    pop.classList.remove('show');
                    more.setAttribute('aria-expanded', 'false');
                    if (action === 'today') { toast('今日回顾将在全部任务完成后展示'); }
                    else if (action === 'layer') { toast('辅助设施图层已切换'); }
                    else if (action === 'about') { toast('品质巡查 v1.0'); }
                });
            }
            if (exit) exit.addEventListener('click', function () { requestExit(); });
        })();

        /* ===== 退出品质巡查（有进行中任务时二次确认） ===== */
        var pendingExit = false;
        function requestExit() {
            if (pendingExit) return;
            pendingExit = true;
            askIframeExecuting(function (executing) {
                pendingExit = false;
                if (executing) {
                    document.getElementById('exitConfirm').classList.add('show');
                } else {
                    window.location.href = 'home.html';
                }
            });
        }
        function confirmExit() {
            closeExitConfirm();
            window.location.href = 'home.html';
        }
        function closeExitConfirm() {
            document.getElementById('exitConfirm').classList.remove('show');
        }
        // 执行态由地图 iframe 同步，供退出确认等流程读取。
        function setExecutingShell(executing) {
            document.body.classList.toggle('is-executing', !!executing);
        }

        window.addEventListener('message', function (event) {
            var frame = document.getElementById('mapFrame');
            if (!frame || event.source !== frame.contentWindow) return;
            var data = event.data || {};
            if (data.type === 'inspectionExecuting' || data.type === 'executingStatus') {
                setExecutingShell(data.value);
            }
        });
        // 向地图 iframe 查询是否有进行中任务
        function askIframeExecuting(callback) {
            var frame = document.getElementById('mapFrame');
            if (!frame || !frame.contentWindow) { callback(false); return; }
            var done = false;
            function settle(val) { if (done) return; done = true; callback(val); }
            var msgHandler = function (event) {
                if (!frame.contentWindow || event.source !== frame.contentWindow) return;
                var data = event.data || {};
                if (data.type === 'executingStatus') {
                    window.removeEventListener('message', msgHandler);
                    settle(!!data.value);
                }
            };
            window.addEventListener('message', msgHandler);
            try {
                frame.contentWindow.postMessage({ type: 'queryExecuting' }, '*');
            } catch (e) {}
            // 兜底：300ms 无响应视为无进行中任务
            setTimeout(function () { settle(false); }, 300);
        }

        function syncExecutingShell() {
            askIframeExecuting(function (executing) {
                setExecutingShell(executing);
            });
        }

        // 默认进入：可选 ?tab=service 直达服务 Tab
        (function () {
            var params = new URLSearchParams(location.search);
            var hparams = new URLSearchParams(location.hash.replace(/^#/, ''));
            var tab = params.get('tab') || hparams.get('tab');
            if (tab === 'service') switchTab('service');
        })();

        /* ===== iframe 加载巡查地图页 ===== */
        (function () {
            var params = new URLSearchParams(location.search);
            var frame = document.getElementById('mapFrame');
            if (!frame) return;
            var queryParts = ['embedded=1'];
            var task = params.get('task');
            var action = params.get('action');
            var sheet = params.get('sheet');
            if (task) queryParts.push('task=' + encodeURIComponent(task));
            if (action) queryParts.push('action=' + encodeURIComponent(action));
            if (sheet) queryParts.push('sheet=' + encodeURIComponent(sheet));
            frame.addEventListener('load', function () {
                // 等待子页面完成脚本初始化后主动确认一次，避免首次状态通知被错过。
                setTimeout(syncExecutingShell, 60);
            });
            frame.src = 'inspection-map.html?' + queryParts.join('&');
        })();
    </script>
</body>
</html>
