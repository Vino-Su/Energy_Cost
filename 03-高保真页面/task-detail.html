<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>任务详情 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 375px; min-height: 100%; background: #f5f5f5; }
        body {
            width: 100%; min-height: 100vh; margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            color: #1f2329; background: #f5f5f5; letter-spacing: 0;
        }
        button, a { -webkit-tap-highlight-color: transparent; }
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 20;
            width: 100%; max-width: 375px; height: 44px; margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.96); border-bottom: 1px solid #e5e6eb;
        }
        .nav-back {
            position: absolute; left: 8px; width: 36px; height: 36px;
            display: inline-flex; align-items: center; justify-content: center;
            color: #1f2329; text-decoration: none; border-radius: 6px;
        }
        .nav-back:active { background: #f2f3f5; }
        .nav-back svg { width: 22px; height: 22px; }
        .top-nav h1 { font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: 0; }
        .page { padding-top: 44px; min-height: 100vh; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }

        .map-section {
            position: relative; height: 244px; overflow: hidden;
            background: #dfe8df; border-bottom: 1px solid #d8ddd8;
        }
        .map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .map-ground { fill: #e9eee8; }
        .map-block { fill: #d7e3d6; stroke: #cbd8ca; stroke-width: 0.45; }
        .map-water { fill: #c8e5ee; }
        .road-wide, .road-narrow { fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .road-wide { stroke: #ffffff; stroke-width: 8; }
        .road-narrow { stroke: #ffffff; stroke-width: 4; }
        .road-center { fill: none; stroke: #d8dde0; stroke-width: 0.6; stroke-dasharray: 3 3; }
        .task-route-shadow, .task-route-line {
            fill: none; stroke-linecap: round; stroke-linejoin: round;
        }
        .task-route-shadow { stroke: rgba(255,255,255,0.92); stroke-width: 6; }
        .task-route-line { stroke: #1677ff; stroke-width: 3.2; }
        .route-marker { stroke: #ffffff; stroke-width: 1.8; }
        .map-label {
            position: absolute; z-index: 2; color: #7b8583; font-size: 10px;
            line-height: 14px; pointer-events: none; white-space: nowrap;
        }
        .label-a { top: 58px; left: 18px; transform: rotate(-18deg); }
        .label-b { top: 104px; right: 20px; transform: rotate(12deg); }
        .label-c { top: 176px; left: 120px; }
        .map-chip {
            position: absolute; top: 12px; left: 12px; z-index: 3;
            display: inline-flex; align-items: center; gap: 5px; min-height: 28px;
            padding: 0 9px; background: rgba(255,255,255,0.94); color: #4e5969;
            border: 1px solid rgba(229,230,235,0.9); border-radius: 6px;
            font-size: 12px; font-weight: 500; box-shadow: 0 2px 8px rgba(31,35,41,0.08);
        }
        .map-chip-dot { width: 7px; height: 7px; border-radius: 50%; background: #1677ff; }
        .map-caption {
            position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3;
            display: flex; align-items: center; min-height: 36px; padding: 8px 10px;
            border-radius: 6px; background: rgba(31,35,41,0.82); color: #ffffff;
            font-size: 12px; line-height: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .issue-marker {
            position: absolute; z-index: 4; width: 34px; height: 34px;
            transform: translate(-50%, -50%); display: none;
        }
        .issue-marker::before {
            content: ""; position: absolute; inset: 0; border-radius: 50%;
            background: rgba(255,77,79,0.2); animation: pulse 1.8s ease-out infinite;
        }
        .issue-marker::after {
            content: "!"; position: absolute; left: 7px; top: 7px;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; background: #ff4d4f; border: 2px solid #ffffff;
            font-size: 12px; line-height: 16px; font-weight: 700;
            box-shadow: 0 2px 6px rgba(255,77,79,0.35);
        }
        @keyframes pulse { from { transform: scale(0.7); opacity: 1; } to { transform: scale(1.45); opacity: 0; } }

        .content { background: #ffffff; }
        .task-heading { padding: 18px 16px 16px; border-bottom: 8px solid #f5f5f5; }
        .task-heading-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
        .task-tag {
            display: inline-flex; align-items: center; height: 24px; padding: 0 8px;
            border-radius: 4px; font-size: 12px; line-height: 24px; font-weight: 600;
        }
        .task-tag.regular { color: #1264d8; background: #e8f3ff; }
        .task-tag.dynamic { color: #7a4d00; background: #fff2cc; }
        .task-tag.emergency { color: #c93638; background: #ffeceb; }
        .task-number-inline {
            flex: 1; min-width: 0; overflow: hidden; color: #86909c;
            font-size: 12px; line-height: 18px; white-space: nowrap; text-overflow: ellipsis;
        }
        .task-status {
            flex: 0 0 auto; display: inline-flex; align-items: center; height: 24px;
            padding: 0 8px; border-radius: 4px; font-size: 12px; line-height: 24px; font-weight: 500;
        }
        .task-status.pending { color: #d48806; background: #fffbe6; }
        .task-status.executing { color: #389e0d; background: #f6ffed; }
        .task-status.completed { color: #86909c; background: #f5f5f5; }
        .task-name { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: 0; }

        .section { padding: 18px 16px; border-bottom: 8px solid #f5f5f5; }
        .section:last-child { border-bottom: 0; padding-bottom: 20px; }
        .section-title {
            display: flex; align-items: center; gap: 7px; margin-bottom: 12px;
            font-size: 15px; line-height: 22px; font-weight: 600;
        }
        .section-title::before {
            content: ""; width: 3px; height: 15px; border-radius: 2px; background: #1677ff;
        }
        .subsection-title {
            font-size: 13px; font-weight: 600; color: #4e5969;
            margin: 14px 0 8px;
        }
        .info-list { width: 100%; }
        .info-row {
            display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px;
            align-items: start; min-height: 41px; padding: 10px 0;
            border-bottom: 1px solid #f0f1f2; font-size: 14px; line-height: 21px;
        }
        .info-row:first-child { padding-top: 0; }
        .info-row:last-child { min-height: auto; padding-bottom: 0; border-bottom: 0; }
        .info-label { color: #86909c; }
        .info-value { color: #1f2329; text-align: right; overflow-wrap: anywhere; }
        .info-value.strong { font-weight: 500; }
        .resource-line + .resource-line { margin-top: 3px; }

        .segment-list { display: grid; gap: 10px; }
        .segment-card {
            padding: 13px 12px; border: 1px solid #e5e6eb; border-radius: 8px;
            background: #ffffff; box-shadow: 0 1px 3px rgba(31,35,41,0.04);
        }
        .segment-head {
            display: flex; align-items: flex-start; gap: 8px; padding-bottom: 10px;
            margin-bottom: 8px; border-bottom: 1px solid #f0f1f2;
        }
        .segment-index {
            flex: 0 0 auto; width: 20px; height: 20px; border-radius: 4px;
            display: inline-flex; align-items: center; justify-content: center;
            color: #ffffff; background: #1677ff; font-size: 11px; font-weight: 600;
        }
        .segment-name { min-width: 0; font-size: 14px; line-height: 20px; font-weight: 600; }
        .segment-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; }
        .segment-field { min-width: 0; }
        .segment-field.wide { grid-column: 1 / -1; }
        .segment-label { display: block; color: #86909c; font-size: 11px; line-height: 17px; }
        .segment-value { display: block; margin-top: 2px; color: #4e5969; font-size: 13px; line-height: 19px; overflow-wrap: anywhere; }

        .issue-tags { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
        .issue-tag {
            display: inline-flex; align-items: center; min-height: 23px; padding: 2px 7px;
            border: 1px solid #ffccc7; border-radius: 4px; color: #c93638;
            background: #fff1f0; font-size: 12px; line-height: 17px;
        }
        .severity { color: #c93638; font-weight: 600; }
        .coordinate-list { display: grid; gap: 3px; }
        .evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .evidence-item {
            position: relative; aspect-ratio: 4 / 3; overflow: hidden;
            border-radius: 6px; background: #dce3e5; border: 1px solid #e5e6eb;
        }
        .evidence-item svg { display: block; width: 100%; height: 100%; }
        .evidence-label {
            position: absolute; left: 7px; bottom: 7px; min-height: 22px; padding: 2px 7px;
            border-radius: 4px; background: rgba(31,35,41,0.76); color: #ffffff;
            font-size: 11px; line-height: 18px;
        }

        .track-actual { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .vehicle-dot { stroke: #ffffff; stroke-width: 1.8; }
        /* 底部操作栏 */
        .bottom-actions {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
            width: 100%; max-width: 375px; margin: 0 auto;
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
            background: #ffffff; border-top: 1px solid #e5e6eb;
            box-shadow: 0 -2px 12px rgba(31,35,41,0.06);
        }
        .bottom-actions .btn {
            flex: 1; height: 44px; border: none; border-radius: 8px;
            font-size: 15px; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            text-decoration: none; font-family: inherit;
        }
        .bottom-actions .btn-primary { flex: 1.5; background: #1677ff; color: #ffffff; }
        .bottom-actions .btn-secondary { background: #f2f3f5; color: #1f2329; }
        .bottom-actions .btn-ghost { background: #ffffff; color: #4e5969; border: 1px solid #e5e6eb; }
        .bottom-actions .btn:active { opacity: 0.85; }
        .bottom-actions .btn svg { width: 18px; height: 18px; }
        /* Toast */
        .toast {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            max-width: 260px; padding: 10px 14px; border-radius: 8px;
            background: rgba(31,35,41,0.82); color: #ffffff;
            font-size: 14px; line-height: 20px; text-align: center;
            z-index: 3000; opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        .toast.show { opacity: 1; }
        .empty-state {
            display: none; min-height: calc(100vh - 44px); padding: 112px 24px 40px;
            text-align: center; background: #ffffff;
        }
        .empty-icon {
            width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #f2f3f5; color: #86909c;
        }
        .empty-icon svg { width: 30px; height: 30px; }
        .empty-title { margin-bottom: 8px; font-size: 17px; line-height: 24px; font-weight: 600; }
        .empty-desc { color: #86909c; font-size: 13px; line-height: 20px; }
        .empty-link {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 132px; height: 44px; margin-top: 24px; padding: 0 18px;
            border-radius: 8px; background: #1677ff; color: #ffffff;
            text-decoration: none; font-size: 15px; font-weight: 500;
        }
        @media (prefers-reduced-motion: reduce) { .issue-marker::before { animation: none; } }
    </style>
</head>
<body data-no-project-switcher="true">
    <header class="top-nav">
        <a href="vehicle-management.html" class="nav-back" id="backLink" aria-label="返回地图工作台" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1>任务详情</h1>
    </header>

    <main class="page" id="taskPage">
        <section class="map-section" aria-label="任务地图">
            <svg class="map-canvas" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <rect class="map-ground" width="100" height="100"/>
                <path class="map-water" d="M83 0h17v100H92c-5-17-10-31-7-49 3-18-2-32-2-51z"/>
                <path class="map-block" d="M2 3h24v20H8zM33 4h22v17H35zM61 3h17v24H60zM4 72h25v23H1zM35 70h19v26H34zM62 72h20v22H59z"/>
                <path class="road-wide" d="M-5 31C18 23 32 43 52 35S79 14 105 19"/>
                <path class="road-wide" d="M14-5c3 24 15 33 12 54S17 81 24 105"/>
                <path class="road-wide" d="M-4 66c24-9 38 4 56-4s29-19 53-13"/>
                <path class="road-narrow" d="M47-5c-4 25 8 41 4 59s-1 31 7 51M73-4c-7 27 5 43 1 62s6 27 7 47"/>
                <path class="road-center" d="M-5 31C18 23 32 43 52 35S79 14 105 19M-4 66c24-9 38 4 56-4s29-19 53-13"/>
                <polyline id="routeShadow" class="task-route-shadow" points=""/>
                <polyline id="routeLine" class="task-route-line" points=""/>
                <circle id="routeStart" class="route-marker" r="3.6" fill="#34c759" cx="0" cy="0"/>
                <circle id="routeEnd" class="route-marker" r="3.6" fill="#1677ff" cx="0" cy="0"/>
                <polyline id="trackLine" class="track-actual" points="" style="display:none"/>
                <circle id="vehicleDot" class="vehicle-dot" r="3.4" fill="#1677ff" cx="0" cy="0" style="display:none"/>
            </svg>
            <span class="map-label label-a">科苑南路</span>
            <span class="map-label label-b">高新南九道</span>
            <span class="map-label label-c">深圳湾科技生态园</span>
            <div class="map-chip"><span class="map-chip-dot" id="mapChipDot"></span><span id="mapChipText">任务路线</span></div>
            <div class="issue-marker" id="issueMarker" aria-hidden="true"></div>
            <div class="map-caption" id="mapCaption"></div>
        </section>

        <div class="content">
            <section class="task-heading">
                <div class="task-heading-row">
                    <span class="task-tag" id="taskType" data-testid="task-type"></span>
                    <span class="task-number-inline" id="taskNumberInline" data-testid="task-number"></span>
                    <span class="task-status" id="taskStatus" data-testid="task-status"></span>
                </div>
                <h2 class="task-name" id="taskName"></h2>
            </section>

            <div id="detailContent"></div>
        </div>
        <div class="bottom-actions" id="bottomActions" data-testid="bottom-actions"></div>
    </main>

    <main class="empty-state" id="emptyState" data-testid="empty-state">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 3h6l1 2h3v16H5V5h3l1-2z"/><path d="M9 10h6M9 14h6"/></svg>
        </div>
        <div class="empty-title">任务不存在</div>
        <div class="empty-desc">该任务可能已撤回或任务编号无效</div>
        <a class="empty-link" id="emptyBackLink" href="vehicle-management.html">返回地图工作台</a>
    </main>

    <script src="components/task-detail-demo-data.js"></script>
    <script>
        (function () {
            'use strict';

            var params = new URLSearchParams(window.location.search);
            var task = window.TASK_DETAIL_DATA && window.TASK_DETAIL_DATA[params.get('id') || '1'];
            var requestedStatus = params.get('status');
            var source = params.get('source') || 'workbench';
            var sourceContext = {
                workbench: { href: 'vehicle-management.html', label: '用车管理', readonly: false },
                schedule: { href: 'schedule-tasks.html', label: '常规任务', readonly: true },
                emergency: { href: 'emergency-tasks.html', label: '应急任务', readonly: true },
                dynamic: { href: 'dynamic-tasks.html', label: '动态任务', readonly: true },
                'today-review': { href: 'today-review.html', label: '今日回顾', readonly: true }
            }[source] || { href: 'vehicle-management.html', label: '用车管理', readonly: false };

            document.body.classList.toggle('readonly-detail', sourceContext.readonly);
            document.getElementById('backLink').href = sourceContext.href;
            document.getElementById('backLink').setAttribute('aria-label', '返回' + sourceContext.label);
            document.getElementById('emptyBackLink').href = sourceContext.href;
            document.getElementById('emptyBackLink').textContent = '返回' + sourceContext.label;

            if (task && ['pending', 'executing', 'completed'].indexOf(requestedStatus) !== -1) {
                task = Object.assign({}, task, { status: requestedStatus });
            }

            if (!task) {
                document.getElementById('taskPage').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            document.title = task.name + ' - 任务详情';
            var typeEl = document.getElementById('taskType');
            typeEl.textContent = task.type;
            typeEl.className = 'task-tag ' + task.tone;
            document.getElementById('taskNumberInline').textContent = task.number;
            var status = taskStatus(task.status);
            var statusEl = document.getElementById('taskStatus');
            statusEl.textContent = status.text;
            statusEl.className = 'task-status ' + status.tone;
            var headingText = task.routeName ? (task.routeName + ' - ' + task.workType) : task.name;
            document.getElementById('taskName').textContent = headingText;

            renderMap(task);
            document.getElementById('detailContent').innerHTML = task.kind === 'issue'
                ? renderIssueDetail(task)
                : renderRouteDetail(task);
            renderBottomActions(task);

            function escapeHtml(value) {
                return String(value).replace(/[&<>"]/g, function (char) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[char];
                });
            }

            function infoRow(label, value, testId, valueClass) {
                var attr = testId ? ' data-testid="' + testId + '"' : '';
                return '<div class="info-row"><span class="info-label">' + label + '</span><span class="info-value ' + (valueClass || '') + '"' + attr + '>' + value + '</span></div>';
            }

            function renderResources(item) {
                return '<div class="resource-line">驾驶员 - ' + escapeHtml(item.driver) + '</div>' +
                    '<div class="resource-line">车辆 ' + escapeHtml(item.vehicle) + '</div>';
            }

            function taskStatus(value) {
                if (value === 'executing') return { text: '执行中', tone: 'executing' };
                if (value === 'completed') return { text: '已完成', tone: 'completed' };
                return { text: '待开始', tone: 'pending' };
            }

            function renderRouteDetail(item) {
                var segments = item.segments.map(function (segment, index) {
                    return '<article class="segment-card" data-testid="segment-card">' +
                        '<div class="segment-head"><span class="segment-index">' + (index + 1) + '</span><h4 class="segment-name">' + escapeHtml(segment.name) + '</h4></div>' +
                        '<div class="segment-grid">' +
                            segmentField('路段属性', segment.attribute) +
                            segmentField('作业模式', segment.mode) +
                            segmentField('作业次数', segment.count) +
                            segmentField('行驶方向', segment.direction) +
                            segmentField('行驶车道', segment.lane, true) +
                        '</div></article>';
                }).join('');

                return '<section class="section">' +
                        '<h3 class="section-title">任务信息</h3>' +
                        '<div class="info-list">' +
                        infoRow('任务日期', escapeHtml(item.date), 'task-date') +
                        infoRow('作业时间', escapeHtml(item.time)) +
                        infoRow('作业资源', renderResources(item)) +
                        infoRow('路线 ID', escapeHtml(item.routeId), 'route-id') +
                        '</div>' +
                        '<div class="subsection-title">路段明细</div>' +
                        '<div class="segment-list">' + segments + '</div>' +
                    '</section>' +
                    renderCompletion(item);
            }

            function segmentField(label, value, wide) {
                return '<div class="segment-field' + (wide ? ' wide' : '') + '"><span class="segment-label">' + label + '</span><span class="segment-value">' + escapeHtml(value) + '</span></div>';
            }

            function renderIssueDetail(item) {
                var coordinates = item.coordinates.map(function (coordinate) {
                    return '<span>【' + escapeHtml(coordinate) + '】</span>';
                }).join('');
                var types = item.issueTypes.map(function (type) {
                    return '<span class="issue-tag">' + escapeHtml(type) + '</span>';
                }).join('');
                var evidence = item.evidence.map(function (photo) {
                    return '<figure class="evidence-item" data-testid="issue-image">' + evidenceVisual(photo.visual) + '<figcaption class="evidence-label">' + escapeHtml(photo.label) + '</figcaption></figure>';
                }).join('');

                return '<section class="section">' +
                        '<h3 class="section-title">任务信息</h3>' +
                        '<div class="info-list">' +
                        infoRow('派发时间', escapeHtml(item.dispatchedAt || item.dispatchTime || '—'), 'dispatch-time') +
                        infoRow('作业资源', renderResources(item)) +
                        infoRow('问题经纬度', '<span class="coordinate-list">' + coordinates + '</span>', 'issue-coordinate') +
                        infoRow('问题地点', escapeHtml(item.location), 'issue-location') +
                        infoRow('问题类型', '<span class="issue-tags">' + types + '</span>') +
                        infoRow('问题重要程度', '<span class="severity">' + escapeHtml(item.severity) + '</span>') +
                        '</div>' +
                        '<div class="subsection-title">问题图片</div>' +
                        '<div class="evidence-grid">' + evidence + '</div>' +
                    '</section>' +
                    renderCompletion(item);
            }

            function evidenceVisual(type) {
                if (type === 'waste') {
                    return '<svg viewBox="0 0 160 120" role="img" aria-label="道路垃圾问题近照">' +
                        '<rect width="160" height="120" fill="#b7c7c2"/><rect y="47" width="160" height="73" fill="#626a6d"/>' +
                        '<path d="M0 54h160" stroke="#f5f2cf" stroke-width="3" stroke-dasharray="20 13"/>' +
                        '<path d="M42 79l18-8 19 7-8 18-21 2z" fill="#4d7a54"/><path d="M78 76l18 4 5 17-24 4-9-11z" fill="#d7d2c2"/>' +
                        '<rect x="105" y="82" width="22" height="15" rx="2" fill="#9d6e42"/><path d="M24 104h116" stroke="#3f484b" stroke-width="2"/>' +
                    '</svg>';
                }
                return '<svg viewBox="0 0 160 120" role="img" aria-label="道路垃圾问题现场全景">' +
                    '<rect width="160" height="45" fill="#bfd6dd"/><rect y="34" width="160" height="30" fill="#839b83"/>' +
                    '<rect x="11" y="18" width="38" height="42" fill="#d6d9d4"/><rect x="17" y="25" width="8" height="10" fill="#78929c"/><rect x="31" y="25" width="8" height="10" fill="#78929c"/>' +
                    '<path d="M0 65l160-12v67H0z" fill="#60686b"/><path d="M0 83l160-12" stroke="#f0e5b4" stroke-width="3" stroke-dasharray="22 14"/>' +
                    '<path d="M96 82l14-8 16 6-5 15-19 2z" fill="#4d7a54"/><rect x="126" y="82" width="15" height="12" rx="2" fill="#9d6e42"/>' +
                '</svg>';
            }

            function deriveIssuePlan(point) {
                var px = point[0], py = point[1];
                return [
                    [Math.max(4, px - 42), Math.max(8, py - 30)],
                    [px - 24, py - 16],
                    [px - 11, py - 6],
                    [px, py]
                ];
            }

            function renderMap(item) {
                var routeLine = document.getElementById('routeLine');
                var routeShadow = document.getElementById('routeShadow');
                var start = document.getElementById('routeStart');
                var end = document.getElementById('routeEnd');
                var trackLine = document.getElementById('trackLine');
                var vehicleDot = document.getElementById('vehicleDot');
                var issueMarker = document.getElementById('issueMarker');
                var chipDot = document.getElementById('mapChipDot');
                var chipText = document.getElementById('mapChipText');
                var caption = document.getElementById('mapCaption');
                var status = item.status;
                var isRoute = item.kind === 'route';

                // 重置图层与样式
                routeLine.style.display = 'none'; routeShadow.style.display = 'none';
                start.style.display = 'none'; end.style.display = 'none';
                trackLine.style.display = 'none'; vehicleDot.style.display = 'none';
                issueMarker.style.display = 'none';
                routeLine.style.stroke = '#1677ff'; routeLine.style.strokeWidth = '3.2';
                routeLine.style.strokeDasharray = 'none'; routeLine.style.opacity = '1';
                chipDot.style.background = isRoute ? (item.tone === 'emergency' ? '#ff4d4f' : '#1677ff') : '#ff4d4f';

                var planPoints = isRoute ? item.routePoints : deriveIssuePlan(item.point);

                if (isRoute) {
                    var pointsStr = planPoints.map(function (p) { return p.join(','); }).join(' ');
                    routeLine.setAttribute('points', pointsStr);
                    routeShadow.setAttribute('points', pointsStr);
                    routeLine.style.display = ''; routeShadow.style.display = '';
                    start.setAttribute('cx', planPoints[0][0]); start.setAttribute('cy', planPoints[0][1]); start.style.display = '';
                    var lastPt = planPoints[planPoints.length - 1];
                    end.setAttribute('cx', lastPt[0]); end.setAttribute('cy', lastPt[1]); end.style.display = '';
                    if (item.tone === 'emergency') { routeLine.style.stroke = '#ff4d4f'; }
                    chipText.textContent = item.type === '应急任务' ? '应急任务路线' : '常规任务路线';
                    caption.textContent = item.routeName;
                } else {
                    issueMarker.style.display = 'block';
                    issueMarker.style.left = item.point[0] + '%';
                    issueMarker.style.top = item.point[1] + '%';
                    chipText.textContent = '动态问题位置';
                    caption.textContent = item.location;
                }

                // 按任务状态叠加实际轨迹
                if (status === 'executing') {
                    var driven = planPoints.slice(0, Math.max(2, Math.ceil(planPoints.length * 0.6)));
                    trackLine.setAttribute('points', driven.map(function (p) { return p.join(','); }).join(' '));
                    trackLine.style.stroke = isRoute ? '#1677ff' : '#ff4d4f';
                    trackLine.style.display = '';
                    var head = driven[driven.length - 1];
                    vehicleDot.setAttribute('cx', head[0]); vehicleDot.setAttribute('cy', head[1]);
                    vehicleDot.setAttribute('fill', isRoute ? '#1677ff' : '#ff4d4f');
                    vehicleDot.style.display = '';
                    routeLine.style.strokeWidth = '2'; routeLine.style.strokeDasharray = '4 3'; routeLine.style.opacity = '0.45';
                    chipText.textContent = '实时轨迹';
                } else if (status === 'completed') {
                    var actual = planPoints.map(function (p, i) {
                        if (!isRoute) { return p; }
                        return [p[0] + (i % 2 ? 1.3 : -1.3), p[1] + (i % 3 ? -0.9 : 0.9)];
                    });
                    trackLine.setAttribute('points', actual.map(function (p) { return p.join(','); }).join(' '));
                    trackLine.style.stroke = '#52c41a';
                    trackLine.style.display = '';
                    routeLine.style.strokeWidth = '2'; routeLine.style.strokeDasharray = '4 3'; routeLine.style.opacity = '0.45';
                    chipText.textContent = '完整轨迹';
                }
            }

            function renderCompletion(item) {
                if (item.status === 'pending') { return ''; }
                var isCompleted = item.status === 'completed';
                // V1.12 任务完成信息：开始/结束时间精确到秒（YYYY-MM-DD HH:mm:ss）；执行中任务的"结束时间/作业里程/作业时长"统一占位为「—」
                var startT = item.actualStartTime || '—';
                var endT = isCompleted ? (item.actualEndTime || '—') : '—';
                var mileageValue = isCompleted
                    ? (item.mileage ? item.mileage + ' km' : '—')
                    : (item.currentMileage ? item.currentMileage + ' km' : '—');
                var durationRaw = isCompleted ? item.duration : item.currentDuration;
                var durationValue = (durationRaw !== null && durationRaw !== undefined && durationRaw !== '')
                    ? durationRaw + ' min'
                    : '—';
                return '<section class="section">' +
                    '<h3 class="section-title">任务完成信息</h3><div class="info-list">' +
                    infoRow('任务开始时间', escapeHtml(startT)) +
                    infoRow('任务结束时间', escapeHtml(endT)) +
                    infoRow('驾驶员', escapeHtml(item.driver)) +
                    infoRow('车牌号', escapeHtml(item.vehicle)) +
                    infoRow('作业里程', escapeHtml(mileageValue)) +
                    infoRow('作业时长', escapeHtml(durationValue)) +
                    '</div></section>';
            }

            function showToast(msg) {
                var existing = document.querySelector('.toast');
                if (existing) { existing.remove(); }
                var t = document.createElement('div');
                t.className = 'toast'; t.textContent = msg;
                document.body.appendChild(t);
                requestAnimationFrame(function () { t.classList.add('show'); });
                setTimeout(function () {
                    t.classList.remove('show');
                    setTimeout(function () { if (t.parentNode) { t.remove(); } }, 220);
                }, 1800);
            }

            function renderBottomActions(item) {
                var box = document.getElementById('bottomActions');
                if (sourceContext.readonly) {
                    box.className = 'bottom-actions';
                    var readonlyHtml = '';
                    readonlyHtml += '<a class="btn btn-secondary" data-act="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>导航</a>';
                    readonlyHtml += '<a class="btn btn-ghost" href="' + sourceContext.href + '">返回</a>';
                    box.innerHTML = readonlyHtml;
                    var navBtn = box.querySelector('[data-act="nav"]');
                    if (navBtn) { navBtn.onclick = function (e) { e.preventDefault(); showToast('调用高德地图导航（演示）'); }; }
                    return;
                }
                var status = item.status;
                var html = '';
                if (status === 'pending') {
                    html += '<button class="btn btn-primary" data-act="start">开始任务</button>';
                } else if (status === 'executing') {
                    html += '<button class="btn btn-primary" data-act="finish">结束任务</button>';
                }
                html += '<a class="btn btn-secondary" data-act="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>导航</a>';
                html += '<a class="btn btn-ghost" href="vehicle-management.html">返回</a>';
                box.innerHTML = html;
                var startBtn = box.querySelector('[data-act="start"]');
                if (startBtn) { startBtn.onclick = function () { goToWorkbench(item, 'start'); }; }
                var finishBtn = box.querySelector('[data-act="finish"]');
                if (finishBtn) { finishBtn.onclick = function () { goToWorkbench(item, 'finish'); }; }
                var navBtn = box.querySelector('[data-act="nav"]');
                if (navBtn) { navBtn.onclick = function (e) { e.preventDefault(); showToast('调用高德地图导航（演示）'); }; }
            }

            // 跳转到地图工作台并触发与地图端一致的开始/结束任务校验流程
            // 不在详情页内复制校验逻辑，所有校验、失败反馈均由地图工作台承担
            function goToWorkbench(item, action) {
                var id = item && item.id ? String(item.id) : '';
                if (!id) {
                    showToast('任务参数缺失，无法跳转');
                    return;
                }
                showToast(action === 'finish' ? '正在跳转地图工作台结束任务…' : '正在跳转地图工作台开始任务…');
                setTimeout(function () {
                    var url = 'vehicle-management.html'
                        + '?from=task-detail'
                        + '&taskId=' + encodeURIComponent(id)
                        + '&action=' + encodeURIComponent(action)
                        + '&embedded=1';
                    window.location.href = url;
                }, 600);
            }
        }());
    </script>
    <script src="components/app-common.js"></script>
</body>
</html>
