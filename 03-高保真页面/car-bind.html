<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>车辆绑定 - 车机品质巡查</title>
<link rel="stylesheet" href="components/car-common.css">
<style>
/* 绑定页：左右分屏，左侧品牌/说明，右侧二维码 */
.bind-main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: var(--car-gap); flex: 1; padding: var(--car-gap); min-height: 0; }
@media (max-width: 1279px) { .bind-main { grid-template-columns: minmax(0, 1fr) 400px; } }
.bind-left { display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 40px; background: var(--car-surface); border-radius: var(--car-radius); border: 1px solid var(--car-border); position: relative; overflow: hidden; }
.bind-left::before { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; background: radial-gradient(circle, rgba(22,119,255,0.08), transparent 70%); }
.bind-left__kicker { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; padding: 6px 14px; background: var(--car-primary-soft); color: var(--car-primary); border-radius: 20px; font-size: var(--car-fs-aux); font-weight: 500; }
.bind-left__title { font-size: var(--car-fs-title); font-weight: 600; line-height: 1.3; }
.bind-left__desc { font-size: var(--car-fs-body); line-height: 28px; color: var(--car-text-secondary); max-width: 420px; }
.bind-steps { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.bind-step { display: flex; align-items: center; gap: 14px; }
.bind-step__no { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--car-primary); color: #fff; font-size: var(--car-fs-aux); font-weight: 600; flex-shrink: 0; }
.bind-step__txt { font-size: var(--car-fs-body); }
.bind-right { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; background: var(--car-surface); border-radius: var(--car-radius); border: 1px solid var(--car-border); }
.bind-right__cap { font-size: var(--car-fs-panel); font-weight: 600; }
.bind-right__sub { font-size: var(--car-fs-aux); color: var(--car-text-secondary); text-align: center; line-height: 22px; }
.bind-vehicle-tag { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--car-surface-soft); border: 1px solid var(--car-border); border-radius: var(--car-radius-sm); font-size: var(--car-fs-body); }
.bind-vehicle-tag .car-mono { color: var(--car-primary); font-weight: 600; }
/* 扫码氛围：二维码外层扫描框 */
.bind-qr-scanbox { position: relative; padding: 24px; }
.bind-qr-scanbox::before, .bind-qr-scanbox::after, .bind-qr-scanbox > i, .bind-qr-scanbox > b { content: ""; position: absolute; width: 22px; height: 22px; border: 3px solid var(--car-primary); }
.bind-qr-scanbox::before { left: 0; top: 0; border-right: none; border-bottom: none; border-radius: 4px 0 0 0; }
.bind-qr-scanbox::after { right: 0; top: 0; border-left: none; border-bottom: none; border-radius: 0 4px 0 0; }
.bind-qr-scanbox > i { left: 0; bottom: 0; border-right: none; border-top: none; border-radius: 0 0 0 4px; }
.bind-qr-scanbox > b { right: 0; bottom: 0; border-left: none; border-top: none; border-radius: 0 0 4px 0; }
.bind-qr-scanbox .car-qr-wrap { border: none; padding: 0; background: transparent; }
/* 演示入口（实际开发由手机端扫码，车机端无此按钮） */
.bind-demo-hint { margin-top: 4px; font-size: 12px; color: var(--car-text-disabled); }
.bind-demo-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 14px; font-size: var(--car-fs-aux); color: var(--car-text-secondary); background: transparent; border: 1px dashed var(--car-border); border-radius: var(--car-radius-sm); transition: color 0.15s, border-color 0.15s; }
.bind-demo-btn:active { color: var(--car-primary); border-color: var(--car-primary); }
</style>
</head>
<body>
<div class="car-app">
    <!-- 顶栏 -->
    <header class="car-topbar">
        <div class="car-topbar__page">
            <div class="car-topbar__brand">
                <svg class="car-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h2l2-5h9l3 5h2"/><path d="M5 13v5h14v-5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/></svg>
                品质巡查
            </div>
        </div>
        <div class="car-topbar__spacer"></div>
        <div class="car-topbar__meta">
            <span class="car-pill"><span class="car-status-dot is-offline"></span>未绑定</span>
            <span class="car-pill js-clock">--:--</span>
        </div>
    </header>

    <!-- 主体 -->
    <div class="bind-main">
        <!-- 左：说明 -->
        <section class="bind-left">
            <span class="bind-left__kicker">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h7v7"/></svg>
                扫码绑定
            </span>
            <h1 class="bind-left__title">请使用手机APP扫描二维码<br>完成人车绑定</h1>
            <p class="bind-left__desc">机动车巡查任务将在车机端执行，绑定后车机自动同步当前巡查员的今日巡查任务与事件数据。</p>
            <div class="bind-steps">
                <div class="bind-step"><span class="bind-step__no">1</span><span class="bind-step__txt">打开手机APP「品质巡查」应用</span></div>
                <div class="bind-step"><span class="bind-step__no">2</span><span class="bind-step__txt">使用「扫码绑车」扫描右侧二维码</span></div>
                <div class="bind-step"><span class="bind-step__no">3</span><span class="bind-step__txt">校验通过后进入今日巡查任务</span></div>
            </div>
        </section>

        <!-- 右：二维码 -->
        <aside class="bind-right">
            <div class="bind-right__cap">车辆绑定二维码</div>
            <div class="bind-vehicle-tag">绑定车辆 <span class="car-mono" id="js-vehicleNo">粤B·D2856</span></div>
            <div class="bind-qr-scanbox"><i></i><b></b><div class="car-qr-wrap" id="js-qr"></div></div>
            <span class="bind-demo-hint">演示入口 · 实际由手机端扫码完成</span>
            <button class="bind-demo-btn" id="js-scan">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                模拟扫码完成绑定
            </button>
        </aside>
    </div>
</div>

<script src="components/car-common.js"></script>
<script>
(function () {
    var st = CAR.getState();
    document.getElementById('js-vehicleNo').textContent = st.vehicleNo;
    document.getElementById('js-qr').innerHTML = CAR.qrSVG('bind-' + st.vehicleId);
    CAR.bindClock();
    CAR.installDebugFab();

    document.getElementById('js-scan').addEventListener('click', function () {
        var result = CAR.validateBind();
        if (!result.ok) { CAR.toast(result.message); return; }
        if (result.warning) CAR.toast(result.warning, 2600);
        CAR.bindVehicle(st.driverName);
        CAR.go('car-home.html', { toast: result.warning || '绑定成功，正在加载今日任务', delay: 900 });
    });

    // 已绑定则直接跳首页
    if (st.bound) { location.replace('car-home.html'); }
})();
</script>
</body>
</html>
