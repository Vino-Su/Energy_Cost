<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 430px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; width: 100%; margin: 0; min-height: 100vh;
            padding-bottom: 56px;
        }
        /* 顶部用户区：浅蓝渐变背景 */
        .profile-header {
            background: linear-gradient(180deg, #e6f4ff 0%, #f5f5f5 100%);
            padding: 24px 16px 32px;
        }
        .user-card {
            display: flex; align-items: center; gap: 12px;
        }
        .user-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .user-avatar svg { width: 36px; height: 36px; }
        .user-info { flex: 1; min-width: 0; }
        .user-name-row {
            display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
        }
        .user-name {
            font-size: 18px; font-weight: 600; color: #000000d9; line-height: 26px;
        }
        .user-phone {
            font-size: 13px; color: #00000073; line-height: 20px;
        }
        .user-role {
            margin-top: 4px; display: inline-block;
            font-size: 11px; padding: 2px 8px; border-radius: 4px;
            background: rgba(22,119,255,0.08); color: #1677ff;
        }
        /* 菜单列表 */
        .menu-card {
            margin: -16px 16px 12px;  /* 上移与用户卡片重叠 */
            background: #ffffff; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .menu-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; text-decoration: none; color: inherit;
            transition: background-color 0.15s;
        }
        .menu-item:active { background: #f5f5f5; }
        .menu-item + .menu-item { border-top: 1px solid #f5f5f5; }
        .menu-icon {
            width: 24px; height: 24px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .menu-icon svg { width: 20px; height: 20px; }
        .menu-name {
            flex: 1; font-size: 15px; color: #000000d9; line-height: 22px;
        }
        .menu-arrow {
            width: 16px; height: 16px; color: #00000040; flex-shrink: 0;
        }
        /* 退出登录 */
        .logout-btn {
            margin: 12px 16px 0; height: 48px; border-radius: 12px;
            background: #ffffff; color: #ff4d4f;
            font-size: 15px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; text-decoration: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .logout-btn:active { background: #fff1f0; }
        /* 底部Tab */
        .bottom-tab {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; width: 100%; max-width: 430px;
            height: 56px; background: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: flex; z-index: 1000;
        }
        .tab-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 2px;
            text-decoration: none; color: #00000073; font-size: 10px;
            transition: color 0.2s;
        }
        .tab-item.active { color: #1677ff; }
        .tab-item svg { width: 24px; height: 24px; }
    </style>
</head>
<body>
    <!-- 顶部用户区 -->

            <div class="user-info">

                    <span class="user-name">张星星</span>
                    <span class="user-phone">18133695568</span>

                <span class="user-role">运营总监</span>

            </div>

    <!-- 底部Tab -->

        <a href="placeholder.html?from=messages&title=消息" class="tab-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>

</html>
