<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常规任务 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="components/driver-task-list.css">
</head>
<body data-no-project-switcher="true">
    <header class="top-nav">
        <a href="vehicle-management.html?tab=service" class="top-nav-back" aria-label="返回用车管理" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 class="top-nav-title" id="pageTitle">常规任务</h1>
    </header>
    <main class="page">
        <div class="tab-bar" id="tabBar" role="tablist" aria-label="任务状态">
            <button type="button" class="tab active" data-tab="pending" role="tab" aria-selected="true">待开始<span class="tab-badge" id="badge-pending">0</span></button>
            <button type="button" class="tab" data-tab="executing" role="tab" aria-selected="false">进行中<span class="tab-badge" id="badge-executing">0</span></button>
            <button type="button" class="tab" data-tab="ended" role="tab" aria-selected="false">已结束<span class="tab-badge" id="badge-ended">0</span></button>
        </div>
        <div class="toolbar">
            <div class="toolbar-chips">
                <button type="button" class="filter-chip" id="filterChip" aria-label="筛选任务时间">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
                    <span class="filter-text" id="filterLabel">今天</span><span class="filter-arrow">▾</span>
                </button>
                <button type="button" class="filter-chip" id="plateChip" aria-label="筛选任务车辆">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 17h14l-1.6-5.2A2.5 2.5 0 0 0 15 10H9a2.5 2.5 0 0 0-2.4 1.8L5 17Z"/><path d="M7 17v2M17 17v2M8 14h8"/></svg>
                    <span class="filter-text" id="plateLabel">全部车牌</span><span class="filter-arrow">▾</span>
                </button>
                <button type="button" class="filter-chip" id="resultChip" aria-label="筛选已结束任务状态" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 7h14M7 12h10M9 17h6"/><circle cx="4" cy="7" r="1" fill="currentColor"/><circle cx="20" cy="12" r="1" fill="currentColor"/><circle cx="8" cy="17" r="1" fill="currentColor"/></svg>
                    <span class="filter-text" id="resultLabel">全部结果</span><span class="filter-arrow">▾</span>
                </button>
            </div>
            <span class="task-count" id="taskCount">0 项</span>
        </div>
        <div class="list-area"><div class="task-list" id="taskList"></div></div>
    </main>
    <div class="sheet-overlay" id="filterSheet">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 class="sheet-title" id="filterTitle">选择时间范围</h2>
                <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭时间筛选">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div id="sheetItems"></div>
            <div class="custom-panel" id="customPanel">
                <div class="date-grid">
                    <div class="date-field"><label for="customStart">起始日期</label><input type="date" id="customStart"></div>
                    <div class="date-field"><label for="customEnd">结束日期</label><input type="date" id="customEnd"></div>
                </div>
                <div class="custom-error" id="customError"></div>
                <div class="custom-actions">
                    <button type="button" class="custom-button secondary" id="customCancel">取消</button>
                    <button type="button" class="custom-button primary" id="customConfirm">确定</button>
                </div>
            </div>
        </section>
    </div>
    <div class="sheet-overlay" id="plateSheet">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="plateSheetTitle">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 class="sheet-title" id="plateSheetTitle">选择车牌</h2>
                <button type="button" class="sheet-close" id="plateSheetClose" aria-label="关闭车牌筛选">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div id="plateSheetItems"></div>
        </section>
    </div>
    <div class="sheet-overlay" id="resultSheet">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="resultSheetTitle">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 class="sheet-title" id="resultSheetTitle">选择结果状态</h2>
                <button type="button" class="sheet-close" id="resultSheetClose" aria-label="关闭结果状态筛选">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div id="resultSheetItems"></div>
        </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="components/task-detail-demo-data.js"></script>
    <script src="components/driver-task-list.js"></script>
    <script>DriverTaskList.init({ listType: 'schedule', title: '常规任务', driverName: '李四', referenceDate: '2026-07-11' });</script>
    <script src="components/app-common.js"></script>
</body>
</html>
