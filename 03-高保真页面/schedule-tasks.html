<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排班任务 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 430px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; color: #000000d9;
            width: 100%; margin: 0; min-height: 100vh;
            font-feature-settings: 'tnum' 1;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        :root {
            --primary: #1677ff;
            --primary-soft: #e6f4ff;
            --running-soft: #f6ffed;
            --done-soft: #f5f5f5;
            --text-1: #000000d9;
            --text-2: #00000073;
            --text-3: #00000040;
            --border: #e8e8e8;
        }
        /* 顶部导航（与 map-workbench 一致） */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto; max-width: 430px;
            height: 44px; background: rgba(255,255,255,0.95);
            border-bottom: 1px solid #e8e8e8;
            display: flex; align-items: center; z-index: 1000; padding: 0 12px; gap: 8px;
        }
        .top-nav-back {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #000000d9; text-decoration: none;
        }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #000000d9;
        }
        .top-nav-spacer { width: 32px; }
        /* Tab 区（与 map-workbench 抽屉头保持一致） */
        .tab-bar {
            position: fixed; top: 44px; left: 0; right: 0; margin: 0 auto; max-width: 430px;
            height: 44px; background: #ffffff; border-bottom: 1px solid #f0f0f0;
            display: flex; align-items: stretch; padding: 0 8px; z-index: 999;
        }
        .tab {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            font-size: 14px; color: #00000073; cursor: pointer; user-select: none;
            position: relative; height: 100%; font-weight: 400;
        }
        .tab.active { color: #1677ff; font-weight: 500; font-size: 15px; }
        .tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 28%; right: 28%;
            height: 2px; background: #1677ff; border-radius: 2px 2px 0 0;
        }
        .tab-badge {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 18px; height: 16px; padding: 0 5px; border-radius: 8px;
            background: #f5f5f5; color: #00000073; font-size: 11px; font-weight: 500;
            font-feature-settings: 'tnum';
        }
        .tab.active .tab-badge { background: #e6f4ff; color: #1677ff; }
        /* 工具条（筛选 + 刷新） */
        .toolbar {
            position: fixed; top: 88px; left: 0; right: 0; margin: 0 auto; max-width: 430px;
            height: 44px; background: #f5f5f5;
            display: flex; align-items: center; padding: 0 16px; gap: 8px; z-index: 998;
        }
        .filter-chip {
            display: inline-flex; align-items: center; gap: 6px;
            height: 32px; padding: 0 12px; border-radius: 16px;
            background: #ffffff; color: #000000d9;
            font-size: 13px; cursor: pointer; user-select: none;
            border: 1px solid #e8e8e8; font-weight: 500;
            transition: all 0.15s;
        }
        .filter-chip svg { width: 14px; height: 14px; }
        .filter-chip .arrow {
            font-size: 10px; color: #00000073; transition: transform 0.2s; margin-left: 2px;
        }
        .filter-chip.open {
            border-color: #1677ff; color: #1677ff; background: #e6f4ff;
        }
        .filter-chip.open .arrow { transform: rotate(180deg); color: #1677ff; }
        .filter-chip .filter-text {
            max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 列表区 */
        .list-area {
            padding: 140px 16px 24px; min-height: calc(100vh - 132px);
        }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        /* 任务卡片（扁平卡片，不带状态底色） */
        .task-card {
            margin: 0;
            padding: 14px 16px;
            background: #ffffff;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #e8e8e8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: transform 0.15s;
        }
        .task-card:active { transform: scale(0.99); }
        /* 三行式布局：第一行 名称+状态 / 第二行 日期+时间+路段 / 第三行 作业要求 */
        .task-card-row {
            display: flex; align-items: center; gap: 8px;
            line-height: 22px;
        }
        .task-card-row + .task-card-row { margin-top: 6px; }
        .task-card-row1 .task-name {
            font-size: 16px; font-weight: 600; color: #000000d9;
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 状态标签 - 与 map-workbench .current-task-tag 一致 */
        .status-tag {
            display: inline-flex; align-items: center; gap: 4px;
            height: 20px; padding: 0 6px; border-radius: 4px;
            font-size: 11px; line-height: 20px; flex-shrink: 0;
            background: #e6f4ff; color: #1677ff;
        }
        .status-tag.pending { background: #e6f4ff; color: #1677ff; }
        .status-tag.running { background: #52c41a; color: #ffffff; }
        .status-tag.done { background: #e8e8e8; color: #00000073; }
        /* 第二行：日期 + 时间 + 路段 */
        .task-card-row2 {
            font-size: 12px; color: #00000073; line-height: 20px;
        }
        .task-card-row2 .sep {
            display: inline-block; width: 1px; height: 10px;
            background: #e8e8e8; vertical-align: middle; margin: 0 6px;
        }
        .task-card-row2 .time {
            font-feature-settings: 'tnum'; font-variant-numeric: tabular-nums;
            color: #000000d9;
        }
        .task-card-row2 .route {
            flex: 1; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 第三行：作业要求 */
        .task-requirement {
            font-size: 12px; color: #00000073; line-height: 20px;
            display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* 空状态 */
        .empty-state {
            padding: 80px 24px; text-align: center;
        }
        .empty-state svg {
            width: 88px; height: 88px; color: #00000040;
            margin-bottom: 16px;
        }
        .empty-state .empty-title {
            font-size: 14px; color: #00000073; margin-bottom: 6px; font-weight: 500;
        }
        .empty-state .empty-desc {
            font-size: 12px; color: #00000073; opacity: 0.7;
        }
        /* Toast（与 map-workbench 完全一致） */
        .toast {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            max-width: 260px; padding: 10px 14px; border-radius: 8px;
            background: rgba(0,0,0,0.75); color: #ffffff;
            font-size: 14px; line-height: 20px; text-align: center;
            z-index: 3000; display: none;
        }
        .toast.show { display: block; }
        /* 时间筛选 ActionSheet */
        .sheet-overlay {
            position: fixed; inset: 0; margin: 0 auto; max-width: 430px;
            background: rgba(0,0,0,0.5); z-index: 2000;
            display: none; align-items: flex-end;
            opacity: 0; transition: opacity 0.2s;
        }
        .sheet-overlay.show { display: flex; opacity: 1; }
        .sheet {
            width: 100%; background: #ffffff;
            border-radius: 16px 16px 0 0; padding: 8px 0 24px;
            transform: translateY(100%); transition: transform 0.28s cubic-bezier(.22,.7,.3,1);
        }
        .sheet-overlay.show .sheet { transform: translateY(0); }
        .sheet-handle {
            width: 36px; height: 4px; border-radius: 2px;
            background: #e8e8e8; margin: 8px auto 12px;
        }
        .sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 4px 16px 14px;
        }
        .sheet-title { font-size: 16px; font-weight: 600; color: #000000d9; }
        .sheet-close {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: #00000073;
        }
        .sheet-close svg { width: 18px; height: 18px; }
        .sheet-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; cursor: pointer;
            transition: background 0.15s; font-size: 15px;
            color: #000000d9; border-top: 1px solid #fafafa;
        }
        .sheet-item:active { background: #f5f5f5; }
        .sheet-item .check { color: #1677ff; }
        .sheet-item .check svg { width: 18px; height: 18px; }
        .sheet-divider { height: 6px; background: #fafafa; }
        /* 自定义日期面板 */
        .custom-overlay {
            position: fixed; inset: 0; margin: 0 auto; max-width: 430px;
            background: rgba(0,0,0,0.5); z-index: 2100;
            display: none; align-items: center; justify-content: center;
            padding: 0 16px; opacity: 0; transition: opacity 0.2s;
        }
        .custom-overlay.show { display: flex; opacity: 1; }
        .custom-card {
            width: 280px; background: #ffffff; border-radius: 16px;
            padding: 22px 20px 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.18);
            animation: customIn 0.24s cubic-bezier(.22,.7,.3,1);
        }
        @keyframes customIn {
            from { opacity: 0; transform: scale(0.94) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .custom-title {
            font-size: 16px; font-weight: 600; color: #000000d9; margin-bottom: 16px;
        }
        .custom-field { margin-bottom: 12px; }
        .custom-field label {
            display: block; font-size: 12px; color: #00000073; margin-bottom: 6px;
            font-weight: 500;
        }
        .custom-field input {
            width: 100%; height: 40px; border: 1px solid #e8e8e8;
            border-radius: 8px; padding: 0 12px; font-size: 14px;
            outline: none; font-family: inherit; transition: all 0.15s;
            color: #000000d9; background: #fafafa;
            font-feature-settings: 'tnum';
        }
        .custom-field input:focus {
            border-color: #1677ff; box-shadow: 0 0 0 2px #e6f4ff; background: #ffffff;
        }
        .custom-err {
            font-size: 12px; color: #ff4d4f; min-height: 18px;
            margin-bottom: 6px; display: flex; align-items: center; gap: 4px;
        }
        .custom-err svg { width: 12px; height: 12px; flex-shrink: 0; }
        .custom-actions { display: flex; gap: 8px; margin-top: 8px; }
        .custom-btn {
            flex: 1; height: 40px; border-radius: 8px; font-size: 14px;
            cursor: pointer; border: none; font-weight: 500;
            transition: opacity 0.15s; font-family: inherit;
        }
        .custom-btn.cancel { background: #f5f5f5; color: #000000d9; }
        .custom-btn.primary { background: #1677ff; color: #ffffff; }
        .custom-btn:active { opacity: 0.85; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="vehicle-management.html" class="top-nav-back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title">排班任务</div>
        <div class="top-nav-spacer"></div>
    </div>

    <!-- Tab 区 -->
    <div class="tab-bar">
        <div class="tab active" data-tab="pending">
            待开始<span class="tab-badge" id="badge-pending">0</span>
        </div>
        <div class="tab" data-tab="running">
            进行中<span class="tab-badge" id="badge-running">0</span>
        </div>
        <div class="tab" data-tab="done">
            已完成<span class="tab-badge" id="badge-done">0</span>
        </div>
    </div>

    <!-- 工具条 -->
    <div class="toolbar">
        <div class="filter-chip" id="filterChip" onclick="openFilterSheet()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span class="filter-text" id="filterLabel">今天</span>
            <span class="arrow">▾</span>
        </div>
    </div>

    <!-- 列表区 -->
    <div class="list-area">
        <div class="task-list" id="taskList"></div>
    </div>

    <!-- Toast 层 -->
    <div class="toast" id="toast"></div>

    <!-- 时间筛选 ActionSheet -->
    <div class="sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeFilterSheet()">
        <div class="sheet">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <div class="sheet-title">选择时间范围</div>
                <div class="sheet-close" onclick="closeFilterSheet()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </div>
            </div>
            <div id="sheetItems"></div>
        </div>
    </div>

    <!-- 自定义日期面板 -->
    <div class="custom-overlay" id="customOverlay" onclick="if(event.target===this)closeCustomPicker()">
        <div class="custom-card">
            <div class="custom-title">自定义时间段</div>
            <div class="custom-field">
                <label>起始日期</label>
                <input type="date" id="customStart" placeholder="YYYY-MM-DD" />
            </div>
            <div class="custom-field">
                <label>结束日期</label>
                <input type="date" id="customEnd" placeholder="YYYY-MM-DD" />
            </div>
            <div class="custom-err" id="customErr"></div>
            <div class="custom-actions">
                <button class="custom-btn cancel" onclick="closeCustomPicker()">取消</button>
                <button class="custom-btn primary" onclick="confirmCustom()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // ============ 数据（对齐 map-workbench 字段口径） ============
        var TODAY = new Date(2026, 6, 10);
        function fmt(d) {
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }
        function shift(days) {
            var d = new Date(TODAY);
            d.setDate(d.getDate() + days);
            return fmt(d);
        }
        var todayStr = fmt(TODAY);

        // 字段：id / name / status / date / timeStart / timeEnd / routeName / requirement
        // 与 map-workbench.html 的 tasks 数组对齐（去除 type/icon 等与地图工作台重复的字段）
        var tasks = [
            // 待开始（今天）
            { id: 'P01', name: '科技园南区道路清扫', status: 'pending',
              date: todayStr, timeStart: '08:30', timeEnd: '10:30',
              routeName: '科苑南路至高新南九道',
              requirement: '洗扫车覆盖道路两侧及辅道，作业速度不超过 25km/h。' },
            { id: 'P02', name: '高新南九道日常巡检', status: 'pending',
              date: todayStr, timeStart: '14:00', timeEnd: '15:00',
              routeName: '高新南九道',
              requirement: '巡检道路洁净度并处理零星垃圾点。' },
            { id: 'P03', name: '南山垃圾中转站对接', status: 'pending',
              date: todayStr, timeStart: '16:00', timeEnd: '17:00',
              routeName: '南山站',
              requirement: '前往中转站完成车辆对接和站点清洁确认。' },
            { id: 'P04', name: '滨海大道夜间冲洗', status: 'pending',
              date: todayStr, timeStart: '19:00', timeEnd: '22:00',
              routeName: '滨海大道东段',
              requirement: '夜间冲洗主干道，避开交通高峰，保持低速匀速作业。' },

            // 进行中（今天）
            { id: 'R01', name: '西丽留仙洞片区道路清扫', status: 'running',
              date: todayStr, timeStart: '08:00', timeEnd: '10:00',
              routeName: '西丽留仙洞片区',
              requirement: '机扫 + 冲洗配合，覆盖主路及非机动车道。' },
            { id: 'R02', name: '海岸城周边精细化保洁', status: 'running',
              date: todayStr, timeStart: '10:30', timeEnd: '12:00',
              routeName: '海岸城片区',
              requirement: '人工保洁配合机扫，重点处理商业广场周边。' },
            { id: 'R03', name: '蛇口午后洒水降尘', status: 'running',
              date: todayStr, timeStart: '13:00', timeEnd: '14:30',
              routeName: '蛇口工业路至太子路',
              requirement: '午后高温时段洒水降尘，控制水压避免溅洒行人。' },

            // 已完成（跨多天，覆盖今天筛选内外）
            { id: 'D01', name: '麒麟立交桥底冲洗', status: 'done',
              date: todayStr, timeStart: '06:00', timeEnd: '07:30',
              routeName: '麒麟立交桥底',
              requirement: '桥下冲洗，重点处理桥墩及排水沟。' },
            { id: 'D02', name: '深南大道机扫', status: 'done',
              date: todayStr, timeStart: '05:00', timeEnd: '07:00',
              routeName: '深南大道东段至西段',
              requirement: '主干道机扫，覆盖双方向六个车道。' },
            { id: 'D03', name: '后海片区清扫保洁', status: 'done',
              date: shift(-1), timeStart: '05:30', timeEnd: '07:30',
              routeName: '后海大道至滨海大道',
              requirement: '片区清扫保洁协同作业。' },
            { id: 'D04', name: '南山科技园晨间机扫', status: 'done',
              date: shift(-1), timeStart: '07:00', timeEnd: '08:30',
              routeName: '科苑南路至高新南九道',
              requirement: '晨间机扫避开上班高峰。' },
            { id: 'D05', name: '科苑路夜班洒水', status: 'done',
              date: shift(-1), timeStart: '02:00', timeEnd: '04:00',
              routeName: '科苑路全段',
              requirement: '夜班洒水降尘。' },
            { id: 'D06', name: '前海合作区机扫', status: 'done',
              date: shift(-2), timeStart: '05:00', timeEnd: '07:00',
              routeName: '前海合作区主干道',
              requirement: '周末机扫加强保洁质量。' }
        ];

        // ============ 状态 ============
        var currentTab = 'pending';
        var currentFilter = { type: 'today', label: '今天', from: todayStr, to: todayStr };
        var FILTER_RANGES = [
            { type: 'today', label: '今天', range: 0 },
            { type: 'week', label: '本周（近 7 天）', range: 6 },
            { type: 'month', label: '本月（近 30 天）', range: 29 },
            { type: 'all', label: '全部时间', range: null },
            { type: 'custom', label: '自定义时间段', range: null }
        ];

        // ============ 工具 ============
        function statusText(s) {
            return s === 'pending' ? '待开始' : s === 'running' ? '进行中' : '已完成';
        }
        function dateInRange(dateStr, from, to) {
            return dateStr >= from && dateStr <= to;
        }
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(function () { t.classList.remove('show'); }, 1800);
        }

        // ============ 数据筛选 ============
        function getFilteredTasks() {
            var from = currentFilter.from, to = currentFilter.to;
            return tasks
                .filter(function (t) { return t.status === currentTab; })
                .filter(function (t) { return dateInRange(t.date, from, to); })
                .sort(function (a, b) {
                    if (currentTab === 'done') {
                        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
                        return a.timeStart < b.timeStart ? 1 : -1;
                    }
                    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
                    return a.timeStart < b.timeStart ? -1 : 1;
                });
        }

        // ============ 渲染（三行式扁平卡片） ============
        function renderCard(task) {
            return ''
                + '<div class="task-card" onclick="onCardClick(\'' + task.id + '\')">'
                // 第一行：任务名称 + 任务状态
                + '<div class="task-card-row task-card-row1">'
                + '<div class="task-name">' + task.name + '</div>'
                + '<span class="status-tag ' + task.status + '">' + statusText(task.status) + '</span>'
                + '</div>'
                // 第二行：日期 + 计划时间 + 路段
                + '<div class="task-card-row task-card-row2">'
                + '<span>' + task.date + '</span>'
                + '<span class="sep"></span>'
                + '<span class="time">' + task.timeStart + '-' + task.timeEnd + '</span>'
                + '<span class="sep"></span>'
                + '<span class="route">' + task.routeName + '</span>'
                + '</div>'
                // 第三行：作业要求
                + (task.requirement ? '<div class="task-card-row task-card-row3"><div class="task-requirement">' + task.requirement + '</div></div>' : '')
                + '</div>';
        }
        function renderEmpty(title, desc) {
            return ''
                + '<div class="empty-state">'
                + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>'
                + '<div class="empty-title">' + title + '</div>'
                + '<div class="empty-desc">' + desc + '</div>'
                + '</div>';
        }

        function updateBadges() {
            ['pending', 'running', 'done'].forEach(function (status) {
                var from = currentFilter.from, to = currentFilter.to;
                var count = tasks.filter(function (t) {
                    return t.status === status && dateInRange(t.date, from, to);
                }).length;
                document.getElementById('badge-' + status).textContent = count;
            });
        }

        function renderAll() {
            var list = getFilteredTasks();
            var container = document.getElementById('taskList');
            if (list.length === 0) {
                var emptyTitles = {
                    pending: '暂无待开始任务',
                    running: '暂无进行中任务',
                    done: '暂无已完成任务'
                };
                var desc = '当前筛选：' + currentFilter.label + '。可切换其他时间范围或 Tab 查看。';
                container.innerHTML = renderEmpty(emptyTitles[currentTab], desc);
                return;
            }
            container.innerHTML = list.map(renderCard).join('');
        }

        function refreshList() {
            showToast('已刷新');
            renderAll();
        }

        function onCardClick(id) {
            showToast('任务详情页建设中');
        }

        // ============ Tab 切换 ============
        document.querySelectorAll('.tab').forEach(function (el) {
            el.addEventListener('click', function () {
                document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
                el.classList.add('active');
                currentTab = el.getAttribute('data-tab');
                renderAll();
            });
        });

        // ============ 时间筛选 Sheet ============
        function buildSheetItems() {
            var html = '';
            FILTER_RANGES.forEach(function (f, idx) {
                var checked = (f.type === currentFilter.type) ? 'block' : 'none';
                html += '<div class="sheet-item" onclick="onPickFilter(\'' + f.type + '\')">'
                    + '<span>' + f.label + '</span>'
                    + '<span class="check" style="display:' + checked + ';">'
                    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>'
                    + '</span></div>';
                if (idx < FILTER_RANGES.length - 1) {
                    html += '<div class="sheet-divider"></div>';
                }
            });
            document.getElementById('sheetItems').innerHTML = html;
        }
        function syncSheetChecks() {
            var items = document.querySelectorAll('#sheetItems .sheet-item');
            items.forEach(function (el, idx) {
                var check = el.querySelector('.check');
                if (check) check.style.display = (FILTER_RANGES[idx].type === currentFilter.type) ? 'block' : 'none';
            });
        }
        function openFilterSheet() {
            buildSheetItems();
            document.getElementById('sheetOverlay').classList.add('show');
            document.getElementById('filterChip').classList.add('open');
        }
        function closeFilterSheet() {
            document.getElementById('sheetOverlay').classList.remove('show');
            document.getElementById('filterChip').classList.remove('open');
        }
        function onPickFilter(type) {
            if (type === 'custom') {
                openCustomPicker();
                return;
            }
            var range = FILTER_RANGES.find(function (f) { return f.type === type; });
            currentFilter = {
                type: type,
                label: range.label,
                from: range.range === null ? '0000-00-00' : shift(-range.range),
                to: todayStr
            };
            syncSheetChecks();
            closeFilterSheet();
            document.getElementById('filterLabel').textContent = currentFilter.label;
            updateBadges();
            renderAll();
        }

        // ============ 自定义日期 ============
        function openCustomPicker() {
            document.getElementById('customOverlay').classList.add('show');
            document.getElementById('customStart').value = currentFilter.type === 'custom' ? currentFilter.from : todayStr;
            document.getElementById('customEnd').value = currentFilter.type === 'custom' ? currentFilter.to : todayStr;
            document.getElementById('customErr').textContent = '';
        }
        function closeCustomPicker() {
            document.getElementById('customOverlay').classList.remove('show');
        }
        function confirmCustom() {
            var start = document.getElementById('customStart').value;
            var end = document.getElementById('customEnd').value;
            var errEl = document.getElementById('customErr');
            errEl.textContent = '';
            errEl.innerHTML = '';
            if (!start || !end) {
                errEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> 请选择起止日期';
                return;
            }
            if (start > end) {
                errEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> 结束日期不能早于起始日期';
                return;
            }
            if (end > todayStr) {
                errEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> 结束日期不能晚于今天';
                return;
            }
            var fmtDate = function (s) { return s.substring(5); };
            var label = '自定义 ' + fmtDate(start) + ' ~ ' + fmtDate(end);
            currentFilter = { type: 'custom', label: label, from: start, to: end };
            closeCustomPicker();
            closeFilterSheet();
            syncSheetChecks();
            document.getElementById('filterLabel').textContent = label;
            updateBadges();
            renderAll();
        }

        // ============ 初始化 ============
        updateBadges();
        renderAll();

        // 演示下拉刷新
        var startY = 0, pulling = false;
        document.addEventListener('touchstart', function (e) {
            if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; }
        });
        document.addEventListener('touchmove', function (e) {
            if (!pulling) return;
            if (e.touches[0].clientY - startY > 80) {
                pulling = false;
                refreshList();
            }
        });
        document.addEventListener('touchend', function () { pulling = false; });
    </script>
</body>
</html>
