<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>巡查地图 - 品质巡查</title>
    <link rel="stylesheet" href="components/app-common.css">
    <script>
        // 嵌入态探测：作为品质巡查「地图」Tab 内容时，站内链接在外壳顶层打开
        (function () {
            if (/[?&]embedded=1/.test(location.search)) {
                var base = document.createElement('base');
                base.target = '_parent';
                document.head.appendChild(base);
                document.documentElement.classList.add('is-embedded');
            }
        })();
    </script>
    <script src="components/app-common.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 375px;
            min-height: 100vh;
            background: #e9eef3;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            color: #000000d9;
            background: #e9eef3;
            -webkit-tap-highlight-color: transparent;
        }
        button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }

        /* ===== 工作台容器（与用车管理 map-workbench 同源） ===== */
        .workbench {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 0;
            margin: 0 auto;
            overflow: hidden;
            background: #eef2f5;
            box-shadow: 0 24px 70px rgba(20, 40, 70, 0.22);
        }

        /* ===== 地图底图（仿用 map-workbench 风格） ===== */
        .map-shell {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background:
                linear-gradient(115deg, transparent 0 32%, rgba(255,255,255,0.52) 32% 34%, transparent 34%),
                linear-gradient(24deg, transparent 0 45%, rgba(255,255,255,0.45) 45% 47%, transparent 47%),
                linear-gradient(155deg, transparent 0 54%, rgba(255,255,255,0.45) 54% 56%, transparent 56%),
                #dfe6ea;
        }
        .map-grid {
            position: absolute;
            inset: 0;
            opacity: 0.72;
            background-image:
                linear-gradient(rgba(255,255,255,0.48) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.48) 1px, transparent 1px);
            background-size: 56px 56px;
        }
        /* 任务作业区域：淡蓝色填充虚线（PRD 6.1.1-8） */
        .map-zone {
            position: absolute;
            border-radius: 14px;
            background: rgba(22, 119, 255, 0.10);
            border: 2px dashed rgba(22, 119, 255, 0.55);
            color: rgba(22, 119, 255, 0.7);
            font-size: 11px;
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
        }
        .map-zone.is-active {
            background: rgba(22, 119, 255, 0.16);
            border-color: rgba(22, 119, 255, 0.85);
        }
        .map-road {
            position: absolute;
            height: 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.54);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.52);
            transform-origin: left center;
        }
        .map-road.main { left: 0; top: 252px; width: 375px; transform: rotate(34deg); }
        .map-road.secondary { left: 0; top: 456px; width: 375px; transform: rotate(-16deg); opacity: 0.76; }
        .map-road.cross { left: 0; top: 72px; width: 375px; transform: rotate(78deg); opacity: 0.62; }
        /* 轨迹图层 */
        .track-layer {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            z-index: 2;
            overflow: visible;
            pointer-events: none;
        }
        .actual-track {
            fill: none;
            stroke: #ff4d4f;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.92;
            filter: drop-shadow(0 1px 2px rgba(255,77,79,0.28));
        }
        /* 重点点位：橙色 pin，编号居中（PRD 6.1.1-2 / 6.1.1-8） */
        .keypoint {
            position: absolute;
            z-index: 6;
            width: 30px;
            height: 38px;
            transform: translate(-50%, -100%);
            filter: drop-shadow(0 2px 5px rgba(224,98,13,0.32));
            pointer-events: none;
        }
        .keypoint svg { width: 100%; height: 100%; display: block; }
        .keypoint > span {
            position: absolute;
            left: 50%; top: 42%;
            transform: translate(-50%, -50%);
            font-family: "DIN", "SF UI Text", sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        /* 问题点位（PRD 6.1.1-8 / 6.1.1-10） */
        .problem-point {
            position: absolute;
            z-index: 7;
            width: 30px;
            height: 38px;
            padding: 0;
            border: 0;
            background: transparent;
            transform: translate(-50%, -100%);
            filter: drop-shadow(0 2px 5px rgba(20,40,70,0.28));
            transition: transform 0.15s ease;
        }
        .problem-point:active { transform: translate(-50%, -100%) scale(0.92); }
        .problem-pin {
            position: relative;
            width: 26px;
            height: 26px;
            margin: 0 auto;
            border: 2px solid #fff;
            border-radius: 50% 50% 50% 0;
            display: grid;
            place-items: center;
            transform: rotate(-45deg);
        }
        .problem-pin > span { transform: rotate(45deg); color: #fff; font-size: 14px; font-weight: 700; }
        .problem-point--pending .problem-pin { background: #8c8c8c; }
        .problem-point--assigned .problem-pin { background: #1677ff; }
        .problem-point--processing .problem-pin { background: #faad14; }
        .problem-point--done .problem-pin { background: #52c41a; }
        /* 人员位置（非机动车视角：人员而非车辆） */
        .person-marker {
            position: absolute;
            z-index: 8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            border: 2px solid #91d5ff;
            box-shadow: 0 3px 13px rgba(22,119,255,0.35);
            display: grid;
            place-items: center;
            color: #1677ff;
            transition: left 0.42s ease, top 0.42s ease;
        }
        .person-marker::after {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: inherit;
            border: 1px solid rgba(22,119,255,0.35);
            animation: personPulse 1.8s ease-out infinite;
        }
        .person-marker svg { width: 20px; height: 20px; }
        @keyframes personPulse {
            0% { transform: scale(0.7); opacity: 0.55; }
            100% { transform: scale(1.18); opacity: 0; }
        }
        .workbench.sheet-open .person-marker { z-index: 5; }

        /* ===== 顶部导航按钮条（小程序样式：返回 / 更多 / 退出） ===== */
        .top-bar {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 12px;
            z-index: 8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar__btn {
            height: 32px;
            min-width: 32px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 12px rgba(15, 35, 70, 0.12);
            color: #000000d9;
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .top-bar__btn:active { transform: scale(0.92); background: #f5f5f5; }
        .top-bar__btn svg { width: 16px; height: 16px; }
        .top-bar__btn--icon { padding: 0; width: 32px; border-radius: 50%; }
        .top-bar__capsule {
            position: relative;
            width: 88px;
            height: 32px;
            margin-left: auto;
            display: flex;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 4px 12px rgba(15, 35, 70, 0.12);
        }
        .top-bar__mini-action {
            width: 43px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 15px;
            background: transparent;
            color: #1f1f1f;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .top-bar__mini-action:active { transform: scale(0.92); background: #f5f5f5; }
        .top-bar__mini-action svg { width: 20px; height: 20px; }
        .top-bar__capsule-divider {
            width: 1px;
            height: 18px;
            flex: 0 0 1px;
            background: #e8e8e8;
        }
        .top-bar__more-pop {
            position: absolute;
            top: 44px;
            right: 0;
            min-width: 120px;
            padding: 4px 0;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(15, 35, 70, 0.18);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar__more-pop.show { display: flex; }
        .top-bar__more-pop button {
            height: 40px;
            padding: 0 16px;
            border: none;
            background: #ffffff;
            text-align: left;
            font-size: 14px;
            color: #000000d9;
        }
        .top-bar__more-pop button:active { background: #f5f5f5; }

        /* ===== 新任务轻提醒 banner（PRD 6.1.1-9） ===== */
        .task-banner {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 58px;
            z-index: 8;
            min-height: 44px;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 10px 8px 12px;
            border-radius: 10px;
            background: rgba(22, 119, 255, 0.96);
            color: #fff;
            box-shadow: 0 8px 22px rgba(22, 119, 255, 0.28);
            animation: bannerIn 0.3s ease-out;
        }
        .task-banner.show { display: flex; }
        @keyframes bannerIn {
            from { transform: translateY(-12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .task-banner__icon { flex: none; display: grid; place-items: center; }
        .task-banner__icon svg { width: 18px; height: 18px; }
        .task-banner__txt { flex: 1; min-width: 0; font-size: 13px; line-height: 18px; }
        .task-banner__txt strong { font-weight: 600; }
        .task-banner__view {
            flex: none;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            background: rgba(255,255,255,0.22);
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            line-height: 28px;
            border: none;
        }
        .task-banner__view:active { background: rgba(255,255,255,0.35); }

        /* ===== 右侧辅助工具栏（PRD 6.1.1-11） ===== */
        .map-tools {
            position: absolute;
            right: 14px;
            bottom: 256px;
            z-index: 9;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            transition: bottom 0.24s ease, opacity 0.24s ease;
        }
        .workbench.sheet-open .map-tools { opacity: 0; pointer-events: none; }
        .map-shortcut {
            position: relative;
            width: 104px;
            height: 32px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.98);
            color: #1f2937;
            box-shadow: 0 4px 12px rgba(24,39,59,0.14);
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            white-space: nowrap;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .map-shortcut:active { transform: scale(0.97); box-shadow: 0 3px 9px rgba(24,39,59,0.12); }
        .map-shortcut__icon { width: 16px; height: 16px; flex: none; color: #1677ff; }
        .map-shortcut__badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            display: grid;
            place-items: center;
            border: 2px solid #fff;
            border-radius: 8px;
            background: #ff7a45;
            color: #fff;
            font-family: "DIN", "SF UI Text", sans-serif;
            font-size: 10px;
            font-weight: 700;
            line-height: 12px;
        }
        .tool-btn {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.96);
            color: #1677ff;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 13px rgba(0,0,0,0.15);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .tool-btn:active { transform: scale(0.92); }
        .tool-btn svg { width: 20px; height: 20px; }

        /* ===== 左下路线图例 ===== */
        .map-legend {
            position: absolute;
            left: 14px;
            bottom: 232px;
            z-index: 9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: bottom 0.24s ease, opacity 0.24s ease;
        }
        .workbench.sheet-open .map-legend { opacity: 0; pointer-events: none; }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 14px;
            color: #000000d9;
            white-space: nowrap;
        }
        .legend-mark { flex: none; }
        .legend-mark.zone { width: 14px; height: 10px; border: 2px dashed rgba(22,119,255,0.7); border-radius: 3px; background: rgba(22,119,255,0.10); }
        .legend-mark--kp { width: 12px; height: 12px; background: #e0620d; border-radius: 50%; }
        .legend-mark.track { width: 18px; height: 0; border-top: 2px solid #ff4d4f; }
        .legend-mark--person { width: 12px; height: 12px; background: #1677ff; border-radius: 50%; }
        .legend-mark--problem { width: 12px; height: 12px; background: #faad14; border-radius: 50%; }

        /* ===== 底部任务控制台（任务卡片 + 操作按钮） ===== */
        .console {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -6px 24px rgba(15, 35, 70, 0.12);
            transition: transform 0.28s ease-out;
        }
        .console__grip {
            display: flex;
            justify-content: center;
            padding: 8px 0 4px;
        }
        .console__grip-bar {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: #e8e8e8;
        }
        .console__summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 16px 10px;
        }
        .console__summary-title { font-size: 13px; color: #00000073; }
        .console__summary-count { font-family: "DIN", "SF UI Text", sans-serif; font-size: 13px; font-weight: 600; color: #1677ff; }
        .console__summary-toggle {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            color: #1677ff;
            font-size: 12px;
            background: none;
            border: none;
        }
        .console__summary-toggle svg { width: 14px; height: 14px; transition: transform 0.24s ease; }
        .workbench.sheet-open .console__summary-toggle svg { transform: rotate(180deg); }

        /* 任务卡片（对齐用车管理 map-workbench 的 task-line 范式，PRD 6.1.1-2） */
        .task-card { padding: 0 16px 12px; }
        .task-line { display: flex; align-items: center; gap: 8px; }
        .task-line + .task-line { margin-top: 8px; }
        /* 第 1 行：区域名 + 状态 + 任务详情（详情为右上角文字链接，非底部按钮） */
        .task-line-head { justify-content: space-between; }
        .task-title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
        .task-card__area {
            flex: 1; min-width: 0;
            font-size: 16px; font-weight: 700; color: #000000d9; line-height: 22px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .task-head-right { flex: none; display: flex; align-items: center; gap: 8px; }
        .detail-link {
            flex: none; font-size: 12px; line-height: 18px; color: #1677ff;
            text-decoration: none; font-weight: 500; background: none; border: none; padding: 0;
        }
        .detail-link:active { opacity: 0.7; }
        /* 第 2 行：任务类型 + 作业类型 + 计划时间段 */
        .task-card__meta {
            font-size: 12px; line-height: 18px; color: #00000073;
        }
        .task-card__meta .sep { color: #e8e8e8; }
        .task-card__meta .mono { font-family: "DIN", "SF UI Text", sans-serif; color: #000000a6; }
        .task-type-tag {
            flex: none; padding: 3px 7px; border-radius: 6px; background: #e6f4ff; color: #1677ff;
            font-size: 12px; font-weight: 700; white-space: nowrap;
        }
        .work-type-tag {
            flex: none; padding: 3px 7px; border-radius: 6px; background: #e6fffb; color: #08979c;
            font-size: 12px; font-weight: 700; white-space: nowrap;
        }
        /* 状态标签 */
        .tag {
            flex: none; display: inline-flex; align-items: center;
            min-height: 22px; padding: 1px 8px; border-radius: 6px;
            font-size: 12px; font-weight: 700; line-height: 18px;
        }
        .tag--todo { background: #fffbe6; color: #d48806; }
        .tag--running { background: #e6f4ff; color: #1677ff; }
        .tag--done { background: #f6ffed; color: #389e0d; }
        /* 第 3 行：3 列指标卡（对齐用车管理 #f5f8fb 底圆角） */
        .task-kpis {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .task-kpi {
            min-height: 50px; padding: 6px 8px; border-radius: 8px; background: #f5f8fb;
            text-align: center; display: flex; flex-direction: column; justify-content: center;
        }
        .task-kpi__label { font-size: 11px; line-height: 16px; color: #00000073; }
        .task-kpi__value { margin-top: 2px; font-family: "DIN", "SF UI Text", sans-serif; font-size: 14px; line-height: 20px; font-weight: 700; color: #000000d9; }
        .task-kpi__value--link { color: #1677ff; }
        .task-kpi__unit { font-size: 11px; color: #00000073; font-weight: 400; }
        /* 第 4 行：主操作 */
        .task-actions {
            display: grid; grid-template-columns: 1fr;
            padding: 4px 0 0;
        }
        .icon-action, .primary-action {
            height: 46px; border-radius: 12px; border: none;
            display: grid; place-items: center;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .icon-action { border: 1px solid #e8e8e8; background: #ffffff; color: #1677ff; }
        .primary-action {
            background: #1677ff; color: #ffffff; font-size: 16px; font-weight: 700;
            box-shadow: 0 8px 18px rgba(22,119,255,0.28);
        }
        .primary-action:active, .icon-action:active { transform: scale(0.98); opacity: 0.86; }
        .icon-action svg { width: 21px; height: 21px; }

        /* ===== 执行态：地图优先巡查操作台 ===== */
        .task-card.is-executing .task-line-head { margin-bottom: 0; }
        .exec-summary {
            display: flex; align-items: center; gap: 10px; padding: 2px 0 0;
            font-size: 12px; line-height: 18px; color: #00000073;
        }
        .exec-summary .exec-area {
            flex: none; font-size: 16px; font-weight: 700; color: #000000d9; line-height: 22px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%;
        }
        .exec-summary .exec-metrics { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
        .exec-summary .exec-metric { display: inline-flex; align-items: baseline; gap: 2px; white-space: nowrap; }
        .exec-summary .exec-metric .m-label { color: #00000073; }
        .exec-summary .exec-metric .m-val { font-family: "DIN", "SF UI Text", sans-serif; color: #000000d9; font-weight: 700; }
        .exec-summary .sep { color: #e8e8e8; }
        .exec-time {
            flex: none; padding: 4px 9px; border: 1px solid #d9e2ec; border-radius: 6px;
            color: #475569; font-family: "DIN", "SF UI Text", sans-serif; font-size: 13px; font-weight: 600; line-height: 20px;
        }
        .exec-actions {
            display: flex; align-items: center; justify-content: space-between;
            min-height: 122px; padding: 8px 48px 18px;
        }
        .exec-action {
            width: 96px; height: 96px; border: none; border-radius: 50%; color: #ffffff;
            display: grid; place-items: center;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .exec-action:active { opacity: 0.84; transform: scale(0.96); }
        .exec-action__name { display: block; color: inherit; font-size: 16px; font-weight: 700; line-height: 24px; }
        .exec-action--finish { background: #b86f76; box-shadow: 0 0 0 6px rgba(184,111,118,0.12), 0 0 18px 6px rgba(184,111,118,0.28), 0 10px 22px rgba(184,111,118,0.25); }
        .exec-action--report { background: #4b9762; box-shadow: 0 0 0 6px rgba(75,151,98,0.12), 0 0 18px 6px rgba(75,151,98,0.32), 0 10px 22px rgba(75,151,98,0.28); }

        /* ===== 执行态专属地图布局（参照外业巡查全地图操作） ===== */
        .workbench.is-executing .top-card { display: none; }
        .workbench.is-executing .task-banner {
            top: 54px; left: 20px; right: 20px; min-height: 40px; padding: 6px 8px 6px 6px;
            border-radius: 24px; background: rgba(255,255,255,0.96); color: #000000d9;
            box-shadow: 0 5px 16px rgba(24,39,59,0.14);
        }
        .workbench.is-executing .task-banner__icon {
            width: 32px; height: 32px; border-radius: 50%; background: #e6f4ff; color: #1677ff;
        }
        .workbench.is-executing .task-banner__icon svg { width: 17px; height: 17px; }
        .workbench.is-executing .task-banner__txt { font-size: 14px; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .workbench.is-executing .task-banner__view { min-height: 28px; border-radius: 15px; background: #f0f7ff; color: #1677ff; line-height: 28px; }
        .workbench.is-executing .task-banner__view:active { background: #e6f4ff; }
        .workbench.is-executing .map-tools { right: 14px; bottom: 280px; z-index: 10; }
        .workbench.is-executing .tool-btn { width: 40px; height: 40px; color: #526072; }
        .workbench.is-executing .tool-btn svg { width: 20px; height: 20px; }
        .workbench.is-executing .map-legend { display: none; }
        .workbench.is-executing .console {
            display: flex; flex-direction: column; background: transparent; box-shadow: none; border-radius: 0; pointer-events: none; z-index: 12;
        }
        .workbench.is-executing .console__grip,
        .workbench.is-executing .console__summary { display: none; }
        .workbench.is-executing .task-card {
            order: 2; position: relative; padding: 14px 16px 16px; background: #ffffff; border-radius: 0; pointer-events: auto;
        }
        .workbench.is-executing #js-actions {
            order: 1; position: relative; padding: 0; pointer-events: none;
        }
        .workbench.is-executing .exec-actions { height: 122px; pointer-events: none; }
        .workbench.is-executing .exec-action { pointer-events: auto; }

        /* ===== 结束任务确认 ===== */
        .finish-overlay {
            position: absolute; inset: 0; z-index: 30; display: none; align-items: flex-end;
            background: rgba(0, 0, 0, 0.48);
        }
        .finish-overlay.show { display: flex; }
        .finish-dialog {
            width: 100%; padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
            background: #ffffff; border-radius: 16px 16px 0 0;
            animation: finishDialogIn 0.2s ease-out;
        }
        @keyframes finishDialogIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .finish-dialog__grip { width: 36px; height: 4px; margin: 0 auto 18px; border-radius: 2px; background: #e8e8e8; }
        .finish-dialog__title { color: #000000d9; font-size: 18px; font-weight: 700; line-height: 26px; }
        .finish-dialog__desc { margin-top: 5px; color: #00000073; font-size: 13px; line-height: 20px; }
        .finish-check {
            display: flex; align-items: center; gap: 9px; margin: 16px 0;
            padding: 11px 12px; background: #f6ffed; color: #237804; border-radius: 8px;
            font-size: 13px; line-height: 20px;
        }
        .finish-check svg { width: 18px; height: 18px; flex: none; }
        .finish-dialog__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .finish-dialog__button {
            height: 46px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600;
        }
        .finish-dialog__button--cancel { background: #f5f5f5; color: #000000d9; }
        .finish-dialog__button--confirm { background: #ff4d4f; color: #ffffff; }
        .finish-dialog__button:active { opacity: 0.85; }

        /* ===== 今日待办抽屉（PRD 6.1.1-4~7，上拉覆盖地图） ===== */
        .sheet-mask {
            position: absolute;
            inset: 0;
            z-index: 11;
            background: rgba(0,0,0,0.32);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.24s ease, visibility 0.24s;
        }
        .sheet-mask.is-open { opacity: 1; visibility: visible; }
        .sheet {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            z-index: 12;
            max-height: 86%;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            transform: translateY(100%);
            transition: transform 0.28s ease-out;
            display: flex;
            flex-direction: column;
        }
        .sheet.is-open { transform: translateY(0); }
        .sheet__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px 8px;
        }
        .sheet__title { font-size: 15px; font-weight: 600; color: #000000d9; }
        .sheet__close {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 12px;
            color: #1677ff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            background: #fff;
        }
        /* 分组统计（PRD 6.1.1-5） */
        .sheet__stats {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px 10px;
            font-size: 12px;
            color: #00000073;
            border-bottom: 1px solid #f0f0f0;
        }
        .sheet__stats .stat { display: inline-flex; align-items: baseline; gap: 4px; }
        .sheet__stats .stat .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; transform: translateY(-1px); }
        .sheet__stats .stat .num { font-family: "DIN", "SF UI Text", sans-serif; font-size: 14px; font-weight: 600; color: #000000d9; }
        .sheet__body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .sheet__group { padding: 10px 16px 4px; font-size: 12px; color: #00000073; background: #fafafa; }
        .sheet-task {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 16px;
            border-bottom: 1px solid #f5f5f5;
            background: #fff;
            transition: background-color 0.15s;
        }
        .sheet-task:last-child { border-bottom: none; }
        .sheet-task:active { background: #f5f5f5; }
        .sheet-task.is-selected { background: #e6f4ff; }
        .sheet-task.is-selected::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 3px;
            background: #1677ff;
        }
        .sheet-task { position: relative; }
        .sheet-task__r1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .sheet-task__area { font-size: 14px; font-weight: 500; color: #000000d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sheet-task__r2 { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #00000073; flex-wrap: wrap; }
        .sheet-task__r2 .sep { color: #e8e8e8; }
        .sheet-task__r2 .mono { font-family: "DIN", "SF UI Text", sans-serif; }
        .sheet-problem {
            --problem-accent: #ff7a45;
        }
        .problem-sheet-item {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 7px;
            width: 100%;
            padding: 13px 16px;
            border: none;
            border-bottom: 1px solid #f5f5f5;
            background: #fff;
            color: #000000d9;
            text-align: left;
        }
        .problem-sheet-item:active { background: #fff7f2; }
        .problem-sheet-item__r1,
        .problem-sheet-item__r2 { display: flex; align-items: center; min-width: 0; gap: 8px; }
        .problem-sheet-item__no {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: "DIN", "SF UI Text", sans-serif;
            font-size: 14px;
            font-weight: 600;
            line-height: 20px;
        }
        .problem-sheet-item__r2 { color: #00000073; font-size: 12px; line-height: 18px; }
        .problem-sheet-item__location { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .problem-sheet-item__time { flex: none; font-family: "DIN", "SF UI Text", sans-serif; }
        .problem-sheet-item__chevron { width: 16px; height: 16px; flex: none; color: #00000040; }
        .sheet-empty {
            padding: 48px 16px;
            text-align: center;
            color: #00000073;
            font-size: 14px;
        }
        .sheet-empty__icon { margin: 0 auto 12px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: #f5f5f5; color: #bfbfbf; }
        .sheet-empty__icon svg { width: 28px; height: 28px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            max-width: 80%;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 14px;
            line-height: 22px;
            border-radius: 8px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>
<div class="workbench" id="workbench">
    <!-- 地图底图 -->
    <div class="map-shell">
        <div class="map-grid"></div>
        <div class="map-road main"></div>
        <div class="map-road secondary"></div>
        <div class="map-road cross"></div>
        <!-- 任务作业区域（JS 动态填充） -->
        <div id="js-zones"></div>
        <!-- 实际轨迹 -->
        <svg class="track-layer" viewBox="0 0 375 600" preserveAspectRatio="none" id="js-track-layer">
            <path class="actual-track" id="js-track-path" d=""></path>
        </svg>
        <!-- 重点点位 -->
        <div id="js-keypoints"></div>
        <!-- 问题点位 -->
        <div id="js-problems"></div>
        <!-- 人员位置 -->
        <div class="person-marker" id="js-person" style="left:50%;top:55%">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 014 4c0 1.6-1 3-2.5 3.5V20l1 1.5h-5l1-1.5V9.5C10 9 9 7.6 9 6a4 4 0 014-4z"/></svg>
        </div>
    </div>

    <!-- 顶部导航按钮条（小程序样式：返回 / 更多 / 退出） -->
    <div class="top-bar">
        <a href="javascript:void(0)" class="top-bar__btn top-bar__btn--icon" id="js-top-back" aria-label="返回上一页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-bar__capsule">
            <button type="button" class="top-bar__mini-action" id="js-top-more" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="6" cy="14" r="2.2" fill="currentColor"/><circle cx="14" cy="14" r="2.8" fill="currentColor"/><circle cx="22" cy="14" r="2.2" fill="currentColor"/></svg>
            </button>
            <span class="top-bar__capsule-divider" aria-hidden="true"></span>
            <button type="button" class="top-bar__mini-action" id="js-top-exit" aria-label="退出品质巡查">
                <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="9.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="14" cy="14" r="3.25" fill="currentColor"/></svg>
            </button>
            <div class="top-bar__more-pop" id="js-more-pop">
                <button type="button" data-action="today">今日回顾</button>
                <button type="button" data-action="layer">图层设置</button>
                <button type="button" data-action="about">关于</button>
            </div>
        </div>
    </div>

    <!-- 新任务轻提醒 banner -->
    <div class="task-banner" id="js-banner" role="status" aria-live="polite">
        <span class="task-banner__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </span>
        <span class="task-banner__txt" id="js-banner-txt"><strong>巡查任务</strong> 新任务已派发</span>
        <button type="button" class="task-banner__view" id="js-banner-view">查看</button>
    </div>

    <!-- 右侧辅助工具栏 -->
    <div class="map-tools">
        <button type="button" class="map-shortcut" id="js-tool-problem" aria-label="查看今日问题">
            <svg class="map-shortcut__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h3M8 13h3M8 17h3"/><path d="m15 8 1 1 2-2M15 13l1 1 2-2M15 17l1 1 2-2"/></svg>
            <span>今日问题</span>
            <span class="map-shortcut__badge" id="js-problem-badge">0</span>
        </button>
        <button type="button" class="map-shortcut" id="js-map-tasks" aria-label="查看今日任务">
            <svg class="map-shortcut__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 13h8M8 17h5"/><path d="m5.5 8 .8.8 1.7-1.7"/><path d="m5.5 13 .8.8 1.7-1.7"/><path d="m5.5 17 .8.8 1.7-1.7"/></svg>
            <span>今日任务</span>
            <span class="map-shortcut__badge" id="js-map-task-count">0</span>
        </button>
        <button type="button" class="tool-btn" id="js-tool-reset" aria-label="复位">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button type="button" class="tool-btn" id="js-tool-layer" aria-label="图层">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </button>
    </div>

    <!-- 左下路线图例 -->
    <div class="map-legend" id="js-legend">
        <div class="legend-item"><span class="legend-mark zone"></span>任务作业区域</div>
        <div class="legend-item"><span class="legend-mark--kp"></span>重点点位</div>
        <div class="legend-item"><span class="legend-mark track"></span>实际轨迹</div>
        <div class="legend-item"><span class="legend-mark--person"></span>人员位置</div>
        <div class="legend-item"><span class="legend-mark--problem"></span>问题点位</div>
    </div>

    <!-- 底部任务控制台 -->
    <div class="console" id="js-console">
        <div class="console__grip" id="js-grip"><div class="console__grip-bar"></div></div>
        <!-- 任务卡片正文（JS 动态填充） -->
        <div class="task-card" id="js-task-card"></div>
        <!-- 操作按钮区（JS 动态填充） -->
        <div id="js-actions"></div>
    </div>

    <!-- 今日待办抽屉 -->
    <div class="sheet-mask" id="js-sheet-mask"></div>
    <div class="sheet" id="js-sheet" role="dialog" aria-modal="true" aria-label="今日待办任务清单">
        <div class="sheet__head">
            <span class="sheet__title">今日待办任务</span>
            <button type="button" class="sheet__close" id="js-sheet-close">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                <span>收起</span>
            </button>
        </div>
        <div class="sheet__stats" id="js-sheet-stats"></div>
        <div class="sheet__body" id="js-sheet-body"></div>
    </div>

    <!-- 今日问题抽屉 -->
    <div class="sheet-mask" id="js-problem-sheet-mask"></div>
    <div class="sheet sheet-problem" id="js-problem-sheet" role="dialog" aria-modal="true" aria-label="今日问题清单">
        <div class="sheet__head">
            <span class="sheet__title">今日问题</span>
            <button type="button" class="sheet__close" id="js-problem-sheet-close">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                <span>收起</span>
            </button>
        </div>
        <div class="sheet__stats" id="js-problem-sheet-stats"></div>
        <div class="sheet__body" id="js-problem-sheet-body"></div>
    </div>

    <!-- 结束任务确认 -->
    <div class="finish-overlay" id="js-finish-overlay" role="dialog" aria-modal="true" aria-labelledby="js-finish-title">
        <div class="finish-dialog">
            <div class="finish-dialog__grip"></div>
            <div class="finish-dialog__title" id="js-finish-title">确认结束任务</div>
            <div class="finish-dialog__desc" id="js-finish-desc">结束后将停止记录本次巡查轨迹。</div>
            <div class="finish-check">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 4 4L19 6"/></svg>
                <span>任务完成情况校验通过</span>
            </div>
            <div class="finish-dialog__actions">
                <button type="button" class="finish-dialog__button finish-dialog__button--cancel" id="js-finish-cancel">继续巡查</button>
                <button type="button" class="finish-dialog__button finish-dialog__button--confirm" id="js-finish-confirm">确认结束</button>
            </div>
        </div>
    </div>

    <input type="file" id="js-camera-input" accept="image/*" capture="environment" hidden>

    <!-- Toast -->
    <div class="toast" id="js-toast"></div>
</div>

<script>
(function () {
    'use strict';

    /* ===== 演示任务数据（巡查员-非机动车视角） ===== */
    var TASKS = [
        { id: 'I001', area: '滨江路东段', status: 'done', type: '巡查任务', workType: '路面质检', time: '08:00-10:00', start: '08:02', mileage: 9.42, duration: 118, problems: 2,

        },
        { id: 'I002', area: '中央广场片区', status: 'todo', type: '巡查任务', workType: '路面质检', time: '10:30-12:00', start: null, mileage: null, duration: null, problems: 0,
          zone: { left: '42%', top: '40%', width: '38%', height: '32%' },

        },
        { id: 'I003', area: '解放南路沿线', status: 'todo', type: '巡查任务', workType: '路面质检', time: '13:30-15:00', start: null, mileage: null, duration: null, problems: 0,
          zone: { left: '10%', top: '52%', width: '50%', height: '26%' },
          points: [{ name: '解放南路1号桥', left: '22%', top: '62%' }, { name: '文昌路口', left: '48%', top: '68%' }],
          track: '',

        },
        { id: 'I004', area: '人民东路-文昌路', status: 'todo', type: '巡查任务', workType: '路面质检', time: '15:30-17:00', start: null, mileage: null, duration: null, problems: 0,
          zone: { left: '40%', top: '14%', width: '42%', height: '24%' },
          points: [{ name: '人民东路跨线桥', left: '52%', top: '22%' }, { name: '文昌路小学', left: '68%', top: '28%' }],
          track: '',
          person: { left: '50%', top: '24%' },
          problemsList: []
        }
    ];

    var STATUS_TAG = { done: 'tag--done', running: 'tag--running', todo: 'tag--todo' };
    var STATUS_TEXT = { done: '已完成', running: '进行中', todo: '待开始' };
    var PROB_TAG = { done: 'tag--done', pending: 'tag--todo', processing: 'tag--running', assigned: 'tag--running' };

    // 状态持久化（与车机端 car-common 一致思路，独立键避免污染用车管理）
    var STATE_KEY = 'kuwash-inspection-state';
    function loadState() {
        try { return JSON.parse(sessionStorage.getItem(STATE_KEY) || '{}'); } catch (e) { return {}; }
    }
    function saveState(s) {
        try { sessionStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
    }
    var state = loadState();
    // 用持久化执行数据覆盖默认任务状态
    TASKS.forEach(function (t) {
        var saved = state[t.id];
        if (!saved || !saved.status) return;
        t.status = saved.status;
        if (saved.status === 'running') {
            t.start = saved.start || '10:31';
            t.mileage = saved.mileage === undefined || saved.mileage === null ? 0.01 : saved.mileage;
            t.duration = saved.duration === undefined || saved.duration === null ? 1 : saved.duration;
        }
    });

    // 选中的任务：优先 URL 指定 → 进行中 → 待开始 → 第一条
    var params = new URLSearchParams(location.search);
    var requestedId = params.get('task');
    var action = params.get('action');
    var initialSheet = params.get('sheet');
    var selectedId = (TASKS.find(function (t) { return t.id === requestedId; }) ||
        TASKS.find(function (t) { return t.status === 'running'; }) ||
        TASKS.find(function (t) { return t.status === 'todo'; }) ||
        TASKS[0]).id;

    function findTask(id) { return TASKS.find(function (t) { return t.id === id; }) }
    function fmt(v, suffix, dash) { return v === null || v === undefined ? (dash || '—') : (v + (suffix || '')); }
    function groupOrder(s) { return s === 'todo' ? 0 : (s === 'running' ? 1 : 2); }
    function sortedTasks() {
        return TASKS.slice().sort(function (a, b) {
            if (groupOrder(a.status) !== groupOrder(b.status)) return groupOrder(a.status) - groupOrder(b.status);
            return a.time < b.time ? -1 : 1;
        });
    }
    function countBy() {
        var c = { todo: 0, running: 0, done: 0 };
        TASKS.forEach(function (t) { c[t.status]++; });
        return c;
    }
    function todayProblems() {
        var list = [];
        TASKS.forEach(function (task) {
            task.problemsList.forEach(function (p) { list.push(Object.assign({}, p, { taskId: task.id, taskArea: task.area })); });
        });
        return list;
    }
    function openProblemDetail(problemId, taskId) {
        var target = 'inspection-problem-detail.html?problem=' + encodeURIComponent(problemId) + '&task=' + encodeURIComponent(taskId || '');
        if (window.parent && window.parent !== window) {
            window.parent.location.href = target;
        } else {
            window.location.href = target;
        }
    }

    /* ===== Toast ===== */
    var toastTimer = null;
    function toast(msg) {
        var el = document.getElementById('js-toast');
        el.textContent = msg;
        el.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    /* ===== 地图渲染 ===== */
    function renderMap(t) {
        // 作业区域
        var zonesEl = document.getElementById('js-zones');
        zonesEl.innerHTML = '<span class="map-zone is-active" style="left:' + t.zone.left + ';top:' + t.zone.top + ';width:' + t.zone.width + ';height:' + t.zone.height + '">' + t.area + '</span>';
        // 轨迹
        var trackPath = document.getElementById('js-track-path');
        trackPath.setAttribute('d', t.track || '');
        document.getElementById('js-track-layer').style.display = t.track ? '' : 'none';
        // 重点点位
        var kpEl = document.getElementById('js-keypoints');
        kpEl.innerHTML = t.points.map(function (p, idx) {
            return '<span class="keypoint" style="left:' + p.left + ';top:' + p.top + '" title="' + p.name + '"><svg viewBox="0 0 1024 1024" aria-hidden="true"><path d="M512 0C229.2 0 0 229.2 0 512c0 229.2 512 819.2 512 819.2S1024 741.2 1024 512C1024 229.2 794.8 0 512 0z" fill="#e0620d"/></svg><span>' + (idx + 1) + '</span></span>';
        }).join('');
        // 问题点位（执行中/已完成展示）
        var probEl = document.getElementById('js-problems');
        if (t.problemsList && t.problemsList.length && (t.status === 'running' || t.status === 'done')) {
            probEl.innerHTML = t.problemsList.map(function (p) {
                if (!p.point) return '';
                return '<button type="button" class="problem-point problem-point--' + p.status + '" data-id="' + p.id + '" style="left:' + p.point.left + ';top:' + p.point.top + '" title="' + p.no + ' · ' + p.statusText + '"><span class="problem-pin"><span>!</span></span></button>';
            }).join('');
            probEl.querySelectorAll('.problem-point').forEach(function (el) {
                el.addEventListener('click', function () { openProblemDetail(el.dataset.id, t.id); });
            });
        } else {
            probEl.innerHTML = '';
        }
        // 人员位置
        var person = document.getElementById('js-person');
        person.style.left = t.person.left;
        person.style.top = t.person.top;
    }

    /* ===== 任务卡片渲染（PRD 6.1.1-2） ===== */
    function renderTaskCard(t) {
        var card = document.getElementById('js-task-card');
        var actionsEl = document.getElementById('js-actions');
        var workbench = document.getElementById('workbench');

        // 执行态：沿用待开始的完整多行卡片，底部使用独立巡查操作台（结束任务 / 问题上报）
        if (t.status === 'running') {
            workbench.classList.add('is-executing');
            card.classList.add('is-executing');
            var html =
                '<div class="task-line task-line-head">' +
                    '<div class="task-title-wrap">' +
                        '<span class="task-card__area">' + t.area + '</span>' +
                        '<span class="tag ' + STATUS_TAG[t.status] + '">' + STATUS_TEXT[t.status] + '</span>' +
                    '</div>' +
                    '<div class="task-head-right">' +
                        '<button type="button" class="detail-link" id="js-btn-detail">详情</button>' +
                    '</div>' +
                '</div>' +
                '<div class="task-line task-card__meta">' +
                    '<span class="task-type-tag">' + t.type + '</span>' +
                    '<span class="work-type-tag">' + t.workType + '</span>' +
                    '<span class="mono">' + t.time + '</span>' +
                '</div>' +
                '<div class="task-line task-kpis">' +
                    '<div class="task-kpi"><span class="task-kpi__label">开始时间</span><span class="task-kpi__value">' + fmt(t.start, '', '—') + '</span></div>' +
                    '<div class="task-kpi"><span class="task-kpi__label">作业里程</span><span class="task-kpi__value">' + fmt(t.mileage, '', '—') + '<span class="task-kpi__unit"> km</span></span></div>' +
                    '<div class="task-kpi"><span class="task-kpi__label">作业时长</span><span class="task-kpi__value">' + fmt(t.duration, '', '—') + '<span class="task-kpi__unit"> min</span></span></div>' +
                '</div>';
            card.innerHTML = html;
            document.getElementById('js-btn-detail').addEventListener('click', function () { toast('任务详情页本期暂未开放'); });
            actionsEl.innerHTML = '<div class="exec-actions">' +
                '<button type="button" class="exec-action exec-action--finish" id="js-btn-finish" aria-label="结束任务">' +
                    '<span class="exec-action__name">结束任务</span>' +
                '</button>' +
                '<button type="button" class="exec-action exec-action--report" id="js-btn-report" aria-label="问题上报，拍照取证">' +
                    '<span class="exec-action__name">问题上报</span>' +
                '</button>' +
            '</div>';
            document.getElementById('js-btn-report').addEventListener('click', function () { openReportCapture(t); });
            document.getElementById('js-btn-finish').addEventListener('click', function () { requestFinish(t); });
            return;
        }

        // 待开始 / 已完成：完整多行任务卡片（对齐用车管理 task-line 范式）
        workbench.classList.remove('is-executing');
        card.classList.remove('is-executing');
        var html =
            '<div class="task-line task-line-head">' +
                '<div class="task-title-wrap">' +
                    '<span class="task-card__area">' + t.area + '</span>' +
                    '<span class="tag ' + STATUS_TAG[t.status] + '">' + STATUS_TEXT[t.status] + '</span>' +
                '</div>' +
                '<div class="task-head-right">' +
                    '<button type="button" class="detail-link" id="js-btn-detail">详情</button>' +
                '</div>' +
            '</div>' +
            '<div class="task-line task-card__meta">' +
                '<span class="task-type-tag">' + t.type + '</span>' +
                '<span class="work-type-tag">' + t.workType + '</span>' +
                '<span class="mono">' + t.time + '</span>' +
            '</div>';
        // 已完成展示指标卡（3 列：开始时间/作业里程/作业时长；问题上报作为第4项以链接形式附在第3卡或单独）
        if (t.status === 'done') {
            html += '<div class="task-line task-kpis">' +
                '<div class="task-kpi"><span class="task-kpi__label">开始时间</span><span class="task-kpi__value">' + fmt(t.start, '', '—') + '</span></div>' +
                '<div class="task-kpi"><span class="task-kpi__label">作业里程</span><span class="task-kpi__value">' + fmt(t.mileage, '', '—') + '<span class="task-kpi__unit"> km</span></span></div>' +
                '<div class="task-kpi"><span class="task-kpi__label">作业时长</span><span class="task-kpi__value">' + fmt(t.duration, '', '—') + '<span class="task-kpi__unit"> min</span></span></div>' +
            '</div>';
        }
        card.innerHTML = html;
        document.getElementById('js-btn-detail').addEventListener('click', function () { toast('任务详情页本期暂未开放'); });

        // 操作行：任务列表入口已移至地图右侧“今日任务”按钮。
        if (t.status === 'todo') {
            actionsEl.innerHTML = '<div class="task-actions"><button type="button" class="primary-action" id="js-btn-start">开始任务</button></div>';
            document.getElementById('js-btn-start').addEventListener('click', function () { onStart(t); });
        } else { // done
            actionsEl.innerHTML = '<div class="task-actions"><button type="button" class="primary-action" style="background:#f5f5f5;color:#00000040;box-shadow:none;">已完成</button></div>';
        }
    }

    /* ===== 开始任务校验链（PRD 6.1.1-3） ===== */
    function onStart(t) {
        // 1. 时间范围校验（阻断项）—— 静态原型：以当前是否早于开始时间模拟
        // 2. 其他进行中任务校验（阻断项）
        var running = TASKS.find(function (x) { return x.status === 'running'; });
        if (running && running.id !== t.id) {
            toast('当前存在进行中任务');
            selectedId = running.id;
            renderAll();
            return;
        }
        // 3. 人员位置是否在路段范围（阻断项）—— 静态原型 mock 通过
        // 校验通过
        t.start = nowHHMM();
        t.mileage = 0.01;
        t.duration = 1;
        setStateStatus(t.id, 'running');
        toast('任务已开始');
        renderAll();
    }

    /* ===== 问题上报：先拍照，再进入上报页 ===== */
    var pendingReportTaskId = null;
    var cameraInput = document.getElementById('js-camera-input');
    function openReportCapture(t) {
        pendingReportTaskId = t.id;
        cameraInput.value = '';
        cameraInput.click();
    }
    cameraInput.addEventListener('change', function () {
        var file = cameraInput.files && cameraInput.files[0];
        var task = findTask(pendingReportTaskId);
        if (!file || !task) return;
        var reader = new FileReader();
        reader.onload = function () {
            try { sessionStorage.setItem('kuwash-inspection-report-photo', reader.result); } catch (e) {}
            openReportForm(task);
        };
        reader.readAsDataURL(file);
    });
    function openReportForm(t) {
        var target = 'inspection-problem-report.html?task=' + encodeURIComponent(t.id) + '&captured=1';
        if (window.parent && window.parent !== window) {
            window.parent.location.href = target;
        } else {
            window.location.href = target;
        }
    }

    /* ===== 结束任务：完成校验通过后，二次确认 ===== */
    var pendingFinishTaskId = null;
    function requestFinish(t) {
        if (!t || t.status !== 'running') {
            toast('当前任务状态不可结束');
            return;
        }
        pendingFinishTaskId = t.id;
        document.getElementById('js-finish-desc').textContent = '结束“' + t.area + '”后将停止记录本次巡查轨迹。';
        document.getElementById('js-finish-overlay').classList.add('show');
    }
    function closeFinishConfirm() {
        pendingFinishTaskId = null;
        document.getElementById('js-finish-overlay').classList.remove('show');
    }

    /* ===== 结束任务 → 今日回顾（本期跳占位，PRD 5.1） ===== */
    function onFinish(t) {
        // 静态原型中，任务完成校验已在确认层展示为通过。
        setStateStatus(t.id, 'done');
        var nextTodo = TASKS.find(function (x) { return x.status === 'todo'; });
        if (nextTodo) {
            selectedId = nextTodo.id;
            toast('已结束当前任务，已自动推送下一条');
            renderAll();
        } else {
            // 今日任务均已完成 → 跳转今日回顾（本期占位）
            // 嵌入态需顶到外壳层跳转（base target=_parent 只对链接点击生效，location.href 需显式指定 parent）
            toast('今日任务均已完成，进入今日回顾');
            var target = 'placeholder.html?from=inspection-today-review&title=' + encodeURIComponent('今日回顾');
            setTimeout(function () {
                if (window.parent && window.parent !== window) {
                    window.parent.location.href = target;
                } else {
                    location.href = target;
                }
            }, 600);
        }
    }

    function setStateStatus(id, status) {
        state[id] = state[id] || {};
        state[id].status = status;
        var t = findTask(id);
        if (t) {
            t.status = status;
            state[id].start = t.start;
            state[id].mileage = t.mileage;
            state[id].duration = t.duration;
        }
        saveState(state);
    }
    function nowHHMM() {
        // 脚本环境不可用 Date.now/new Date，用静态占位（演示数据已含真实时间）
        return '10:31';
    }

    /* ===== 今日待办抽屉（PRD 6.1.1-4~7） ===== */
    function renderSheetStats() {
        var c = countBy();
        document.getElementById('js-sheet-stats').innerHTML =
            '<span class="stat"><span class="dot" style="background:#faad14"></span>未完成 <span class="num">' + c.todo + '</span></span>' +
            '<span class="stat"><span class="dot" style="background:#52c41a"></span>进行中 <span class="num">' + c.running + '</span></span>' +
            '<span class="stat"><span class="dot" style="background:#1677ff"></span>已完成 <span class="num">' + c.done + '</span></span>';
    }
    function renderSheetBody() {
        var body = document.getElementById('js-sheet-body');
        var sorted = sortedTasks();
        if (!sorted.length) {
            body.innerHTML = '<div class="sheet-empty"><div class="sheet-empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg></div>暂无今日待办任务</div>';
            return;
        }
        var groups = [{ key: 'todo', label: '未开始' }, { key: 'running', label: '进行中' }, { key: 'done', label: '已完成' }];
        var html = '';
        var lastGroup = null;
        sorted.forEach(function (t) {
            if (t.status !== lastGroup) {
                var g = groups.find(function (x) { return x.key === t.status; });
                html += '<div class="sheet__group">' + g.label + '</div>';
                lastGroup = t.status;
            }
            html += '<div class="sheet-task' + (t.id === selectedId ? ' is-selected' : '') + '" data-id="' + t.id + '">' +
                '<div class="sheet-task__r1"><span class="sheet-task__area">' + t.area + '</span>' +
                '<span class="tag ' + STATUS_TAG[t.status] + '">' + STATUS_TEXT[t.status] + '</span></div>' +
                '<div class="sheet-task__r2"><span>' + t.type + '</span><span class="sep">·</span><span>' + t.workType + '</span><span class="sep">·</span><span class="mono">' + t.time + '</span></div>' +
            '</div>';
        });
        body.innerHTML = html;
        body.querySelectorAll('.sheet-task').forEach(function (el) {
            el.addEventListener('click', function () {
                selectedId = el.dataset.id;
                closeSheet();
                renderAll();
            });
        });
    }
    function openSheet() {
        renderSheetStats();
        renderSheetBody();
        document.getElementById('js-sheet').classList.add('is-open');
        document.getElementById('js-sheet-mask').classList.add('is-open');
        document.getElementById('workbench').classList.add('sheet-open');
    }
    function closeSheet() {
        document.getElementById('js-sheet').classList.remove('is-open');
        document.getElementById('js-sheet-mask').classList.remove('is-open');
        document.getElementById('workbench').classList.remove('sheet-open');
    }

    /* ===== 今日问题抽屉 ===== */
    function renderProblemSheetStats() {
        var problems = todayProblems();
        var done = problems.filter(function (p) { return p.status === 'done'; }).length;
        var processing = problems.filter(function (p) { return p.status === 'processing' || p.status === 'assigned'; }).length;
        var pending = problems.length - done - processing;
        document.getElementById('js-problem-sheet-stats').innerHTML =
            '<span class="stat"><span class="dot" style="background:#ff7a45"></span>今日上报 <span class="num">' + problems.length + '</span></span>' +
            '<span class="stat"><span class="dot" style="background:#faad14"></span>待处理 <span class="num">' + (pending + processing) + '</span></span>' +
            '<span class="stat"><span class="dot" style="background:#52c41a"></span>已完成 <span class="num">' + done + '</span></span>';
    }
    function renderProblemSheetBody() {
        var body = document.getElementById('js-problem-sheet-body');
        var problems = todayProblems().sort(function (a, b) { return (b.reportedAt || '').localeCompare(a.reportedAt || ''); });
        if (!problems.length) {
            body.innerHTML = '<div class="sheet-empty"><div class="sheet-empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 19a2 2 0 0 0 1.75 3h14.5A2 2 0 0 0 21 19L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg></div>暂无今日上报问题</div>';
            return;
        }
        body.innerHTML = problems.map(function (p) {
            return '<button type="button" class="problem-sheet-item" data-id="' + p.id + '" data-task-id="' + p.taskId + '">' +
                '<span class="problem-sheet-item__r1"><span class="problem-sheet-item__no">' + p.no + '</span><span class="tag ' + (PROB_TAG[p.status] || 'tag--todo') + '">' + p.statusText + '</span><svg class="problem-sheet-item__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></span>' +
                '<span class="problem-sheet-item__r2"><span class="problem-sheet-item__location">' + p.loc + '</span><span class="problem-sheet-item__time">' + (p.reportedAt || '—') + '</span></span>' +
            '</button>';
        }).join('');
        body.querySelectorAll('.problem-sheet-item').forEach(function (el) {
            el.addEventListener('click', function () {
                openProblemDetail(el.dataset.id, el.dataset.taskId);
            });
        });
    }
    function openProblemSheet() {
        closeSheet();
        renderProblemSheetStats();
        renderProblemSheetBody();
        document.getElementById('js-problem-sheet').classList.add('is-open');
        document.getElementById('js-problem-sheet-mask').classList.add('is-open');
        document.getElementById('workbench').classList.add('sheet-open');
    }
    function closeProblemSheet() {
        document.getElementById('js-problem-sheet').classList.remove('is-open');
        document.getElementById('js-problem-sheet-mask').classList.remove('is-open');
        document.getElementById('workbench').classList.remove('sheet-open');
    }

    /* ===== 顶部统计 + 控制台计数 ===== */
    function renderSummary() {
        var c = countBy();
        var problemCount = todayProblems().length;
        document.getElementById('js-problem-badge').textContent = problemCount;
        document.getElementById('js-map-task-count').textContent = TASKS.length;
    }

    function renderAll() {
        var t = findTask(selectedId) || TASKS[0];
        renderMap(t);
        renderTaskCard(t);
        renderSummary();
        notifyExecutionShell(t.status === 'running');
    }

    function notifyExecutionShell(executing) {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'inspectionExecuting', value: executing }, '*');
        }
    }

    /* ===== 事件绑定 ===== */
    document.getElementById('js-grip').addEventListener('click', openSheet);
    document.getElementById('js-sheet-close').addEventListener('click', closeSheet);
    document.getElementById('js-sheet-mask').addEventListener('click', closeSheet);
    document.getElementById('js-map-tasks').addEventListener('click', openSheet);
    document.getElementById('js-tool-problem').addEventListener('click', openProblemSheet);
    document.getElementById('js-problem-sheet-close').addEventListener('click', closeProblemSheet);
    document.getElementById('js-problem-sheet-mask').addEventListener('click', closeProblemSheet);
    document.getElementById('js-finish-cancel').addEventListener('click', closeFinishConfirm);
    document.getElementById('js-finish-confirm').addEventListener('click', function () {
        var task = findTask(pendingFinishTaskId);
        closeFinishConfirm();
        if (task) onFinish(task);
    });
    document.getElementById('js-finish-overlay').addEventListener('click', function (event) {
        if (event.target === this) closeFinishConfirm();
    });
    // 返回按钮：对齐用车管理 go('home.html')，嵌入态顶到外壳层直接退回工作台
    function goBack(url) {
        url = url || 'home.html';
        if (window.parent && window.parent !== window.self) {
            window.parent.location.href = url;
        } else {
            window.location.href = url;
        }
    }
    document.getElementById('js-top-back').addEventListener('click', function () { goBack('home.html'); });
    /* ===== 顶部：更多弹出菜单 + 退出 ===== */
    var moreBtn = document.getElementById('js-top-more');
    var morePop = document.getElementById('js-more-pop');
    moreBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        morePop.classList.toggle('show');
        moreBtn.setAttribute('aria-expanded', morePop.classList.contains('show') ? 'true' : 'false');
    });
    document.addEventListener('click', function () {
        morePop.classList.remove('show');
        moreBtn.setAttribute('aria-expanded', 'false');
    });
    morePop.addEventListener('click', function (e) {
        var action = e.target.getAttribute('data-action');
        if (!action) return;
        morePop.classList.remove('show');
        moreBtn.setAttribute('aria-expanded', 'false');
        if (action === 'today') { toast('今日回顾将在全部任务完成后展示'); }
        else if (action === 'layer') { toast('辅助设施图层已切换'); }
        else if (action === 'about') { toast('品质巡查 v1.0'); }
    });
    document.getElementById('js-top-exit').addEventListener('click', function () {
        // 退出：优先通知外层 management 页做进行中任务校验，否则直接回首页
        try {
            if (window.parent && window.parent !== window && typeof window.parent.requestExit === 'function') {
                window.parent.requestExit();
                return;
            }
        } catch (err) {}
        goBack('home.html');
    });
    document.getElementById('js-tool-reset').addEventListener('click', function () { toast('已复位至当前位置'); var t = findTask(selectedId); if (t) { var p = document.getElementById('js-person'); p.style.left = t.person.left; p.style.top = t.person.top; } });
    document.getElementById('js-tool-layer').addEventListener('click', function () { toast('辅助设施图层已切换'); });
    document.getElementById('js-banner-view').addEventListener('click', function () { closeBanner(); openSheet(); });

    /* ===== 新任务轻提醒 banner（PRD 6.1.1-9，静态演示） ===== */
    var bannerTimer = null;
    function showBanner() {
        document.getElementById('js-banner').classList.add('show');
        // PRD：默认显示 1min；演示缩短为 6s
        bannerTimer = setTimeout(closeBanner, 6000);
    }
    function closeBanner() {
        document.getElementById('js-banner').classList.remove('show');
        if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
    }

    /* ===== 嵌入态：响应外壳 queryExecuting（退出校验） ===== */
    window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type === 'queryExecuting') {
            var executing = TASKS.some(function (t) { return t.status === 'running'; });
            try {
                event.source.postMessage({ type: 'executingStatus', value: executing }, '*');
            } catch (e) {}
        }
    });

    /* ===== 项目切换联动（PRD：数据随项目刷新） ===== */
    document.addEventListener('projectChanged', function () {
        toast('项目已切换，任务列表已刷新');
        renderAll();
    });

    /* ===== 初始化 ===== */
    renderAll();
    if (initialSheet === 'problems') {
        setTimeout(openProblemSheet, 0);
    }
    // 若 URL 指定 action=start，自动触发开始
    if (action === 'start') {
        var t0 = findTask(selectedId);
        if (t0 && t0.status === 'todo') { setTimeout(function () { onStart(t0); }, 300); }
    }
    // 演示：加载后延时弹一次新任务 banner
    setTimeout(showBanner, 1800);
})();
</script>
</body>
</html>
