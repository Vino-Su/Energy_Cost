<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>巡查地图 - 品质巡查</title>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script>
        // 嵌入态探测：作为品质巡查「地图」Tab 内容时，站内链接在外壳顶层打开
        (function () {
            if (/[?&]embedded=1/.test(location.search)) {
                var base = document.createElement('base');
                base.target = '_parent';
                document.head.appendChild(base);
                document.documentElement.classList.add('is-embedded');
            }
        })();
    </script>
    <script src="components/app-common.js"></script>
    <script src="components/vehicle-demo-state.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 375px;
            min-height: 100vh;
            background: #e9eef3;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            color: #000000d9;
            background: #e9eef3;
            -webkit-tap-highlight-color: transparent;
        }
        button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }

        /* ===== 工作台容器（与用车管理 map-workbench 同源） ===== */
        .workbench {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 0;
            margin: 0 auto;
            overflow: hidden;
            background: #eef2f5;
            box-shadow: 0 24px 70px rgba(20, 40, 70, 0.22);
        }

        /* ===== 地图底图（仿用 map-workbench 风格） ===== */
        .map-shell {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background:
                linear-gradient(115deg, transparent 0 32%, rgba(255,255,255,0.52) 32% 34%, transparent 34%),
                linear-gradient(24deg, transparent 0 45%, rgba(255,255,255,0.45) 45% 47%, transparent 47%),
                linear-gradient(155deg, transparent 0 54%, rgba(255,255,255,0.45) 54% 56%, transparent 56%),
                #dfe6ea;
        }

        /* ===== Leaflet 地图（替代上方 SVG/伪底图方案） ===== */
        .map-shell.is-leaflet { background: #edf2f5; }
        .insp-leaflet-map { position: absolute; inset: 0; z-index: 0; background: #edf2f5; font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif; }
        .insp-map-fallback { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center; padding: 24px; background: #edf2f5; color: #00000073; font-size: 14px; text-align: center; }
        .insp-map-fallback.is-visible { display: flex; }
        /* Leaflet 成功后隐藏旧 SVG/伪底图层（DOM 保留作降级备份） */
        .map-shell.is-leaflet > .map-grid,
        .map-shell.is-leaflet > .map-road,
        .map-shell.is-leaflet > #js-zones,
        .map-shell.is-leaflet > .track-layer,
        .map-shell.is-leaflet > #js-problems,
        .map-shell.is-leaflet > .person-marker { display: none !important; }
        /* Leaflet 控件与瓦片视觉调整 */
        .insp-leaflet-map .leaflet-control-zoom { border: 0 !important; box-shadow: 0 2px 8px rgba(20,40,70,0.16); margin-top: 56px !important; margin-right: 14px !important; }
        .insp-leaflet-map .leaflet-control-zoom a { width: 36px; height: 36px; line-height: 34px; color: #000000d9; font-size: 20px; border-radius: 8px !important; }
        .insp-leaflet-map .leaflet-control-zoom a:first-child { border-bottom-left-radius: 0 !important; border-bottom-right-radius: 0 !important; }
        .insp-leaflet-map .leaflet-control-zoom a:last-child { border-top: 1px solid #f0f0f0; border-top-left-radius: 0 !important; border-top-right-radius: 0 !important; }
        .insp-leaflet-map .leaflet-control-attribution { padding: 2px 5px; background: rgba(255,255,255,0.86); color: #00000073; font-size: 10px; }
        .insp-leaflet-map .leaflet-control-attribution a { color: #1677ff; }
        .insp-leaflet-map .leaflet-marker-icon { border: 0; background: transparent; }
        .insp-leaflet-map .leaflet-tile-pane { filter: saturate(0.8) contrast(0.96) brightness(1.03); }
        /* Leaflet marker 视觉（巡查端：蓝色人员 / 状态色问题点 / 胶囊设施） */
        .insp-map-marker { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; font-family: "DIN", "SF UI Text", sans-serif; }
        .insp-leaflet-map .leaflet-marker-icon.insp-map-marker--person { width: 40px; height: 40px; border: 2px solid #fff; border-radius: 50%; background: #52c41a; color: #fff; box-shadow: 0 3px 13px rgba(82,196,26,0.4); display: grid; place-items: center; }
        .insp-map-marker--person svg { width: 20px; height: 20px; }
        .insp-map-marker--person::after { content: ""; position: absolute; inset: -9px; border-radius: inherit; border: 1px solid rgba(82,196,26,0.4); animation: personPulse 1.8s ease-out infinite; }
        .insp-map-marker--problem { width: 22px; height: 22px; border: 0; background: transparent; transform: translate(-50%, -50%); }
        .insp-map-marker--problem .problem-pin { position: relative; width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; background: var(--insp-problem-color, #1677ff); box-shadow: 0 2px 6px rgba(20,40,70,0.32); }
        .insp-map-marker--problem.is-selected .problem-pin { box-shadow: 0 0 0 5px #e6f4ff, 0 3px 9px rgba(20,40,70,0.4); transform: scale(1.18); }
        /* Leaflet 模式下 .is-selected 加在外层 marker div 上，补一条等价光晕 */
        .leaflet-marker-icon.is-selected .problem-pin { box-shadow: 0 0 0 5px #e6f4ff, 0 3px 9px rgba(20,40,70,0.4); transform: scale(1.18); }
        .insp-map-marker--facility { min-width: 72px; height: 30px; gap: 5px; padding: 0 8px; border: 1px solid #dfe5ec; border-radius: 4px; background: #ffffff; color: #000000d9; box-shadow: 0 2px 6px rgba(20,40,70,0.16); font-size: 12px; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; }
        .insp-map-marker--facility::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #52c41a; }
        .insp-leaflet-map .leaflet-tooltip.insp-map-area-label { padding: 3px 6px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.88); color: #000000d9; box-shadow: none; font-size: 12px; font-weight: 600; }
        .insp-leaflet-map .leaflet-tooltip.insp-map-area-label::before { display: none; }

        .map-grid {
            position: absolute;
            inset: 0;
            opacity: 0.72;
            background-image:
                linear-gradient(rgba(255,255,255,0.48) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.48) 1px, transparent 1px);
            background-size: 56px 56px;
        }
        /* 任务作业区域：淡蓝色填充虚线（PRD 6.1.1-8） */
        .map-zone {
            position: absolute;
            border-radius: 14px;
            background: rgba(22, 119, 255, 0.10);
            border: 2px dashed rgba(22, 119, 255, 0.55);
            color: rgba(22, 119, 255, 0.7);
            font-size: 11px;
            display: grid;
            place-items: center;
            transition: all 0.3s ease;
        }
        .map-zone.is-active {
            background: rgba(22, 119, 255, 0.16);
            border-color: rgba(22, 119, 255, 0.85);
        }
        .map-road {
            position: absolute;
            height: 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.54);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.52);
            transform-origin: left center;
        }
        .map-road.main { left: 0; top: 252px; width: 375px; transform: rotate(34deg); }
        .map-road.secondary { left: 0; top: 456px; width: 375px; transform: rotate(-16deg); opacity: 0.76; }
        .map-road.cross { left: 0; top: 72px; width: 375px; transform: rotate(78deg); opacity: 0.62; }
        /* 轨迹图层 */
        .track-layer {
            position: absolute;
            left: 0; top: 0; width: 100%; height: 100%;
            z-index: 2;
            overflow: visible;
            pointer-events: none;
        }
        .actual-track {
            fill: none;
            stroke: #ff4d4f;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.92;
            filter: drop-shadow(0 1px 2px rgba(255,77,79,0.28));
        }
        /* 事件点位（PRD 6.1.1-8 / 6.1.1-10，纯色填充圆形） */
        .problem-point {
            position: absolute;
            z-index: 7;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 0;
            background: transparent;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 2px 6px rgba(20,40,70,0.32));
            transition: transform 0.15s ease;
        }
        .problem-point:active { transform: translate(-50%, -50%) scale(0.92); }
        .problem-pin {
            position: relative;
            width: 18px;
            height: 18px;
            border: 3px solid #fff;
            border-radius: 50%;
        }
        .problem-point--pending .problem-pin { background: #8c8c8c; }
        .problem-point--assigned .problem-pin { background: #1677ff; }
        .problem-point--processing .problem-pin { background: #faad14; }
        .problem-point--done .problem-pin { background: #52c41a; }
        .problem-point--unidentified .problem-pin { background: #8c8c8c; }
        .problem-point--unassigned .problem-pin { background: #1677ff; }
        .problem-point--unprocessed .problem-pin { background: #faad14; }
        .problem-point--reviewing .problem-pin { background: #722ed1; }
        .problem-point.is-selected { z-index: 9; }
        .problem-point.is-selected .problem-pin { box-shadow: 0 0 0 5px #e6f4ff, 0 3px 9px rgba(20,40,70,0.4); transform: scale(1.18); }
        /* 人员位置（非机动车视角：人员而非车辆） */
        .person-marker {
            position: absolute;
            z-index: 8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #52c41a;
            border: 2px solid #fff;
            box-shadow: 0 3px 13px rgba(82,196,26,0.4);
            display: grid;
            place-items: center;
            color: #fff;
            transition: left 0.42s ease, top 0.42s ease;
        }
        .person-marker::after {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: inherit;
            border: 1px solid rgba(82,196,26,0.4);
            animation: personPulse 1.8s ease-out infinite;
        }
        .person-marker svg { width: 20px; height: 20px; }
        @keyframes personPulse {
            0% { transform: scale(0.7); opacity: 0.55; }
            100% { transform: scale(1.18); opacity: 0; }
        }
        .workbench.sheet-open .person-marker { z-index: 5; }

        /* ===== 顶部导航按钮条（小程序样式：返回 / 更多 / 退出） ===== */
        .top-bar {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 12px;
            z-index: 8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar__btn {
            height: 32px;
            min-width: 32px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 4px 12px rgba(15, 35, 70, 0.12);
            color: #000000d9;
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .top-bar__btn:active { transform: scale(0.92); background: #f5f5f5; }
        .top-bar__btn svg { width: 16px; height: 16px; }
        .top-bar__btn--icon { padding: 0; width: 32px; border-radius: 50%; }
        .top-bar__capsule {
            position: relative;
            width: 88px;
            height: 32px;
            margin-left: auto;
            display: flex;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 4px 12px rgba(15, 35, 70, 0.12);
        }
        .top-bar__mini-action {
            width: 43px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 15px;
            background: transparent;
            color: #1f1f1f;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .top-bar__mini-action:active { transform: scale(0.92); background: #f5f5f5; }
        .top-bar__mini-action svg { width: 20px; height: 20px; }
        .top-bar__capsule-divider {
            width: 1px;
            height: 18px;
            flex: 0 0 1px;
            background: #e8e8e8;
        }
        .top-bar__more-pop {
            position: absolute;
            top: 44px;
            right: 0;
            min-width: 120px;
            padding: 4px 0;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(15, 35, 70, 0.18);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar__more-pop.show { display: flex; }
        .top-bar__more-pop button {
            height: 40px;
            padding: 0 16px;
            border: none;
            background: #ffffff;
            text-align: left;
            font-size: 14px;
            color: #000000d9;
        }
        .top-bar__more-pop button:active { background: #f5f5f5; }

        /* ===== 新任务轻提醒 banner（PRD 6.1.1-9） ===== */
        .task-banner {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 58px;
            z-index: 8;
            min-height: 44px;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 10px 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.96);
            color: #000000d9;
            box-shadow: 0 8px 22px rgba(24, 39, 59, 0.14);
            animation: bannerIn 0.3s ease-out;
        }
        .task-banner.show { display: flex; }
        @keyframes bannerIn {
            from { transform: translateY(-12px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .task-banner__icon { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: #e6f4ff; color: #1677ff; }
        .task-banner__icon svg { width: 18px; height: 18px; }
        .task-banner__txt { flex: 1; min-width: 0; font-size: 13px; line-height: 18px; color: #334155; }
        .task-banner__txt strong { font-weight: 600; }
        .task-banner__view {
            flex: none;
            min-height: 28px;
            padding: 0 10px;
            border-radius: 15px;
            background: #f0f7ff;
            color: #1677ff;
            font-size: 12px;
            font-weight: 500;
            line-height: 28px;
            border: none;
        }
        .task-banner__view:active { background: #e6f4ff; }

        /* ===== 右侧辅助工具栏（PRD 6.1.1-11） ===== */
        .map-tools {
            position: absolute;
            right: 14px;
            bottom: 256px;
            z-index: 9;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            transition: bottom 0.24s ease, opacity 0.24s ease;
        }
        .workbench.sheet-open .map-tools { opacity: 0; pointer-events: none; }
        .map-shortcut {
            position: relative;
            width: 104px;
            height: 32px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            border-radius: 16px;
            background: rgba(255,255,255,0.98);
            color: #1f2937;
            box-shadow: 0 4px 12px rgba(24,39,59,0.14);
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            white-space: nowrap;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .map-shortcut:active { transform: scale(0.97); box-shadow: 0 3px 9px rgba(24,39,59,0.12); }
        .map-shortcut.is-active { background: #1677ff; color: #fff; box-shadow: 0 4px 14px rgba(22,119,255,0.32); }
        .map-shortcut.is-active .map-shortcut__icon { color: #fff; }
        .map-shortcut.is-active .map-shortcut__badge { background: #fff; color: #1677ff; }
        .map-shortcut__icon { width: 16px; height: 16px; flex: none; color: #1677ff; }
        .map-shortcut__badge {
            position: absolute;
            top: -4px;
            right: -4px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            display: grid;
            place-items: center;
            border: 2px solid #fff;
            border-radius: 8px;
            background: #ff7a45;
            color: #fff;
            font-family: "DIN", "SF UI Text", sans-serif;
            font-size: 10px;
            font-weight: 700;
            line-height: 12px;
        }
        .tool-btn {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.96);
            color: #1677ff;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 13px rgba(0,0,0,0.15);
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .tool-btn:active { transform: scale(0.92); }
        .tool-btn svg { width: 20px; height: 20px; }
        .tool-btn.is-active { background: #1677ff; color: #ffffff; }
        .tool-btn.is-inactive { color: #00000040; }

        /* ===== 左下路线图例 ===== */
        .map-legend {
            position: absolute;
            left: 14px;
            bottom: 172px;
            z-index: 9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: bottom 0.24s ease, opacity 0.24s ease;
        }
        .map-legend.is-hidden { display: none; }
        .workbench.sheet-open .map-legend { opacity: 0; pointer-events: none; }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 14px;
            color: #000000d9;
            white-space: nowrap;
        }
        .legend-mark { flex: none; }
        .legend-mark.zone { width: 14px; height: 10px; border: 2px dashed rgba(22,119,255,0.7); border-radius: 3px; background: rgba(22,119,255,0.10); }
        .legend-mark.track { width: 18px; height: 0; border-top: 2px solid #ff4d4f; }
        .legend-mark--person { width: 12px; height: 12px; background: #52c41a; border-radius: 50%; }
        .legend-mark--problem { width: 12px; height: 12px; background: #faad14; border-radius: 50%; }

        /* ===== 底部任务控制台（任务卡片 + 操作按钮） ===== */
        .console {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -6px 24px rgba(15, 35, 70, 0.12);
            transition: transform 0.28s ease-out;
        }
        .console__grip {
            display: flex;
            justify-content: center;
            padding: 8px 0 4px;
        }
        .console__grip-bar {
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: #e8e8e8;
        }
        .console__summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 16px 10px;
        }
        .console__summary-title { font-size: 13px; color: #00000073; }
        .console__summary-count { font-family: "DIN", "SF UI Text", sans-serif; font-size: 13px; font-weight: 600; color: #1677ff; }
        .console__summary-toggle {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            color: #1677ff;
            font-size: 12px;
            background: none;
            border: none;
        }
        .console__summary-toggle svg { width: 14px; height: 14px; transition: transform 0.24s ease; }
        .workbench.sheet-open .console__summary-toggle svg { transform: rotate(180deg); }

        /* 任务卡片（对齐用车管理 map-workbench 的 task-line 范式，PRD 6.1.1-2） */
        .task-card { padding: 0 16px 12px; }
        /* 车机连接：任务卡片内的紧凑上下文行，不承载车辆类型等非核心信息 */
        .connection-row {
            width: 100%;
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 0 8px;
            margin-bottom: 8px;
            border: 0;
            border-bottom: 1px solid #f0f0f0;
            background: transparent;
            color: #000000d9;
            text-align: left;
        }
        .connection-row:active { opacity: 0.7; }
        .connection-row__label { flex: none; color: #00000073; font-size: 12px; line-height: 18px; }
        .connection-row__plate {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: "DIN", "SF UI Text", sans-serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 20px;
        }
        .connection-row__plate--unbound { color: #00000073; font-family: inherit; font-size: 13px; font-weight: 400; }
        .connection-row__status,
        .connection-row__action {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 500;
            line-height: 18px;
            white-space: nowrap;
        }
        .connection-row__status { color: #389e0d; }
        .connection-row__status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .connection-row__action { color: #1677ff; }
        .connection-row__arrow { width: 15px; height: 15px; flex: none; color: #00000073; }
        .task-line { display: flex; align-items: center; gap: 8px; }
        .task-line + .task-line { margin-top: 8px; }
        /* 第 1 行：区域名 + 状态 + 任务详情（详情为右上角文字链接，非底部按钮） */
        .task-line-head { justify-content: space-between; }
        .task-title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
        .task-card__area {
            flex: none; max-width: 60%;
            font-size: 16px; font-weight: 700; color: #000000d9; line-height: 22px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        /* 事件上报数（待接收不渲染） */
        .task-card__count {
            flex: none; display: inline-flex; align-items: center; gap: 2px;
            color: #ff4d4f; font-size: 12px; line-height: 18px; font-weight: 500;
        }
        .task-card__count svg { width: 13px; height: 13px; }
        .task-head-right { flex: none; display: flex; align-items: center; gap: 8px; }
        .detail-link {
            flex: none; font-size: 12px; line-height: 18px; color: #1677ff;
            text-decoration: none; font-weight: 500; background: none; border: none; padding: 0;
        }
        .detail-link:active { opacity: 0.7; }
        /* 第 2 行：任务日期 - 作业时间 - 作业资源 */
        .task-card__meta {
            font-size: 12px; line-height: 18px; color: #00000073;
        }
        .task-card__meta .sep { color: #e8e8e8; }
        .task-card__meta .mono { font-family: "DIN", "SF UI Text", sans-serif; color: #000000a6; }
        .task-card__meta .resource { color: #000000a6; }
        /* 状态标签 */
        .tag {
            flex: none; display: inline-flex; align-items: center;
            min-height: 22px; padding: 1px 8px; border-radius: 6px;
            font-size: 12px; font-weight: 700; line-height: 18px;
        }
        .tag--todo { background: #fffbe6; color: #d48806; }
        .tag--running { background: #e6f4ff; color: #1677ff; }
        .tag--done { background: #f6ffed; color: #389e0d; }
        .tag--unidentified { background: #f5f5f5; color: #595959; }
        .tag--unassigned { background: #e6f4ff; color: #1677ff; }
        .tag--unprocessed { background: #fff7e6; color: #d46b08; }
        .tag--reviewing { background: #f9f0ff; color: #722ed1; }
        /* 第 3 行：3 列指标卡（对齐用车管理 #f5f8fb 底圆角） */
        .task-kpis {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .task-kpi {
            min-height: 50px; padding: 6px 8px; border-radius: 8px; background: #f5f8fb;
            text-align: center; display: flex; flex-direction: column; justify-content: center;
        }
        .task-kpi__label { font-size: 11px; line-height: 16px; color: #00000073; }
        .task-kpi__value { margin-top: 2px; font-family: "DIN", "SF UI Text", sans-serif; font-size: 14px; line-height: 20px; font-weight: 700; color: #000000d9; }
        .task-kpi__value--link { color: #1677ff; }
        .task-kpi__unit { font-size: 11px; color: #00000073; font-weight: 400; }
        /* 第 4 行：主操作 */
        .task-actions {
            display: grid; grid-template-columns: 1fr;
            padding: 4px 0 0;
        }
        .icon-action, .primary-action {
            height: 46px; border-radius: 12px; border: none;
            display: grid; place-items: center;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .icon-action { border: 1px solid #e8e8e8; background: #ffffff; color: #1677ff; }
        .primary-action {
            background: #1677ff; color: #ffffff; font-size: 16px; font-weight: 700;
            box-shadow: 0 8px 18px rgba(22,119,255,0.28);
        }
        .primary-action:active, .icon-action:active { transform: scale(0.98); opacity: 0.86; }
        .icon-action svg { width: 21px; height: 21px; }

        /* ===== 执行态：地图优先巡查操作台 ===== */
        .task-card.is-executing .task-line-head { margin-bottom: 0; }
        .exec-summary {
            display: flex; align-items: center; gap: 10px; padding: 2px 0 0;
            font-size: 12px; line-height: 18px; color: #00000073;
        }
        .exec-summary .exec-area {
            flex: none; font-size: 16px; font-weight: 700; color: #000000d9; line-height: 22px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%;
        }
        .exec-summary .exec-metrics { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
        .exec-summary .exec-metric { display: inline-flex; align-items: baseline; gap: 2px; white-space: nowrap; }
        .exec-summary .exec-metric .m-label { color: #00000073; }
        .exec-summary .exec-metric .m-val { font-family: "DIN", "SF UI Text", sans-serif; color: #000000d9; font-weight: 700; }
        .exec-summary .sep { color: #e8e8e8; }
        .exec-time {
            flex: none; padding: 4px 9px; border: 1px solid #d9e2ec; border-radius: 6px;
            color: #475569; font-family: "DIN", "SF UI Text", sans-serif; font-size: 13px; font-weight: 600; line-height: 20px;
        }
        .exec-actions {
            display: flex; align-items: center; justify-content: space-between;
            min-height: 122px; padding: 8px 48px 18px;
        }
        .exec-action {
            width: 96px; height: 96px; border: none; border-radius: 50%; color: #ffffff;
            display: grid; place-items: center;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .exec-action:active { opacity: 0.84; transform: scale(0.96); }
        .exec-action__name { display: block; color: inherit; font-size: 16px; font-weight: 700; line-height: 24px; }
        .exec-action--finish { background: #b86f76; box-shadow: 0 0 0 6px rgba(184,111,118,0.12), 0 0 18px 6px rgba(184,111,118,0.28), 0 10px 22px rgba(184,111,118,0.25); }
        .exec-action--report { background: #4b9762; box-shadow: 0 0 0 6px rgba(75,151,98,0.12), 0 0 18px 6px rgba(75,151,98,0.32), 0 10px 22px rgba(75,151,98,0.28); }

        /* ===== 执行态专属地图布局（参照外业巡查全地图操作） ===== */
        .workbench.is-executing .top-card { display: none; }
        .workbench.is-executing .task-banner {
            top: 54px; left: 20px; right: 20px; min-height: 40px; padding: 6px 8px 6px 6px;
            border-radius: 24px; background: rgba(255,255,255,0.96); color: #000000d9;
            box-shadow: 0 5px 16px rgba(24,39,59,0.14);
        }
        .workbench.is-executing .task-banner__icon {
            width: 32px; height: 32px; border-radius: 50%; background: #e6f4ff; color: #1677ff;
        }
        .workbench.is-executing .task-banner__icon svg { width: 17px; height: 17px; }
        .workbench.is-executing .task-banner__txt { font-size: 14px; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .workbench.is-executing .task-banner__view { min-height: 28px; border-radius: 15px; background: #f0f7ff; color: #1677ff; line-height: 28px; }
        .workbench.is-executing .task-banner__view:active { background: #e6f4ff; }
        .workbench.is-executing .map-tools { right: 14px; bottom: 280px; z-index: 10; }
        .workbench.is-executing .tool-btn { width: 40px; height: 40px; color: #526072; }
        .workbench.is-executing .tool-btn svg { width: 20px; height: 20px; }
        .workbench.is-executing .map-legend { display: none; }
        .workbench.is-executing .console {
            display: flex; flex-direction: column; background: transparent; box-shadow: none; border-radius: 0; pointer-events: none; z-index: 12;
        }
        .workbench.is-executing .console__grip,
        .workbench.is-executing .console__summary { display: none; }
        .workbench.is-executing .task-card {
            order: 2; position: relative; padding: 14px 16px 16px; background: #ffffff; border-radius: 0; pointer-events: auto;
        }
        .workbench.is-executing #js-actions {
            order: 1; position: relative; padding: 0; pointer-events: none;
        }
        .workbench.is-executing .exec-actions { height: 122px; pointer-events: none; }
        .workbench.is-executing .exec-action { pointer-events: auto; }

        /* ===== 结束任务确认 ===== */
        .finish-overlay {
            position: absolute; inset: 0; z-index: 30; display: none; align-items: flex-end;
            background: rgba(0, 0, 0, 0.48);
        }
        .finish-overlay.show { display: flex; }
        .finish-dialog {
            width: 100%; padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
            background: #ffffff; border-radius: 16px 16px 0 0;
            animation: finishDialogIn 0.2s ease-out;
        }
        @keyframes finishDialogIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .finish-dialog__grip { width: 36px; height: 4px; margin: 0 auto 18px; border-radius: 2px; background: #e8e8e8; }
        .finish-dialog__title { color: #000000d9; font-size: 18px; font-weight: 700; line-height: 26px; }
        .finish-dialog__desc { margin-top: 5px; color: #00000073; font-size: 13px; line-height: 20px; }
        .finish-check {
            display: flex; align-items: center; gap: 9px; margin: 16px 0;
            padding: 11px 12px; background: #f6ffed; color: #237804; border-radius: 8px;
            font-size: 13px; line-height: 20px;
        }
        .finish-check svg { width: 18px; height: 18px; flex: none; }
        .finish-dialog__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .finish-dialog__button {
            height: 46px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600;
        }
        .finish-dialog__button--cancel { background: #f5f5f5; color: #000000d9; }
        .finish-dialog__button--confirm { background: #ff4d4f; color: #ffffff; }
        .finish-dialog__button:active { opacity: 0.85; }

        /* ===== 车辆连接详情 ===== */
        .connection-overlay {
            position: absolute;
            inset: 0;
            z-index: 31;
            display: none;
            align-items: flex-end;
            background: rgba(0, 0, 0, 0.48);
        }
        .connection-overlay.show { display: flex; }
        .connection-detail {
            width: 100%;
            padding: 12px 20px calc(20px + env(safe-area-inset-bottom));
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            animation: finishDialogIn 0.2s ease-out;
        }
        .connection-detail__head { display: flex; align-items: center; justify-content: space-between; }
        .connection-detail__title { color: #000000d9; font-size: 18px; font-weight: 700; line-height: 26px; }
        .connection-detail__close {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: none;
            border-radius: 50%;
            background: #f5f5f5;
            color: #00000073;
        }
        .connection-detail__close:active { opacity: 0.7; }
        .connection-detail__close svg { width: 18px; height: 18px; }
        .connection-detail__list { margin-top: 14px; border-top: 1px solid #f0f0f0; }
        .connection-detail__item {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #00000073;
            font-size: 14px;
            line-height: 22px;
        }
        .connection-detail__item strong {
            min-width: 0;
            overflow: hidden;
            color: #000000d9;
            font-family: "DIN", "SF UI Text", sans-serif;
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .connection-detail__state { color: #389e0d !important; }
        .connection-detail__disconnect {
            width: 100%;
            height: 44px;
            margin-top: 14px;
            border: none;
            border-radius: 8px;
            background: #fff1f0;
            color: #ff4d4f;
            font-size: 15px;
            font-weight: 600;
        }
        .connection-detail__disconnect:active { opacity: 0.78; }

        /* 断开连接确认：避免在查看连接信息时误触退出车机应用 */
        .connection-disconnect-overlay {
            position: absolute;
            inset: 0;
            z-index: 32;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(0, 0, 0, 0.48);
        }
        .connection-disconnect-overlay.show { display: flex; }
        .connection-disconnect-dialog {
            width: min(280px, 100%);
            padding: 22px 20px 18px;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
            animation: connectionConfirmIn 0.18s ease-out;
        }
        @keyframes connectionConfirmIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .connection-disconnect-dialog__title { color: #000000d9; font-size: 17px; font-weight: 700; line-height: 24px; text-align: center; }
        .connection-disconnect-dialog__desc { margin-top: 10px; color: #00000073; font-size: 13px; line-height: 20px; text-align: center; }
        .connection-disconnect-dialog__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .connection-disconnect-dialog__button { height: 40px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; }
        .connection-disconnect-dialog__button--cancel { background: #f5f5f5; color: #000000d9; }
        .connection-disconnect-dialog__button--confirm { background: #ff4d4f; color: #ffffff; }
        .connection-disconnect-dialog__button:active { opacity: 0.82; }

        /* ===== 今日待办抽屉（PRD 6.1.1-4~7，上拉覆盖地图） ===== */
        .sheet-mask {
            position: absolute;
            inset: 0;
            z-index: 11;
            background: rgba(0,0,0,0.32);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.24s ease, visibility 0.24s;
        }
        .sheet-mask.is-open { opacity: 1; visibility: visible; }
        .sheet {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            z-index: 12;
            max-height: 86%;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
            transform: translateY(100%);
            transition: transform 0.28s ease-out;
            display: flex;
            flex-direction: column;
        }
        .sheet.is-open { transform: translateY(0); }
        .sheet__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px 8px;
        }
        .sheet__title { font-size: 15px; font-weight: 600; color: #000000d9; }
        .sheet__close {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            font-size: 12px;
            color: #1677ff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            background: #fff;
        }
        /* 分组统计（PRD 6.1.1-5） */
        .sheet__stats {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 16px 10px;
            font-size: 12px;
            color: #00000073;
            border-bottom: 1px solid #f0f0f0;
        }
        .sheet__stats .stat { display: inline-flex; align-items: baseline; gap: 4px; }
        .sheet__stats .stat .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; transform: translateY(-1px); }
        .sheet__stats .stat .num { font-family: "DIN", "SF UI Text", sans-serif; font-size: 14px; font-weight: 600; color: #000000d9; }
        .sheet__body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .sheet__group { padding: 10px 16px 4px; font-size: 12px; color: #00000073; background: #fafafa; }
        .sheet-task {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 16px;
            border-bottom: 1px solid #f5f5f5;
            background: #fff;
            transition: background-color 0.15s;
        }
        .sheet-task:last-child { border-bottom: none; }
        .sheet-task:active { background: #f5f5f5; }
        .sheet-task.is-selected { background: #e6f4ff; }
        .sheet-task.is-selected::before {
            content: "";
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 3px;
            background: #1677ff;
        }
        .sheet-task { position: relative; }
        .sheet-task__r1 { display: flex; align-items: center; gap: 8px; }
        .sheet-task__area { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; color: #000000d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sheet-task__count { flex: none; color: #ff4d4f; font-size: 12px; line-height: 18px; font-weight: 500; }
        .sheet-task__r2 { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #00000073; flex-wrap: wrap; }
        .sheet-task__r2 .sep { color: #e8e8e8; }
        .sheet-task__r2 .mono { font-family: "DIN", "SF UI Text", sans-serif; }
        .sheet-problem {
            --problem-accent: #ff7a45;
            max-height: 50vh;
        }
        .problem-sheet-item {
            position: relative;
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 40px;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border: 0;
            border-bottom: 1px solid #f5f5f5;
            background: #fff;
            transition: background-color 0.15s;
        }
        .problem-sheet-item:last-child { border-bottom: 0; }
        .problem-sheet-item.is-selected { background: #e6f4ff; }
        .problem-sheet-item.is-selected::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #1677ff;
        }
        .problem-sheet-item__summary {
            display: block; min-width: 0; padding: 0; border: 0; background: transparent;
            color: inherit; font: inherit; text-align: left; cursor: pointer;
        }
        .problem-sheet-item__summary:active { opacity: 0.76; }
        .problem-sheet-item__content { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .problem-sheet-item__head { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .problem-sheet-item__time { flex: none; color: #000000a6; font-family: "DIN", "SF UI Text", sans-serif; font-size: 14px; font-weight: 500; }
        .problem-sheet-item__sep { color: #e8e8e8; }
        .problem-sheet-item__location { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; color: #000000d9; }
        .problem-sheet-item__meta { display: flex; align-items: center; gap: 7px; min-width: 0; color: #00000073; font-size: 12px; flex-wrap: wrap; }
        .problem-sheet-item__type { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #000000d9; font-size: 12px; font-weight: 500; }
        .problem-sheet-item__tags { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 6px; }
        .problem-sheet-item__desc { overflow: hidden; color: #00000073; font-size: 12px; line-height: 18px; text-overflow: ellipsis; white-space: nowrap; }
        .problem-sheet-item__detail {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; padding: 0;
            border: 1px solid #1677ff; border-radius: 50%;
            background: #ffffff; color: #1677ff; cursor: pointer;
            transition: background-color 0.15s, transform 0.12s;
        }
        .problem-sheet-item__detail:hover { background: #e6f4ff; }
        .problem-sheet-item__detail:active { transform: scale(0.96); }
        .problem-sheet-item__detail svg { width: 16px; height: 16px; }
        .problem-discover {
            flex: none; display: inline-flex; align-items: center; gap: 3px;
            height: 20px; padding: 0 6px; border-radius: 4px;
            font-size: 11px; font-weight: 600; line-height: 1;
        }
        .problem-discover::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
        .problem-discover--ai { background: #e6f4ff; color: #1677ff; }
        .problem-discover--ai::before { background: #1677ff; }
        .problem-discover--manual { background: #f0f5ff; color: #2f54eb; }
        .problem-discover--manual::before { background: #2f54eb; }
        .sheet-empty {
            padding: 48px 16px;
            text-align: center;
            color: #00000073;
            font-size: 14px;
        }
        .sheet-empty__icon { margin: 0 auto 12px; width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: #f5f5f5; color: #bfbfbf; }
        .sheet-empty__icon svg { width: 28px; height: 28px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            max-width: 80%;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: 14px;
            line-height: 22px;
            border-radius: 8px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s;
        }
        .toast.show { opacity: 1; visibility: visible; }
    </style>
</head>
<body>
<div class="workbench" id="workbench">
    <!-- 地图底图 -->
    <div class="map-shell" id="js-map-shell">
        <!-- Leaflet 地图容器（OSM 瓦片）；JS 检测 window.L 成功后给 .map-shell 加 is-leaflet 类 -->
        <div class="insp-leaflet-map" id="js-leaflet-map" aria-label="巡查地图"></div>
        <div class="insp-map-fallback" id="js-map-fallback">地图服务暂不可用，请检查网络连接后刷新</div>
        <div class="map-grid"></div>
        <div class="map-road main"></div>
        <div class="map-road secondary"></div>
        <div class="map-road cross"></div>
        <!-- 任务作业区域（JS 动态填充） -->
        <div id="js-zones"></div>
        <!-- 实际轨迹 -->
        <svg class="track-layer" viewBox="0 0 375 600" preserveAspectRatio="none" id="js-track-layer">
            <path class="actual-track" id="js-track-path" d=""></path>
        </svg>
        <!-- 事件点位 -->
        <div id="js-problems"></div>
