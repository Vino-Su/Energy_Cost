            groups[k].sort(function (a, b) { return (b.reportedAt || '').localeCompare(a.reportedAt || ''); });
        });
        return groups;
    }
    function openProblemDetail(problemId, taskId) {
        var target = 'inspection-problem-detail.html?problem=' + encodeURIComponent(problemId) + '&task=' + encodeURIComponent(taskId || '');
        if (window.parent && window.parent !== window) {
            window.parent.location.href = target;
        } else {
            window.location.href = target;
        }
    }

    /* ===== Toast ===== */
    var toastTimer = null;
    function toast(msg) {
        var el = document.getElementById('js-toast');
        el.textContent = msg;
        el.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    /* ===== 地图渲染 ===== */
    // Leaflet 实例与图层组（与车机端 car-task-running 同构）
    var leafletMap = null;
    var mapReady = false;
    var tileErrorNotified = false;
    var mapLayers = null;          // { focus, tasks, problems, facilities }
    var currentTaskLayer = null;   // 当前任务区域 polygon（聚焦模式）
    var currentTrackLayer = null;  // 当前已行驶轨迹 polyline（红色实线）
    var currentPlannedLayer = null; // 计划轨迹 polyline（灰色虚线）
    var currentPersonMarker = null;
    // 执行中任务轨迹动画状态
    var trackAnimTimer = null;     // setInterval 句柄
    var trackAnimState = null;     // { taskId, track, stepIdx, trackLayer, personMarker }
    var stateSaveTimer = null;     // 持久化 debounce 句柄
    var facilitiesVisible = false;
    // 今日事件抽屉打开时：全部事件点位 marker 引用（Leaflet 模式存 L.marker，降级模式存 HTMLElement）
    var problemMarkers = {};
    // 当前聚焦选中的事件 id（点击卡片 toggle 用）
    var focusedProblemId = null;
    var MAP_FACILITIES = [
        { name: '公厕', latlng: [23.1304, 113.2602] },
        { name: '垃圾转运点', latlng: [23.1336, 113.2718] },
        { name: '消火栓', latlng: [23.1262, 113.2678] }
    ];

    // 问题状态色（与 UI_design_APP 色值对齐）
    function problemStatusColor(status) {
        return PROB_STATUS_COLOR[status] || '#1677ff';
    }
    // 解析 'lng,lat' 字符串为 Leaflet [lat,lng]
    function parseLatLng(str) {
        if (!str) return null;
        var parts = String(str).split(',');
        if (parts.length < 2) return null;
        var lng = parseFloat(parts[0]);
        var lat = parseFloat(parts[1]);
        if (isNaN(lat) || isNaN(lng)) return null;
        return [lat, lng];
    }

    // divIcon 工厂
    function mapIcon(className, html, size, anchor) {
        return L.divIcon({ className: className || '', html: html, iconSize: size, iconAnchor: anchor });
    }
    function personIcon() {
        return mapIcon('insp-map-marker insp-map-marker--person',
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 18h6"/></svg>',
            [40, 40], [20, 20]);
    }
    function problemIcon(p) {
        return mapIcon('insp-map-marker insp-map-marker--problem',
            '<span class="problem-pin" style="--insp-problem-color:' + problemStatusColor(p.status) + '"></span>',
            [22, 22], [11, 11]);
    }
    function facilityIcon(name) {
        return mapIcon('insp-map-marker insp-map-marker--facility', name, null, null);
    }

    // Leaflet 初始化（OSM 瓦片 + 降级 + invalidateSize）
    function initLeafletMap() {
        if (mapReady) return;
        var shell = document.getElementById('js-map-shell');
        try {
            leafletMap = L.map('js-leaflet-map', {
                zoomControl: false, attributionControl: true,
                preferCanvas: true, minZoom: 12, maxZoom: 19
            });
            // 缩放控件置于右上角，下移避开顶部返回按钮条（PRD 6.1.1-11）
            L.control.zoom({ position: 'topright' }).addTo(leafletMap);
            var tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
            }).addTo(leafletMap);
            tiles.on('tileerror', function () {
                if (tileErrorNotified) return;
                tileErrorNotified = true;
                toast('地图底图加载失败，请检查网络连接');
            });
            mapLayers = {
                focus: L.featureGroup().addTo(leafletMap),
                tasks: L.featureGroup().addTo(leafletMap),
                problems: L.featureGroup().addTo(leafletMap),
                facilities: L.featureGroup().addTo(leafletMap)
            };
            shell.classList.add('is-leaflet');
            mapReady = true;
            setTimeout(function () { leafletMap.invalidateSize(false); }, 0);
        } catch (err) {
            var fb = document.getElementById('js-map-fallback');
            if (fb) fb.classList.add('is-visible');
            mapReady = false;
        }
    }

    function renderMap(t) {
        // 双轨：Leaflet 成功走新路径，失败走旧 SVG/百分比降级路径
        if (mapReady && leafletMap) { renderMapLeaflet(t); return; }
        renderMapLegacy(t);
    }

    // Leaflet 渲染（聚焦当前任务模式）
    function renderMapLeaflet(t) {
        var geo = t.geo;
        // 清空聚焦层
        mapLayers.focus.clearLayers();
        currentTaskLayer = null;
        currentTrackLayer = null;
        currentPlannedLayer = null;
        currentPersonMarker = null;
        // 作业区域：淡蓝虚线填充 polygon + 区域名标签 tooltip
        if (geo && geo.zone && geo.zone.length) {
            currentTaskLayer = L.polygon(geo.zone, {
                color: '#1677ff', weight: 2, dashArray: '8 6',
                fillColor: '#1677ff', fillOpacity: 0.10,
                lineCap: 'round', lineJoin: 'round'
            }).addTo(mapLayers.focus);
            currentTaskLayer.bindTooltip(t.area, {
                permanent: true, direction: 'center', className: 'insp-map-area-label'
            });
        }
        // 计划轨迹（灰色虚线，作底，执行中/已完成展示）
        if (geo && geo.track && geo.track.length > 1 && (t.status === 'running' || t.status === 'done')) {
            currentPlannedLayer = L.polyline(geo.track, {
                color: '#bfbfbf', weight: 4, opacity: 0.65, dashArray: '8 8',
                lineCap: 'round', lineJoin: 'round'
            }).addTo(mapLayers.focus);
        }
        // 已行驶轨迹（红色实线）：已完成画完整；执行中画当前进度 t._traveled（PRD 6.1.1-8）
        var traveled = (t.status === 'running') ? (t._traveled || (geo && geo.track && geo.track.length ? [geo.track[0]] : [])) : geo.track;
        if (geo && geo.track && geo.track.length > 1 && traveled && traveled.length > 1) {
            currentTrackLayer = L.polyline(traveled, {
                color: '#ff4d4f', weight: 4, opacity: 0.92,
                lineCap: 'round', lineJoin: 'round'
            }).addTo(mapLayers.focus);
        }
        // 事件点位：执行中/已完成展示，点击进详情
        if (t.problemsList && t.problemsList.length && (t.status === 'running' || t.status === 'done')) {
            t.problemsList.forEach(function (p) {
                var ll = parseLatLng(p.coordinate);
                if (!ll) return;
                var marker = L.marker(ll, { icon: problemIcon(p) }).addTo(mapLayers.focus);
                marker.on('click', function () { openProblemDetail(p.id, t.id); });
            });
        }
        // 人员位置：执行中定位到已行驶轨迹终点，已完成/其他用 geo.person
        var personLatLng = geo.person;
        if (t.status === 'running' && t._traveled && t._traveled.length) {
            personLatLng = t._traveled[t._traveled.length - 1];
        } else if (t.status === 'running' && geo && geo.track && geo.track.length) {
            personLatLng = geo.track[0];
        }
        if (personLatLng) {
            currentPersonMarker = L.marker(personLatLng, { icon: personIcon(), zIndexOffset: 1000 })
                .addTo(mapLayers.focus);
        }
        // 聚焦到任务区域
        if (currentTaskLayer) {
            leafletMap.fitBounds(currentTaskLayer.getBounds().pad(0.25), { animate: false });
        } else if (geo && geo.person) {
            leafletMap.setView(geo.person, 16, { animate: false });
        }
        // 设施图层按可见性重绘
        renderFacilities();
    }

    // ===== 执行中任务轨迹动画（3秒/步，到达终点停止） =====
    function startTrackAnimation(t) {
        if (!mapReady || !leafletMap) return;            // 降级模式不启动地图动画
        if (!t || !t.geo || !t.geo.track || t.geo.track.length < 2) return;  // 轨迹点不足
        stopTrackAnimation(false);                       // 先清掉已有动画
        var track = t.geo.track;
        // 初始化/恢复进度（_traveled/_stepIdx 存 task 上，刷新或抽屉关闭后重渲染仍可用）
        if (!t._traveled || !t._traveled.length) {
            t._traveled = [track[0]];
            t._stepIdx = 1;
        }
        // 创建红色已行驶轨迹 polyline（若 renderMapLeaflet 已建则复用，否则新建）
        if (!currentTrackLayer) {
            currentTrackLayer = L.polyline(t._traveled, {
                color: '#ff4d4f', weight: 4, opacity: 0.92,
                lineCap: 'round', lineJoin: 'round'
            }).addTo(mapLayers.focus);
        }
        trackAnimState = {
            taskId: t.id,
            track: track,
            stepIdx: t._stepIdx,
            trackLayer: currentTrackLayer,
            personMarker: currentPersonMarker
        };
        trackAnimTimer = setInterval(stepTrackAnimation, 3000);
    }

    function stepTrackAnimation() {
        if (!trackAnimState) return;
        var st = trackAnimState;
        var t = findTask(st.taskId);
        if (!t) { stopTrackAnimation(false); return; }
        if (st.stepIdx >= st.track.length) { stopTrackAnimation(false); return; }  // 到达终点
        var prev = st.track[st.stepIdx - 1];
        var next = st.track[st.stepIdx];
        // 移动人员 marker
        if (st.personMarker) { st.personMarker.setLatLng(next); }
        // 延伸已行驶轨迹
        t._traveled.push(next);
        st.trackLayer.setLatLngs(t._traveled);
        // 累计里程（Leaflet 球面距离，米→公里，2 位小数）
        var segMeters = L.latLng(prev[0], prev[1]).distanceTo(L.latLng(next[0], next[1]));
        t.mileage = +(t.mileage + segMeters / 1000).toFixed(2);
        // 累计时长（3秒/步映射 3 分钟演示节奏）
        t.duration = t.duration + 3;
        // 更新 KPI 文本
        updateRunningKpi(t);
        // 推进下标（同步到 task）
        st.stepIdx++;
        t._stepIdx = st.stepIdx;
        // 到达终点定格
        if (st.stepIdx >= st.track.length) { stopTrackAnimation(false); return; }
        // debounce 持久化
        if (stateSaveTimer) clearTimeout(stateSaveTimer);
        stateSaveTimer = setTimeout(function () {
            state[t.id] = state[t.id] || {};
            state[t.id].mileage = t.mileage;
            state[t.id].duration = t.duration;
            saveState(state);
        }, 800);
    }

    function stopTrackAnimation(restoreFull) {
        if (trackAnimTimer) { clearInterval(trackAnimTimer); trackAnimTimer = null; }
        if (stateSaveTimer) { clearTimeout(stateSaveTimer); stateSaveTimer = null; }
        var t = trackAnimState ? findTask(trackAnimState.taskId) : null;
        trackAnimState = null;
        // 落盘最终里程/时长
        if (t) {
            state[t.id] = state[t.id] || {};
            state[t.id].mileage = t.mileage;
            state[t.id].duration = t.duration;
            saveState(state);
        }
        // restoreFull 暂无额外处理：进度已存 task，renderMapLeaflet 重渲染会正确画出
        void restoreFull;
    }

    // 更新执行态卡片作业里程/时长 KPI 文本（不重渲染整卡，避免丢失按钮事件绑定）
    function updateRunningKpi(t) {
        var mEl = document.getElementById('js-kpi-mileage');
        var dEl = document.getElementById('js-kpi-duration');
        if (mEl) mEl.textContent = fmt(t.mileage, '', '—');
        if (dEl) dEl.textContent = fmt(t.duration, '', '—');
    }

    // 旧 SVG/百分比降级渲染（Leaflet 加载失败时兜底）
    function renderMapLegacy(t) {
        var zonesEl = document.getElementById('js-zones');
        zonesEl.innerHTML = '<span class="map-zone is-active" style="left:' + t.zone.left + ';top:' + t.zone.top + ';width:' + t.zone.width + ';height:' + t.zone.height + '">' + t.area + '</span>';
        var trackPath = document.getElementById('js-track-path');
        trackPath.setAttribute('d', t.track || '');
        document.getElementById('js-track-layer').style.display = t.track ? '' : 'none';
        var probEl = document.getElementById('js-problems');
        if (t.problemsList && t.problemsList.length && (t.status === 'running' || t.status === 'done')) {
            probEl.innerHTML = t.problemsList.map(function (p) {
                if (!p.point) return '';
                return '<button type="button" class="problem-point problem-point--' + p.status + '" data-id="' + p.id + '" style="left:' + p.point.left + ';top:' + p.point.top + '" title="' + p.no + ' · ' + p.statusText + '"><span class="problem-pin"></span></button>';
            }).join('');
            probEl.querySelectorAll('.problem-point').forEach(function (el) {
                el.addEventListener('click', function () { openProblemDetail(el.dataset.id, t.id); });
            });
        } else {
            probEl.innerHTML = '';
        }
        var person = document.getElementById('js-person');
        person.style.left = t.person.left;
        person.style.top = t.person.top;
    }

    // 今日事件抽屉：渲染当前用户当日全部事件点位（PRD C02-R5 全部事件点位）
    function renderAllProblemMarkers() {
        problemMarkers = {};
        var problems = todayProblems();
        if (mapReady && leafletMap) {
            mapLayers.focus.clearLayers();    // 暂隐选中任务区域/轨迹/人员
            mapLayers.problems.clearLayers();
            currentTaskLayer = null;
            currentTrackLayer = null;
            currentPersonMarker = null;
            problems.forEach(function (p) {
                var ll = parseLatLng(p.coordinate);
                if (!ll) return;
                var marker = L.marker(ll, { icon: problemIcon(p) }).addTo(mapLayers.problems);
                marker.on('click', function () { openProblemDetail(p.id, p.taskId); });
                problemMarkers[p.id] = marker;
            });
            var pts = problems.map(function (p) { return parseLatLng(p.coordinate); }).filter(Boolean);
            if (pts.length) leafletMap.fitBounds(L.latLngBounds(pts).pad(0.25), { animate: true });
        } else {
            // 降级：在 js-problems 容器渲染全部任务点位 DOM
            var probEl = document.getElementById('js-problems');
            probEl.innerHTML = problems.map(function (p) {
                if (!p.point) return '';
                return '<button type="button" class="problem-point problem-point--' + p.status + '" data-id="' + p.id + '" style="left:' + p.point.left + ';top:' + p.point.top + '" title="' + (p.loc || '') + ' · ' + (p.statusText || '') + '"><span class="problem-pin"></span></button>';
            }).join('');
            probEl.querySelectorAll('.problem-point').forEach(function (el) {
                var id = el.dataset.id;
                problemMarkers[id] = el;
                el.addEventListener('click', function () {
                    var p = todayProblems().filter(function (x) { return x.id === id; })[0];
                    if (p) openProblemDetail(p.id, p.taskId);
                });
            });
        }
    }

    function clearAllProblemMarkers() {
        if (mapReady && leafletMap) {
            mapLayers.problems.clearLayers();
        } else {
            var probEl = document.getElementById('js-problems');
            if (probEl) probEl.innerHTML = '';
        }
        problemMarkers = {};
    }

    // 聚焦某事件点位：地图平移 + 点位/卡片选中态
    function focusProblem(problemId) {
        clearProblemFocus();
        var p = todayProblems().filter(function (x) { return x.id === problemId; })[0];
        if (!p) return;
        focusedProblemId = problemId;
        if (mapReady && leafletMap) {
            var ll = parseLatLng(p.coordinate);
            if (ll) leafletMap.setView(ll, 17, { animate: true });
            var marker = problemMarkers[problemId];
            if (marker) {
                var el = marker.getElement && marker.getElement();
                if (el) el.classList.add('is-selected');   // 触发点位光晕
            }
        } else {
            var domEl = problemMarkers[problemId];
            if (domEl) domEl.classList.add('is-selected');
        }
        var card = document.querySelector('.problem-sheet-item[data-id="' + problemId + '"]');
        if (card) card.classList.add('is-selected');
    }

    function clearProblemFocus() {
        if (!focusedProblemId) return;
        if (mapReady && leafletMap) {
            var marker = problemMarkers[focusedProblemId];
            if (marker) {
                var el = marker.getElement && marker.getElement();
                if (el) el.classList.remove('is-selected');
            }
        } else {
            var domEl = problemMarkers[focusedProblemId];
            if (domEl) domEl.classList.remove('is-selected');
        }
        var card = document.querySelector('.problem-sheet-item[data-id="' + focusedProblemId + '"]');
        if (card) card.classList.remove('is-selected');
        focusedProblemId = null;
    }

    // 辅助设施图层渲染（可切换）
    function renderFacilities() {
        if (!mapReady || !mapLayers) return;
        mapLayers.facilities.clearLayers();
        if (!facilitiesVisible) return;
        MAP_FACILITIES.forEach(function (f) {
            L.marker(f.latlng, { icon: facilityIcon(f.name) })
                .addTo(mapLayers.facilities)
                .bindTooltip(f.name, { direction: 'top', offset: [0, -16] });
        });
    }

    // 复位：聚焦当前任务区域
    function resetMapView() {
        if (!mapReady || !leafletMap) return;
        var t = findTask(selectedId);
        if (t && t.geo && t.geo.zone && t.geo.zone.length) {
            var b = L.latLngBounds(t.geo.zone);
            leafletMap.fitBounds(b.pad(0.25), { animate: true });
        } else if (t && t.geo && t.geo.person) {
            leafletMap.setView(t.geo.person, 16);
        }
    }

    /* ===== 任务卡片渲染（PRD 6.1.1-2 / 6.1.1-8） ===== */
    // 第 1 行：片区名 - 事件上报数（未开始不显示）- 任务状态（+ 右侧详情链接）
    // showCount=false 时强制不显示事件上报数（执行态收起场景）
    function cardHeadHtml(t, withStatus, showCount) {
        var statusHtml = withStatus ? '<span class="tag ' + STATUS_TAG[t.status] + '">' + STATUS_TEXT[t.status] + '</span>' : '';
        // 待接收（未开始）或收起态不显示事件上报数
        var showCountFlag = (showCount !== false) && (t.status !== 'todo');
        var countHtml = showCountFlag ? '<span class="task-card__count"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 3 19a2 2 0 0 0 1.75 3h14.5A2 2 0 0 0 21 19L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg>事件上报 ' + t.problems + '</span>' : '';
        return '<div class="task-line task-line-head">' +
                '<div class="task-title-wrap">' +
                    '<span class="task-card__area">' + t.area + '</span>' +
                    countHtml +
                    statusHtml +
                '</div>' +
                '<div class="task-head-right">' +
                    '<button type="button" class="detail-link" id="js-btn-detail">详情</button>' +
                '</div>' +
            '</div>';
    }
    function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function getVehicleBinding() {
        try {
            return (typeof VehicleDemoState !== 'undefined') ? VehicleDemoState.getBinding() : null;
        } catch (e) {
            return null;
        }
    }
    function formatBindingTime(timestamp) {
        if (!timestamp) return '—';
        var date = new Date(timestamp);
        if (isNaN(date.getTime())) return '—';
        function pad(value) { return String(value).padStart(2, '0'); }
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }
    function connectionRowHtml() {
        var binding = getVehicleBinding();
        if (binding && binding.plateNo) {
            return '<button type="button" class="connection-row" id="js-connection-row" aria-label="查看已连接车机信息">' +
                '<span class="connection-row__label">车机连接</span>' +
                '<span class="connection-row__plate">' + escapeHtml(binding.plateNo) + '</span>' +
                '<span class="connection-row__status">已连接</span>' +
                '<svg class="connection-row__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>' +
            '</button>';
        }
        return '<button type="button" class="connection-row" id="js-connection-row" aria-label="绑定车辆">' +
            '<span class="connection-row__label">车机连接</span>' +
            '<span class="connection-row__plate connection-row__plate--unbound">未连接</span>' +
            '<span class="connection-row__action">去绑定</span>' +
            '<svg class="connection-row__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>' +
        '</button>';
    }
    function closeConnectionDetail() {
        document.getElementById('js-connection-overlay').classList.remove('show');
    }
    var pendingDisconnectBinding = null;
    var CAR_APP_LOGOUT_KEY = 'kuwash-car-app-remote-logout';
    function closeConnectionDisconnectConfirm() {
        pendingDisconnectBinding = null;
        document.getElementById('js-connection-disconnect-overlay').classList.remove('show');
    }
    function openConnectionDisconnectConfirm() {
        var binding = getVehicleBinding();
        if (!binding || !binding.plateNo) {
            closeConnectionDetail();
            renderAll();
            toast('当前未连接车辆');
            return;
        }
        pendingDisconnectBinding = binding;
        closeConnectionDetail();
        document.getElementById('js-connection-disconnect-overlay').classList.add('show');
    }
    function disconnectVehicleConnection() {
        var binding = pendingDisconnectBinding || getVehicleBinding();
        closeConnectionDisconnectConfirm();
        if (!binding || !binding.plateNo) {
            renderAll();
            toast('当前未连接车辆');
            return;
        }
        try {
            window.localStorage.setItem(CAR_APP_LOGOUT_KEY, JSON.stringify({
                plateNo: binding.plateNo,
                disconnectedAt: Date.now()
            }));
        } catch (e) {}
        try {
            if (typeof VehicleDemoState !== 'undefined') VehicleDemoState.unbind();
        } catch (e) {}
        renderAll();
        toast('已断开连接，车机APP已退出登录');
    }
    function openConnectionDetail(binding) {
        var list = document.getElementById('js-connection-detail-list');
        list.innerHTML = '<div class="connection-detail__item"><span>车牌号</span><strong>' + escapeHtml(binding.plateNo || '—') + '</strong></div>' +
            '<div class="connection-detail__item"><span>连接状态</span><strong class="connection-detail__state">已连接</strong></div>' +
            '<div class="connection-detail__item"><span>绑定时间</span><strong>' + escapeHtml(formatBindingTime(binding.boundAt)) + '</strong></div>';
        document.getElementById('js-connection-overlay').classList.add('show');
    }
    function openVehicleBinding() {
        var target = 'qrcode.html?scene=bind&returnUrl=inspection-management.html';
        if (window.parent && window.parent !== window) {
            window.parent.location.href = target;
        } else {
            window.location.href = target;
        }
    }
    function bindConnectionRow() {
        var row = document.getElementById('js-connection-row');
        if (!row) return;
        row.addEventListener('click', function () {
            var binding = getVehicleBinding();
            if (binding && binding.plateNo) {
                openConnectionDetail(binding);
            } else {
                openVehicleBinding();
            }
        });
    }
    // 第 2 行：任务日期 - 作业时间 - 作业资源
    function cardMetaHtml(t) {
        return '<div class="task-line task-card__meta">' +
                '<span class="mono">' + (t.planDate || '—') + '</span>' +
                '<span class="sep">·</span>' +
                '<span class="mono">' + t.time + '</span>' +
                '<span class="sep">·</span>' +
                '<span class="resource">' + (t.resource || '—') + '</span>' +
            '</div>';
    }
    // 第 3 行：3 列指标卡（开始时间 / 作业里程 km 2 位 / 作业时长 min 整数）
    function cardKpisHtml(t) {
        var mileage = (t.mileage == null || t.mileage === '') ? '—' : Number(t.mileage).toFixed(2);
        var duration = (t.duration == null || t.duration === '') ? '—' : t.duration;
        return '<div class="task-line task-kpis">' +
                '<div class="task-kpi"><span class="task-kpi__label">开始时间</span><span class="task-kpi__value">' + fmt(t.start, '', '—') + '</span></div>' +
                '<div class="task-kpi"><span class="task-kpi__label">作业里程</span><span class="task-kpi__value" id="js-kpi-mileage">' + mileage + '</span><span class="task-kpi__unit"> km</span></div>' +
                '<div class="task-kpi"><span class="task-kpi__label">作业时长</span><span class="task-kpi__value" id="js-kpi-duration">' + duration + '</span><span class="task-kpi__unit"> min</span></div>' +
            '</div>';
    }
    function bindDetail(t) {
        var btn = document.getElementById('js-btn-detail');
        if (btn) btn.addEventListener('click', function () { location.href = 'inspection-task-detail.html?id=' + encodeURIComponent(t.id) + '&from=map'; });
    }

    function renderTaskCard(t) {
        var card = document.getElementById('js-task-card');
        var actionsEl = document.getElementById('js-actions');
        var workbench = document.getElementById('workbench');

        // 执行态（PRD 6.1.1-8）：卡片收起，仅展示片区名称 + 开始时间/作业里程/作业时长
        if (t.status === 'running') {
            workbench.classList.add('is-executing');
            card.classList.add('is-executing');
            card.innerHTML = connectionRowHtml() + cardHeadHtml(t, false, false) + cardKpisHtml(t);
            bindConnectionRow();
            bindDetail(t);
            actionsEl.innerHTML = '<div class="exec-actions">' +
                '<button type="button" class="exec-action exec-action--finish" id="js-btn-finish" aria-label="结束任务">' +
                    '<span class="exec-action__name">结束任务</span>' +
                '</button>' +
                '<button type="button" class="exec-action exec-action--report" id="js-btn-report" aria-label="事件上报，拍照取证">' +
                    '<span class="exec-action__name">事件上报</span>' +
                '</button>' +
            '</div>';
            document.getElementById('js-btn-report').addEventListener('click', function () { openReportCapture(t); });
            document.getElementById('js-btn-finish').addEventListener('click', function () { requestFinish(t); });
            return;
        }

        // 待开始 / 已完成（PRD 6.1.1-2）：完整多行任务卡片
        workbench.classList.remove('is-executing');
        card.classList.remove('is-executing');
        var html = connectionRowHtml() + cardHeadHtml(t, true) + cardMetaHtml(t);
        // 已完成展示执行指标；待接收（未开始）无执行数据，不展示
        if (t.status === 'done') {
            html += cardKpisHtml(t);
        }
        card.innerHTML = html;
        bindConnectionRow();
        bindDetail(t);

        // 操作行：任务列表入口已移至地图右侧“今日任务”按钮。
        if (t.status === 'todo') {
            actionsEl.innerHTML = '<div class="task-actions"><button type="button" class="primary-action" id="js-btn-start">开始任务</button></div>';
            document.getElementById('js-btn-start').addEventListener('click', function () { onStart(t); });
        } else { // done
            actionsEl.innerHTML = '<div class="task-actions"><button type="button" class="primary-action" style="background:#f5f5f5;color:#00000040;box-shadow:none;">已完成</button></div>';
        }
    }

    /* ===== 开始任务校验链（PRD 6.1.1-3） ===== */
    function onStart(t) {
        // 1. 时间范围校验（阻断项）—— 静态原型：以当前是否早于开始时间模拟
        // 2. 其他进行中任务校验（阻断项）
        var running = TASKS.find(function (x) { return x.status === 'running'; });
        if (running && running.id !== t.id) {
            toast('当前存在进行中任务');
            selectedId = running.id;
            renderAll();
            return;
        }
        // 3. 人员位置是否在路段范围（阻断项）—— 静态原型 mock 通过
        // 校验通过
        t.start = nowHHMM();
        t.mileage = 0.01;
        t.duration = 1;
        t._traveled = null;   // 重置动画进度
        t._stepIdx = 1;
        setStateStatus(t.id, 'running');
        toast('任务已开始');
        renderAll();
        startTrackAnimation(t);
    }

    /* ===== 事件上报：先拍照，再进入上报页 ===== */
    var pendingReportTaskId = null;
    var cameraInput = document.getElementById('js-camera-input');
    function openReportCapture(t) {
        pendingReportTaskId = t.id;
        cameraInput.value = '';
        cameraInput.click();
    }
    cameraInput.addEventListener('change', function () {
        var file = cameraInput.files && cameraInput.files[0];
        var task = findTask(pendingReportTaskId);
        if (!file || !task) return;
        var reader = new FileReader();
        reader.onload = function () {
            try { sessionStorage.setItem('kuwash-inspection-report-photo', reader.result); } catch (e) {}
            openReportForm(task);
        };
        reader.readAsDataURL(file);
    });
    function openReportForm(t) {
        var target = 'inspection-problem-report.html?task=' + encodeURIComponent(t.id) + '&captured=1';
        if (window.parent && window.parent !== window) {
            window.parent.location.href = target;
        } else {
            window.location.href = target;
        }
    }

    /* ===== 结束任务：完成校验通过后，二次确认 ===== */
    var pendingFinishTaskId = null;
    function requestFinish(t) {
        if (!t || t.status !== 'running') {
            toast('当前任务状态不可结束');
            return;
        }
        pendingFinishTaskId = t.id;
        document.getElementById('js-finish-desc').textContent = '结束“' + t.area + '”后将停止记录本次巡查轨迹。';
        document.getElementById('js-finish-overlay').classList.add('show');
    }
    function closeFinishConfirm() {
        pendingFinishTaskId = null;
        document.getElementById('js-finish-overlay').classList.remove('show');
    }

    /* ===== 结束任务 → 今日回顾（本期跳占位，PRD 5.1） ===== */
    function onFinish(t) {
        // 静态原型中，任务完成校验已在确认层展示为通过。
        stopTrackAnimation(false);
        setStateStatus(t.id, 'done');
        var nextTodo = TASKS.find(function (x) { return x.status === 'todo'; });
        if (nextTodo) {
            selectedId = nextTodo.id;
            toast('已结束当前任务，已自动推送下一条');
            renderAll();
        } else {
            // 今日任务均已完成 → 跳转今日回顾（本期占位）
            // 嵌入态需顶到外壳层跳转（base target=_parent 只对链接点击生效，location.href 需显式指定 parent）
            toast('今日任务均已完成，进入今日回顾');
            var target = 'placeholder.html?from=inspection-today-review&title=' + encodeURIComponent('今日回顾');
            setTimeout(function () {
                if (window.parent && window.parent !== window) {
                    window.parent.location.href = target;
                } else {
                    location.href = target;
                }
            }, 600);
        }
    }

    function setStateStatus(id, status) {
        state[id] = state[id] || {};
        state[id].status = status;
        var t = findTask(id);
        if (t) {
            t.status = status;
            state[id].start = t.start;
            state[id].mileage = t.mileage;
            state[id].duration = t.duration;
        }
        saveState(state);
    }
    function nowHHMM() {
        // 脚本环境不可用 Date.now/new Date，用静态占位（演示数据已含真实时间）
        return '10:31';
    }

    /* ===== 今日待办抽屉（PRD 6.1.1-4~7） ===== */
    function renderSheetStats() {
        var c = countBy();
        document.getElementById('js-sheet-stats').innerHTML =
            '<span class="stat"><span class="dot" style="background:#faad14"></span>未完成 <span class="num">' + c.todo + '</span></span>' +
            '<span class="stat"><span class="dot" style="background:#52c41a"></span>进行中 <span class="num">' + c.running + '</span></span>' +
            '<span class="stat"><span class="dot" style="background:#1677ff"></span>已完成 <span class="num">' + c.done + '</span></span>';
    }
    function renderSheetBody() {
        var body = document.getElementById('js-sheet-body');
        var sorted = sortedTasks();
        if (!sorted.length) {
            body.innerHTML = '<div class="sheet-empty"><div class="sheet-empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/></svg></div>暂无今日待办任务</div>';
            return;
        }
        var groups = [{ key: 'todo', label: '未开始' }, { key: 'running', label: '进行中' }, { key: 'done', label: '已完成' }];
        var html = '';
        var lastGroup = null;
        sorted.forEach(function (t) {
            if (t.status !== lastGroup) {
                var g = groups.find(function (x) { return x.key === t.status; });
                html += '<div class="sheet__group">' + g.label + '</div>';
                lastGroup = t.status;
            }
            // 卡片两行（对齐 PRD 6.1.2-3）：片区名-事件上报数（未开始不显示）-状态 / 任务日期-作业时间-作业资源
            var countHtml = (t.status !== 'todo') ? '<span class="sheet-task__count">事件上报 ' + t.problems + '</span>' : '';
            html += '<div class="sheet-task' + (t.id === selectedId ? ' is-selected' : '') + '" data-id="' + t.id + '">' +
                '<div class="sheet-task__r1"><span class="sheet-task__area">' + t.area + '</span>' +
                countHtml +
                '<span class="tag ' + STATUS_TAG[t.status] + '">' + STATUS_TEXT[t.status] + '</span></div>' +
                '<div class="sheet-task__r2"><span class="mono">' + (t.planDate || '—') + '</span><span class="sep">·</span><span class="mono">' + t.time + '</span><span class="sep">·</span><span>' + (t.resource || '—') + '</span></div>' +
            '</div>';
        });
        body.innerHTML = html;
        body.querySelectorAll('.sheet-task').forEach(function (el) {
            el.addEventListener('click', function () {
                stopTrackAnimation(false);
                selectedId = el.dataset.id;
                closeSheet();
                renderAll();
            });
        });
    }
    function openSheet() {
        renderSheetStats();
        renderSheetBody();
        document.getElementById('js-sheet').classList.add('is-open');
        document.getElementById('js-sheet-mask').classList.add('is-open');
        document.getElementById('workbench').classList.add('sheet-open');
    }
    function closeSheet() {
        document.getElementById('js-sheet').classList.remove('is-open');
        document.getElementById('js-sheet-mask').classList.remove('is-open');
        document.getElementById('workbench').classList.remove('sheet-open');
    }

    /* ===== 今日事件抽屉 ===== */
    function renderProblemSheetBody() {
        var body = document.getElementById('js-problem-sheet-body');
        var groups = groupProblemsByStatus(todayProblems());
        var hasAny = PROB_STATUS_ORDER.some(function (s) { return groups[s].length; });
        if (!hasAny) {
            body.innerHTML = '<div class="sheet-empty"><div class="sheet-empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 3 19a2 2 0 0 0 1.75 3h14.5A2 2 0 0 0 21 19L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg></div>暂无今日上报事件</div>';
            return;
        }
        function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function renderItem(p) {
            var time = (p.reportedAt || '').slice(11, 16) || '—';
            var discoverCls = p.discoverType === 'manual' ? 'problem-discover--manual' : 'problem-discover--ai';
            var discoverTxt = p.discoverType === 'manual' ? '人工' : 'AI';
            var descRow = p.desc ? '<span class="problem-sheet-item__desc">' + esc(p.desc) + '</span>' : '';
            return '<article class="problem-sheet-item" data-id="' + p.id + '" data-task-id="' + p.taskId + '">' +
                '<button type="button" class="problem-sheet-item__summary" aria-label="在地图定位' + esc(p.loc) + '事件">' +
                    '<span class="problem-sheet-item__content">' +
                        '<span class="problem-sheet-item__head">' +
                            '<span class="problem-sheet-item__time">' + esc(time) + '</span>' +
                            '<span class="problem-sheet-item__sep">·</span>' +
                            '<span class="problem-sheet-item__location">' + esc(p.loc) + '</span>' +
                        '</span>' +
                        '<span class="problem-sheet-item__meta">' +
                            '<span class="problem-sheet-item__type">' + esc(p.problemType || '未知') + '</span>' +
                            '<span class="problem-sheet-item__tags">' +
                                '<span class="problem-discover ' + discoverCls + '">' + discoverTxt + '</span>' +
                                '<span class="tag ' + (PROB_TAG[p.status] || 'tag--unidentified') + '">' + esc(p.statusText) + '</span>' +
                            '</span>' +
                        '</span>' +
                        descRow +
                    '</span>' +
                '</button>' +
                '<button type="button" class="problem-sheet-item__detail" data-id="' + p.id + '" data-task-id="' + p.taskId + '" aria-label="进入' + esc(p.loc) + '事件详情" title="进入事件详情">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>' +
                '</button>' +
            '</article>';
        }
        var html = '';
        PROB_STATUS_ORDER.forEach(function (s) {
            if (!groups[s].length) return;   // 空组不展示
            html += '<div class="sheet__group">' + PROB_STATUS_TEXT[s] + ' · ' + groups[s].length + '</div>';
            html += groups[s].map(renderItem).join('');
        });
        body.innerHTML = html;
        // 卡片主体点击：聚焦/取消聚焦（toggle）
        body.querySelectorAll('.problem-sheet-item__summary').forEach(function (el) {
            el.addEventListener('click', function () {
                var item = el.closest('.problem-sheet-item');
                var id = item.dataset.id;
                if (focusedProblemId === id) {
                    clearProblemFocus();
                } else {
                    focusProblem(id);
                }
            });
        });
        // 右侧详情按钮：打开事件详情（阻止冒泡到主体）
        body.querySelectorAll('.problem-sheet-item__detail').forEach(function (el) {
            el.addEventListener('click', function (e) {
                e.stopPropagation();
                openProblemDetail(el.dataset.id, el.dataset.taskId);
            });
        });
    }
    function openProblemSheet() {
        stopTrackAnimation(false);   // 切换到全部事件点位视图，暂停轨迹动画（进度已存 task）
        closeSheet();
        clearProblemFocus();
        renderProblemSheetBody();
        document.getElementById('js-problem-sheet').classList.add('is-open');
        document.getElementById('js-problem-sheet-mask').classList.add('is-open');
        document.getElementById('workbench').classList.add('sheet-open');
        document.getElementById('js-tool-problem').classList.add('is-active');
        renderAllProblemMarkers();   // 地图同步展示全部事件点位
    }
    function closeProblemSheet() {
        document.getElementById('js-problem-sheet').classList.remove('is-open');
        document.getElementById('js-problem-sheet-mask').classList.remove('is-open');
        document.getElementById('workbench').classList.remove('sheet-open');
        document.getElementById('js-tool-problem').classList.remove('is-active');
        clearProblemFocus();
        clearAllProblemMarkers();    // 清除全部事件点位
        renderAll();                 // 恢复选中任务地图
    }

    /* ===== 顶部统计 + 控制台计数 ===== */
    function renderSummary() {
        var c = countBy();
        var problemCount = todayProblems().length;
        document.getElementById('js-problem-badge').textContent = problemCount;
        document.getElementById('js-map-task-count').textContent = TASKS.length;
    }

    function renderAll() {
        var t = findTask(selectedId) || TASKS[0];
        renderMap(t);
        renderTaskCard(t);
        renderSummary();
        syncLegendPos();
        notifyExecutionShell(t.status === 'running');
    }
    // 图例紧贴任务卡片上方，避免重叠
    function syncLegendPos() {
        var legend = document.getElementById('js-legend');
        var console = document.getElementById('js-console');
        if (!legend || !console) return;
        requestAnimationFrame(function () {
            var consoleH = console.offsetHeight;
            legend.style.bottom = (consoleH + 12) + 'px';
        });
    }

    function notifyExecutionShell(executing) {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'inspectionExecuting', value: executing }, '*');
        }
    }

    /* ===== 事件绑定 ===== */
    document.getElementById('js-grip').addEventListener('click', openSheet);
    document.getElementById('js-sheet-close').addEventListener('click', closeSheet);
    document.getElementById('js-sheet-mask').addEventListener('click', closeSheet);
    document.getElementById('js-map-tasks').addEventListener('click', openSheet);
    document.getElementById('js-tool-problem').addEventListener('click', function () {
        if (this.classList.contains('is-active')) {
            closeProblemSheet();   // 再次点击收起并恢复地图
        } else {

        }

    document.getElementById('js-finish-cancel').addEventListener('click', closeFinishConfirm);

        var task = findTask(pendingFinishTaskId);

        if (event.target === this) closeFinishConfirm();

    document.getElementById('js-connection-close').addEventListener('click', closeConnectionDetail);
    document.getElementById('js-connection-overlay').addEventListener('click', function (event) {
        if (event.target === this) closeConnectionDetail();

    document.getElementById('js-connection-disconnect').addEventListener('click', openConnectionDisconnectConfirm);
    document.getElementById('js-connection-disconnect-cancel').addEventListener('click', closeConnectionDisconnectConfirm);
    document.getElementById('js-connection-disconnect-confirm').addEventListener('click', disconnectVehicleConnection);
    document.getElementById('js-connection-disconnect-overlay').addEventListener('click', function (event) {
        if (event.target === this) closeConnectionDisconnectConfirm();
    });
    // 返回按钮：对齐用车管理 go('home.html')，嵌入态顶到外壳层直接退回工作台
    function goBack(url) {
        url = url || 'home.html';
        if (window.parent && window.parent !== window.self) {
            window.parent.location.href = url;
        } else {
            window.location.href = url;
        }
    }
    document.getElementById('js-top-back').addEventListener('click', function () { goBack('home.html'); });
    /* ===== 顶部：更多弹出菜单 + 退出 ===== */
    var moreBtn = document.getElementById('js-top-more');
    var morePop = document.getElementById('js-more-pop');
    moreBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        morePop.classList.toggle('show');
        moreBtn.setAttribute('aria-expanded', morePop.classList.contains('show') ? 'true' : 'false');
    });
    document.addEventListener('click', function () {
        morePop.classList.remove('show');
        moreBtn.setAttribute('aria-expanded', 'false');
    });
    morePop.addEventListener('click', function (e) {
        var action = e.target.getAttribute('data-action');
        if (!action) return;
        morePop.classList.remove('show');
        moreBtn.setAttribute('aria-expanded', 'false');
        if (action === 'today') { toast('今日回顾将在全部任务完成后展示'); }
        else if (action === 'layer') {
            if (mapReady) {
                facilitiesVisible = !facilitiesVisible;
                renderFacilities();
                var lb = document.getElementById('js-tool-layer');
                lb.classList.toggle('is-active', facilitiesVisible);
                lb.setAttribute('aria-pressed', facilitiesVisible ? 'true' : 'false');
                toast(facilitiesVisible ? '已显示辅助设施图层' : '已隐藏辅助设施图层');
            } else { toast('辅助设施图层已切换'); }
        }
        else if (action === 'about') { toast('品质巡查 v1.0'); }
    });
    document.getElementById('js-top-exit').addEventListener('click', function () {
        // 退出：优先通知外层 management 页做进行中任务校验，否则直接回首页
        try {
            if (window.parent && window.parent !== window && typeof window.parent.requestExit === 'function') {
                window.parent.requestExit();
                return;
            }
        } catch (err) {}
        goBack('home.html');
    });
    document.getElementById('js-tool-reset').addEventListener('click', function () {
        if (mapReady && leafletMap) { resetMapView(); toast('已复位至当前任务区域'); }
        else { toast('已复位至当前位置'); var t = findTask(selectedId); if (t) { var p = document.getElementById('js-person'); p.style.left = t.person.left; p.style.top = t.person.top; } }
    });
    document.getElementById('js-tool-layer').addEventListener('click', function () {
        if (!mapReady) { toast('辅助设施图层已切换'); return; }
        facilitiesVisible = !facilitiesVisible;
        renderFacilities();
        this.classList.toggle('is-active', facilitiesVisible);
        this.setAttribute('aria-pressed', facilitiesVisible ? 'true' : 'false');
        toast(facilitiesVisible ? '已显示辅助设施图层' : '已隐藏辅助设施图层');
    });
    document.getElementById('js-tool-legend').addEventListener('click', function () {
        var legend = document.getElementById('js-legend');
        var btn = document.getElementById('js-tool-legend');
        var hidden = legend.classList.toggle('is-hidden');
        btn.classList.toggle('is-active', !hidden);
        btn.classList.toggle('is-inactive', hidden);
        btn.setAttribute('aria-pressed', hidden ? 'false' : 'true');
        toast(hidden ? '已隐藏图例' : '已显示图例');
    });
    document.getElementById('js-banner-view').addEventListener('click', function () { closeBanner(); openSheet(); });

    /* ===== 新任务轻提醒 banner（PRD 6.1.1-9，静态演示） ===== */
    var bannerTimer = null;
    // 文案格式：新任务【作业类型】-【任务区域】-【任务计划时间】
    function buildBannerText(task) {
        var t = task || TASKS.find(function (x) { return x.status === 'todo'; }) || TASKS[0];
        if (!t) { return '新任务已派发'; }
        var workType = t.workType || '—';
        var area = t.area || '—';
        var planTime = (t.planDate || '') + ' ' + (t.time || '');
        return '新任务 ' + workType + '-' + area + '-' + planTime.replace(/^\s+/, '');
    }
    function showBanner() {
        var txtEl = document.getElementById('js-banner-txt');
        if (txtEl) { txtEl.textContent = buildBannerText(); }
        document.getElementById('js-banner').classList.add('show');
        // PRD：默认显示 1min；演示缩短为 6s
        bannerTimer = setTimeout(closeBanner, 6000);
    }
    function closeBanner() {
        document.getElementById('js-banner').classList.remove('show');
        if (bannerTimer) { clearTimeout(bannerTimer); bannerTimer = null; }
    }

    /* ===== 嵌入态：响应外壳 queryExecuting（退出校验） ===== */
    window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type === 'queryExecuting') {
            var executing = TASKS.some(function (t) { return t.status === 'running'; });
            try {
                event.source.postMessage({ type: 'executingStatus', value: executing }, '*');
            } catch (e) {}
        }
    });

    /* ===== 项目切换联动（PRD：数据随项目刷新） ===== */
    document.addEventListener('projectChanged', function () {
        toast('项目已切换，任务列表已刷新');
        stopTrackAnimation(false);
        renderAll();
    });

    /* ===== 初始化 ===== */
    initLeafletMap();
    renderAll();
    // 双层 iframe 嵌入下容器尺寸可能延迟就绪，需多次 invalidateSize
    if (mapReady && leafletMap) {
        [0, 60, 200, 500].forEach(function (delay) {
            setTimeout(function () { leafletMap.invalidateSize(false); }, delay);
        });
        window.addEventListener('load', function () { leafletMap.invalidateSize(false); });
        window.addEventListener('resize', function () { leafletMap.invalidateSize(false); });
    }
    if (initialSheet === 'problems') {
        setTimeout(openProblemSheet, 0);
    }
    // 若 URL 指定 action=start，自动触发开始
    if (action === 'start') {
        var t0 = findTask(selectedId);
        if (t0 && t0.status === 'todo') { setTimeout(function () { onStart(t0); }, 300); }
    }
    // 演示：加载后延时弹一次新任务 banner
    setTimeout(showBanner, 1800);
    // 页面卸载时停止动画并落盘进度
    window.addEventListener('pagehide', function () { stopTrackAnimation(false); });
})();
</script>
</body>
</html>
