<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>上报记录 - 酷哇APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 375px;
            min-height: 100vh;
            background: #f5f5f5;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            color: #1f2329;
            width: 100%;
            margin: 0;
            min-height: 100vh;
        }
        button, input { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        .top-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            margin: 0 auto;
            width: 100%; max-width: 375px;
            height: 44px;
            background: rgba(255,255,255,0.96);
            border-bottom: 1px solid #e5e6eb;
            display: flex; align-items: center; justify-content: center;
            z-index: 30;
        }
        .top-nav-back {
            position: absolute; left: 8px; width: 36px; height: 36px;
            display: inline-flex; align-items: center; justify-content: center;
            color: #1f2329; text-decoration: none; border-radius: 6px;
        }
        .top-nav-back:active { background: #f2f3f5; }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title { font-size: 16px; line-height: 22px; font-weight: 600; }
        .page { padding-top: 44px; min-height: 100vh; }
        /* 工具栏：双胶囊 + 计数 */
        .toolbar {
            display: flex; align-items: center; justify-content: space-between;
            min-height: 52px; padding: 8px 16px; background: #ffffff;
            border-bottom: 1px solid #f0f1f2;
        }
        .toolbar-chips {
            display: flex; align-items: center; gap: 8px;
            min-width: 0; flex: 1; overflow-x: auto;
            scrollbar-width: none;
        }
        .toolbar-chips::-webkit-scrollbar { display: none; }
        .filter-chip {
            display: inline-flex; align-items: center; gap: 6px;
            max-width: 100%; height: 36px; padding: 0 11px;
            border: 1px solid #e5e6eb; border-radius: 18px;
            background: #ffffff; color: #4e5969; cursor: pointer;
            flex-shrink: 0;
        }
        .filter-chip:active { background: #f7f8fa; }
        .filter-chip svg { width: 16px; height: 16px; color: #1677ff; flex-shrink: 0; }
        .filter-text { overflow: hidden; font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
        .filter-arrow { color: #86909c; font-size: 11px; }
        .task-count { color: #86909c; font-size: 12px; line-height: 18px; flex-shrink: 0; margin-left: 12px; }
        /* 类型筛选单行 */
        .type-bar {
            display: flex; gap: 8px; padding: 10px 16px;
            background: #ffffff;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .type-bar::-webkit-scrollbar { display: none; }
        .type-pill {
            display: inline-flex; align-items: center; justify-content: center;
            height: 30px; padding: 0 14px; border-radius: 16px;
            border: 1px solid #e5e6eb; background: #ffffff;
            color: #4e5969; font-size: 13px;
            cursor: pointer; white-space: nowrap; flex-shrink: 0;
        }
        .type-pill:active { background: #f7f8fa; }
        .type-pill.active {
            background: #e6f4ff; border-color: #1677ff; color: #1677ff; font-weight: 500;
        }
        /* 汇总条 */
        .summary-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #f5f5f5;
            color: #86909c; font-size: 12px; line-height: 18px;
            border-bottom: 1px solid #ececec;
        }
        .summary-bar .item strong { color: #1f2329; font-weight: 600; margin: 0 2px; }
        /* 记录卡片 */
        .list-area { padding: 12px 16px 24px; }
        .record-list { display: grid; gap: 12px; }
        .record-card {
            position: relative;
            background: #ffffff;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            padding: 14px 16px;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: 0 2px 8px rgba(31,35,41,0.04);
            transition: transform 0.15s, border-color 0.15s;
        }
        .record-card:active {
            transform: scale(0.99);
            border-color: #bedaff;
        }
        .card-row1 {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
        }
        .tag {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 22px; padding: 1px 8px;
            border-radius: 4px;
            font-size: 12px; line-height: 18px; font-weight: 500;
        }
        .tag-fuel { background: #fff7e6; color: #d46b08; }
        .tag-water { background: #e6f4ff; color: #1677ff; }
        .tag-charge { background: #f6ffed; color: #389e0d; }
        .card-amount {
            font-size: 18px; font-weight: 600; color: #1f2329;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .thumb-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 18px; height: 18px;
            color: #86909c; flex-shrink: 0;
        }
        .thumb-badge svg { width: 14px; height: 14px; }
        .card-row2 {
            margin-top: 6px;
            color: #1f2329; font-size: 16px; line-height: 24px; font-weight: 500;
        }
        .card-meta {
            display: flex; align-items: center; gap: 8px;
            margin-top: 8px; padding-top: 8px;
            border-top: 1px solid #f0f1f2;
            color: #86909c; font-size: 12px; line-height: 18px;
        }
        .card-meta-item {
            display: inline-flex; align-items: center; gap: 4px;
            min-width: 0;
        }
        .card-meta-item svg { width: 12px; height: 12px; }
        .card-meta-sep { width: 1px; height: 11px; background: #e5e6eb; flex-shrink: 0; }
        .card-meta-item.grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* 空状态 */
        .empty-state {
            min-height: 320px; padding: 72px 24px 40px; text-align: center;
            background: #ffffff; border-radius: 12px;
            margin: 12px 16px;
        }
        .empty-icon {
            width: 60px; height: 60px; margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #f2f3f5; color: #86909c;
        }
        .empty-icon svg { width: 28px; height: 28px; }
        .empty-title { color: #1f2329; font-size: 15px; line-height: 22px; font-weight: 600; }
        .empty-desc { margin-top: 7px; color: #86909c; font-size: 12px; line-height: 19px; }
        .empty-action {
            display: inline-flex; align-items: center; justify-content: center;
            margin-top: 20px; min-width: 140px; height: 40px;
            padding: 0 18px; border-radius: 20px;
            background: #1677ff; color: #ffffff;
            font-size: 14px; font-weight: 500;
            text-decoration: none;
        }
        .empty-action:active { opacity: 0.85; }
        /* 加载更多 */
        .load-more {
            text-align: center; padding: 16px 0 8px;
            font-size: 13px; color: #86909c;
        }
        .load-more .spinner {
            display: inline-block; width: 12px; height: 12px; margin-right: 6px;
            border: 2px solid #d8dadf; border-top-color: #1677ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: -2px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* 底部弹窗（Sheet） */
        .sheet-overlay {
            position: fixed; inset: 0; z-index: 50;
            display: none; align-items: flex-end; justify-content: center;
            background: rgba(0,0,0,0.5);
        }
        .sheet-overlay.show { display: flex; }
        .sheet {
            width: 100%; max-width: 375px;
            padding-bottom: env(safe-area-inset-bottom);
            border-radius: 16px 16px 0 0; background: #ffffff;
            animation: sheet-in 0.2s ease-out;
        }
        @keyframes sheet-in {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .sheet-handle {
            width: 36px; height: 4px; margin: 8px auto;
            border-radius: 2px; background: #d8dadf;
        }
        .sheet-header {
            display: flex; align-items: center; justify-content: space-between;
            height: 48px; padding: 0 16px; border-bottom: 1px solid #f0f1f2;
        }
        .sheet-title { font-size: 16px; line-height: 24px; font-weight: 600; }
        .sheet-close {
            width: 36px; height: 36px; border: 0; border-radius: 6px;
            background: transparent; color: #4e5969; cursor: pointer;
        }
        .sheet-close:active { background: #f2f3f5; }
        .sheet-close svg { width: 20px; height: 20px; }
        .sheet-item {
            width: 100%; min-height: 50px; padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            border: 0; border-bottom: 1px solid #f5f5f5;
            background: #ffffff; color: #1f2329;
            font-size: 14px; cursor: pointer;
        }
        .sheet-item:active { background: #fafafa; }
        .sheet-item.active { color: #1677ff; font-weight: 500; }
        .sheet-check { visibility: hidden; color: #1677ff; }
        .sheet-item.active .sheet-check { visibility: visible; }
        /* 时间自定义面板 */
        .custom-panel {
            display: none; padding: 16px;
            border-top: 1px solid #f0f1f2; background: #fafafa;
        }
        .custom-panel.show { display: block; }
        .date-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .date-field label {
            display: block; margin-bottom: 6px;
            color: #86909c; font-size: 12px; line-height: 18px;
        }
        .date-field input {
            width: 100%; height: 42px; padding: 0 10px;
            border: 1px solid #e5e6eb; border-radius: 8px;
            background: #ffffff; color: #1f2329; outline: none;
        }
        .date-field input:focus {
            border-color: #1677ff; box-shadow: 0 0 0 2px #e8f3ff;
        }
        .custom-error {
            min-height: 18px; margin-top: 7px;
            color: #ff4d4f; font-size: 12px; line-height: 18px;
        }
        .custom-actions {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 8px; margin-top: 8px;
        }
        .custom-button {
            height: 40px; border: 0; border-radius: 8px;
            font-size: 14px; cursor: pointer;
        }
        .custom-button.secondary { background: #f2f3f5; color: #1f2329; }
        .custom-button.primary { background: #1677ff; color: #ffffff; }
        /* Toast */
        .toast {
            position: fixed; left: 50%; top: 50%; z-index: 100;
            max-width: 260px; padding: 10px 14px;
            border-radius: 8px; background: rgba(31,35,41,0.82);
            color: #ffffff; font-size: 14px; line-height: 20px;
            text-align: center; opacity: 0; pointer-events: none;
            transform: translate(-50%,-50%); transition: opacity 0.2s;
        }
        .toast.show { opacity: 1; }
        @media (max-width: 340px) {
            .toolbar, .list-area, .type-bar { padding-left: 12px; padding-right: 12px; }
            .record-card { padding: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .record-card, .toast, .sheet, .spinner {
                transition: none; animation: none;
            }
        }
    </style>
</head>
<body data-no-project-switcher="true">
    <header class="top-nav">
        <a href="home.html" class="top-nav-back" aria-label="返回" id="backLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 class="top-nav-title">上报记录</h1>
    </header>

    <main class="page">
        <!-- 工具栏：时间 + 车牌 双胶囊 -->
        <div class="toolbar">
            <div class="toolbar-chips">
                <button type="button" class="filter-chip" id="filterChip" aria-label="筛选时间范围">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
                    <span class="filter-text" id="filterLabel">近7天</span>
                    <span class="filter-arrow">▾</span>
                </button>
                <button type="button" class="filter-chip" id="plateChip" aria-label="筛选车牌">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 17h14l-1.6-5.2A2.5 2.5 0 0 0 15 10H9a2.5 2.5 0 0 0-2.4 1.8L5 17Z"/><path d="M7 17v2M17 17v2M8 14h8"/></svg>
                    <span class="filter-text" id="plateLabel">全部车牌</span>
                    <span class="filter-arrow">▾</span>
                </button>
            </div>
        </div>

        <!-- 类型筛选（单行胶囊） -->
        <div class="type-bar" role="tablist" aria-label="记录类型">
            <button type="button" class="type-pill active" data-type="all" role="tab" aria-selected="true">全部</button>
            <button type="button" class="type-pill" data-type="fuel" role="tab" aria-selected="false">加油</button>
            <button type="button" class="type-pill" data-type="water" role="tab" aria-selected="false">加水</button>
            <button type="button" class="type-pill" data-type="charge" role="tab" aria-selected="false">充电</button>
        </div>

        <!-- 汇总条：根据时间筛选动态显示 -->
        <div class="summary-bar" id="summaryBar">
            <span class="item" id="summaryRange">近7天 <strong id="sumCount">0</strong> 笔 / 合计 <strong id="sumAmount">¥0.00</strong></span>
        </div>

        <!-- 列表 -->
        <div class="list-area">
            <div class="record-list" id="recordList"></div>
            <div class="load-more" id="loadMore" onclick="loadMore()">上拉加载更多</div>
        </div>
    </main>

    <!-- 时间筛选弹窗 -->
    <div class="sheet-overlay" id="filterSheet">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 class="sheet-title" id="filterTitle">选择时间范围</h2>
                <button type="button" class="sheet-close" id="sheetClose" aria-label="关闭时间筛选">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div id="sheetItems"></div>
            <div class="custom-panel" id="customPanel">
                <div class="date-grid">
                    <div class="date-field">
                        <label for="customStart">起始日期</label>
                        <input type="date" id="customStart">
                    </div>
                    <div class="date-field">
                        <label for="customEnd">结束日期</label>
                        <input type="date" id="customEnd">
                    </div>
                </div>
                <div class="custom-error" id="customError"></div>
                <div class="custom-actions">
                    <button type="button" class="custom-button secondary" id="customCancel">取消</button>
                    <button type="button" class="custom-button primary" id="customConfirm">确定</button>
                </div>
            </div>
        </section>
    </div>

    <!-- 车牌选择弹窗 -->
    <div class="sheet-overlay" id="plateSheet">
        <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="plateSheetTitle">
            <div class="sheet-handle"></div>
            <div class="sheet-header">
                <h2 class="sheet-title" id="plateSheetTitle">选择车牌</h2>
                <button type="button" class="sheet-close" id="plateSheetClose" aria-label="关闭车牌筛选">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                </button>
            </div>
            <div id="plateSheetItems"></div>
        </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // ====== 入口来源：动态切换返回地址 ======
        (function() {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from');
            const backLink = document.getElementById('backLink');
            if (backLink) {
                if (from === 'ocr') backLink.href = 'home-ocr.html';
                else if (from === 'vehicle') backLink.href = 'vehicle-management.html?tab=service';
                else backLink.href = 'home.html';
            }
        })();

        // ====== Mock 数据：14 条，覆盖 5 个车牌 / 4 个时间区间 / 3 个项目 ======
        // 参考日期 2026-07-11，所有时间围绕该日期分布
        const recordsData = [
            // 近 7 天（4 条）
            { id: 1,  type: 'fuel',   plate: '粤B·12345', amount: 420.00, time: '2026-07-10 09:30', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: true },
            { id: 2,  type: 'charge', plate: '粤B·67890', amount: 85.50,  time: '2026-07-09 18:15', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: true },
            { id: 3,  type: 'water',  plate: '粤B·12345', amount: 35.00,  time: '2026-07-09 14:00', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: false },
            { id: 4,  type: 'water',  plate: '粤B·22222', amount: 42.00,  time: '2026-07-08 16:30', reporter: '王五', project: '北京朝阳清洁项目',     hasPhoto: false },
            // 8~30 天（5 条）
            { id: 5,  type: 'fuel',   plate: '粤B·54321', amount: 380.00, time: '2026-07-04 08:45', reporter: '李四', project: '广州天河环卫项目',     hasPhoto: true },
            { id: 6,  type: 'charge', plate: '粤B·11111', amount: 120.00, time: '2026-07-02 20:00', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: false },
            { id: 7,  type: 'water',  plate: '粤B·67890', amount: 28.00,  time: '2026-06-28 11:20', reporter: '李四', project: '深圳南山智慧环卫项目', hasPhoto: false },
            { id: 8,  type: 'fuel',   plate: '粤B·12345', amount: 460.00, time: '2026-06-25 07:50', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: true },
            { id: 9,  type: 'water',  plate: '粤B·54321', amount: 50.00,  time: '2026-06-22 15:10', reporter: '李四', project: '广州天河环卫项目',     hasPhoto: false },
            // 31~180 天（3 条）
            { id: 10, type: 'fuel',   plate: '粤B·12345', amount: 395.00, time: '2026-05-20 09:00', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: false },
            { id: 11, type: 'charge', plate: '粤B·12345', amount: 95.00,  time: '2026-05-30 19:30', reporter: '张三', project: '深圳南山智慧环卫项目', hasPhoto: false },
            { id: 12, type: 'fuel',   plate: '粤B·11111', amount: 410.00, time: '2026-05-15 10:15', reporter: '王五', project: '深圳南山智慧环卫项目', hasPhoto: true },
            // 180+ 天（2 条 - 仅全部时间可见）
            { id: 13, type: 'water',  plate: '粤B·67890', amount: 32.00,  time: '2026-03-15 13:40', reporter: '李四', project: '深圳南山智慧环卫项目', hasPhoto: false },
            { id: 14, type: 'fuel',   plate: '粤B·22222', amount: 500.00, time: '2026-02-10 08:20', reporter: '王五', project: '北京朝阳清洁项目',     hasPhoto: false }
        ];

        const typeLabels = { fuel: '加油', water: '加水', charge: '充电' };
        const typeClasses = { fuel: 'tag-fuel', water: 'tag-water', charge: 'tag-charge' };

        // ====== 状态变量 ======
        const referenceDate = new Date('2026-07-11');
        let currentType = 'all';
        let currentPlate = null;          // null = 全部车牌
        let currentFilter = { type: '7', label: '近7天' };
        let startDate = null;
        let endDate = null;
        let pageNo = 1;
        const PAGE_SIZE = 20;

        // ====== 时间筛选预设 ======
        const FILTERS = [
            { type: 'all',    label: '全部时间', days: null },
            { type: '7',      label: '近7天',   days: 7 },
            { type: '30',     label: '近30天',  days: 30 },
            { type: '180',    label: '近半年',  days: 180 },
            { type: 'custom', label: '自定义时间段', days: null }
        ];

        // ====== 工具函数 ======
        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        function getFromParam() {
            return new URLSearchParams(window.location.search).get('from') || '';
        }
        function getCurrentProjectName() {
            return (window.CityStewardCommon && window.CityStewardCommon.getCurrentProject)
                ? window.CityStewardCommon.getCurrentProject().name
                : '深圳南山智慧环卫项目';
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ====== 时间筛选逻辑 ======
        function rangeFor(type) {
            const selected = FILTERS.filter(f => f.type === type)[0] || FILTERS[1];
            if (selected.days === null) return { type: type, label: selected.label, from: null, to: null };
            const from = new Date(referenceDate);
            const to = new Date(referenceDate);
            from.setDate(from.getDate() - (selected.days - 1));
            return { type: type, label: selected.label, from: formatDate(from), to: formatDate(to) };
        }
        function isInDateRange(time) {
            if (!currentFilter.from || !currentFilter.to) return true;
            const d = time.slice(0, 10);
            return d >= currentFilter.from && d <= currentFilter.to;
        }

        // ====== 列表渲染 ======
        function applyFilters() {
            const projectName = getCurrentProjectName();
            return recordsData.filter(r => {
                if (currentType !== 'all' && r.type !== currentType) return false;
                if (currentPlate && r.plate !== currentPlate) return false;
                if (r.project !== projectName) return false;
                if (!isInDateRange(r.time)) return false;
                return true;
            }).sort((a, b) => b.time.localeCompare(a.time));
        }

        function renderSummary(filtered) {
            const rangeLabel = currentFilter.label || '全部时间';
            const count = filtered.length;
            const total = filtered.reduce((s, r) => s + r.amount, 0);
            document.getElementById('summaryRange').innerHTML =
                `${escapeHtml(rangeLabel)} <strong id="sumCount">${count}</strong> 笔 / 合计 <strong id="sumAmount">¥${total.toFixed(2)}</strong>`;
        }

        function renderList() {
            const container = document.getElementById('recordList');
            const loadMore = document.getElementById('loadMore');
            const filtered = applyFilters();
            renderSummary(filtered);

            const visible = filtered.slice(0, pageNo * PAGE_SIZE);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
                        </div>
                        <div class="empty-title">暂无记录</div>
                        <div class="empty-desc">当前筛选条件下没有数据<br>试试调整时间或车牌</div>
                        <a href="fuel-report.html" class="empty-action">去上报</a>
                    </div>`;
                loadMore.style.display = 'none';
                return;
            }

            container.innerHTML = visible.map(r => `
                <a href="record-detail.html?type=${r.type}&id=${r.id}&from=${getFromParam()}" class="record-card" data-type="${r.type}">
                    <div class="card-row1">
                        <span class="tag ${typeClasses[r.type]}">${typeLabels[r.type]}</span>
                        <span class="card-amount">¥${r.amount.toFixed(2)}</span>
                    </div>
                    <div class="card-row2">${escapeHtml(r.plate)}</div>
                    <div class="card-meta">
                        <span class="card-meta-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                            ${escapeHtml(r.time)}
                        </span>
                        <span class="card-meta-sep"></span>
                        <span class="card-meta-item">${escapeHtml(r.reporter)}</span>
                        <span class="card-meta-sep"></span>
                        <span class="card-meta-item grow">${escapeHtml(r.project)}</span>
                    </div>
                </a>
            `).join('');

            // 加载更多状态
            if (visible.length >= filtered.length) {
                loadMore.innerHTML = '没有更多了';
                loadMore.onclick = null;
                loadMore.style.cursor = 'default';
            } else {
                loadMore.innerHTML = '上拉加载更多';
                loadMore.onclick = loadMore;
                loadMore.style.cursor = 'pointer';
            }
        }

        // ====== 类型筛选 ======
        function bindTypeBar() {
            document.querySelector('.type-bar').addEventListener('click', function (e) {
                const btn = e.target.closest('[data-type]');
                if (!btn) return;
                document.querySelectorAll('.type-pill').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-selected', 'false');
                });
                btn.classList.add('active');
                btn.setAttribute('aria-selected', 'true');
                currentType = btn.getAttribute('data-type');
                pageNo = 1;
                renderList();
            });
        }

        // ====== 时间筛选弹窗 ======
        function renderFilterSheet() {
            const container = document.getElementById('sheetItems');
            container.innerHTML = FILTERS.map(f => {
                const active = currentFilter.type === f.type ? ' active' : '';
                return `<button type="button" class="sheet-item${active}" data-filter="${f.type}">
                    <span>${f.label}</span><span class="sheet-check">✓</span></button>`;
            }).join('');
        }
        function openFilterSheet() {
            renderFilterSheet();
            document.getElementById('filterSheet').classList.add('show');
        }
        function closeFilterSheet() {
            document.getElementById('filterSheet').classList.remove('show');
            document.getElementById('customPanel').classList.remove('show');
            document.getElementById('customError').textContent = '';
        }
        function bindFilterSheet() {
            const sheet = document.getElementById('filterSheet');
            document.getElementById('filterChip').addEventListener('click', openFilterSheet);
            document.getElementById('sheetClose').addEventListener('click', closeFilterSheet);
            sheet.addEventListener('click', e => { if (e.target === sheet) closeFilterSheet(); });
            document.getElementById('sheetItems').addEventListener('click', function (e) {
                const item = e.target.closest('[data-filter]');
                if (!item) return;
                const type = item.getAttribute('data-filter');
                if (type === 'custom') {
                    document.getElementById('customPanel').classList.add('show');
                    return;
                }
                applyPreset(type);
                closeFilterSheet();
            });
            document.getElementById('customCancel').addEventListener('click', closeFilterSheet);
            document.getElementById('customConfirm').addEventListener('click', confirmCustomRange);
        }
        function applyPreset(type) {
            const f = FILTERS.filter(x => x.type === type)[0];
            if (!f) return;
            if (f.days === null) {
                currentFilter = { type: type, label: f.label, from: null, to: null };
            } else {
                const r = rangeFor(type);
                currentFilter = r;
            }
            document.getElementById('filterLabel').textContent = currentFilter.label;
            pageNo = 1;
            renderList();
        }
        function confirmCustomRange() {
            const s = document.getElementById('customStart').value;
            const e = document.getElementById('customEnd').value;
            const err = document.getElementById('customError');
            if (!s || !e) { err.textContent = '请选择起止日期'; return; }
            if (s > e) { err.textContent = '起始日期不能晚于结束日期'; return; }
            err.textContent = '';
            currentFilter = { type: 'custom', label: `${s} 至 ${e}`, from: s, to: e };
            document.getElementById('filterLabel').textContent = currentFilter.label;
            closeFilterSheet();
            pageNo = 1;
            renderList();
        }

        // ====== 车牌筛选弹窗 ======
        function availablePlates() {
            const projectName = getCurrentProjectName();
            const seen = {};
            const list = [];
            recordsData.forEach(r => {
                if (r.project !== projectName) return;
                if (r.plate && !seen[r.plate]) {
                    seen[r.plate] = true;
                    list.push(r.plate);
                }
            });
            return list;
        }
        function renderPlateSheet() {
            const plates = availablePlates();
            let html = `<button type="button" class="sheet-item${currentPlate == null ? ' active' : ''}" data-plate="">
                <span>全部车牌</span><span class="sheet-check">✓</span></button>`;
            plates.forEach(p => {
                const active = currentPlate === p ? ' active' : '';
                html += `<button type="button" class="sheet-item${active}" data-plate="${escapeHtml(p)}">
                    <span>${escapeHtml(p)}</span><span class="sheet-check">✓</span></button>`;
            });
            document.getElementById('plateSheetItems').innerHTML = html;
        }
        function openPlateSheet() {
            renderPlateSheet();
            document.getElementById('plateSheet').classList.add('show');
        }
        function closePlateSheet() {
            document.getElementById('plateSheet').classList.remove('show');
        }
        function bindPlateSheet() {
            const sheet = document.getElementById('plateSheet');
            document.getElementById('plateChip').addEventListener('click', openPlateSheet);
            document.getElementById('plateSheetClose').addEventListener('click', closePlateSheet);
            sheet.addEventListener('click', e => { if (e.target === sheet) closePlateSheet(); });
            document.getElementById('plateSheetItems').addEventListener('click', function (e) {
                const item = e.target.closest('[data-plate]');
                if (!item) return;
                const value = item.getAttribute('data-plate');
                currentPlate = value || null;
                document.getElementById('plateLabel').textContent = currentPlate || '全部车牌';
                closePlateSheet();
                pageNo = 1;
                renderList();
            });
        }

        // ====== 加载更多 ======
        function loadMore() {
            const lm = document.getElementById('loadMore');
            lm.innerHTML = '<span class="spinner"></span>加载中…';
            setTimeout(() => {
                pageNo += 1;
                renderList();
            }, 600);
        }

        // ====== 初始化 ======
        function init() {
            // 默认时间范围：近 7 天
            currentFilter = rangeFor('7');
            startDate = currentFilter.from;
            endDate = currentFilter.to;
            bindTypeBar();
            bindFilterSheet();
            bindPlateSheet();
            renderList();
            // URL 参数：自动打开指定弹窗（用于自测截图）
            const openSheet = new URLSearchParams(location.search).get('openSheet');
            if (openSheet === 'plate') openPlateSheet();
            else if (openSheet === 'time') openFilterSheet();
        }

        // 监听项目切换事件，刷新记录列表
        document.addEventListener('projectChanged', function () {
            currentPlate = null;
            document.getElementById('plateLabel').textContent = '全部车牌';
            pageNo = 1;
            renderList();
        });

        init();
    </script>
    <script src="components/app-common.js"></script>
</body>
</html>
