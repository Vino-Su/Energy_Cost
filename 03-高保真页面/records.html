<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>上报记录 - 酷哇APP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 430px;
            min-height: 100vh;
            background: #f5f5f5;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            width: 100%;
            margin: 0;
            min-height: 100vh;
            padding-bottom: 0;
        }
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 430px;
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 0 16px;
        }
        .top-nav-back {
            position: absolute;
            left: 16px;
            display: flex;
            align-items: center;
            color: #000000d9;
            text-decoration: none;
            font-size: 14px;
        }
        .top-nav-title {
            font-size: 16px;
            font-weight: 600;
            color: #000000d9;
        }
        .top-nav-right {
            position: absolute;
            right: 16px;
            color: #1677ff;
            font-size: 14px;
            cursor: pointer;
        }
        .content-area {
            padding-top: 44px;
            padding-bottom: 16px;
        }
        .filter-bar {
            background: #ffffff;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #e8e8e8;
            overflow-x: auto;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            border: 1px solid #e8e8e8;
            background: #ffffff;
            color: #000000d9;
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #e6f4ff;
            border-color: #1677ff;
            color: #1677ff;
        }
        .date-range-btn {
            display: flex;
            align-items: center;
            border-radius: 8px;
            padding: 8px 12px;
            min-width: 180px;
            color: #00000073;
        }
        .date-range-btn svg {
            flex-shrink: 0;
        }
        .date-range-btn span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .record-card {
            background: #ffffff;
            border-radius: 12px;
            margin: 12px 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.15s;
        }
        .record-card:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-fuel { background: #fff7e6; color: #fa8c16; }
        .tag-water { background: #e6f4ff; color: #1677ff; }
        .tag-charge { background: #f6ffed; color: #52c41a; }
        .card-amount {
            font-size: 18px;
            font-weight: 600;
            color: #ff4d4f;
        }
        .card-plate {
            font-size: 15px;
            font-weight: 500;
            color: #000000d9;
            margin-bottom: 8px;
        }
        .card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #00000073;
        }
        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .load-more {
            text-align: center;
            padding: 16px;
            font-size: 13px;
            color: #00000073;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #00000073;
        }
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        .picker-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            max-width: 430px;
            margin: 0 auto;
        }
        .picker-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
        }
        .picker-header {
            padding: 16px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .picker-title {
            font-size: 16px;
            font-weight: 600;
        }
        .picker-close {
            font-size: 14px;
            color: #1677ff;
        }
        .picker-option {
            padding: 14px 16px;
            font-size: 14px;
            color: #000000d9;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .picker-option.selected {
            color: #1677ff;
            background: #e6f4ff;
        }
        .form-input {
            width: 100%;
            height: 44px;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            color: #000000d9;
            outline: none;
            background: #ffffff;
        }
        .form-input:focus {
            border-color: #1677ff;
            box-shadow: 0 0 0 2px #e6f4ff;
        }
        .date-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px;
            border-bottom: 1px solid #f5f5f5;
        }
        .date-preset {
            padding: 6px 14px;
            border: 1px solid #e8e8e8;
            border-radius: 16px;
            font-size: 13px;
            color: #000000d9;
            cursor: pointer;
            transition: all 0.2s;
        }
        .date-preset.active {
            background: #e6f4ff;
            border-color: #1677ff;
            color: #1677ff;
        }
        .date-range-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .date-range-row .form-input {
            flex: 1;
        }
        .reset-btn, .confirm-btn {
            flex: 1;
            height: 40px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .reset-btn {
            background: #f5f5f5;
            color: #000000d9;
        }
        .confirm-btn {
            background: #1677ff;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="home.html" class="top-nav-back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            <span>返回</span>
        </a>
        <div class="top-nav-title">上报记录</div>
        <div class="project-switcher" role="button" aria-label="切换项目" onclick="CityStewardCommon.openProjectPicker()">
            <span class="project-switcher-text">选择项目</span>
            <svg class="project-switcher-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
    </div>

    <div class="content-area">
        <!-- 筛选栏 -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterType(this,'all')">全部</button>
            <button class="filter-btn" onclick="filterType(this,'fuel')">加油</button>
            <button class="filter-btn" onclick="filterType(this,'water')">加水</button>
            <button class="filter-btn" onclick="filterType(this,'charge')">充电</button>
        </div>
        <div class="filter-bar" style="border-bottom:none;padding-top:0;">
            <button class="filter-btn date-range-btn" id="dateRangeBtn" onclick="showDateFilter()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span id="dateRangeLabel">全部时间</span>
            </button>
        </div>

        <!-- 记录列表 -->
        <div id="recordList"></div>

        <!-- 上拉加载更多 -->
        <div class="load-more" id="loadMore" onclick="loadMore()">
            上拉加载更多
        </div>
    </div>

    <!-- 时间范围筛选弹窗 -->
    <div class="picker-overlay" id="dateFilterPicker" onclick="closePicker(event, 'dateFilterPicker')">
        <div class="picker-panel" onclick="event.stopPropagation()">
            <div class="picker-header">
                <span class="picker-title">选择时间范围</span>
                <span class="picker-close" onclick="closePickerDirect('dateFilterPicker')">关闭</span>
            </div>
            <div class="date-presets">
                <div class="date-preset" onclick="selectDatePreset('all')">全部</div>
                <div class="date-preset" onclick="selectDatePreset('7')">近7天</div>
                <div class="date-preset" onclick="selectDatePreset('30')">近30天</div>
                <div class="date-preset" onclick="selectDatePreset('180')">近半年</div>
            </div>
            <div style="padding: 16px; border-top: 1px solid #f5f5f5;">
                <div style="font-size:13px;color:#00000073;margin-bottom:8px;">自定义范围</div>
                <div class="date-range-row">
                    <input type="date" class="form-input" id="startDate" style="height:36px;">
                    <span style="color:#00000073;">至</span>
                    <input type="date" class="form-input" id="endDate" style="height:36px;">
                </div>
            </div>
            <div style="padding: 12px 16px 20px; display:flex; gap:12px;">
                <button class="reset-btn" onclick="resetDateFilter()">重置</button>
                <button class="confirm-btn" onclick="confirmDateFilter()">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 根据入口来源设置返回地址
        (function() {
            const params = new URLSearchParams(window.location.search);
            const from = params.get('from');
            const backLink = document.querySelector('.top-nav-back');
            if (backLink) {
                if (from === 'ocr') backLink.href = 'home-ocr.html';
                else if (from === 'vehicle') backLink.href = 'vehicle-management.html';
                else backLink.href = 'home.html';
            }
        })();

        const recordsData = [
            { id: 1, type: 'fuel', plate: '粤B·12345', amount: 420.00, time: '2026-06-22 09:30', reporter: '张三', project: '深圳南山智慧环卫项目' },
            { id: 2, type: 'charge', plate: '粤B·67890', amount: 85.50, time: '2026-06-21 18:15', reporter: '张三', project: '深圳南山智慧环卫项目' },
            { id: 3, type: 'water', plate: '粤B·12345', amount: 35.00, time: '2026-06-21 14:00', reporter: '张三', project: '深圳南山智慧环卫项目' },
            { id: 4, type: 'fuel', plate: '粤B·54321', amount: 380.00, time: '2026-06-20 08:45', reporter: '李四', project: '广州天河环卫项目' },
            { id: 5, type: 'charge', plate: '粤B·11111', amount: 120.00, time: '2026-06-19 20:00', reporter: '张三', project: '深圳南山智慧环卫项目' },
            { id: 6, type: 'water', plate: '粤B·22222', amount: 42.00, time: '2026-06-18 16:30', reporter: '王五', project: '北京朝阳清洁项目' }
        ];

        let currentType = 'all';
        let startDate = null;
        let endDate = null;

        const typeLabels = { fuel: '加油', water: '加水', charge: '充电' };
        const typeClasses = { fuel: 'tag-fuel', water: 'tag-water', charge: 'tag-charge' };

        function getFromParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('from') || '';
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function initDateFilter() {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - 6);
            startDate = formatDate(start);
            endDate = formatDate(end);
            document.getElementById('startDate').value = startDate;
            document.getElementById('endDate').value = endDate;
            document.getElementById('dateRangeLabel').textContent = '近7天';
        }

        function getCurrentProjectName() {
            return window.CityStewardCommon ? window.CityStewardCommon.getCurrentProject().name : '深圳南山智慧环卫项目';
        }

        function renderList() {
            const container = document.getElementById('recordList');
            const currentProjectName = getCurrentProjectName();
            const filtered = recordsData.filter(r => {
                if (currentType !== 'all' && r.type !== currentType) return false;
                if (r.project !== currentProjectName) return false;
                if (startDate && r.time < startDate + ' 00:00') return false;
                if (endDate && r.time > endDate + ' 23:59') return false;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#00000040" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
                        </svg>
                        <div>暂无记录</div>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(r => `
                <a href="record-detail.html?type=${r.type}&id=${r.id}&from=${getFromParam()}" class="record-card" data-type="${r.type}">
                    <div class="card-header">
                        <span class="tag ${typeClasses[r.type]}">${typeLabels[r.type]}</span>
                        <div class="card-amount">¥${r.amount.toFixed(2)}</div>
                    </div>
                    <div class="card-plate">${r.plate}</div>
                    <div class="card-meta">
                        <span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${r.time}</span>
                        <span>|</span>
                        <span>${r.reporter}</span>
                        <span>|</span>
                        <span>${r.project}</span>
                    </div>
                </a>
            `).join('');
        }

        function filterType(btn, type) {
            document.querySelectorAll('.filter-bar:first-child .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentType = type;
            renderList();
        }

        function showDateFilter() {
            document.getElementById('dateFilterPicker').style.display = 'block';
        }

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function selectDatePreset(days) {
            document.querySelectorAll('.date-preset').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            const end = new Date();
            const start = new Date();
            if (days !== 'all') {
                start.setDate(start.getDate() - parseInt(days));
            } else {
                start.setFullYear(2000, 0, 1);
            }
            document.getElementById('startDate').value = formatDate(start);
            document.getElementById('endDate').value = formatDate(end);
        }

        function confirmDateFilter() {
            startDate = document.getElementById('startDate').value || null;
            endDate = document.getElementById('endDate').value || null;
            document.getElementById('dateFilterPicker').style.display = 'none';

            let label = '自定义';
            if (!startDate && !endDate) label = '全部时间';
            else if (startDate && endDate) {
                const s = new Date(startDate), e = new Date(endDate);
                const diff = Math.round((e - s) / (1000 * 60 * 60 * 24));
                if (diff === 6) label = '近7天';
                else if (diff === 29) label = '近30天';
                else if (diff === 179) label = '近半年';
                else label = `${startDate} 至 ${endDate}`;
            }
            document.getElementById('dateRangeLabel').textContent = label;
            renderList();
        }

        function resetDateFilter() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.querySelectorAll('.date-preset').forEach(p => p.classList.remove('active'));
        }

        function closePicker(e, id) {
            document.getElementById(id).style.display = 'none';
        }
        function closePickerDirect(id) {
            document.getElementById(id).style.display = 'none';
        }

        function loadMore() {
            const loadMore = document.getElementById('loadMore');
            loadMore.textContent = '加载中...';
            setTimeout(() => {
                loadMore.textContent = '没有更多了';
            }, 1000);
        }

        // 监听项目切换事件，刷新记录列表
        document.addEventListener('projectChanged', function () {
            renderList();
        });

        initDateFilter();
        renderList();
    </script>
    <script src="components/app-common.js"></script>
</body>
</html>
