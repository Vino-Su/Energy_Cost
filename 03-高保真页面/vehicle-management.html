<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>用车管理 - 城市管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 430px;
            min-height: 100vh;
            background: #ffffff;
        }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            width: 100%;
            margin: 0;
            min-height: 100vh;
            padding-bottom: 56px;
        }
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 430px;
            height: 44px;
            background: #ffffff;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            z-index: 1000;
            padding: 0 16px;
        }
        .top-nav-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000d9;
            text-decoration: none;
            margin-left: -8px;
        }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 600;
            color: #000000d9;
        }
        .top-nav-placeholder {
            width: 32px;
            margin-left: auto;
        }
        .content-area {
            padding-top: 44px;
            padding-bottom: 56px;
        }
        .section-title {
            font-size: 14px;
            color: #00000073;
            padding: 16px 16px 12px;
        }
        .section-title:first-child {
            padding-top: 12px;
        }
        /* 子项宫格：与 home.html 的 app-grid/app-item 风格一致，统一一行四列均分 */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 0 16px;
        }
        .module-grid.cols-2 { grid-template-columns: repeat(4, 1fr); }
        .module-grid.cols-3 { grid-template-columns: repeat(4, 1fr); }
        .module-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
        .module-item {
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: opacity 0.15s;
        }
        .module-item:active {
            opacity: 0.6;
        }
        .module-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .module-icon svg {
            width: 22px;
            height: 22px;
        }
        /* 今日用车：恢复整行大卡片样式 */
        .today-card {
            margin: 0 16px 4px;
            min-height: 72px;
            padding: 16px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #000000d9;
            transition: all 0.15s;
        }
        .today-card:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .today-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #e6f4ff;
            color: #1677ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .today-icon svg { width: 26px; height: 26px; }
        .today-name {
            flex: 1;
            font-size: 16px;
            line-height: 24px;
            font-weight: 600;
            color: #000000d9;
        }
        /* 右侧绑定状态：车牌号 / 未绑定提示，靠右展示，箭头仍在最右 */
        .today-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .today-plate {
            font-size: 14px;
            line-height: 20px;
            font-weight: 500;
            color: #1677ff;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .today-plate-plate {
            display: inline-block;
            padding: 1px 6px;
            margin-right: 4px;
            border-radius: 4px;
            background: #e6f4ff;
            color: #1677ff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .today-unbound {
            font-size: 13px;
            line-height: 18px;
            color: #00000073;
        }
        .today-arrow {
            width: 18px;
            height: 18px;
            color: #00000040;
            flex-shrink: 0;
        }
        .module-name {
            font-size: 13px;
            color: #000000d9;
            font-weight: 500;
            text-align: center;
        }
        /* 各分组图标背景色 */
        .module-icon.schedule { background: #e6f4ff; color: #1677ff; }
        .module-icon.emergency { background: #fff1f0; color: #ff4d4f; }
        .module-icon.dynamic { background: #f6ffed; color: #52c41a; }
        .module-icon.today { background: #e6f4ff; color: #1677ff; }
        .module-icon.fuel { background: #fff7e6; color: #fa8c16; }
        .module-icon.water { background: #e6f4ff; color: #1677ff; }
        .module-icon.charge { background: #f6ffed; color: #52c41a; }
        .module-icon.records { background: #f2f0ff; color: #722ed1; }
        .module-icon.repair { background: #fff1f0; color: #ff4d4f; }
        .module-icon.maintenance { background: #fff7e6; color: #fa8c16; }
        .module-icon.stat-trip { background: #e6fffb; color: #13c2c2; }
        .module-icon.stat-task { background: #f2f0ff; color: #722ed1; }
        /* 底部Tab */
        .bottom-tab {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 430px;
            height: 56px;
            background: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            z-index: 1000;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            text-decoration: none;
            color: #00000073;
            font-size: 10px;
            transition: color 0.2s;
        }
        .tab-item.active {
            color: #1677ff;
        }
        .tab-item svg { width: 24px; height: 24px; }
        /* 校验加载遮罩 */
        .verify-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            margin: 0 auto; max-width: 430px;
            background: rgba(0,0,0,0.5); z-index: 3000;
            display: none; align-items: center; justify-content: center;
        }
        .verify-overlay.show { display: flex; }
        .verify-card {
            background: #ffffff; border-radius: 12px;
            padding: 24px 32px;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .verify-spinner {
            width: 32px; height: 32px; border: 3px solid #e6f4ff;
            border-top-color: #1677ff; border-radius: 50%;
            animation: verify-spin 0.8s linear infinite;
        }
        @keyframes verify-spin { to { transform: rotate(360deg); } }
        .verify-text { font-size: 14px; color: #000000d9; }
        /* 校验失败弹窗 */
        .verify-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            margin: 0 auto; max-width: 430px;
            background: rgba(0,0,0,0.5); z-index: 3000;
            display: none; align-items: center; justify-content: center;
        }
        .verify-modal-overlay.show { display: flex; }
        .verify-modal-card {
            width: 280px; background: #ffffff; border-radius: 16px;
            padding: 24px 20px;
        }
        .verify-modal-icon {
            width: 56px; height: 56px; border-radius: 50%;
            background: #fff1f0; color: #ff4d4f;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
        }
        .verify-modal-icon svg { width: 32px; height: 32px; }
        .verify-modal-title {
            font-size: 16px; font-weight: 600; color: #000000d9;
            text-align: center; margin-bottom: 8px;
        }
        .verify-modal-desc {
            font-size: 13px; color: #00000073; text-align: center;
            line-height: 20px; margin-bottom: 20px;
        }
        .verify-modal-buttons {
            display: flex; gap: 8px;
        }
        .verify-modal-btn {
            flex: 1; height: 40px; border-radius: 8px;
            padding: 0; font-family: inherit; font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.15s;
        }
        .verify-modal-btn:active { opacity: 0.85; }
        .verify-modal-btn.secondary {
            background: #ffffff; border: 1px solid #e8e8e8; color: #000000d9;
        }
        .verify-modal-btn.primary {
            background: #1677ff; border: 1px solid #1677ff; color: #ffffff;
        }
    </style>
</head>

    <script src="components/vehicle-demo-state.js"></script>
    <script>
        var verifyModalAction = null;

        // 今日用车入口校验逻辑。默认无绑定，扫码完成后由 sessionStorage 记录本次演示状态。
        function verifyAndGo(event) {
            if (event) event.preventDefault();
            var url = new URL(window.location.href);
            var demo = url.searchParams.get('demo');

            if (demo === 'unavailable') {
                showVerifyModal('无法进入今日用车', '当前车辆保险已到期，请联系管理员处理后再使用。', 'contact', '联系管理员');
                return;
            }
            if (demo === 'maintenance') {
                showVerifyModal('无法进入今日用车', '当前车辆维修中，暂不可用车。', 'contact', '联系管理员');
                return;
            }
            if (!VehicleDemoState.isBound()) {
                showVerifyModal('暂未绑定车辆', '校验未通过，请先展示个人二维码完成车辆绑定。', 'bind', '去绑定车辆');
                return;
            }

            showVerifyOverlay();
            setTimeout(function () {
                window.location.href = 'map-workbench.html';
            }, 600);
        }

        function showVerifyOverlay() {
            document.getElementById('verifyOverlay').classList.add('show');
        }

        function showVerifyModal(title, desc, action, primaryText) {
            verifyModalAction = action || null;
            document.getElementById('verifyModalTitle').textContent = title;
            document.getElementById('verifyModalDesc').textContent = desc;
            document.getElementById('verifyModalPrimary').textContent = primaryText || '知道了';
            document.getElementById('verifyModal').classList.add('show');
        }

        function closeVerifyModal() {
            document.getElementById('verifyModal').classList.remove('show');
            verifyModalAction = null;
        }

        function handleVerifyPrimary() {
            if (verifyModalAction === 'bind') {
                window.location.href = 'qrcode.html?scene=bind&returnUrl=map-workbench.html';
                return;
            }
            if (verifyModalAction === 'contact') {
                alert('演示：请联系项目经理');
                return;
            }
            closeVerifyModal();
        }

        function syncTodayCardState() {
            var binding = VehicleDemoState.getBinding();
            var plate = document.getElementById('todayPlate');
            var unbound = document.getElementById('todayUnbound');
            if (!plate || !unbound) return;

            if (!binding) {
                plate.style.display = 'none';
                unbound.style.display = 'inline';
            } else {
                plate.querySelector('.today-plate-plate').textContent = binding.plateNo;
                plate.style.display = 'inline-flex';
                unbound.style.display = 'none';
            }
        }

        (function () {
            var url = new URL(window.location.href);
            var demo = url.searchParams.get('demo');
            if (demo === 'reset' || demo === 'unbound') VehicleDemoState.unbind();
            if (demo === 'bound') VehicleDemoState.bind();
            syncTodayCardState();
            if (demo === 'unbound' || demo === 'unavailable' || demo === 'maintenance') {
                setTimeout(verifyAndGo, 100);
            }
        })();
    </script>
</body>
</html>
