<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地图工作台 - 城市管家</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 430px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; width: 100%; margin: 0; min-height: 100vh;
        }
        /* 顶部状态栏：半透明悬浮 */
        .top-status {
            position: fixed; top: 12px; left: 12px; right: 12px;
            margin: 0 auto; max-width: 406px; height: 44px;
            background: rgba(255,255,255,0.95); border-radius: 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex; align-items: center; padding: 0 12px;
            z-index: 1000; gap: 8px;
        }
        .top-status-back {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #000000d9; text-decoration: none;
        }
        .top-status-back svg { width: 22px; height: 22px; }
        .top-status-info { flex: 1; min-width: 0; }
        .top-status-plate {
            font-size: 14px; font-weight: 600; color: #000000d9;
            display: flex; align-items: center; gap: 6px;
        }
        .top-status-plate-tag {
            display: inline-block; padding: 1px 6px; border-radius: 4px;
            background: #f6ffed; color: #52c41a;
            font-size: 10px; font-weight: 500;
        }
        .top-status-meta {
            font-size: 11px; color: #00000073; margin-top: 1px;
        }
        /* 地图 */
        #map {
            position: fixed; top: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 430px;
            width: 100%; height: 100vh; z-index: 1;
        }
        /* 右侧悬浮工具组：跟随 430px 页面容器，并随底部抽屉展开/收起上下移动 */
        .float-tools {
            position: fixed;
            /* 工具栏距离 430px 页面右边缘 28px，比页面内容缩进更大，营造呼吸感 */
            right: max(28px, calc(50vw - 215px - 28px));
            bottom: 220px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 1000;
            transition: bottom 0.3s ease;
        }
        .float-tool {
            width: 44px; height: 44px; border-radius: 50%;
            background: #ffffff; color: #1677ff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.15s;
            text-decoration: none;
        }
        .float-tool:active { transform: scale(0.92); }
        .float-tool svg { width: 22px; height: 22px; }
        .float-tool.repair { color: #ff4d4f; }
        .float-tool.report { color: #fa8c16; }
        .float-tool.handover { color: #722ed1; }
        /* 底部任务抽屉 */
        .task-drawer {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 430px;
            background: #ffffff; border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
            z-index: 1000;
            max-height: 50vh;
            transition: max-height 0.3s ease;
        }
        .task-drawer.expanded {
            max-height: 80vh;
        }
        .drawer-handle {
            width: 36px; height: 4px; border-radius: 2px;
            background: #e8e8e8; margin: 8px auto;
        }
        .drawer-header {
            padding: 4px 16px 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .drawer-title {
            font-size: 16px; font-weight: 600; color: #000000d9;
        }
        .drawer-count {
            font-size: 12px; color: #00000073;
        }
        .drawer-expand-btn {
            font-size: 12px; color: #1677ff; cursor: pointer;
            background: none; border: none;
        }
        /* 当前任务卡片（半展开默认显示） */
        .current-task {
            margin: 0 16px 12px; padding: 12px;
            background: #e6f4ff; border-radius: 12px;
            cursor: pointer;
            border: 1px solid rgba(22,119,255,0.14);
        }
        .current-task.executing { background: #f6ffed; border-color: rgba(82,196,26,0.24); }
        .current-task.completed { background: #f5f5f5; border-color: #e8e8e8; }
        .task-card-top {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .current-task-tag {
            display: inline-flex; align-items: center; gap: 4px;
            height: 20px; padding: 0 6px; border-radius: 4px;
            font-size: 11px; line-height: 20px;
            background: #e6f4ff; color: #1677ff;
        }
        .current-task-tag.executing {
            background: #52c41a; color: #ffffff;
        }
        .current-task-tag.completed { background: #e8e8e8; color: #00000073; }
        .task-nav-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: none; background: #ffffff; color: #1677ff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            cursor: pointer; flex-shrink: 0;
        }
        .task-nav-btn svg { width: 17px; height: 17px; }
        .current-task-name {
            font-size: 16px; font-weight: 600; color: #000000d9;
            margin: 6px 0 4px;
        }
        .current-task-meta {
            font-size: 12px; color: #00000073; line-height: 18px;
        }
        .current-task-actions {
            margin-top: 12px; display: flex; gap: 8px;
        }
        .task-btn {
            flex: 1; height: 36px; border-radius: 6px;
            font-size: 13px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; transition: opacity 0.15s;
            text-decoration: none;
        }
        .task-btn.primary {
            background: #1677ff; color: #ffffff;
        }
        .task-btn.success { background: #52c41a; color: #ffffff; }
        .task-btn.secondary {
            background: #ffffff; color: #1677ff; border: 1px solid #1677ff;
        }
        .task-btn.ghost {
            flex: 0 0 auto; min-width: 68px; padding: 0 10px;
            background: transparent; color: #00000073; border: 1px solid #e8e8e8;
        }
        .task-btn.disabled {
            background: #f5f5f5; color: #00000040; border: 1px solid #e8e8e8;
            pointer-events: none;
        }
        .task-btn:active { opacity: 0.85; }
        .task-notice {
            margin: 0 16px 10px; padding: 8px 10px; border-radius: 8px;
            background: #fffbe6; color: #ad6800; font-size: 12px; line-height: 18px;
            display: none;
        }
        .task-notice.show { display: block; }
        /* 任务列表（全展开显示） */
        .task-list {
            padding: 0 16px 16px; display: none;
        }
        .task-drawer.expanded .task-list { display: block; }
        .task-list-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid #f5f5f5;
            cursor: pointer; text-decoration: none; color: inherit;
        }
        .task-list-item.active {
            margin: 0 -8px; padding: 12px 8px; border-radius: 10px;
            background: #e6f4ff; border-bottom-color: transparent;
        }
        @keyframes taskFlash {
            0%, 100% { background: #e6f4ff; }
            50% { background: #ffe7ba; }
        }
        .task-list-item.flash {
            margin: 0 -8px; padding: 12px 8px; border-radius: 10px;
            border-bottom-color: transparent;
            animation: taskFlash 0.6s ease-in-out 3;
        }
        .task-list-item:last-child { border-bottom: none; }
        .task-list-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .task-list-icon.executing { background: #52c41a; color: #ffffff; }
        .task-list-icon.emergency { background: #fff1f0; color: #ff4d4f; }
        .task-list-icon.normal { background: #e6f4ff; color: #1677ff; }
        .task-list-icon svg { width: 20px; height: 20px; }
        .task-list-main { flex: 1; min-width: 0; }
        .task-list-name {
            font-size: 14px; font-weight: 500; color: #000000d9;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .task-list-meta {
            font-size: 12px; color: #00000073; margin-top: 2px;
        }
        .task-list-tag {
            font-size: 11px; padding: 2px 6px; border-radius: 4px;
            background: #fff7e6; color: #fa8c16;
        }
        .task-list-tag.executing { background: #f6ffed; color: #52c41a; }
        .task-list-tag.pending { background: #f5f5f5; color: #00000073; }
        .task-list-tag.completed { background: #f5f5f5; color: #00000040; }
        .toast {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
            max-width: 260px; padding: 10px 14px; border-radius: 8px;
            background: rgba(0,0,0,0.75); color: #ffffff;
            font-size: 14px; line-height: 20px; text-align: center;
            z-index: 3000; display: none;
        }
        .toast.show { display: block; }
    </style>
</head>

        }

        function renderTaskDrawer(notice) {
            var selectedTask = getTask(selectedTaskId);
            var activeCount = tasks.filter(function (task) { return task.status !== 'completed'; }).length;
            var executingCount = tasks.filter(function (task) { return task.status === 'executing'; }).length;
            document.querySelector('.drawer-count').textContent = activeCount + ' 项 · ' + executingCount + ' 项执行中';

            var noticeEl = document.getElementById('taskNotice');
            if (notice) {
                noticeEl.textContent = notice;
                noticeEl.classList.add('show');
            } else {
                noticeEl.classList.remove('show');
            }

            document.getElementById('currentTask').innerHTML = buildCurrentTask(selectedTask);
            document.getElementById('taskList').innerHTML = tasks.map(function (task) {
                var tagClass = task.status === 'executing' ? 'executing' : task.status === 'completed' ? 'completed' : 'pending';
                return '<div class="task-list-item ' + (task.id === selectedTaskId ? 'active' : '') + '" onclick="selectTask(\'' + task.id + '\')">' +
                    '<div class="task-list-icon ' + (task.status === 'executing' ? 'executing' : task.icon) + '">' + taskIconSvg(task.icon) + '</div>' +
                    '<div class="task-list-main"><div class="task-list-name">' + task.name + '</div><div class="task-list-meta">' + task.time + ' · ' + task.routeName + '</div></div>' +
                    '<span class="task-list-tag ' + tagClass + '">' + (task.icon === 'emergency' && task.status === 'pending' ? '应急' : statusText(task.status)) + '</span>' +
                    '</div>';
            }).join('');
        }

        function buildCurrentTask(task) {
            var tagClass = task.status === 'executing' ? 'executing' : task.status === 'completed' ? 'completed' : '';
            var progressText = task.status === 'executing'
                ? '<div class="current-task-meta" style="color:#1677ff;margin-top:4px;">路线覆盖度 ' + task.coverage + '% · 已作业 ' + task.duration + '</div>'
                : '<div class="current-task-meta" style="color:#1677ff;margin-top:4px;">作业要求：' + task.requirement + '</div>';
            var primaryAction = '';
            if (task.status === 'executing') {
                primaryAction = '<button class="task-btn primary" onclick="finishTask(\'' + task.id + '\')">结束任务</button>';
            } else if (task.status === 'pending') {
                primaryAction = '<button class="task-btn primary" onclick="startTask(\'' + task.id + '\')">开始任务</button>';
            } else {
                primaryAction = '<span class="task-btn disabled">已完成</span>';
            }
            return '<div class="current-task ' + task.status + '">' +
                '<div class="task-card-top">' +
                '<span class="current-task-tag ' + tagClass + '">' + statusText(task.status) + '</span>' +
                '<button class="task-nav-btn" onclick="openAmapNavigation(\'' + task.id + '\')" aria-label="高德导航">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-6.5 8-13a8 8 0 10-16 0c0 6.5 8 13 8 13z"/><circle cx="12" cy="9" r="2.5"/></svg>' +

                '<div class="current-task-meta">' + task.time + ' · ' + task.routeName + '</div>' +

                '<div class="current-task-actions">' +
                '<a href="task-detail.html?id=' + task.id + '" class="task-btn ghost">任务详情</a>' +
                primaryAction +
                '</div></div>';
        }

        function selectTask(id) {

        function startTask(id) {
            var task = getTask(id);

            if (!task.canStart) {

            task.status = 'executing';
            task.actualIndex = 0;
            task.coverage = 12;
            task.duration = '0 分钟';
            executingTaskId = id;
            selectedTaskId = id;
            showToast('任务已开始');
            renderTaskDrawer();
            drawSelectedTask(true);
            startVehicleMotion(task);
        }

        function finishTask(id) {
            var task = getTask(id);
            if (!task || task.status !== 'executing') {
                showToast('当前无可结束任务');
                return;
            }
            if (task.canFinish === false) {
                showToast(task.blockReason || '存在未完成事项，暂不可结束');
                return;
            }
            clearInterval(moveTimer);
            task.status = 'completed';
            task.coverage = Math.max(task.coverage, 96);
            task.duration = task.duration || '已完成';
            executingTaskId = null;
            var nextTask = tasks.find(function (item) { return item.status === 'pending'; });
            if (nextTask) {
                selectedTaskId = nextTask.id;
                renderTaskDrawer('当前任务已结束，已自动推送下一任务：' + nextTask.name);

            } else {
                selectedTaskId = task.id;
                renderTaskDrawer('今日任务已完成，可导航返场并交车');
                showToast('今日任务已完成');
            }
            drawSelectedTask(true);
        }

        function startVehicleMotion(task) {
            clearInterval(moveTimer);
            moveTimer = setInterval(function () {
                if (task.status !== 'executing') {
                    clearInterval(moveTimer);

                if (task.actualIndex < task.route.length - 1) {

                    task.coverage = Math.min(98, Math.round(((task.actualIndex + 1) / task.route.length) * 100));

                    renderTaskDrawer();
                    drawSelectedTask(false);
                } else {
                    clearInterval(moveTimer);
                }
            }, 1800);
        }

        }

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(function () {
                toast.classList.remove('show');
            }, 1800);
        }

        function centerMap() {
            map.setView(vehicleMarker.getLatLng(), 15, { animate: true });
        }

        // 交车：先校验是否存在未结束任务，仅拦截"进行中未结束"任务；未开始任务不阻断
        function handleHandover() {
            var unfinished = tasks.filter(function (task) { return task.status === 'executing'; });
            if (unfinished.length > 0) {
                showToast('存在未结束任务，无法交车，请结束任务或异常关闭');
                var target = unfinished[0];
                var drawer = document.getElementById('taskDrawer');
                if (!drawer.classList.contains('expanded')) {
                    drawer.classList.add('expanded');
                    setTimeout(adjustToolsPosition, 320);
                }
                selectTask(target.id);
                highlightTask(target.id);
                return;
            }
            // 无进行中任务 → 调用个人二维码页面完成交车
            window.location.href = 'qrcode.html?scene=handover';
        }

        // 在待办任务列表中高亮闪烁指定任务
        function highlightTask(id) {
            var idx = tasks.findIndex(function (task) { return task.id === id; });
            if (idx < 0) return;
            setTimeout(function () {
                var items = document.getElementById('taskList').querySelectorAll('.task-list-item');
                var el = items[idx];
                if (!el) return;
                el.classList.add('flash');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(function () { el.classList.remove('flash'); }, 2000);
            }, 80);
        }

        function toggleDrawer() {
            var drawer = document.getElementById('taskDrawer');
            drawer.classList.toggle('expanded');
            // 等 CSS 过渡完成后再调整工具栏位置
            setTimeout(adjustToolsPosition, 320);
        }

        // 让右侧工具栏始终在底部抽屉上方 16px
        function adjustToolsPosition() {
            var drawer = document.getElementById('taskDrawer');
            var tools = document.querySelector('.float-tools');
            if (!drawer || !tools) return;
            var drawerHeight = drawer.offsetHeight;
            tools.style.bottom = (drawerHeight + 16) + 'px';
        }

        // 监听窗口尺寸变化与初始加载
        window.addEventListener('load', adjustToolsPosition);
        window.addEventListener('resize', adjustToolsPosition);
        // 立即执行一次（确保初始位置正确）
        adjustToolsPosition();
        renderTaskDrawer();
        drawSelectedTask(true);
        startVehicleMotion(getTask(executingTaskId));

        function openReportPicker() {
            document.getElementById('reportModal').style.display = 'flex';
        }
        function closeReportModal() {
            document.getElementById('reportModal').style.display = 'none';
        }
        document.getElementById('reportModal').addEventListener('click', function (e) {
            if (e.target === this) closeReportModal();
        });
    </script>
</body>
</html>
