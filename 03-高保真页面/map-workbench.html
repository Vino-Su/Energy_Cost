<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地图工作台 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            margin: 0 auto;
            max-width: 430px;
            min-height: 100vh;
            background: #e9eef3;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            color: #000000d9;
            background: #e9eef3;
            -webkit-tap-highlight-color: transparent;
        }
        button, a {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        button {
            cursor: pointer;
        }
        .workbench {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 760px;
            margin: 0 auto;
            overflow: hidden;
            background: #eef2f5;
            box-shadow: 0 24px 70px rgba(20, 40, 70, 0.22);
        }
        .map-shell {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background:
                linear-gradient(115deg, transparent 0 32%, rgba(255,255,255,0.52) 32% 34%, transparent 34%),
                linear-gradient(24deg, transparent 0 45%, rgba(255,255,255,0.45) 45% 47%, transparent 47%),
                linear-gradient(155deg, transparent 0 54%, rgba(255,255,255,0.45) 54% 56%, transparent 56%),
                #dfe6ea;
        }
        .map-grid {
            position: absolute;
            inset: 0;
            opacity: 0.72;
            background-image:
                linear-gradient(rgba(255,255,255,0.48) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.48) 1px, transparent 1px);
            background-size: 56px 56px;
        }
        .map-zone {
            position: absolute;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.32);
            color: rgba(0, 0, 0, 0.26);
            font-size: 11px;
            letter-spacing: 0;
            display: grid;
            place-items: center;
            transform: rotate(-12deg);
        }
        .map-zone.one { left: 32px; top: 126px; width: 112px; height: 72px; }
        .map-zone.two { right: 30px; top: 224px; width: 104px; height: 84px; transform: rotate(10deg); }
        .map-zone.three { left: 70px; top: 410px; width: 132px; height: 74px; transform: rotate(8deg); }
        .map-road {
            position: absolute;
            height: 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.54);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.52);
            transform-origin: left center;
        }
        .map-road.main { left: -36px; top: 252px; width: 520px; transform: rotate(34deg); }
        .map-road.secondary { left: -10px; top: 456px; width: 460px; transform: rotate(-16deg); opacity: 0.76; }
        .map-road.cross { left: 186px; top: 72px; width: 420px; transform: rotate(78deg); opacity: 0.62; }
        .route-layer {
            position: absolute;
            left: 44px;
            top: 132px;
            width: 302px;
            height: 392px;
            z-index: 2;
            overflow: visible;
        }
        .planned-route {
            fill: none;
            stroke: #1677ff;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 9 7;
            opacity: 0.78;
        }
        .actual-track {
            fill: none;
            stroke: #ff4d4f;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.92;
        }
        .pulse-route {
            fill: none;
            stroke: rgba(22, 119, 255, 0.18);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0;
            animation: routePulse 2.4s ease-in-out infinite;
        }
        @keyframes routePulse {
            0%, 100% { opacity: 0; }
            45% { opacity: 1; }
        }
        .marker {
            position: absolute;
            z-index: 9;
            display: grid;
            place-items: center;
            filter: drop-shadow(0 3px 7px rgba(0,0,0,0.16));
            transition: left 0.42s ease, top 0.42s ease, transform 0.2s ease, opacity 0.2s ease;
            pointer-events: none;
        }
        .marker.vehicle { z-index: 11; }
        .marker.start,
        .marker.end {
            width: 34px;
            height: 34px;
            transform: translate(-50%, calc(-100% + 4px));
        }
        .marker.vehicle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            border: 2px solid #91d5ff;
            box-shadow: 0 3px 13px rgba(22,119,255,0.35);
        }
        .marker.vehicle::after {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: inherit;
            border: 1px solid rgba(22,119,255,0.35);
            animation: vehiclePulse 1.8s ease-out infinite;
        }
        .workbench.sheet-open .marker.vehicle {
            z-index: 7;
        }
        @keyframes vehiclePulse {
            0% { transform: scale(0.7); opacity: 0.55; }
            100% { transform: scale(1.18); opacity: 0; }
        }
        /* 顶部车辆执行状态条 */
        .top-card {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 14px;
            min-height: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.90);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(15, 35, 70, 0.14);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 8;
        }
        .top-back {
            width: 32px;
            height: 32px;
            border: 1px solid #e8e8e8;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.82);
            display: grid;
            place-items: center;
            color: #000000d9;
            text-decoration: none;
            flex: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .top-back:active { transform: scale(0.92); background: #f5f5f5; }
        .top-back svg { width: 20px; height: 20px; }
        .vehicle-summary {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .vehicle-icon {
            width: 40px;
            height: auto;
            align-self: stretch;
            border-radius: 8px;
            display: grid;
            place-items: center;
            flex: none;
            background: #e6f4ff;
            color: #1677ff;
        }
        .vehicle-icon svg {
            width: 22px;
            height: 22px;
        }
        .vehicle-plate {
            min-width: 0;
            font-size: 16px;
            font-weight: 700;
            line-height: 22px;
            color: #000000d9;
            font-family: "DIN", "SF UI Text", "PingFang SC", "Microsoft YaHei", sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vehicle-state {
            flex: none;
            align-self: center;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 4px;
            background: #e6f4ff;
            color: #1677ff;
            font-size: 12px;
            font-weight: 700;
            line-height: 18px;
            white-space: nowrap;
        }
        .vehicle-state.active {
            background: #f6ffed;
            color: #389e0d;
        }
        .vehicle-state.warning {
            background: #fffbe6;
            color: #d48806;
        }
        .vehicle-state.error {
            background: #fff2f0;
            color: #cf1322;
        }
        .vehicle-state-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex: none;
        }
        .vehicle-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
            color: #00000073;
            font-size: 12px;
            line-height: 18px;
            white-space: nowrap;
        }
        .vehicle-meta span {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .vehicle-meta span + span {
            padding-left: 7px;
            border-left: 1px solid #e8e8e8;
        }
        .vehicle-meta strong {
            color: #000000d9;
            font-weight: 700;
        }
        .map-tools {
            position: absolute;
            right: 14px;
            bottom: 320px; /* 由 JS 动态更新为 console 高度 + 16px */
            z-index: 9;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: bottom 0.24s ease;
        }
        /* 地图左下角路线图例 */
        .map-legend {
            position: absolute;
            left: 14px;
            bottom: 320px; /* 由 JS 动态更新为 console 高度 + 16px */
            z-index: 9;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: bottom 0.24s ease;
        }
        .workbench.sheet-open .map-tools,
        .workbench.sheet-open .map-legend {
            opacity: 0;
            pointer-events: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            line-height: 14px;
            color: #000000d9;
            white-space: nowrap;
        }
        .legend-line {
            width: 22px;
            height: 0;
            flex: none;
        }
        .legend-line.planned {
            border-top: 2px dashed #1677ff;
        }
        .legend-line.actual {
            border-top: 2px solid #ff4d4f;
        }
        .tool-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.96);
            color: #1677ff;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 13px rgba(0,0,0,0.15);
            transition: transform 0.15s ease, background 0.15s ease;
            text-decoration: none;
        }
        .tool-btn:active { transform: scale(0.92); }
        .tool-btn.report { color: #52c41a; }
        .tool-btn.repair { color: #fa8c16; }
        .tool-btn.handover { color: #722ed1; }
        .dynamic-task-banner {
            position: absolute;
            left: 16px;
            right: 16px;
            top: 94px;
            z-index: 8;
            min-height: 48px;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid #ffd591;
            border-radius: 8px;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 8px 20px rgba(250,140,22,0.16);
            color: #000000d9;
            text-align: left;
            animation: dynamicBannerIn 0.28s ease-out;
        }
        .dynamic-task-banner.show { display: flex; }
        .dynamic-task-banner:active { transform: scale(0.99); }
        .dynamic-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #fa8c16;
            box-shadow: 0 0 0 6px rgba(250,140,22,0.13);
            flex: none;
        }
        .dynamic-copy {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
        }
        .dynamic-copy b {
            flex: none;
            color: #fa8c16;
            font-size: 12px;
            line-height: 18px;
        }
        .dynamic-copy strong {
            flex: 0 1 auto;
            min-width: 0;
            font-size: 13px;
            line-height: 18px;
            color: #000000d9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .dynamic-copy small {
            flex: none;
            font-size: 12px;
            line-height: 16px;
            color: #00000073;
            white-space: nowrap;
        }
        .dynamic-action {
            flex: none;
            padding: 3px 8px;
            border-radius: 999px;
            background: #fff7e6;
            color: #d46b08;
            font-size: 11px;
            line-height: 16px;
            font-weight: 700;
        }
        @keyframes dynamicBannerIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .console {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
            background: #ffffff;
            border-radius: 22px 22px 0 0;
            box-shadow: 0 -12px 34px rgba(0,0,0,0.14);
        }
        .handle {
            width: 42px;
            height: 4px;
            margin: 0 auto 10px;
            border-radius: 999px;
            background: #e8e8e8;
        }
        /* 任务卡片 4 行布局：标题 / 副标题 / 作业要求+任务详情 / 3 列指标 / 导航+主操作 */
        .task-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .task-line + .task-line { margin-top: 8px; }

        /* 第 1 行：任务名 + 状态 + 展开列表 */
        .task-line-head { align-items: center; }
        .task-line-head .task-name {
            flex: 1;
            min-width: 0;
            font-size: 16px;
            line-height: 22px;
            font-weight: 700;
            color: #000000d9;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .task-head-right {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .state-tag {
            flex: none;
            padding: 4px 8px;
            border-radius: 6px;
            background: #f6ffed;
            color: #389e0d;
            font-size: 12px;
            font-weight: 700;
        }
        .state-tag.pending {
            background: #e6f4ff;
            color: #1677ff;
        }
        .state-tag.completed {
            background: #f5f5f5;
            color: #00000073;
        }
        .task-list-btn {
            height: 28px;
            padding: 0 10px;
            border: none;
            border-radius: 999px;
            background: #e6f4ff;
            color: #1677ff;
            font-size: 12px;
            font-weight: 700;
        }

        /* 副标题行：路段名称 - 计划时间 */
        .task-line-subtitle {
            font-size: 12px;
            line-height: 18px;
            color: #00000073;
        }

        /* 第 2 行：作业要求 + 任务详情 */
        .task-line-requirement { gap: 12px; }
        .task-requirement {
            flex: 1;
            min-width: 0;
            font-size: 12px;
            line-height: 18px;
            color: #00000073;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .detail-link {
            flex: none;
            font-size: 12px;
            line-height: 18px;
            color: #1677ff;
            text-decoration: none;
            font-weight: 500;
        }
        .detail-link:active { opacity: 0.7; }

        /* 第 3 行：开始时间 + 覆盖度 + 作业时长 */
        .task-line-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .task-line-metrics .metric {
            min-height: 50px;
            padding: 6px 8px;
            border-radius: 8px;
            background: #f5f8fb;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .task-line-metrics .metric-label {
            font-size: 11px;
            line-height: 16px;
            color: #00000073;
        }
        .task-line-metrics .metric-value {
            margin-top: 2px;
            font-size: 14px;
            line-height: 20px;
            font-weight: 700;
            color: #000000d9;
        }

        /* 第 4 行：导航 + 主操作 */
        .task-line-actions {
            display: grid;
            grid-template-columns: 46px 1fr;
            gap: 10px;
        }
        .task-line-actions .icon-action,
        .task-line-actions .primary-action {
            height: 46px;
            border-radius: 12px;
            text-decoration: none;
            display: grid;
            place-items: center;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .task-line-actions .icon-action {
            border: 1px solid #e8e8e8;
            background: #ffffff;
            color: #1677ff;
        }
        .task-line-actions .primary-action {
            border: none;
            background: #1677ff;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 8px 18px rgba(22,119,255,0.28);
        }
        .task-line-actions .primary-action.finished {
            background: #f5f5f5;
            color: #00000040;
            box-shadow: none;
        }
        .task-line-actions .icon-action:active,
        .task-line-actions .primary-action:active {
            transform: scale(0.98);
            opacity: 0.86;
        }
        /* 任务列表遮罩已移除（不再做单独弹出） */
        .modal-mask {
            position: absolute;
            inset: 0;
            z-index: 15;
            background: rgba(0,0,0,0.34);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease;
        }
        .workbench.modal-open .modal-mask {
            opacity: 1;
            pointer-events: auto;
        }
        /* 任务列表：在 console 内部展开/收起（无独立弹窗） */
        .task-list-panel {
            flex: 0 0 0;
            max-height: 0;
            margin: 8px -16px 0;
            padding: 0 16px;
            background: #f5f8fb;
            border-top: 1px solid #f0f0f0;
            overflow: hidden;
            transition: flex-basis 0.3s ease, max-height 0.3s ease, padding 0.3s ease;
        }
        .workbench.sheet-open .task-list-panel {
            flex: 1 1 auto;
            max-height: 50vh;
            padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
            overflow-y: auto;
        }
        .bottom-modal {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: none;
            max-height: 70vh;
            padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
            border-radius: 22px 22px 0 0;
            background: #ffffff;
            box-shadow: 0 -18px 40px rgba(0,0,0,0.18);
            transform: translateY(104%);
            transition: transform 0.26s cubic-bezier(.2,.8,.2,1);
            overflow-y: auto;
        }
        .bottom-modal.show {
            display: block;
            transform: translateY(0);
        }
        .sheet-handle {
            width: 42px;
            height: 4px;
            margin: 0 auto 12px;
            border-radius: 999px;
            background: #e8e8e8;
        }
        .task-list-top,
        .modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            gap: 12px;
        }
        .task-list-title strong,
        .modal-title {
            display: block;
            font-size: 16px;
            line-height: 22px;
            color: #000000d9;
            font-weight: 700;
        }
        .task-list-title span,
        .modal-subtitle {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            line-height: 18px;
            color: #00000073;
        }
        .collapse-list,
        .modal-close {
            min-width: 44px;
            height: 32px;
            padding: 0 4px;
            border: none;
            background: transparent;
            color: #1677ff;
            font-size: 14px;
            font-weight: 700;
        }
        .mini-task {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 8px;
            min-height: 58px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f7f9fb;
            border: 1px solid transparent;
            text-align: left;
        }
        .mini-task + .mini-task { margin-top: 8px; }
        .mini-task.active {
            background: #f6ffed;
            border-color: rgba(82,196,26,0.24);
        }
        .mini-task.flash {
            animation: taskFlash 0.6s ease-in-out 3;
        }
        @keyframes taskFlash {
            0%, 100% { background: #f6ffed; }
            50% { background: #ffe7ba; }
        }
        .task-title.flash {
            animation: consoleTitleFlash 0.5s ease-in-out 4;
        }
        @keyframes consoleTitleFlash {
            0%, 100% { color: #000000d9; }
            50% { color: #fa8c16; }
        }
        .mini-name {
            font-size: 13px;
            line-height: 18px;
            font-weight: 700;
            color: #000000d9;
        }
        .mini-meta {
            margin-top: 1px;
            font-size: 11px;
            line-height: 16px;
            color: #00000073;
        }
        .mini-tag {
            padding: 2px 7px;
            border-radius: 5px;
            background: #e6f4ff;
            color: #1677ff;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }
        .mini-tag.running {
            background: #f6ffed;
            color: #389e0d;
        }
        .mini-tag.urgent {
            background: #fff2f0;
            color: #ff4d4f;
        }
        .mini-tag.dynamic {
            background: #fff7e6;
            color: #d46b08;
        }
        .mini-tag.completed {
            background: #f5f5f5;
            color: #00000040;
        }
        .report-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            text-decoration: none;
            color: inherit;
            border-top: 1px solid #f5f5f5;
        }
        .report-item:first-of-type { border-top: none; }
        .report-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            flex: none;
        }
        .report-main { flex: 1; min-width: 0; }
        .report-main strong {
            display: block;
            font-size: 15px;
            line-height: 22px;
            color: #000000d9;
        }
        .report-main span {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            line-height: 18px;
            color: #00000073;
        }
        .modal-actions {
            display: grid;

        function getTask(id) {
            id = String(id);
            return tasks.find(function (task) { return task.id === id; });
        }

        function getVisibleTasks() {
            return tasks.filter(function (task) {
                return !task.hiddenUntilDispatch || task.dispatched;
            });
        }

        function statusText(status) {
            if (status === 'executing') return '执行中';
            if (status === 'completed') return '已完成';
            return '待开始';
        }

        function statusClass(status) {
            if (status === 'completed') return 'completed';
            if (status === 'pending') return 'pending';
            return '';
        }

        function taskTagClass(task) {
            if (task.status === 'executing') return 'running';
            if (task.status === 'completed') return 'completed';
            if (task.icon === 'dynamic') return 'dynamic';
            if (task.icon === 'emergency') return 'urgent';
            return '';
        }

        function taskTagText(task) {
            if (task.status === 'executing') return '当前';
            if (task.status === 'completed') return statusText(task.status);
            if (task.icon === 'dynamic') return '动态';
            if (task.icon === 'emergency') return '应急';
            return statusText(task.status);
        }

        function projectPoint(point) {
            var lat = point[0];
            var lng = point[1];
            var xRatio = (lng - GEO_BOUNDS.minLng) / (GEO_BOUNDS.maxLng - GEO_BOUNDS.minLng);
            var yRatio = (GEO_BOUNDS.maxLat - lat) / (GEO_BOUNDS.maxLat - GEO_BOUNDS.minLat);
            return {
                x: MAP_AREA.left + xRatio * MAP_AREA.width,
                y: MAP_AREA.top + yRatio * MAP_AREA.height
            };
        }

        function routeToPoints(route) {
            // 返回 SVG 坐标系内的相对坐标（SVG 自身定位在 MAP_AREA 区域）
            return route.map(function (point) {
                var projected = projectPoint(point);
                var svgX = (projected.x - MAP_AREA.left).toFixed(1);
                var svgY = (projected.y - MAP_AREA.top).toFixed(1);
                return svgX + ',' + svgY;
            }).join(' ');
        }

        function setMarkerPosition(id, point) {
            var marker = document.getElementById(id);
            if (!marker) return;
            var projected = projectPoint(point);
            marker.style.left = projected.x + 'px';
            marker.style.top = projected.y + 'px';
        }

        function setTaskList(open) {
            var workbench = document.getElementById('workbench');
            var trigger = document.getElementById('taskSheetTrigger');
            workbench.classList.toggle('sheet-open', open);
            trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
            updateTaskTriggerText();
            // 同步右侧工具栏位置（紧贴 console 卡片上方 16px）
            updateMapToolsPosition();
        }

        function updateTaskTriggerText() {
            var workbench = document.getElementById('workbench');
            var trigger = document.getElementById('taskSheetTrigger');
            if (!workbench || !trigger) return;
            var open = workbench.classList.contains('sheet-open');
            trigger.textContent = open ? '收起任务' : '展开任务';
            trigger.setAttribute('aria-label', open ? '收起今日任务列表' : '展开今日任务列表');
        }

        // 同步地图底部浮层位置：始终在 console 卡片顶部上方 16px
        function updateMapToolsPosition() {
            var consoleEl = document.getElementById('taskConsole');
            var mapTools = document.getElementById('mapTools');
            var mapLegend = document.getElementById('mapLegend');
            if (consoleEl) {
                var bottom = consoleEl.offsetHeight + 16;
                if (mapTools) mapTools.style.bottom = bottom + 'px';
                if (mapLegend) mapLegend.style.bottom = bottom + 'px';
            }
        }

        function toggleTaskList() {
            var workbench = document.getElementById('workbench');
            setTaskList(!workbench.classList.contains('sheet-open'));
        }

        function closeTaskList() {
            setTaskList(false);
        }

        function syncTopVehicleStatus() {
            var taskCount = document.getElementById('topTaskCount');
            var completedCount = document.getElementById('topCompletedCount');
            var vehicleStatus = document.getElementById('vehicleStatus');
            var vehicleStatusText = document.getElementById('vehicleStatusText');
            var visibleTasks = getVisibleTasks();
            if (taskCount) taskCount.textContent = visibleTasks.length;
            var completed = visibleTasks.filter(function (task) { return task.status === 'completed'; }).length;
            if (completedCount) completedCount.textContent = completed;
            if (!vehicleStatus || !vehicleStatusText) return;

            var hasExecuting = visibleTasks.some(function (task) { return task.status === 'executing'; });
            var hasPending = visibleTasks.some(function (task) { return task.status === 'pending'; });
            var label = '待交车';
            var stateClass = 'warning';
            if (hasExecuting) {
                label = '作业中';
                stateClass = 'active';
            } else if (hasPending) {
                label = '使用中';
                stateClass = '';
            }

            vehicleStatus.className = 'vehicle-state' + (stateClass ? ' ' + stateClass : '');
            vehicleStatusText.textContent = label;
        }

        function renderTaskDrawer(notice) {
            var visibleTasks = getVisibleTasks();
            var activeCount = visibleTasks.filter(function (task) { return task.status !== 'completed'; }).length;
            var executingIndex = visibleTasks.findIndex(function (task) { return task.status === 'executing'; });
            updateTaskTriggerText();
            document.getElementById('taskSheetMeta').textContent = visibleTasks.length + ' 项任务 · ' + (executingIndex >= 0 ? '当前执行第 ' + (executingIndex + 1) + ' 项' : activeCount + ' 项待办');
            syncTopVehicleStatus();

            document.getElementById('taskList').innerHTML = visibleTasks.map(function (task) {
                var tagClass = taskTagClass(task);
                var meta = task.status === 'executing'
                    ? task.time + ' · 覆盖度 ' + task.coverage + '%'
                    : task.time + ' · ' + task.routeName + (task.distance ? ' · ' + task.distance : '');
                return '<button type="button" class="mini-task ' + (task.id === selectedTaskId ? 'active' : '') + '" data-task-id="' + task.id + '" onclick="selectTask(' + task.id + ')">' +
                    '<span><span class="mini-name">' + task.name + '</span><span class="mini-meta">' + meta + '</span></span>' +
                    '<span class="mini-tag ' + tagClass + '">' + taskTagText(task) + '</span>' +
                    '</button>';
            }).join('');

            if (notice) showToast(notice);
        }

        function renderConsole() {
            var task = getTask(selectedTaskId);
            var isPending = task.status === 'pending';
            var coverage = Math.max(0, Math.min(100, task.coverage || 0));
            var planStart = (task.time || '').split('-')[0] || '--:--';
            var startTime = task.startTime || planStart;

            document.getElementById('taskTitle').textContent = task.name;
            document.getElementById('taskRoute').textContent = (task.routeName || '') + ' - ' + (task.time || '');
            document.getElementById('taskRequirement').textContent = task.requirement || '暂无作业要求';
            document.getElementById('taskState').textContent = statusText(task.status);
            document.getElementById('taskState').className = 'state-tag ' + statusClass(task.status);
            document.getElementById('startTimeValue').textContent = isPending ? '-' : startTime;
            document.getElementById('coverageValue').textContent = isPending ? '-' : (coverage + '%');
            document.getElementById('durationValue').textContent = isPending ? '-' : (task.duration || '0 分钟');
            document.getElementById('detailBtn').href = 'task-detail.html?id=' + task.id;
            syncTopVehicleStatus();

            var primaryAction = document.getElementById('primaryAction');
            primaryAction.classList.toggle('finished', task.status === 'completed');
            primaryAction.disabled = false;
            if (task.status === 'executing') {
                primaryAction.textContent = '结束任务';
                primaryAction.onclick = function () { finishTask(task.id); };
            } else if (task.status === 'pending') {
                primaryAction.textContent = '开始任务';
                primaryAction.onclick = function () { startTask(task.id); };
            } else {
                primaryAction.textContent = '已完成';
                primaryAction.onclick = function () { showToast('该任务已完成'); };
            }
            // 同步右侧工具栏位置
            updateMapToolsPosition();
        }

        function formatHHMM(date) {
            var h = String(date.getHours()).padStart(2, '0');
            var m = String(date.getMinutes()).padStart(2, '0');
            return h + ':' + m;
        }

        function drawSelectedTask() {
            var task = getTask(selectedTaskId);
            var route = task.route;
            var actualPath = task.actualRoute || route;
            var displayRoute = route;
            var actualEndIndex = task.status === 'executing' || task.status === 'completed' ? Math.max(0, Math.min(task.actualIndex, actualPath.length - 1)) : 0;
            var actualRoute = task.status === 'pending' ? [] : actualPath.slice(0, actualEndIndex + 1);

            document.getElementById('plannedRoute').setAttribute('points', routeToPoints(route));
            document.getElementById('pulseRoute').setAttribute('points', routeToPoints(route));
            document.getElementById('actualTrack').setAttribute('points', actualRoute.length > 1 ? routeToPoints(actualRoute) : '');

            setMarkerPosition('startMarker', displayRoute[0]);
            setMarkerPosition('endMarker', displayRoute[displayRoute.length - 1]);

            var runningTask = executingTaskId ? getTask(executingTaskId) : null;
            var runningPath = runningTask ? (runningTask.actualRoute || runningTask.route) : null;
            var vehiclePoint = task.status === 'executing'
                ? actualPath[Math.min(task.actualIndex, actualPath.length - 1)]
                : (runningPath ? runningPath[Math.min(runningTask.actualIndex, runningPath.length - 1)] : displayRoute[0]);
            setMarkerPosition('vehicleMarker', vehiclePoint);
        }

        function selectTask(id) {
            selectedTaskId = String(id);
            renderTaskDrawer();
            renderConsole();
            drawSelectedTask();
        }

        function startTask(id) {
            var task = getTask(id);
            if (executingTaskId && executingTaskId !== id) {
                showToast('请先结束当前任务');
                selectTask(executingTaskId);
                highlightTask(executingTaskId);
                return;
            }
            if (!task.canStart) {
                showToast(task.failReason || '当前暂不可开始任务');
                return;
            }
            task.status = 'executing';
            task.actualIndex = 0;
            task.coverage = Math.max(task.coverage, 8);
            task.duration = '0 分钟';
            task.startTime = formatHHMM(new Date());
            executingTaskId = id;
            selectedTaskId = id;
            showToast('任务已开始');
            renderTaskDrawer();
            renderConsole();
            drawSelectedTask();
            startVehicleMotion(task);
            // 任务已开始：自动收起任务列表，仅展示当前执行任务
            closeTaskList();
        }

        function finishTask(id) {
            var task = getTask(id);
            if (!task || task.status !== 'executing') {
                showToast('当前无可结束任务');
                return;
            }
            // 后台校验：阻断项
            if (task.canFinish === false) {
                showToast(task.blockReason || '存在未完成事项，暂不可结束');
                return;
            }
            // 后台校验：路线覆盖度（演示阈值 50%）
            if (typeof task.coverage === 'number' && task.coverage < 50) {
                showToast('路线覆盖度 ' + task.coverage + '%，未达 50%，请补作业后再结束');
                return;
            }
            // 校验通过：结束任务
            clearInterval(moveTimer);
            task.status = 'completed';
            task.coverage = Math.max(task.coverage, 96);
            task.duration = task.duration || '已完成';
            executingTaskId = null;
            var nextTask = getVisibleTasks().find(function (item) { return item.status === 'pending'; });
            if (nextTask) {
                selectedTaskId = nextTask.id;
                showToast('任务已结束，已推送下一任务：' + nextTask.name);
            } else {
                selectedTaskId = task.id;
                showToast('今日任务已完成，可导航返场并交车');
            }
            renderTaskDrawer();
            renderConsole();
            drawSelectedTask();
        }

        function startVehicleMotion(task) {
            clearInterval(moveTimer);
            if (!task) return;
            moveTimer = setInterval(function () {
                if (task.status !== 'executing') {
                    clearInterval(moveTimer);
                    return;
                }
                var motionPath = task.actualRoute || task.route;
                if (task.actualIndex < motionPath.length - 1) {
                    task.actualIndex += 1;
                    task.coverage = Math.min(98, Math.round(((task.actualIndex + 1) / motionPath.length) * 100));
                    task.duration = task.actualIndex * 8 + ' 分钟';
                    if (task.actualIndex >= Math.floor(motionPath.length * DYNAMIC_TASK_TRIGGER_RATIO)) {
                        showDynamicTaskBanner();
                    }
                    renderTaskDrawer();
                    renderConsole();
                    drawSelectedTask();
                } else {
                    clearInterval(moveTimer);
                }
            }, DEMO_STEP_MS);
        }

        function showDynamicTaskBanner() {
            if (dynamicTaskShown) return;
            var dynamicTask = tasks.find(function (task) {
                return task.icon === 'dynamic' && task.hiddenUntilDispatch;
            });
            if (!dynamicTask) return;
            dynamicTask.dispatched = true;
            dynamicTaskShown = true;
            var banner = document.querySelector('[data-testid="dynamic-task-banner"]');
            if (banner) {
                banner.classList.add('show');
                banner.setAttribute('aria-hidden', 'false');
            }
            renderTaskDrawer();
        }

        function openAmapNavigation(id) {
            var task = getTask(id);
            var target = task.route[task.route.length - 1];
            var url = 'https://uri.amap.com/navigation?to=' + target[1] + ',' + target[0] + ',' + encodeURIComponent(task.routeName) + '&mode=car&policy=1&src=kuwash-app&coordinate=wgs84&callnative=1';
            showToast('正在打开高德地图导航');
            window.open(url, '_blank');
        }

        function centerMap() {
            var marker = document.getElementById('vehicleMarker');
            marker.style.transform = 'translate(-50%, -50%) scale(1.1)';
            setTimeout(function () {
                marker.style.transform = 'translate(-50%, -50%) scale(1)';
            }, 240);
            showToast('已回正到当前车辆位置');
        }

        // 交车：按 PRD 5.7 章节执行
        // - 有进行中未结束任务：toast 拦截 + 底部 console 任务标题高亮，不打开任何抽屉/弹窗
        // - 无未结束任务：直接跳转个人二维码页面
        function handleHandover() {
            var unfinished = tasks.filter(function (task) { return task.status === 'executing'; });
            if (unfinished.length > 0) {
                showToast('存在未结束任务，无法交车，请结束任务或异常关闭');
                var target = unfinished[0];
                selectedTaskId = target.id;
                renderTaskDrawer();
                renderConsole();
                drawSelectedTask();
                // 不调用 setTaskList(true)，仅在底部 console 上对当前任务标题做高亮提示
                flashConsoleTask(target.id);
                return;
            }
            window.location.href = 'qrcode.html?scene=handover';
        }

        // 底部 console 当前任务标题的高亮提示（用于交车拦截时的视觉强调）
        function flashConsoleTask(id) {
            var title = document.getElementById('taskTitle');
            if (!title) return;
            title.classList.remove('flash');
            void title.offsetWidth; // 触发 reflow，重启动画
            title.classList.add('flash');
            setTimeout(function () { title.classList.remove('flash'); }, 2000);
        }

        function highlightTask(id) {
            setTimeout(function () {
                var el = document.querySelector('[data-task-id="' + id + '"]');
                if (!el) return;
                el.classList.add('flash');
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(function () { el.classList.remove('flash'); }, 2000);
            }, 80);
        }

        function openDynamicTask() {
            var dynamicTask = tasks.find(function (task) {
                return task.icon === 'dynamic' && task.status === 'pending' && (!task.hiddenUntilDispatch || task.dispatched);
            });
            if (!dynamicTask) {
                showToast('暂无新的动态任务');
                return;
            }
            selectedTaskId = dynamicTask.id;
            renderTaskDrawer('新动态任务已进入待办列表');
            renderConsole();
            drawSelectedTask();
            setTaskList(true);
            highlightTask(dynamicTask.id);
        }

        function openModal(id) {
            // 弹窗显示时折叠任务列表抽屉，避免视觉混乱与 stacking 错乱
            closeTaskList();
            document.getElementById('workbench').classList.add('modal-open');
            var target = document.getElementById(id);
            // 关闭其他可能打开的 .bottom-modal
            document.querySelectorAll('.bottom-modal').forEach(function (modal) {
                modal.classList.toggle('show', modal === target);
            });
        }

        function closeActiveModal() {
            document.getElementById('workbench').classList.remove('modal-open');
            document.querySelectorAll('.bottom-modal').forEach(function (modal) {
                modal.classList.remove('show');
            });
        }

        function openReportPicker() {
            openModal('reportModal');
        }

        // 直接关闭 reportModal：移除 .modal-open + reportModal.show，强制清理避免残留
        function closeReportModal() {
            document.getElementById('workbench').classList.remove('modal-open');
            var reportModal = document.getElementById('reportModal');
            if (reportModal) {
                reportModal.classList.remove('show');
            }
        }

        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(function () {
                toast.classList.remove('show');
            }, 1800);
        }

        renderTaskDrawer();
        renderConsole();
        drawSelectedTask();
        if (executingTaskId) {
            startVehicleMotion(getTask(executingTaskId));
        }
        // 初始化时同步右侧工具栏位置
        updateMapToolsPosition();
        // 用 ResizeObserver 兜底监听 console 高度变化
        if (typeof ResizeObserver !== 'undefined') {
            var consoleEl = document.getElementById('taskConsole');
            if (consoleEl) {
                new ResizeObserver(updateMapToolsPosition).observe(consoleEl);
            }
        }
    </script>
</body>
</html>
