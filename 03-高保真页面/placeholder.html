<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>功能开发中 - 城市管家</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="components/custom-tabbar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 430px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            width: 100%; margin: 0; min-height: 100vh; padding-bottom: 56px;
        }
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
            width: 100%; max-width: 430px; height: 44px;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            display: flex; align-items: center; z-index: 1000; padding: 0 16px;
        }
        .top-nav-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #000000d9; text-decoration: none; margin-left: -8px;
        }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #000000d9;
        }
        .content-area {
            padding-top: 44px; padding-bottom: 56px;
            min-height: calc(100vh - 44px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .placeholder-icon {
            width: 120px; height: 120px; border-radius: 50%;
            background: #e6f4ff; color: #1677ff;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }
        .placeholder-icon svg { width: 56px; height: 56px; }
        .placeholder-title {
            font-size: 18px; font-weight: 600; color: #000000d9;
            line-height: 26px; text-align: center;
        }
        .placeholder-desc {
            margin-top: 8px; font-size: 13px; color: #00000073;
            line-height: 20px; text-align: center; padding: 0 32px;
        }
        .placeholder-tag {
            margin-top: 12px; display: inline-flex; align-items: center;
            height: 24px; padding: 0 10px; border-radius: 12px;
            background: #fff7e6; color: #fa8c16; font-size: 12px; line-height: 24px;
        }
        .placeholder-back-btn {
            margin-top: 32px; min-width: 140px; height: 40px; padding: 0 24px;
            background: #ffffff; color: #1677ff; font-size: 14px; font-weight: 500;
            border: 1px solid #1677ff; border-radius: 20px;
            text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .placeholder-back-btn:active {
            background: #e6f4ff; transform: scale(0.96);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <a href="javascript:history.back()" class="top-nav-back" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title" id="navTitle">功能开发中</div>
    </div>

    <div class="content-area">
        <div class="placeholder-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
            </svg>
        </div>
        <div class="placeholder-title" id="featureTitle">该功能</div>
        <div class="placeholder-desc">该功能正在开发中，敬请期待</div>
        <div class="placeholder-tag">即将上线</div>
        <a href="javascript:history.back()" class="placeholder-back-btn">返回上一页</a>
    </div>

    <!-- 底部Tab（自定义组件） -->
    <nav class="ctab-bar" aria-label="主导航"></nav>

    <script>
        // 从 URL 参数读取功能名称
        (function () {
            function getQueryParam(name) {
                var search = window.location.search.replace(/^\?/, '');
                var pairs = search.split('&');
                for (var i = 0; i < pairs.length; i++) {
                    var kv = pairs[i].split('=');
                    if (decodeURIComponent(kv[0]) === name) {
                        return decodeURIComponent(kv[1] || '');
                    }
                }
                return '';
            }
            var title = getQueryParam('title') || '该功能';
            document.getElementById('navTitle').textContent = title;
            document.getElementById('featureTitle').textContent = title;
            document.title = title + ' - 城市管家';
        })();
    </script>
    <script src="components/app-common.js"></script>
    <script src="components/tab-apps-data.js"></script>
    <script src="components/custom-tabbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // 占位页默认高亮工作台
            CustomTabbar.init({ activeKey: 'sys-workbench' });
        });
    </script>
</body>
</html>
