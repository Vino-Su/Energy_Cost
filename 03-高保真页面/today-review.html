<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日回顾 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <link rel="stylesheet" href="components/driver-task-list.css">
    <style>
        /* 页面级框架样式（顶导/底部/今日回顾指标/分组标题） */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 375px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; color: #1f2329;
            width: 100%; min-height: 100vh; margin: 0;
        }
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
            width: 100%; max-width: 375px; height: 44px;
            background: rgba(255,255,255,0.96); border-bottom: 1px solid #e5e6eb;
            display: flex; align-items: center; z-index: 1000; padding: 0 16px;
        }
        .top-nav-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #1f2329; text-decoration: none; margin-left: -8px;
            -webkit-tap-highlight-color: transparent;
        }
        .top-nav-back:active { background: #f2f3f5; border-radius: 6px; }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #1f2329;
        }
        .content-area { padding: 56px 16px 96px; }
        /* 交车成功横幅 */
        .success-card {
            background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%);
            border-radius: 12px; padding: 18px 16px; margin-bottom: 12px;
            color: #ffffff;
        }
        .success-top { display: flex; align-items: center; gap: 10px; }
        .success-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .success-icon svg { width: 22px; height: 22px; }
        .success-title { font-size: 17px; font-weight: 600; }
        .success-sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
        .success-meta {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.25);
            font-size: 12px; line-height: 20px;
        }
        .success-meta .label { opacity: 0.85; margin-right: 6px; }
        /* 通用卡片（今日回顾指标 / 今日待办 / 明日待办 容器） */
        .card {
            background: #ffffff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 15px; font-weight: 600; color: #1f2329; margin-bottom: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .card-title .bar {
            width: 3px; height: 14px; border-radius: 2px; background: #1677ff;
        }
        .card-title .count {
            font-size: 12px; font-weight: 400; color: #86909c;
            margin-left: auto;
        }
        /* 今日回顾指标 */
        .review-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .review-item {
            text-align: center; padding: 14px 4px;
            background: #f7fafd; border-radius: 10px;
        }
        .review-value {
            font-size: 22px; font-weight: 700; color: #1677ff; line-height: 28px;
        }
        .review-value .unit { font-size: 12px; font-weight: 500; color: #00000073; margin-left: 2px; }
        .review-label { font-size: 11px; color: #86909c; margin-top: 4px; }
        /* 今日待办分组标题 */
        .unfinished-group { margin-top: 14px; }
        .unfinished-group:first-child { margin-top: 0; }
        .unfinished-group + .unfinished-group { margin-top: 18px; }
        .unfinished-group-head {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 10px;
        }
        .unfinished-group-bar {
            width: 3px; height: 14px; border-radius: 2px; flex-shrink: 0;
        }
        .unfinished-group.current .unfinished-group-bar { background: #1677ff; }
        .unfinished-group.other .unfinished-group-bar { background: #faad14; }
        .unfinished-group-title {
            font-size: 14px; font-weight: 600; color: #1f2329;
        }
        .unfinished-group-count {
            font-size: 12px; color: #86909c; font-weight: 400;
        }
        /* 卡片列表容器（覆盖 driver-task-list.css 的 .list-area 间距） */
        .task-list { display: grid; gap: 12px; }
        /* 卡片微调：driver-task-list.css 默认有左侧色条，按列表页保留 14px 内边距；今日待办卡片去掉该色条 */
        .task-card.no-border-left { border-left: 0 !important; padding-left: 16px !important; }
        /* 底部固定按钮 */
        .bottom-actions {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 375px;
            padding: 12px 16px 16px; background: #ffffff; border-top: 1px solid #e8e8e8;
            z-index: 1000;
        }
        .action-btn {
            width: 100%; height: 44px; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; text-decoration: none;
            background: #1677ff; color: #ffffff;
        }
        .action-btn:active { opacity: 0.85; }
        /* Toast（沿用项目无依赖实现） */
        .toast {
            position: fixed; left: 50%; top: 50%; z-index: 1100; max-width: 260px;
            padding: 10px 14px; border-radius: 8px; background: rgba(31,35,41,0.82);
            color: #ffffff; font-size: 14px; line-height: 20px; text-align: center;
            opacity: 0; pointer-events: none; transform: translate(-50%,-50%); transition: opacity 0.2s;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body data-no-project-switcher="true">
    <header class="top-nav">
        <a href="vehicle-management.html" class="top-nav-back" aria-label="返回首页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title">今日回顾</div>
    </header>

    <div class="content-area">
        <!-- 交车成功横幅 -->
        <div class="success-card">
            <div class="success-top">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div>
                    <div class="success-title">交车成功</div>
                    <div class="success-sub">已解除人车绑定，今日作业已收尾</div>
                </div>
            </div>
            <div class="success-meta">
                <span class="label">车辆</span>粤B·D2856 · 洗扫车<br>
                <span class="label">交车时间</span>2026-07-10 18:26 · 科苑南路停放场
            </div>
        </div>

        <!-- 今日回顾 -->
        <div class="card">
            <div class="card-title"><span class="bar"></span>今日回顾</div>
            <div class="review-grid">
                <div class="review-item">
                    <div class="review-value">3</div>
                    <div class="review-label">完成任务数</div>
                </div>
                <div class="review-item">
                    <div class="review-value">38.6<span class="unit">km</span></div>
                    <div class="review-label">轨迹里程</div>
                </div>
                <div class="review-item">
                    <div class="review-value">7<span class="unit">时42分</span></div>
                    <div class="review-label">出车时长</div>
                </div>
            </div>
        </div>

        <!-- 今日待办 -->
        <div class="card">
            <div class="card-title">
                <span class="bar"></span>今日待办
                <span id="unfinishedTotal" class="count"></span>
            </div>
            <div class="task-list" id="unfinishedList"></div>
        </div>

        <!-- 明日待办 -->
        <div class="card">
            <div class="card-title"><span class="bar"></span>明日待办</div>
            <div class="task-list" id="todoList"></div>
        </div>
    </div>

    <div class="bottom-actions">
        <a href="vehicle-management.html" class="action-btn">返回首页</a>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        // ============================================================
        // 数据：今日待办（demo）+ 明日待办（demo）
        // 字段与 driver-task-list.css / task-detail.html 对齐
        // kind: route(常规) / issue(动态)；tone: regular/temporary/emergency/dynamic
        // ============================================================

        // 当前车辆（交车车辆 粤B·D2856）今日未完成任务：1 进行中 + 1 待开始
        var CURRENT_VEHICLE_TASKS = [
            {
                id: 'R01', kind: 'route', tone: 'regular', status: 'executing',
                name: '西丽留仙洞片区道路清扫', workType: '道路清扫',
                date: '2026-07-10', time: '08:00~10:00',
                plateNo: '粤B·D2856', source: 'schedule'
            },
            {
                id: '4', kind: 'route', tone: 'regular', status: 'pending',
                name: '高新南九道日常巡检', workType: '日常巡检',
                date: '2026-07-10', time: '14:00~15:00',
                plateNo: '粤B·D2856', source: 'schedule'
            }
        ];

        // 其他车辆（同一司机名下其他车）今日未完成任务：1 进行中 + 1 待开始 + 1 动态
        var OTHER_VEHICLE_TASKS = [
            {
                id: 'R02', kind: 'route', tone: 'regular', status: 'executing',
                name: '海岸城周边精细化保洁', workType: '精细化保洁',
                date: '2026-07-10', time: '10:30~12:00',
                plateNo: '粤B·B229L', source: 'schedule'
            },
            {
                id: 'E-P03', kind: 'route', tone: 'temporary', status: 'pending',
                name: '沙河西路污染点临时冲洗', workType: '污染点处置',
                date: '2026-07-10', time: '13:00~15:00',
                plateNo: '粤B·3368F', source: 'emergency'
            },
            {
                id: 'T-P02', kind: 'issue', tone: 'dynamic', status: 'pending',
                name: '后海大道雨水口堵塞复核', workType: '动态问题处置',
                issueType: '雨水口堵塞', severity: '一般',
                dispatchedAt: '2026-07-10 13:05:00',
                plateNo: '粤B·K337W', source: 'dynamic'
            }
        ];

        // 明日待办任务（demo）：1 常态 + 1 临时应急 + 1 动态
        var TOMORROW_TASKS = [
            {
                id: 'P01', kind: 'route', tone: 'regular', status: 'pending',
                name: '科技园南区道路清扫', workType: '道路清扫',
                date: '2026-07-11', time: '08:30~10:30',
                plateNo: '粤B·8829D', source: 'schedule'
            },
            {
                id: 'E-P01', kind: 'route', tone: 'temporary', status: 'pending',
                name: '沙河西路污染点临时冲洗', workType: '污染点处置',
                date: '2026-07-11', time: '11:20~12:20',
                plateNo: '粤B·E550F', source: 'emergency'
            },
            {
                id: 'T-P01', kind: 'issue', tone: 'dynamic', status: 'pending',
                name: '科技园北区垃圾遗漏复核', workType: '动态问题处置',
                issueType: '明显垃圾', severity: '紧急',
                dispatchedAt: '2026-07-11 09:25:00',
                plateNo: '粤B·J226V', source: 'dynamic'
            },
            {
                id: 'P04', kind: 'route', tone: 'regular', status: 'pending',
                name: '滨海大道夜间冲洗', workType: '夜间冲洗',
                date: '2026-07-11', time: '19:00~22:00',
                plateNo: '粤B·7720A', source: 'schedule'
            }
        ];

        // ============================================================
        // 枚举文案（与 driver-task-list.js 保持一致）
        // ============================================================
        var STATUS_TEXT = {
            pending: '待开始', executing: '进行中',
            completed: '已完成', delegated: '已转派', terminated: '已终止', invalid: '已失效'
        };
        var TYPE_TEXT = { schedule: '常规任务', dynamic: '动态任务' };

        // ============================================================
        // 工具方法
        // ============================================================
        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
            });
        }

        // 进行中 > 待开始；同状态按时间升序
        var STATUS_RANK = { executing: 0, pending: 1 };
        function sortByStatusAndTime(list) {
            return list.slice().sort(function (a, b) {
                var ra = STATUS_RANK[a.status] == null ? 99 : STATUS_RANK[a.status];
                var rb = STATUS_RANK[b.status] == null ? 99 : STATUS_RANK[b.status];
                if (ra !== rb) return ra - rb;
                var ta = a.time || a.dispatchedAt || '';
                var tb = b.time || b.dispatchedAt || '';
                return String(ta).localeCompare(String(tb));
            });
        }

        // ============================================================
        // 卡片渲染（与 driver-task-list.js renderCard 字段规则一致）
        // ============================================================
        function renderTaskCard(task) {
            var plate = task.plateNo || '';
            var plateClass = plate ? '' : ' unassigned';
            var plateText = plate || '未分配车辆';
            var isDynamic = task.kind === 'issue' || task.tone === 'dynamic';
            var title = isDynamic
                ? (task.name || '问题地点待确认')
                : (task.name || '路线待确认');
            // 卡片左侧色条按任务类型着色（今日回顾页不按车辆分组，色条按任务类型强化）
            var borderClass = 'no-border-left'; // 今日回顾页采用分组标题区分，不用单卡色条
            if (task.tone === 'temporary' || task.tone === 'emergency') {
                borderClass = 'emergency';
            } else if (task.tone === 'dynamic') {
                borderClass = 'dynamic';
            } else {
                borderClass = 'schedule';
            }
            var href = 'task-detail.html?id=' + encodeURIComponent(task.id) +
                '&status=' + encodeURIComponent(task.status) +
                '&source=' + encodeURIComponent(task.source || (isDynamic ? 'dynamic' : 'schedule'));

            // 第一行：标题 + 任务状态
            var firstLine = '<span class="task-card-head">' +
                '<span class="task-card-title-wrap"><span class="task-card-title">' + escapeHtml(title) + '</span></span>' +
                '<span class="status-tag ' + escapeHtml(task.status) + '">' + escapeHtml(STATUS_TEXT[task.status] || '状态未知') + '</span>' +
            '</span>';

            // 第二行：车牌 + 类型 + 作业类型/问题类型/重要程度
            var tagList = ['<span class="plate-tag' + plateClass + '">' + escapeHtml(plateText) + '</span>'];
            if (isDynamic) {
                var typeLabel = '动态任务';
                tagList.push('<span class="type-tag dynamic">' + typeLabel + '</span>');
                tagList.push('<span class="work-type">' + escapeHtml(task.issueType || '问题类型待确认') + '</span>');
                tagList.push('<span class="severity-tag">' + escapeHtml(task.severity || '一般') + '</span>');
            } else {
                var typeText = (task.tone === 'temporary') ? '临时任务' : '常态任务';
                var typeClass = (task.tone === 'temporary') ? 'temporary' : 'schedule';
                tagList.push('<span class="type-tag ' + typeClass + '">' + escapeHtml(typeText) + '</span>');
                tagList.push('<span class="work-type">' + escapeHtml(task.workType || '作业类型待确认') + '</span>');
            }
            var secondLine = '<span class="task-card-tags">' + tagList.join('') + '</span>';

            // 第三行：常规任务 -> 计划日期 + 时间；动态任务 -> 任务派发时间
            var meta = '';
            if (isDynamic) {
                meta = '<span class="task-meta"><span class="task-meta-item">任务派发时间：' +
                    escapeHtml(task.dispatchedAt || '待确认') + '</span></span>';
            } else {
                meta = '<span class="task-meta">' +
                    '<span class="task-meta-item">计划日期：' + escapeHtml(task.date || '待确认') + '</span>' +
                    '<span class="task-meta-sep"></span>' +
                    '<span class="task-meta-item">' + escapeHtml(task.time || '时间待确认') + '</span>' +
                '</span>';
            }

            return '<button type="button" class="task-card ' + borderClass + '" data-detail-href="' + href + '" aria-label="查看' + escapeHtml(title) + '详情">' +
                firstLine + secondLine + meta +
            '</button>';
        }

        // ============================================================
        // 今日待办分组渲染
        // ============================================================
        function renderGroup(label, list, kind) {
            var sorted = sortByStatusAndTime(list);
            var itemsHtml = sorted.map(renderTaskCard).join('');
            return '<div class="unfinished-group ' + kind + '">' +
                '<div class="unfinished-group-head">' +
                    '<span class="unfinished-group-bar"></span>' +
                    '<span class="unfinished-group-title">' + escapeHtml(label) + '</span>' +
                    '<span class="unfinished-group-count">共 ' + list.length + ' 项</span>' +
                '</div>' +
                itemsHtml +
                '</div>';
        }

        function renderEmptyState() {
            return '<div class="empty-state" style="min-height:auto;padding:24px 16px;">' +
                '<div class="empty-icon" style="width:48px;height:48px;margin-bottom:8px;">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' +
                '</div>' +
                '<div class="empty-title" style="font-size:13px;font-weight:500;">今日所有任务已闭环，干得漂亮！</div>' +
                '</div>';
        }

        function renderUnfinished() {
            var box = document.getElementById('unfinishedList');
            var totalEl = document.getElementById('unfinishedTotal');
            var total = CURRENT_VEHICLE_TASKS.length + OTHER_VEHICLE_TASKS.length;
            totalEl.textContent = total > 0 ? ('共 ' + total + ' 项待办') : '';

            if (total === 0) {
                box.innerHTML = renderEmptyState();
                return;
            }

            var html = '';
            if (CURRENT_VEHICLE_TASKS.length > 0) {
                html += renderGroup('当前车辆 · 粤B·D2856', CURRENT_VEHICLE_TASKS, 'current');
            }
            if (OTHER_VEHICLE_TASKS.length > 0) {
                html += renderGroup('其他车辆', OTHER_VEHICLE_TASKS, 'other');
            }
            box.innerHTML = html;
        }

        // ============================================================
        // 明日待办渲染
        // ============================================================
        function renderTodo() {
            var box = document.getElementById('todoList');
            if (!TOMORROW_TASKS.length) {
                box.innerHTML = '<div class="empty-state" style="min-height:auto;padding:28px 16px;">' +
                    '<div class="empty-icon">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' +
                    '</div>' +
                    '<div class="empty-title" style="font-size:13px;font-weight:500;">暂无明日待办任务</div>' +
                    '</div>';
                return;
            }
            box.innerHTML = TOMORROW_TASKS.map(renderTaskCard).join('');
        }

        // ============================================================
        // 卡片点击 → 跳转任务详情
        // ============================================================
        function bindCardClick(containerId) {
            var box = document.getElementById(containerId);
            box.addEventListener('click', function (event) {
                var card = event.target.closest('[data-detail-href]');
                if (!card) return;
                window.location.href = card.getAttribute('data-detail-href');
            });
        }

        // ============================================================
        // Toast（无依赖）
        // ============================================================
        function showToast(message) {
            var el = document.getElementById('toast');
            el.textContent = message;
            el.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
        }

        // ============================================================
        // 入口
        // ============================================================
        renderTodo();
        renderUnfinished();
        bindCardClick('todoList');
        bindCardClick('unfinishedList');
    </script>
    <script src="components/app-common.js"></script>
</body>
</html>
