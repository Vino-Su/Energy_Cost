<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今日回顾 - 城市管家</title>
    <link rel="stylesheet" href="components/app-common.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { margin: 0 auto; max-width: 430px; min-height: 100vh; background: #f5f5f5; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5; width: 100%; margin: 0; min-height: 100vh;
        }
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; margin: 0 auto;
            width: 100%; max-width: 430px; height: 44px;
            background: #ffffff; border-bottom: 1px solid #e8e8e8;
            display: flex; align-items: center; z-index: 1000; padding: 0 16px;
        }
        .top-nav-back {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            color: #000000d9; text-decoration: none; margin-left: -8px;
        }
        .top-nav-back svg { width: 22px; height: 22px; }
        .top-nav-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: 16px; font-weight: 600; color: #000000d9;
        }
        .content-area { padding: 56px 16px 100px; }
        /* 交车成功横幅 */
        .success-card {
            background: linear-gradient(135deg, #52c41a 0%, #389e0d 100%);
            border-radius: 12px; padding: 18px 16px; margin-bottom: 12px;
            color: #ffffff;
        }
        .success-top { display: flex; align-items: center; gap: 10px; }
        .success-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .success-icon svg { width: 22px; height: 22px; }
        .success-title { font-size: 17px; font-weight: 600; }
        .success-sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
        .success-meta {
            margin-top: 12px; padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.25);
            font-size: 12px; line-height: 20px;
        }
        .success-meta .label { opacity: 0.85; margin-right: 6px; }
        /* 通用卡片 */
        .card {
            background: #ffffff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .card-title {
            font-size: 15px; font-weight: 600; color: #000000d9; margin-bottom: 14px;
            display: flex; align-items: center; gap: 6px;
        }
        .card-title .bar {
            width: 3px; height: 14px; border-radius: 2px; background: #1677ff;
        }
        /* 今日回顾指标网格 */
        .review-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .review-item {
            text-align: center; padding: 14px 4px;
            background: #f7fafd; border-radius: 10px;
        }
        .review-value {
            font-size: 22px; font-weight: 700; color: #1677ff; line-height: 28px;
        }
        .review-value .unit { font-size: 12px; font-weight: 500; color: #00000073; margin-left: 2px; }
        .review-label { font-size: 11px; color: #00000073; margin-top: 4px; }
        /* 明日待办 */
        .todo-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 10px; background: #f7fafd;
        }
        .todo-item + .todo-item { margin-top: 10px; }
        .todo-time {
            flex-shrink: 0; width: 52px; text-align: center;
        }
        .todo-time-start { font-size: 14px; font-weight: 600; color: #000000d9; }
        .todo-time-end { font-size: 11px; color: #00000073; margin-top: 2px; }
        .todo-divider { width: 1px; align-self: stretch; background: #e8e8e8; }
        .todo-main { flex: 1; min-width: 0; }
        .todo-name {
            font-size: 14px; font-weight: 500; color: #000000d9;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .todo-meta { font-size: 12px; color: #00000073; margin-top: 3px; }
        .todo-tag {
            flex-shrink: 0; font-size: 11px; padding: 2px 8px; border-radius: 4px;
            background: #e6f4ff; color: #1677ff;
        }
        .todo-tag.emergency { background: #fff1f0; color: #ff4d4f; }
        .todo-empty {
            padding: 28px 16px; text-align: center;
        }
        .todo-empty-icon {
            width: 56px; height: 56px; margin: 0 auto 10px;
            border-radius: 50%; background: #f0f5fa;
            display: flex; align-items: center; justify-content: center;
            color: #bfbfbf;
        }
        .todo-empty-icon svg { width: 28px; height: 28px; }
        .todo-empty-text { font-size: 13px; color: #00000073; }
        /* 底部 */
        .bottom-actions {
            position: fixed; bottom: 0; left: 0; right: 0;
            margin: 0 auto; max-width: 430px;
            padding: 12px 16px 16px; background: #ffffff; border-top: 1px solid #e8e8e8;
            z-index: 1000;
        }
        .action-btn {
            width: 100%; height: 44px; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            display: flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; text-decoration: none;
            background: #1677ff; color: #ffffff;
        }
        .action-btn:active { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="home.html" class="top-nav-back" aria-label="返回首页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <div class="top-nav-title">今日回顾</div>
    </div>

    <div class="content-area">
        <!-- 交车成功横幅 -->
        <div class="success-card">
            <div class="success-top">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                </div>
                <div>
                    <div class="success-title">交车成功</div>
                    <div class="success-sub">已解除人车绑定，今日作业已收尾</div>
                </div>
            </div>
            <div class="success-meta">
                <span class="label">车辆</span>粤B·D2856 · 洗扫车<br>
                <span class="label">交车时间</span>2026-07-10 18:26 · 科苑南路停放场
            </div>
        </div>

        <!-- 今日回顾 -->
        <div class="card">
            <div class="card-title"><span class="bar"></span>今日回顾</div>
            <div class="review-grid">
                <div class="review-item">
                    <div class="review-value">3</div>
                    <div class="review-label">完成任务数</div>
                </div>
                <div class="review-item">
                    <div class="review-value">38.6<span class="unit">km</span></div>
                    <div class="review-label">轨迹里程</div>
                </div>
                <div class="review-item">
                    <div class="review-value">7<span class="unit">时42分</span></div>
                    <div class="review-label">出车时长</div>
                </div>
                <div class="review-item">
                    <div class="review-value">2</div>
                    <div class="review-label">水电油上报数</div>
                </div>
                <div class="review-item">
                    <div class="review-value">0</div>
                    <div class="review-label">报修数</div>
                </div>
            </div>
        </div>

        <!-- 明日待办 -->
        <div class="card">
            <div class="card-title"><span class="bar"></span>明日待办</div>
            <div id="todoList"></div>
        </div>
    </div>

    <div class="bottom-actions">
        <a href="home.html" class="action-btn">返回首页</a>
    </div>

    <script>
        // 明日待办任务（演示数据）；置为空数组可查看空态
        var TOMORROW_TASKS = [
            { start: '08:30', end: '10:30', name: '科技园南区道路清扫', route: '科苑南路至高新南九道', type: 'normal', tag: '常规' },
            { start: '11:00', end: '12:00', name: '沙河西路应急处置', route: '沙河西路全段', type: 'emergency', tag: '应急' },
            { start: '19:00', end: '22:00', name: '滨海大道夜间冲洗', route: '滨海大道东段', type: 'normal', tag: '常规' }
        ];

        function renderTodo() {
            var box = document.getElementById('todoList');
            if (!TOMORROW_TASKS.length) {
                box.innerHTML = '<div class="todo-empty">' +
                    '<div class="todo-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>' +
                    '<div class="todo-empty-text">暂无明日待办任务</div>' +
                    '</div>';
                return;
            }
            box.innerHTML = TOMORROW_TASKS.map(function (t) {
                return '<div class="todo-item">' +
                    '<div class="todo-time"><div class="todo-time-start">' + t.start + '</div><div class="todo-time-end">' + t.end + '</div></div>' +
                    '<div class="todo-divider"></div>' +
                    '<div class="todo-main"><div class="todo-name">' + t.name + '</div><div class="todo-meta">' + t.route + '</div></div>' +
                    '<span class="todo-tag ' + (t.type === 'emergency' ? 'emergency' : '') + '">' + t.tag + '</span>' +
                    '</div>';
            }).join('');
        }

        renderTodo();
    </script>
</body>
</html>
