<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酷哇APP · 车辆能耗成本管理 — 高保真原型导航</title>
<style>
    /* ============ Design Tokens（对齐 Ant Design WEB 规范） ============ */
    :root {
        --c-primary: #1677ff;
        --c-primary-hover: #4096ff;
        --c-primary-dark: #0958d9;
        --c-text: #000000d9;
        --c-text-secondary: #00000073;
        --c-text-tertiary: #00000040;
        --c-bg: #f0f2f5;
        --c-card: #ffffff;
        --c-border: #f0f0f0;
        --c-border-strong: #d9d9d9;
        --c-split: #f0f0f0;

        --web-color: #1677ff;  --web-bg: #e6f4ff;
        --app-color: #52c41a;  --app-bg: #f6ffed;
        --car-color: #fa8c16;  --car-bg: #fff7e6;

        --radius-card: 12px;
        --radius-icon: 10px;
        --shadow-card: 0 1px 2px rgba(0,0,0,.03), 0 1px 6px rgba(0,0,0,.04);
        --shadow-hover: 0 6px 16px rgba(0,0,0,.08);
        --font: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-num: 'DIN Alternate', 'DIN', 'Bebas Neue', 'PingFang SC', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        background: var(--c-bg);
        min-height: 100vh;
        font-family: var(--font);
        color: var(--c-text);
        -webkit-font-smoothing: antialiased;
        padding-bottom: 64px;
    }

    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ============ Hero ============ */
    .hero {
        position: relative;
        margin-top: 28px;
        padding: 40px 40px 36px;
        border-radius: 20px;
        background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
        color: #fff;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(22, 119, 255, .22);
    }
    /* 装饰：网格点纹 */
    .hero::before {
        content: "";
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1px);
        background-size: 22px 22px;
        opacity: .5;
        pointer-events: none;
    }
    /* 装饰：右侧光晕 */
    .hero::after {
        content: "";
        position: absolute;
        right: -120px; top: -120px;
        width: 360px; height: 360px;
        background: radial-gradient(circle, rgba(255,255,255,.22), transparent 65%);
        pointer-events: none;
    }
    .hero-inner { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; flex-wrap: wrap; }

    .hero-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .hero-logo {
        width: 44px; height: 44px; border-radius: 12px;
        background: rgba(255,255,255,.18);
        backdrop-filter: blur(4px);
        display: grid; place-items: center;
        border: 1px solid rgba(255,255,255,.28);
    }
    .hero-logo svg { width: 26px; height: 26px; }
    .hero-eyebrow { font-size: 12px; letter-spacing: 2px; opacity: .82; text-transform: uppercase; }
    .hero h1 { font-size: 30px; font-weight: 600; line-height: 1.2; letter-spacing: .5px; }
    .hero-sub { margin-top: 10px; font-size: 14px; opacity: .85; max-width: 560px; line-height: 1.7; }

    .hero-stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat {
        min-width: 116px;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255,255,255,.14);
        border: 1px solid rgba(255,255,255,.22);
        backdrop-filter: blur(4px);
    }
    .stat-num { font-family: var(--font-num); font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-num small { font-size: 14px; font-weight: 500; opacity: .8; margin-left: 3px; }
    .stat-label { margin-top: 6px; font-size: 12px; opacity: .82; }

    /* ============ Toolbar（搜索 + Tab） ============ */
    .toolbar {
        position: sticky; top: 12px; z-index: 50;
        margin: 24px 0 8px;
        padding: 14px 16px;
        background: rgba(255,255,255,.86);
        backdrop-filter: blur(10px);
        border: 1px solid var(--c-border);
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,.04);
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .search {
        position: relative; flex: 1; min-width: 220px;
    }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--c-text-tertiary); pointer-events: none; }
    .search input {
        width: 100%; height: 40px;
        padding: 0 38px 0 40px;
        border: 1px solid var(--c-border-strong);
        border-radius: 10px;
        font-size: 14px; font-family: var(--font);
        color: var(--c-text); background: #fff;
        transition: all .2s;
    }
    .search input::placeholder { color: var(--c-text-tertiary); }
    .search input:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px var(--web-bg); }
    .search .clear {
        position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
        width: 22px; height: 22px; border: none; background: #f0f0f0; border-radius: 50%;
        display: none; align-items: center; justify-content: center; cursor: pointer; color: var(--c-text-secondary);
    }
    .search .clear.show { display: flex; }

    .tabs { display: flex; gap: 4px; background: #f5f5f5; padding: 4px; border-radius: 10px; }
    .tab {
        position: relative;
        padding: 7px 16px; border: none; background: transparent;
        font-size: 13px; font-family: var(--font); font-weight: 500;
        color: var(--c-text-secondary); cursor: pointer;
        border-radius: 7px; transition: all .2s; white-space: nowrap;
        display: flex; align-items: center; gap: 6px;
    }
    .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-text-tertiary); }
    .tab[data-key="web"] .dot { background: var(--web-color); }
    .tab[data-key="app"] .dot { background: var(--app-color); }
    .tab[data-key="car"] .dot { background: var(--car-color); }
    .tab .cnt { font-family: var(--font-num); font-size: 12px; opacity: .7; }
    .tab:hover { color: var(--c-text); }
    .tab.active { background: #fff; color: var(--c-text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .tab.active .cnt { opacity: 1; }

    /* ============ Sections ============ */
    .result-meta { margin: 18px 4px 0; font-size: 12px; color: var(--c-text-secondary); }
    .result-meta b { color: var(--c-text); font-family: var(--font-num); }

    .platform-section { margin-top: 28px; }
    .platform-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .platform-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; }
    .platform-icon svg { width: 18px; height: 18px; }
    .platform-name { font-size: 18px; font-weight: 600; color: var(--c-text); }
    .platform-count { font-size: 12px; color: var(--c-text-secondary); background: #fff; border: 1px solid var(--c-border); padding: 2px 10px; border-radius: 20px; font-family: var(--font-num); }

    .module-group { margin-top: 18px; }
    .module-title {
        font-size: 13px; font-weight: 500; color: var(--c-text-secondary);
        padding-left: 10px; margin-bottom: 12px;
        border-left: 3px solid var(--c-border-strong);
        display: flex; align-items: center; gap: 8px;
    }
    .module-title .m-cnt { font-family: var(--font-num); font-size: 11px; color: var(--c-text-tertiary); }

    /* ============ 卡片网格 ============ */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 14px;
    }
    .card {
        position: relative;
        display: flex; align-items: center; gap: 14px;
        padding: 16px;
        background: var(--c-card);
        border: 1px solid var(--c-border);
        border-radius: var(--radius-card);
        text-decoration: none; color: var(--c-text);
        box-shadow: var(--shadow-card);
        transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        opacity: 0; transform: translateY(10px);
        animation: cardIn .4s ease forwards;
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--card-accent, var(--c-primary)); }
    .card:active { transform: translateY(-1px); }

    .card-icon {
        flex-shrink: 0;
        width: 44px; height: 44px;
        border-radius: var(--radius-icon);
        display: grid; place-items: center;
    }
    .card-icon svg { width: 22px; height: 22px; }
    .card-body { flex: 1; min-width: 0; }
    .card-name {
        font-size: 14px; font-weight: 600; color: var(--c-text);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        display: flex; align-items: center; gap: 8px;
    }
    .card-desc {
        margin-top: 3px;
        font-size: 12px; color: var(--c-text-secondary);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-arrow {
        flex-shrink: 0; width: 18px; height: 18px; color: var(--c-text-tertiary);
        transition: transform .18s ease, color .18s ease;
    }
    .card:hover .card-arrow { transform: translate(2px, -2px); color: var(--card-accent, var(--c-primary)); }

    .badge-new {
        font-size: 10px; font-weight: 600; line-height: 1;
        padding: 2px 6px; border-radius: 4px;
        background: #fff1f0; color: #ff4d4f;
        border: 1px solid #ffccc7;
    }

    /* 端色映射 */
    .platform-section[data-platform="web"] .platform-icon,
    .platform-section[data-platform="web"] .module-title { border-color: var(--web-color); }
    .platform-section[data-platform="app"] .platform-icon,
    .platform-section[data-platform="app"] .module-title { border-color: var(--app-color); }
    .platform-section[data-platform="car"] .platform-icon,
    .platform-section[data-platform="car"] .module-title { border-color: var(--car-color); }

    /* ============ 空状态 ============ */
    .empty {
        text-align: center; padding: 80px 20px; color: var(--c-text-secondary);
    }
    .empty svg { width: 56px; height: 56px; color: var(--c-text-tertiary); margin-bottom: 16px; }
    .empty h3 { font-size: 16px; font-weight: 500; color: var(--c-text); margin-bottom: 6px; }
    .empty p { font-size: 13px; }

    /* ============ 页脚 ============ */
    .footer {
        margin-top: 48px; text-align: center;
        font-size: 12px; color: var(--c-text-tertiary); line-height: 1.8;
    }
    .footer a { color: var(--c-primary); text-decoration: none; }

    /* ============ 响应式 ============ */
    @media (max-width: 768px) {
        .wrap { padding: 0 16px; }
        .hero { margin-top: 16px; padding: 28px 22px; }
        .hero h1 { font-size: 22px; }
        .hero-inner { flex-direction: column; align-items: flex-start; }
        .hero-stats { width: 100%; }
        .stat { flex: 1; min-width: 0; }
        .toolbar { position: static; flex-direction: column; align-items: stretch; }
        .tabs { overflow-x: auto; }
        .grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>
<div class="wrap">

    <!-- ============ Hero ============ -->
    <header class="hero">
        <div class="hero-inner">
            <div>
                <div class="hero-brand">
                    <div class="hero-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 13h2l2-5h9l3 5h2"/><path d="M5 13v5h14v-5"/><circle cx="7.5" cy="18" r="1.5"/><circle cx="16.5" cy="18" r="1.5"/>
                        </svg>
                    </div>
                    <span class="hero-eyebrow">KUWA · PROTOTYPE</span>
                </div>
                <h1>酷哇APP · 车辆能耗成本管理</h1>
                <p class="hero-sub">城市环卫车辆能耗成本与品质巡查全链路高保真原型，覆盖 WEB 管理后台、移动端 APP、车机端三端协同，用于产品评审与开发落地参考。</p>
            </div>

    <!-- ============ 工具栏 ============ -->
    <div class="toolbar">
        <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input id="searchInput" type="text" placeholder="搜索页面名称、功能或模块…" autocomplete="off">
            <button class="clear" id="clearBtn" title="清除">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:12px;height:12px"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="tabs" id="tabs">
            <button class="tab active" data-key="all">全部 <span class="cnt" id="cnt-all"></span></button>
            <button class="tab" data-key="web"><span class="dot"></span>WEB端 <span class="cnt" id="cnt-web"></span></button>
            <button class="tab" data-key="app"><span class="dot"></span>APP端 <span class="cnt" id="cnt-app"></span></button>
            <button class="tab" data-key="car"><span class="dot"></span>车机端 <span class="cnt" id="cnt-car"></span></button>
        </div>
    </div>

    <div class="result-meta" id="resultMeta"></div>

    <!-- ============ 渲染容器 ============ -->
    <main id="container"></main>

    <footer class="footer">
        酷哇APP · 车辆能耗成本管理高保真原型系统 &nbsp;|&nbsp; 风格遵循 Ant Design 规范<br>
        最近更新：<span id="updateDate"></span> &nbsp;·&nbsp; 共 <b id="footTotal" style="color:var(--c-text)"></b> 个页面
    </footer>
</div>

<script>
/* ============ 图标库（Lucide 风格，stroke=currentColor） ============ */
const ICONS = {

function svg(name, color) {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.doc}</svg>`;
}

        modules: [

                { f:'map-workbench',     n:'地图工作台',       d:'地图作业工作台', icon:'map' },
                { f:'today-review',      n:'今日回顾',         d:'当日作业数据回顾', icon:'review' },
                { f:'placeholder',       n:'功能开发中',       d:'通用占位页', icon:'placeholder' },
            ]},
            { title: '用车与任务', pages: [
                { f:'vehicle-management?demo=reset', n:'用车管理',   d:'地图/服务双 Tab · 全部任务', icon:'car' },

/* ============ 统计 ============ */
function countAll() {
    let total = 0; const by = { web:0, app:0, car:0 };
    PLATFORMS.forEach(p => {
        let c = 0;
        p.modules.forEach(m => c += m.pages.length);
        by[p.key] = c; total += c;
    });
    return { total, by };
}
const STATS = countAll();

function renderHeroStats() {
    const el = document.getElementById('heroStats');
    el.innerHTML = `
        <div class="stat"><div class="stat-num">${STATS.total}<small>个</small></div><div class="stat-label">原型页面总数</div></div>
        <div class="stat"><div class="stat-num">3</div><div class="stat-label">协同终端</div></div>
        <div class="stat"><div class="stat-num">v1.0</div><div class="stat-label">高保真版本</div></div>
    `;
    document.getElementById('cnt-all').textContent = STATS.total;
    document.getElementById('cnt-web').textContent = STATS.by.web;
    document.getElementById('cnt-app').textContent = STATS.by.app;
    document.getElementById('cnt-car').textContent = STATS.by.car;
    document.getElementById('footTotal').textContent = STATS.total;
}

/* ============ 渲染 ============ */
const container = document.getElementById('container');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultMeta = document.getElementById('resultMeta');
let currentTab = 'all';

function matchKeyword(page, platformName, moduleName, kw) {
    if (!kw) return true;
    const hay = (page.n + ' ' + page.d + ' ' + platformName + ' ' + moduleName + ' ' + page.icon).toLowerCase();
    return hay.includes(kw.toLowerCase());
}

function render() {
    const kw = searchInput.value.trim();
    clearBtn.classList.toggle('show', !!kw);
    const filter = currentTab === 'all' ? null : currentTab;
    let shown = 0;
    let html = '';
    let delay = 0;

    PLATFORMS.forEach(p => {
        if (filter && p.key !== filter) return;
        // 收集该端命中模块
        const hitModules = [];
        p.modules.forEach(m => {
            const pages = m.pages.filter(pg => matchKeyword(pg, p.name, m.title, kw));
            if (pages.length) hitModules.push({ title: m.title, pages });
        });
        if (!hitModules.length) return;

        const pCount = hitModules.reduce((s, m) => s + m.pages.length, 0);
        shown += pCount;

        html += `<section class="platform-section" data-platform="${p.key}">
            <div class="platform-head">
                <div class="platform-icon" style="background:${p.bg}">${svg(p.icon, p.color)}</div>
                <div class="platform-name">${p.name}</div>
                <span class="platform-count">${pCount} 页</span>
            </div>`;

        hitModules.forEach(m => {
            html += `<div class="module-group">
                <div class="module-title">${m.title} <span class="m-cnt">${m.pages.length}</span></div>
                <div class="grid">`;
            m.pages.forEach(pg => {
                const isNew = UPDATED.has(pg.f.split('?')[0]);
                // pg.f 可能含查询串（如 vehicle-management?demo=reset），需正确补 .html 后缀
                const finalHref = pg.f.includes('?')
                    ? DIR + pg.f.replace('?', '.html?')
                    : DIR + pg.f + '.html';
                html += `<a class="card" style="--card-accent:${p.color}; animation-delay:${delay}ms" href="${finalHref}" target="_blank" rel="noopener">
                    <div class="card-icon" style="background:${p.bg}">${svg(pg.icon, p.color)}</div>
                    <div class="card-body">
                        <div class="card-name">${pg.n}${isNew ? '<span class="badge-new">更新</span>' : ''}</div>
                        <div class="card-desc">${pg.d}</div>
                    </div>
                    <svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>
                </a>`;
                delay = Math.min(delay + 25, 400);
            });
            html += `</div></div>`;
        });
        html += `</section>`;
    });

    if (!shown) {
        html = `<div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>
            <h3>未找到匹配的页面</h3>
            <p>试试更换关键词，或切换其他终端 Tab</p>
        </div>`;
    }

    container.innerHTML = html;
    resultMeta.innerHTML = kw || filter
        ? `当前筛选下共 <b>${shown}</b> 个页面${kw ? ` · 关键词「${escapeHtml(kw)}」` : ''}${filter ? ` · ${PLATFORMS.find(p=>p.key===filter).name}` : ''}`
        : '';
}

function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============ 事件绑定 ============ */
let searchTimer = null;
searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 80);
});
clearBtn.addEventListener('click', () => { searchInput.value = ''; render(); searchInput.focus(); });

document.getElementById('tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.key;
    render();
});

// 快捷键：/ 聚焦搜索
document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== searchInput) { e.preventDefault(); searchInput.focus(); }
    if (e.key === 'Escape' && document.activeElement === searchInput) { searchInput.value = ''; render(); }
});

/* ============ 初始化 ============ */
renderHeroStats();
document.getElementById('updateDate').textContent = '2026-08-04';
render();
</script>
