<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷哇APP - 能耗管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #000;
            border-radius: 48px;
            padding: 12px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25), 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 40px;
            overflow: hidden;
            position: relative;
        }
        .phone-screen iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 34px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        .notch::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 6px;
            background: #1a1a1a;
            border-radius: 3px;
        }
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: #333;
            border-radius: 3px;
            z-index: 10;
        }
        .app-title {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }
        .size-label {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #888;
            font-size: 13px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="app-title">酷哇APP - 能耗管理</div>
        <div class="notch"></div>
        <div class="phone-screen">
            <iframe src="03-高保真页面/home.html" title="酷哇APP"></iframe>
        </div>
        <div class="home-indicator"></div>
        <div class="size-label">375px × 812px 移动端预览</div>
    </div>
</body>
</html>
