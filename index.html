<!DOCTYPE html>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .container {
            text-align: center;
            max-width: 800px;
            padding: 24px;
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            color: #000000d9;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #00000073;
            font-size: 14px;
            margin-bottom: 32px;
        }
        .section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: #000000d9;
            margin-bottom: 12px;
            text-align: left;
            padding-left: 8px;
            border-left: 3px solid #1677ff;
        }
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .link-card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            text-decoration: none;
            color: #000000d9;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            border: 1px solid #f0f0f0;
        }
        .link-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-color: #1677ff;
            color: #1677ff;
        }
        .link-card svg {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }
        .link-card .name {
            font-size: 14px;
            font-weight: 500;
        }
        .link-card .desc {
            font-size: 12px;
            color: #00000073;
            margin-top: 2px;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: auto;
        }
        .tag-web { background: #e6f4ff; color: #1677ff; }
        .tag-app { background: #f6ffed; color: #52c41a; }
    </style>
</head>
