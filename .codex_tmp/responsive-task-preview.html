<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
        iframe { display: block; height: 812px; border: 0; background: #f5f5f5; }
    </style>
</head>
<body>
    <iframe id="preview" title="响应式任务页面预览"></iframe>
    <script>
        const params = new URLSearchParams(location.search);
        const frame = document.getElementById('preview');
        frame.style.width = `${Number(params.get('width') || 375)}px`;
        frame.src = params.get('page') || '../03-高保真页面/schedule-tasks.html';
    </script>
</body>
</html>
